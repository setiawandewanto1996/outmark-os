<style>

<script>
const CLIENT_ID = '534061439425-cl0savvhsflp1ub4tgcnf8uih4b2iqso.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const STATE_FILENAME = 'outmark-os-state.json';

/* =========================================================================
   STATE
   ========================================================================= */
let STATE = {
  capitalPartners: [],  // {id, nama, kode2, kontak, tanggalBergabung, status}
  stores: [],            // {id, nama, platform, status}
  products: [],           // {id, nama, brand, prefix, hargaKonveksi: {SIZE: [{harga,tanggal,sumber}]}}
  contracts: [],           // {id, produk, capitalPartnerId, kodeKontrak, tanggalMasuk, stockAwal, stockAkhir, hargaModalPcs, nilaiMargin, status}
  colorCodeMap: {},         // {kode3huruf: namaWarna}
  pembagiPctManual: {},      // override manual (opsional): {produk: {kode2: pct}}
  orderDb: [],                // hasil proses Import Mingguan, permanen: {orderId, sku, produk, qty, ...}
  pendingOrderSku: {},          // {orderId: [{sku,qty,warna,storeName}]} -- SEMUA order dari file "Semua Pesanan"/"Order All",
                                  // cair maupun belum, supaya SKU-nya "diingat" sampai kapan pun akhirnya cair
  payouts: [],                  // kewajiban bayar ke capital partner per batch: {id, produk, kode2, capitalPartnerId, kodeKontrak, qty, rate, payout, tanggalDihitung, tanggalDibayar}
  vendorPayouts: [],              // kewajiban bayar ke konveksi/supplier: {id, brand, produk, qty, total, tanggalDihitung, tanggalDibayar}
  adsMingguan: [],                 // biaya iklan per periode per toko: {id, tanggalDari, tanggalSampai, storeId, storeName, platform, biaya, catatan}
  biayaOperasional: [],            // biaya operasional periodik: {id, tanggalDari, tanggalSampai, kategori, jumlah, catatan}
  saldoDiluarKontrak: {},          // {capitalPartnerId: jumlahRp} -- sisa pembulatan dari rollover kontrak, lintas produk per investor
  biayaRetur: [],                  // biaya retur/refund dari order lama yg ditolak/dikembalikan: {id, tanggalDihitung, orderId, toko, jumlah, catatan}
};
let stateFileId = null;
let accessToken = null;

function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Konversi tanggal serial Excel (angka mentah, mis. 46246) -> ISO string, MURNI matematika, TANPA lewat
// konversi objek Date/timezone browser sama sekali. Ini utk hindari bug SheetJS yg bisa geser tanggal
// tergantung zona waktu perangkat yg membaca file (ditemukan lewat laporan user, tanggal geser -1 hari).
function excelSerialToISO(serial) {
  if (serial == null || isNaN(serial)) return null;
  // Excel epoch: 30 Des 1899 (serial 0), dgn bug historis menganggap 1900 kabisat -- rumus baku konversi ke Unix ms:
  const ms = Math.round((Number(serial) - 25569) * 86400 * 1000);
  const d = new Date(ms); // dibuat dari angka milidetik absolut -- TIDAK bergantung timezone sama sekali
  return isNaN(d) ? null : d.toISOString();
}

// Kebalikan dari excelSerialToISO -- dipakai utk bikin "baris income palsu" di fitur Tambah Transaksi Manual,
// supaya bisa lewat pipeline processWeeklyBatch yg sama persis (bukan reimplementasi alokasi terpisah).
function dateStrToExcelSerial(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr + 'T00:00:00.000Z').getTime();
  return (ms / 86400000) + 25569;
}

/* =========================================================================
   LOGIKA INTI (dipindahkan dari versi sebelumnya, sudah tervalidasi)
   ========================================================================= */
const SIZE_CODE_MAP = { '01':'S','02':'M','03':'L','04':'XL','05':'XXL','06':'3XL','07':'4XL','08':'5XL','09':'6XL','10':'7XL' };
const SIZES = ['S','M','L','XL','XXL','3XL','4XL','5XL','6XL','7XL'];
const SIZE_TOKENS = new Set(['S','M','L','XL','XXL','2XL','3XL','4XL','5XL','6XL','7XL','8XL']);
const CAPITAL_PARTNER_PRODUCT_ALIAS = { 'FORSAKERWB': 'FORSAKERVOL2' }; // FORSAKERWB berbagi pool modal dgn FORSAKERVOL2 (ditemukan dari data nyata)
function capitalPartnerProduk(produk) { return CAPITAL_PARTNER_PRODUCT_ALIAS[produk] || produk; }

function findProduct(nama) { return STATE.products.find(p => p.nama === nama); }
function findPartnerByKode2(kode2) { return STATE.capitalPartners.find(p => p.kode2 === kode2); }
function findPartnerById(id) { return STATE.capitalPartners.find(p => p.id === id); }

function getCurrentHarga(produkNama, size) {
  const p = findProduct(produkNama);
  if (!p || !p.hargaKonveksi || !p.hargaKonveksi[size] || !p.hargaKonveksi[size].length) return null;
  const hist = p.hargaKonveksi[size];
  return hist[hist.length - 1].harga;
}
function addHargaHistory(produkNama, size, harga, sumber) {
  const p = findProduct(produkNama);
  if (!p) return;
  p.hargaKonveksi = p.hargaKonveksi || {};
  p.hargaKonveksi[size] = p.hargaKonveksi[size] || [];
  p.hargaKonveksi[size].push({ harga, tanggal: new Date().toISOString(), sumber: sumber || 'manual' });
}

// Hitung persentase Pembagi Qty SW dari besaran modal kontrak AKTIF (DANA BELUM CAIR) saat ini, per produk (setelah alias)
function computePembagiPct(produkAsli) {
  const produk = capitalPartnerProduk(produkAsli);
  if (STATE.pembagiPctManual[produk]) return STATE.pembagiPctManual[produk]; // manual override menang
  const active = STATE.contracts.filter(c => capitalPartnerProduk(c.produk) === produk && c.status === 'DANA BELUM CAIR');
  const capitalByPartner = {};
  active.forEach(c => {
    const partner = findPartnerById(c.capitalPartnerId);
    if (!partner) return;
    const modal = (c.stockAwal || 0) * (c.hargaModalPcs || 0);
    capitalByPartner[partner.kode2] = (capitalByPartner[partner.kode2] || 0) + modal;
  });
  const total = Object.values(capitalByPartner).reduce((a,b) => a+b, 0);
  if (total <= 0) return {};
  const pct = {};
  Object.entries(capitalByPartner).forEach(([k,v]) => { pct[k] = v / total; });
  return pct;
}

// Kontrak aktif (FIFO) milik 1 capital partner utk 1 produk -- yg paling awal tanggal masuk dgn status DANA BELUM CAIR
function activeContractFor(produkAsli, capitalPartnerId) {
  const list = STATE.contracts
    .filter(c => c.produk === produkAsli && c.capitalPartnerId === capitalPartnerId && c.status === 'DANA BELUM CAIR')
    .sort((a,b) => new Date(a.tanggalMasuk) - new Date(b.tanggalMasuk));
  return list[0] || null;
}

// Generate kode kontrak berikutnya, meniru pola kode kontrak LAMA yg sedang di-rollover (mis. "IMO021" -> "IMO022"),
// tapi dicari nomor TERTINGGI yg sudah dipakai utk kombinasi [investor][huruf produk] itu (bukan cuma +1 dari kode lama),
// supaya tidak tabrakan kalau ada gap/kontrak lain sudah dibuat duluan.
function generateNextKodeKontrak(kodeKontrakLama) {
  const m = String(kodeKontrakLama).match(/^([A-Z]{2})([A-Z])(\d+)$/i);
  if (!m) return kodeKontrakLama + '-2'; // fallback kalau polanya tidak dikenali
  const [, kode2, huruf, numStr] = m;
  const prefix = (kode2 + huruf).toUpperCase();
  const width = numStr.length;
  let maxNum = 0;
  STATE.contracts.forEach(c => {
    const mm = String(c.kodeKontrak).match(/^([A-Z]{2})([A-Z])(\d+)$/i);
    if (mm && (mm[1]+mm[2]).toUpperCase() === prefix) maxNum = Math.max(maxNum, parseInt(mm[3], 10));
  });
  const next = maxNum + 1;
  return prefix + String(next).padStart(width, '0');
}

// Eksekusi keputusan rollover (dari panel di preview batch) -- MENGUBAH result.allocations di tempat
// supaya applyBatchResult() yg jalan setelah ini bisa memproses semuanya spt alokasi normal (bikin kontrak
// baru beneran ke STATE.contracts kalau perlu, atau redistribusi ke investor lain kalau di-stop).
function resolveRolloverIntoAllocations(result, resolutions, tanggalPenarikanForRollover) {
  // Tanggal yg relevan utk penarikan batch ini -- dipakai utk menandai kontrak baru hasil rollover supaya
  // nanti kalau tanggal yg SAMA di-"Hitung Ulang" dari nol, kontrak ini (yg murni lahir dari hasil rollover
  // tanggal ini) bisa dikenali & tidak keliru dianggap "sudah ada dari awal" (lihat beginRecomputeForDate).
  const dateForRollover = tanggalPenarikanForRollover ? String(tanggalPenarikanForRollover).slice(0,10) : (result.dateStr || null);
  const perluList = result.allocations.filter(a => a.perluKontrakBaru);

  // Tahap 1: proses PUTAR PENUH / PUTAR MODAL SAJA dulu -- bikin kontrak baru, supaya kontrak2 baru ini
  // ikut kehitung sbg kandidat kalau ada kasus STOP yg perlu redistribusi di tahap 2.
  const toRemoveTahap1 = [];
  perluList.forEach(a => {
    const key = a.kode2 + '|' + a.produk;
    const res = resolutions[key];
    if (!res || res.tipe === 'stop') return;

    // Sebelum sisa unit ini masuk ke kontrak BARU hasil rollover, coba dulu pakaikan ke kontrak2 AKTIF LAIN
    // milik investor yg sama utk produk yg sama yg SUDAH ADA lebih dulu (mis. IDO048), urut FIFO dari
    // tanggalMasuk paling awal. Kontrak yg baru saja habis (a.kodeKontrakLama, mis. IDO047) di-exclude
    // krn stockAkhir/status-nya di STATE.contracts masih STALE di titik ini (baru benar2
    // dikurangi/ditutup nanti di applyBatchResult) -- kalau tidak di-exclude bisa keliru dianggap masih ada isi.
    const siblingContracts = STATE.contracts
      .filter(c => c.produk === a.produk && c.capitalPartnerId === a.capitalPartnerId
        && c.status === 'DANA BELUM CAIR' && c.kodeKontrak !== a.kodeKontrakLama)
      .sort((x, y) => new Date(x.tanggalMasuk) - new Date(y.tanggalMasuk));

    const qtyAwal = a.qty;
    const orderUnitsAll = a.orderUnits || [];
    let sisaQty = qtyAwal;
    let unitCursor = 0;
    siblingContracts.forEach(sc => {
      if (sisaQty <= 0) return;
      const qtyDariSini = Math.min(sisaQty, sc.stockAkhir);
      if (qtyDariSini <= 0) return;
      const subUnits = orderUnitsAll.slice(unitCursor, unitCursor + qtyDariSini);
      unitCursor += qtyDariSini;
      const skuBreakdown = {};
      subUnits.forEach(u => { skuBreakdown[u.sku] = (skuBreakdown[u.sku]||0) + 1; });
      result.allocations.push({
        produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor, capitalPartnerId: a.capitalPartnerId,
        kodeKontrak: sc.kodeKontrak, contractId: sc.id, qty: qtyDariSini, rate: sc.nilaiMargin, payout: qtyDariSini*sc.nilaiMargin,
        catatan: `${qtyDariSini} unit sisa dari ${a.kodeKontrakLama} (habis) dipakaikan dulu ke kontrak aktif ${sc.kodeKontrak} milik ${a.namaInvestor} sebelum ke kontrak baru hasil rollover`,
        orderUnits: subUnits, skuBreakdown, hargaModalPcs: sc.hargaModalPcs,
      });
      sisaQty -= qtyDariSini;
    });
    const qtyDariSibling = qtyAwal - sisaQty;

    // Kontrak baru hasil rollover TETAP dibuat (utk jejak/lineage & dipakai batch berikutnya), walau
    // sisaQty di titik ini sudah 0 (artinya semua sisa unit sudah tertampung kontrak aktif lama di atas).
    const modalLama = a.qtyKontrakLama * a.hargaModalPcsLama;
    const profitLama = a.qtyKontrakLama * a.nilaiMarginLama;
    const modalBaru = res.tipe === 'putar_penuh' ? (modalLama + profitLama) : modalLama;
    const stockAwalBaru = Math.floor(modalBaru / res.hargaBaru);
    const sisaRp = modalBaru - (stockAwalBaru * res.hargaBaru);
    STATE.saldoDiluarKontrak[a.capitalPartnerId] = (STATE.saldoDiluarKontrak[a.capitalPartnerId] || 0) + sisaRp;
    const kodeBaru = generateNextKodeKontrak(a.kodeKontrakLama);
    const kontrakBaru = {
      id: uid('ct'), produk: a.produk, capitalPartnerId: a.capitalPartnerId, kodeKontrak: kodeBaru,
      tanggalMasuk: new Date().toISOString(), stockAwal: stockAwalBaru, stockAkhir: stockAwalBaru,
      hargaModalPcs: res.hargaBaru, nilaiMargin: a.nilaiMarginLama, status: 'DANA BELUM CAIR',
      rolledFromKodeKontrak: a.kodeKontrakLama, rolledTipe: res.tipe,
      rolledForTanggalPenarikan: dateForRollover,
    };
    STATE.contracts.push(kontrakBaru);

    if (sisaQty <= 0) {
      // Semua sisa unit sudah tertampung kontrak aktif lama -- entri placeholder ini tidak perlu jadi payout lagi.
      toRemoveTahap1.push(a);
      delete a.perluKontrakBaru;
      return;
    }

    const qtyAlokasi = Math.min(sisaQty, stockAwalBaru);
    const subUnitsBaru = orderUnitsAll.slice(unitCursor, unitCursor + qtyAlokasi);
    const skuBreakdownBaru = {};
    subUnitsBaru.forEach(u => { skuBreakdownBaru[u.sku] = (skuBreakdownBaru[u.sku]||0) + 1; });
    a.kodeKontrak = kodeBaru; a.contractId = kontrakBaru.id; a.qty = qtyAlokasi;
    a.orderUnits = subUnitsBaru; a.skuBreakdown = skuBreakdownBaru;
    a.rate = a.nilaiMarginLama; a.payout = qtyAlokasi * a.nilaiMarginLama;
    a.catatan = `Rollover (${res.tipe==='putar_penuh'?'putar penuh':'putar modal saja'}) dari ${a.kodeKontrakLama} -> ${kodeBaru}` +
      (qtyDariSibling > 0 ? ` -- ${qtyDariSibling} unit sudah dipakaikan dulu ke kontrak aktif lama sebelum ke kontrak baru ini` : '') +
      (qtyAlokasi < sisaQty ? ` -- ⚠ kontrak baru cuma cukup utk ${stockAwalBaru} dari ${sisaQty} unit, sisanya perlu ditangani manual` : '');
    delete a.perluKontrakBaru;
  });
  toRemoveTahap1.forEach(a => { const idx = result.allocations.indexOf(a); if (idx >= 0) result.allocations.splice(idx, 1); });

  // Tahap 2: proses STOP -- hapus entri ini, redistribusi qty-nya ke investor aktif lain (kontrak baru dari tahap 1 ikut terhitung)
  const toRemove = [];
  perluList.forEach(a => {
    const key = a.kode2 + '|' + a.produk;
    const res = resolutions[key];
    if (!res || res.tipe !== 'stop') return;
    toRemove.push(a);
    // Kontrak lama BELUM ditutup di titik ini (penutupan normal baru terjadi nanti di applyBatchResult).
    // Karena investor pilih STOP, tutup SEKARANG supaya tidak ikut kehitung di persentase redistribusi di bawah.
    const kontrakLama = STATE.contracts.find(c => c.kodeKontrak === a.kodeKontrakLama);
    if (kontrakLama) { kontrakLama.stockAkhir = 0; kontrakLama.status = 'DANA SUDAH CAIR'; }
    const pct = computePembagiPct(a.produk); // sekarang benar2 exclude kontrak yg baru ditutup ini
    if (!Object.keys(pct).length) {
      result.allocations.push({ produk: a.produk, kode2: null, namaInvestor: null, kodeKontrak: null, qty: a.qty, rate: null, payout: null,
        catatan: `${a.qty} unit dari ${a.namaInvestor} (STOP) tidak bisa diredistribusi -- tidak ada kontrak aktif lain utk ${a.produk}.` });
      return;
    }
    const floors = allocateLargestRemainder(a.qty, pct);
    Object.entries(floors).forEach(([kode2b, qtyb]) => {
      if (qtyb <= 0) return;
      const partnerB = findPartnerByKode2(kode2b);
      const kontrakB = partnerB ? activeContractFor(a.produk, partnerB.id) : null;
      result.allocations.push({
        produk: a.produk, kode2: kode2b, namaInvestor: partnerB ? partnerB.nama : kode2b, capitalPartnerId: partnerB ? partnerB.id : null,
        kodeKontrak: kontrakB ? kontrakB.kodeKontrak : null, contractId: kontrakB ? kontrakB.id : null,
        qty: qtyb, rate: kontrakB ? kontrakB.nilaiMargin : null, payout: kontrakB ? qtyb*kontrakB.nilaiMargin : null,
        catatan: `Redistribusi dari ${a.namaInvestor} (kontrak di-STOP)` + (kontrakB ? '' : ' -- TIDAK ADA kontrak aktif, cek manual'),
        orderUnits: a.orderUnits ? a.orderUnits.slice(0, qtyb) : [], skuBreakdown: {}, hargaModalPcs: kontrakB ? kontrakB.hargaModalPcs : null,
      });
    });
  });
  toRemove.forEach(a => { const idx = result.allocations.indexOf(a); if (idx >= 0) result.allocations.splice(idx, 1); });
}

function parseWarna(variasiText) {
  if (!variasiText) return null;
  const parts = String(variasiText).split(',').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  const first = parts[0].toUpperCase();
  if (SIZE_TOKENS.has(first)) return null;
  return parts[0];
}
function deriveWarnaFromSku(sku) {
  if (!sku || String(sku).length < 6) return null;
  const kode = String(sku).toUpperCase().slice(3,6);
  return STATE.colorCodeMap[kode] || null;
}
function lookupHargaKonveksiBySku(sku) {
  if (!sku) return null;
  const skuUpper = String(sku).toUpperCase();
  const prefix = skuUpper.slice(0,3);
  const sizeCode = skuUpper.slice(-2);
  const p = STATE.products.find(pr => pr.prefix === prefix);
  const ukuran = SIZE_CODE_MAP[sizeCode];
  if (p && ukuran) return getCurrentHarga(p.nama, ukuran);
  return null;
}

   ========================================================================= */
function sheetToRows(ws) {
  // baca SEMUA baris apa adanya, termasuk kalau !ref rusak (bug TikTok export) -> scan cell keys manual
  const XU = XLSX.utils;
  let ref = ws['!ref'];
  let range = ref ? XU.decode_range(ref) : null;
  let maxR = range ? range.e.r : 0, maxC = range ? range.e.c : 0;
  Object.keys(ws).forEach(k => {
    if (k[0] === '!') return;
    const cell = XU.decode_cell(k);
    if (cell.r > maxR) maxR = cell.r;
    if (cell.c > maxC) maxC = cell.c;
  });
  const rows = [];
  for (let r = 0; r <= maxR; r++) {
    const row = [];
    for (let c = 0; c <= maxC; c++) {
      const cell = ws[XU.encode_cell({r, c})];
      row.push(cell ? cell.v : null);
    }
    rows.push(row);
  }
  return rows;
}
function rowsToObjects(rows, headerRowIdx, dataStartIdx) {
  const header = rows[headerRowIdx];
  return rows.slice(dataStartIdx).map(r => {
    const o = {}; header.forEach((h,i) => { if (h) o[h] = r[i]; }); return o;
  }).filter(o => Object.values(o).some(v => v !== null && v !== undefined));
}

// Alokasi largest-remainder method: floor tiap kode2, sisa dikasih ke fraksi desimal terbesar (tervalidasi Fase 1)
function allocateLargestRemainder(qtyTotal, pctMap) {
  const floors = {}; let sumFloor = 0; const remainders = [];
  Object.entries(pctMap).forEach(([kode2, pct]) => {
    const raw = qtyTotal * pct; const f = Math.floor(raw);
    floors[kode2] = f; sumFloor += f; remainders.push({ kode2, frac: raw - f });
  });
  let sisa = qtyTotal - sumFloor;
  remainders.sort((a,b) => b.frac - a.frac);
  for (let i = 0; i < sisa; i++) floors[remainders[i % remainders.length].kode2]++;
  return floors;
}

// Alokasi FIFO (per investor) + largest remainder (antar investor), dgn pelacakan UNIT (order+SKU) spesifik
// mana yg masuk ke investor mana -- perlu utk laporan detail per kontrak. Diekstrak dari processWeeklyBatch
// (isinya PERSIS SAMA, tidak diubah sama sekali) supaya bisa dipakai ulang oleh fitur lain yg perlu
// menghitung alokasi dgn logika yg IDENTIK -- mis. recomputeAllocationForDate (hitung ulang alokasi per
// tanggal penarikan), supaya tidak ada 2 implementasi alokasi yg bisa diam2 beda hasil.
function allocateUnitsToContracts(qtyPerProduk, cairSkuRows) {
  const allocations = [];
  Object.entries(qtyPerProduk).forEach(([produk, qtyTotalF]) => {
    const qtyTotal = Math.round(qtyTotalF);
    const pct = computePembagiPct(produk);

    // kumpulkan semua UNIT individual (bukan baris -- krn 1 baris bisa qty>1) utk produk ini
    const productRows = cairSkuRows.filter(r => capitalPartnerProduk(r.produk) === produk);
    const units = [];
    productRows.forEach(r => { for (let i = 0; i < r.qty; i++) units.push({ orderId: r.orderId, sku: r.sku }); });

    if (!Object.keys(pct).length) {
      allocations.push({ produk, kode2:null, namaInvestor:null, kodeKontrak:null, qty:qtyTotal, rate:null, payout:null, catatan:'Tidak ada kontrak aktif utk produk ini', orderUnits: units });
      return;
    }
    const floors = allocateLargestRemainder(qtyTotal, pct);
    let unitCursor = 0;
    Object.entries(floors).forEach(([kode2, qty]) => {
      if (qty <= 0) return;
      const assignedUnits = units.slice(unitCursor, unitCursor + qty);
      unitCursor += qty;
      const partner = findPartnerByKode2(kode2);
      if (!partner) {
        allocations.push({ produk, kode2, namaInvestor: kode2, capitalPartnerId: null, kodeKontrak: null, contractId: null,
          qty, rate: null, payout: null, catatan: 'Investor tidak ditemukan', orderUnits: assignedUnits, skuBreakdown: {}, hargaModalPcs: null });
        return;
      }
      // Ambil kontrak aktif investor ini utk produk ini, urut FIFO (paling awal tanggalMasuk duluan) -- HANYA
      // kontrak yg PALING AWAL yg dipakai. Kalau kontrak itu habis di tengah, sisanya TIDAK BOLEH diam2
      // "meluber" ke kontrak aktif LAIN milik investor yg sama (mis. investor ID py IDO047 & IDO048 -- IDO047
      // habis TIDAK otomatis lanjut ke IDO048) -- tiap kontrak adalah siklus modal investor yg terpisah, jadi
      // begitu kontrak yg sedang jalan habis, itu HARUS langsung jadi keputusan rollover (Putar Penuh/Modal
      // Saja/Stop), bukan diam2 dianggap "masih ada kontrak aktif lain jadi lanjut aja". (Sebelumnya sistem
      // otomatis lanjut ke kontrak aktif berikutnya -- diubah krn investor bisa py >1 kontrak aktif utk 1
      // produk yg sengaja dikelola sbg siklus modal terpisah, bukan 1 pool gabungan.)
      const activeContractsForPartner = STATE.contracts
        .filter(c => c.produk === produk && c.capitalPartnerId === partner.id && c.status === 'DANA BELUM CAIR')
        .sort((a,b) => new Date(a.tanggalMasuk) - new Date(b.tanggalMasuk));
      const kontrak = activeContractsForPartner[0] || null;
      let remaining = qty;
      if (kontrak) {
        const qtyForThisContract = Math.min(qty, kontrak.stockAkhir);
        remaining = qty - qtyForThisContract;
        if (qtyForThisContract > 0) {
          const subUnits = assignedUnits.slice(0, qtyForThisContract);
          const skuBreakdown = {};
          subUnits.forEach(u => { skuBreakdown[u.sku] = (skuBreakdown[u.sku]||0) + 1; });
          allocations.push({
            produk, kode2, namaInvestor: partner.nama, capitalPartnerId: partner.id,
            kodeKontrak: kontrak.kodeKontrak, contractId: kontrak.id,
            qty: qtyForThisContract, rate: kontrak.nilaiMargin, payout: qtyForThisContract*kontrak.nilaiMargin,
            catatan: `${(pct[kode2]*100).toFixed(2)}% dari ${qtyTotal} unit ${produk}`,
            orderUnits: subUnits, skuBreakdown, hargaModalPcs: kontrak.hargaModalPcs,
          });
        }
      }
      if (remaining > 0) {
        // Kontrak (paling awal/sedang jalan) sudah habis -- investor perlu kontrak baru (rollover) atau
        // dihentikan, WALAU investor ini kebetulan py kontrak aktif LAIN utk produk yg sama (lihat komentar
        // di atas -- itu sengaja TIDAK dipakai otomatis). BELUM otomatis dibuatkan -- perlu keputusan manual
        // (lihat notifikasi "Perlu Kontrak Baru" di preview batch).
        const lastContract = kontrak
          || STATE.contracts.filter(c => c.produk === produk && c.capitalPartnerId === partner.id)
               .sort((a,b) => new Date(b.tanggalMasuk) - new Date(a.tanggalMasuk))[0] || null;
        const sisaUnits = kontrak ? assignedUnits.slice(Math.min(qty, kontrak.stockAkhir)) : assignedUnits;
        allocations.push({
          produk, kode2, namaInvestor: partner.nama, capitalPartnerId: partner.id, kodeKontrak: null, contractId: null,
          qty: remaining, rate: null, payout: null,
          catatan: `⚠ ${remaining} unit TIDAK ADA kontrak aktif yg cukup -- kontrak ${partner.nama} utk ${produk} sudah habis, perlu kontrak baru (rollover) atau dihentikan.`,
          orderUnits: sisaUnits, skuBreakdown: {}, hargaModalPcs: null, perluKontrakBaru: true,
          kodeKontrakLama: lastContract ? lastContract.kodeKontrak : null,
          qtyKontrakLama: lastContract ? lastContract.stockAwal : 0,
          hargaModalPcsLama: lastContract ? lastContract.hargaModalPcs : 0,
          nilaiMarginLama: lastContract ? lastContract.nilaiMargin : 0,
        });
      }
    });
  });
  return allocations;
}

// Tambah 1 transaksi manual (order yg SKU-nya tdk ketemu otomatis lewat pipeline biasa) --

// konsisten dgn jalur biasa, BUKAN reimplementasi terpisah yg rawan beda logika.
// TAHAP 1 (preview): siapkan "baris income palsu" & jalankan lewat processWeeklyBatch SAJA -- BELUM ditulis
// ke database. Dipisah dari eksekusi (finalizeManualTransaction) supaya kalau ternyata kontrak produk ini
// habis di tengah (butuh keputusan Putar Penuh/Modal Saja/Stop) ATAU produk ini tidak punya kontrak aktif
// SAMA SEKALI, user diminta keputusan/diberi peringatan DULU -- sebelumnya kasus ini lolos diam-diam karena

async function prepareManualTransaction({ orderId, store, skuRows, pendapatan, netSettlement, tanggalCairStr }) {
  // skuRows: [{sku, qty, warna}, ...] -- 1 order bisa punya BANYAK SKU berbeda (order isi banyak produk sekaligus)
  STATE.pendingOrderSku[orderId] = STATE.pendingOrderSku[orderId] || [];
  skuRows.forEach(r => {
    if (!STATE.pendingOrderSku[orderId].some(p => p.sku === r.sku)) {
      STATE.pendingOrderSku[orderId].push({ sku: r.sku, qty: r.qty||1, warna: r.warna||null, storeName: store.nama });
    }
  });
  const serial = dateStrToExcelSerial(tanggalCairStr);
  let fakeWb;
  if (store.platform === 'Shopee') {
    fakeWb = { Sheets: { 'Penghasilan': {
      '!ref': 'A1:E4',
      A3:{v:'Lihat berdasarkan'}, B3:{v:'No. Pesanan'}, C3:{v:'Harga Produk'}, D3:{v:'Total Penghasilan'}, E3:{v:'Tanggal Dana Dilepaskan'},
      A4:{v:'Order'}, B4:{v:orderId}, C4:{v:pendapatan}, D4:{v:netSettlement}, E4:{v:serial},
    } } };
  } else {
    fakeWb = { Sheets: { 'Detail pesanan': {
      '!ref': 'A1:E3',
      A1:{v:'ID Pesanan/Penyesuaian'}, B1:{v:'Jenis transaksi'}, C1:{v:'Total Pendapatan'}, D1:{v:'Jumlah penyelesaian pembayaran'}, E1:{v:'Waktu pembayaran pesanan'},
      A3:{v:orderId}, B3:{v:'Pesanan'}, C3:{v:pendapatan}, D3:{v:netSettlement}, E3:{v:serial},
    } } };
  }
  return processWeeklyBatch([{ store, incomeWb: fakeWb }]);
}

// Kasus produk yg SAMA SEKALI tidak punya kontrak aktif (beda dgn "kontrak habis di tengah" yg py riwayat
// kontrak lama utk di-rollover) -- tandai eksplisit di sini spy bisa dideteksi & diblokir di UI manual,
// TANPA mengubah perilaku Import Mingguan biasa (jalur itu sudah tervalidasi, sengaja tidak disentuh).
function manualNeedsAttention(result) {
  const perluKontrakBaru = result.allocations.filter(a => a.perluKontrakBaru);
  const tanpaKontrakSamaSekali = result.allocations.filter(a => !a.perluKontrakBaru && !a.capitalPartnerId && a.catatan === 'Tidak ada kontrak aktif utk produk ini');
  return { perluKontrakBaru, tanpaKontrakSamaSekali };
}

// TAHAP 2 (eksekusi): dipanggil SETELAH semua keputusan rollover (kalau ada) sudah diselesaikan di UI.
async function finalizeManualTransaction(result, tanggalCairStr, rolloverResolutions) {
  if (rolloverResolutions && Object.keys(rolloverResolutions).length) {
    resolveRolloverIntoAllocations(result, rolloverResolutions, tanggalCairStr);
  }
  const tglPenarikanIso = new Date(tanggalCairStr + 'T00:00:00.000Z').toISOString();
  const { added, updated } = await applyBatchResult(result, tglPenarikanIso);
  return { added, updated };
}

async function processWeeklyBatch(storeImports) {
  // storeImports: [{ store: {id,nama,platform}, incomeWb }] -- TIDAK perlu file Order lagi,
  // SKU dicari dari pendingOrderSku (hasil "Update Daftar Pesanan") + histori orderDb.
  const shopeeImports = storeImports.filter(si => si.store.platform === 'Shopee');
  const tiktokImports = storeImports.filter(si => si.store.platform === 'TikTok' || si.store.platform === 'Tokopedia');
  // Baris "Pesanan" tapi Pendapatan=0 (mis. retur/ditolak konsumen, kita nanggung ongkir) -- BUKAN penjualan asli,
  // jangan diproses sbg cair biasa (bisa salah kurangi stok kontrak) -- tangkap sbg BIAYA terpisah supaya tetap masuk PNL.
  const returAdjustments = [];
  // Order berstatus "Pesanan" tapi Settlement=0 (tdk pernah settle sama sekali, mis. batal sblm bayar) --
  // DICATAT di sini (bukan cuma dilewati diam2) spy tetap KELIHATAN di ringkasan hasil batch, bukan hilang tanpa jejak.
  const zeroSettlementSkipped = [];

  // ---- Shopee ----
  const shopeeFinance = {};
  shopeeImports.forEach(si => {
    const objsI = rowsToObjects(sheetToRows(si.incomeWb.Sheets['Penghasilan']), 2, 3);
    objsI.filter(o => o['Lihat berdasarkan'] === 'Order').forEach(o => {
      const id = String(o['No. Pesanan']);
      const pendapatan = Number(o['Harga Produk'])||0;
      const netSettlement = Number(o['Total Penghasilan'])||0;
      // Settlement = 0 -> TIDAK ADA uang yg benar2 masuk sama sekali (order batal/gagal sblm settle) -- BUKAN
      // penjualan asli, BUKAN retur juga (tidak ada biaya yg ditanggung) -- lewati dari perhitungan, TAPI dicatat.
      if (netSettlement === 0) { zeroSettlementSkipped.push({ orderId: id, toko: si.store.nama }); return; }
      // Settlement negatif -> biaya retur/refund (ongkir/penyesuaian yg kita tanggung), TIDAK masuk sbg penjualan.
      if (netSettlement < 0) {
        returAdjustments.push({ orderId: id, toko: si.store.nama, jumlah: netSettlement, tanggalCair: excelSerialToISO(o['Tanggal Dana Dilepaskan']) });
        return;
      }
      shopeeFinance[id] = {
        toko: si.store.nama, pendapatan,
        komisi_platform: sumCategory(o, SHOPEE_CATMAP.komisi_platform), biaya_layanan: sumCategory(o, SHOPEE_CATMAP.biaya_layanan),
        biaya_pembayaran: sumCategory(o, SHOPEE_CATMAP.biaya_pembayaran), komisi_afiliasi: sumCategory(o, SHOPEE_CATMAP.komisi_afiliasi),
        komisi_dinamis: sumCategory(o, SHOPEE_CATMAP.komisi_dinamis), biaya_iklan: sumCategory(o, SHOPEE_CATMAP.biaya_iklan),
        pajak: sumCategory(o, SHOPEE_CATMAP.pajak), lainnya: sumCategory(o, SHOPEE_CATMAP.lainnya),
        netSettlement, tanggalCair: excelSerialToISO(o['Tanggal Dana Dilepaskan']),
      };
    });
  });

  // ---- TikTok/Tokopedia ----
  const tiktokFinance = {};
  tiktokImports.forEach(si => {
    const objsI = rowsToObjects(sheetToRows(si.incomeWb.Sheets['Detail pesanan']), 0, 2);
    objsI.filter(o => o['Jenis transaksi'] === 'Pesanan').forEach(o => {
      const id = String(o['ID Pesanan/Penyesuaian']);
      const pendapatan = Number(o['Total Pendapatan'])||0;
      const netSettlement = Number(o['Jumlah penyelesaian pembayaran'])||0;
      if (netSettlement === 0) { zeroSettlementSkipped.push({ orderId: id, toko: si.store.nama }); return; }
      if (netSettlement < 0) {
        returAdjustments.push({ orderId: id, toko: si.store.nama, jumlah: netSettlement, tanggalCair: excelSerialToISO(o['Waktu pembayaran pesanan']) });
        return;
      }
      tiktokFinance[id] = {
        toko: si.store.nama, pendapatan,
        komisi_platform: sumCategory(o, TIKTOK_CATMAP.komisi_platform), biaya_layanan: sumCategory(o, TIKTOK_CATMAP.biaya_layanan),
        biaya_pembayaran: sumCategory(o, TIKTOK_CATMAP.biaya_pembayaran), komisi_afiliasi: sumCategory(o, TIKTOK_CATMAP.komisi_afiliasi),
        komisi_dinamis: sumCategory(o, TIKTOK_CATMAP.komisi_dinamis), biaya_iklan: sumCategory(o, TIKTOK_CATMAP.biaya_iklan),
        pajak: sumCategory(o, TIKTOK_CATMAP.pajak), lainnya: sumCategory(o, TIKTOK_CATMAP.lainnya),
        netSettlement, tanggalCair: excelSerialToISO(o['Waktu pembayaran pesanan']),
      };
    });
  });

  // ---- Gabungkan baris SKU cair (fallback: file minggu ini -> pendingOrderSku registry -> histori orderDb) ----
  const historicalOrderSku = {};
  STATE.orderDb.forEach(r => { if (r.orderId && r.sku) { historicalOrderSku[r.orderId] = historicalOrderSku[r.orderId] || []; historicalOrderSku[r.orderId].push({ sku: r.sku, qty: r.qty, warna: r.warna }); } });

  const cairSkuRows = [];
  const notFoundOrderIds = [];
  const matchStats = { shopeeTotal:0, shopeeFound:0, shopeeNotFound:0, tiktokTotal:0, tiktokFound:0, tiktokNotFound:0 };
  Object.keys(shopeeFinance).forEach(id => {
    matchStats.shopeeTotal++;
    let rows = STATE.pendingOrderSku[id] || historicalOrderSku[id];
    if (rows) { matchStats.shopeeFound++; rows.forEach(r => cairSkuRows.push({ orderId:id, sku:r.sku, qty:r.qty, warna:r.warna, ...financeShare(shopeeFinance[id], r, rows) })); }
    else { matchStats.shopeeNotFound++; notFoundOrderIds.push({ orderId: id, toko: shopeeFinance[id].toko }); }
  });
  Object.keys(tiktokFinance).forEach(id => {
    matchStats.tiktokTotal++;
    let rows = STATE.pendingOrderSku[id] || historicalOrderSku[id];
    if (rows) { matchStats.tiktokFound++; rows.forEach(r => cairSkuRows.push({ orderId:id, sku:r.sku, qty:r.qty, warna:r.warna, ...financeShare(tiktokFinance[id], r, rows) })); }
    else { matchStats.tiktokNotFound++; notFoundOrderIds.push({ orderId: id, toko: tiktokFinance[id].toko }); }
  });

  function financeShare(fin, row, allRows) {
    const totalQty = allRows.reduce((s,r) => s + r.qty, 0);
    const share = totalQty > 0 ? row.qty / totalQty : 1;
    const totalBiaya = (fin.komisi_platform+fin.biaya_layanan+fin.biaya_pembayaran+fin.komisi_afiliasi+fin.komisi_dinamis+fin.biaya_iklan+fin.pajak+fin.lainnya) * share;
    return {
      sumber: fin.toko, pendapatan: fin.pendapatan*share, komisiPlatform: fin.komisi_platform*share, biayaLayanan: fin.biaya_layanan*share,
      biayaPembayaran: fin.biaya_pembayaran*share, komisiAfiliasi: fin.komisi_afiliasi*share, komisiDinamis: fin.komisi_dinamis*share,
      biayaIklan: fin.biaya_iklan*share, pajak: fin.pajak*share, totalBiaya, netSettlement: fin.netSettlement*share, tanggalCair: fin.tanggalCair,
    };
  }

  // ---- Saring order yg SUDAH tercatat sebelumnya (migrasi ATAU batch mingguan lalu) -- cegah dihitung dobel ----
  // kalau order yg sama entah bagaimana muncul lagi sbg "cair" di file minggu ini (rentang tanggal tumpang tindih dsb),
  // jangan dihitung lagi ke alokasi/payout, karena sudah pernah diproses & dibayarkan sebelumnya.
  // Cuma anggap "sudah tercatat" (blokir hitung ulang) kalau baris itu BENERAN sudah settle (ada pendapatan asli).
  // Order berstatus "Gagal"/dibatalkan (pendapatan kosong) TIDAK dianggap final -- kalau platform koreksi & order itu
  // ternyata cair beneran nanti, tetap harus bisa diproses (bukan di-skip diam-diam).
  const alreadyRecorded = new Set(
    STATE.orderDb.filter(r => r.pendapatan != null && r.status !== 'Gagal').map(r => r.orderId + '|' + r.sku)
  );
  const skippedAlreadyRecorded = cairSkuRows.filter(r => alreadyRecorded.has(r.orderId + '|' + r.sku));
  const newCairSkuRows = cairSkuRows.filter(r => !alreadyRecorded.has(r.orderId + '|' + r.sku));

  // ---- Map SKU -> produk + brand, hargaKonveksi, warna fallback ----
  const qtyPerProduk = {}; // hanya produk URBAN OUTDOOR (jalur capital partner)
  const vendorSkuRows = []; // SEMUA produk (termasuk Urban Outdoor) -- konveksi/pembuat barang tetap harus dibayar
                             // terlepas dari investor dapat margin, jadi 2 arus uang ini paralel, bukan saling meniadakan.
  newCairSkuRows.forEach(r => {
    if (!r.sku) return;
    const prefix = String(r.sku).slice(0,3).toUpperCase();
    const p = STATE.products.find(pr => pr.prefix === prefix);
    r.produk = p ? p.nama : null;
    r.brand = p ? p.brand : null;
    r.hargaKonveksi = lookupHargaKonveksiBySku(r.sku);
    if (!r.warna) r.warna = deriveWarnaFromSku(r.sku);
    if (!p) return;
    if (p.brand === 'URBAN OUTDOOR') {
      const cp = capitalPartnerProduk(p.nama);
      qtyPerProduk[cp] = (qtyPerProduk[cp]||0) + r.qty;
    }
    vendorSkuRows.push(r);
  });

  // ---- Pembayaran ke Konveksi/Supplier (SEMUA brand, termasuk Urban Outdoor) ----
  const vendorPayments = {};
  vendorSkuRows.forEach(r => {
    if (!r.hargaKonveksi) return;
    const b = r.brand || 'TIDAK DIKETAHUI';
    vendorPayments[b] = vendorPayments[b] || { qty:0, total:0, produk:new Set(), skuBreakdown:{} };
    vendorPayments[b].qty += r.qty; vendorPayments[b].total += r.qty*r.hargaKonveksi; vendorPayments[b].produk.add(r.produk);
    vendorPayments[b].skuBreakdown[r.sku] = (vendorPayments[b].skuBreakdown[r.sku]||0) + r.qty;
  });

  // ---- Alokasi FIFO (per investor) + largest remainder (antar investor) ----
  const allocations = allocateUnitsToContracts(qtyPerProduk, newCairSkuRows);

  // ---- Surplus per produk (harga investor flat - harga konveksi per SKU) ----
  const surplusRows = Object.entries(qtyPerProduk).map(([produk, qtyTotal]) => {
    const activeC = STATE.contracts.find(c => c.produk === produk && c.status === 'DANA BELUM CAIR');
    const hargaInvestor = activeC ? activeC.hargaModalPcs : null;
    const skusOfProduk = newCairSkuRows.filter(r => capitalPartnerProduk(r.produk) === produk);
    let totalKonveksi = 0, qtyDenganHarga = 0;
    skusOfProduk.forEach(r => { if (r.hargaKonveksi) { totalKonveksi += r.qty*r.hargaKonveksi; qtyDenganHarga += r.qty; } });
    if (!hargaInvestor || qtyDenganHarga === 0) return { produk, qty: Math.round(qtyTotal), surplusPerUnit:null, totalSurplus:null };
    const totalInvestorRevenue = qtyDenganHarga * hargaInvestor;
    const totalSurplus = totalInvestorRevenue - totalKonveksi;
    return { produk, qty: Math.round(qtyTotal), hargaInvestor, totalKonveksi, totalSurplus, surplusPerUnit: totalSurplus/qtyDenganHarga };
  });

  return { cairSkuRows: newCairSkuRows, qtyPerProduk, allocations, vendorPayments, surplusRows, matchStats, nSkippedAlreadyRecorded: skippedAlreadyRecorded.length, returAdjustments, notFoundOrderIds, zeroSettlementSkipped, timestamp: new Date().toISOString() };
}

/* =========================================================================
   GOOGLE DRIVE STORAGE LAYER
   ========================================================================= */
async function driveApi(path, opts) {
  opts = opts || {};
  const res = await fetch('https://www.googleapis.com' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + accessToken, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error(`Drive API ${res.status}: ${await res.text()}`);
  return res;
}

async function getOrCreateStateFile() {
  // cek cache lokal dulu -- hindari re-search berulang yg rawan race condition/salah pilih kalau ada duplikat
  const cachedId = localStorage.getItem('outmark-os-state-file-id');
  if (cachedId) {
    try {
      const res = await driveApi(`/drive/v3/files/${cachedId}?fields=id,trashed`);
      const meta = await res.json();
      if (!meta.trashed) return cachedId;
    } catch (e) { /* file mungkin sudah tidak ada/berubah, lanjut cari ulang di bawah */ }
  }

  // cari file yg sudah pernah dibuat app ini (drive.file scope: cuma file yg dibuat app ini yg kelihatan)
  // urutkan by modifiedTime desc -- kalau (seharusnya tidak terjadi lagi) ada duplikat, pakai yg PALING BARU diubah, bukan asal ambil pertama
  const q = encodeURIComponent(`name='${STATE_FILENAME}' and trashed=false`);
  const listRes = await driveApi(`/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime,size)&orderBy=modifiedTime desc`);
  const list = await listRes.json();
  if (list.files && list.files.length) {
    if (list.files.length > 1) {
      console.warn(`PERINGATAN: ditemukan ${list.files.length} file "${STATE_FILENAME}" di Drive. Memakai yang paling baru diubah (${list.files[0].modifiedTime}). Sebaiknya hapus manual file duplikat lainnya di Drive supaya tidak membingungkan.`);
    }
    const chosenId = list.files[0].id;
    localStorage.setItem('outmark-os-state-file-id', chosenId);
    return chosenId;
  }
  // belum ada -> buat baru, isi kosong
  const initialContent = JSON.stringify({ capitalPartners: [], stores: [] });
  const metadata = { name: STATE_FILENAME, mimeType: 'application/json' };
  const boundary = '-------outmarkstate';
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
               `--${boundary}\r\nContent-Type: application/json\r\n\r\n${initialContent}\r\n--${boundary}--`;
  const createRes = await driveApi('/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body,
  });
  const created = await createRes.json();
  localStorage.setItem('outmark-os-state-file-id', created.id);
  return created.id;
}

async function loadState() {
  stateFileId = await getOrCreateStateFile();
  const res = await driveApi(`/drive/v3/files/${stateFileId}?alt=media`);
  const text = await res.text();
  const loaded = text ? JSON.parse(text) : {};
  // DEFAULT_STATE mencakup SEMUA field yg pernah ada -- supaya file lama (dari sebelum field baru ditambahkan)
  // tidak jadi undefined pas dimuat. Tiap kali nambah field baru ke STATE, tambahkan juga di sini.
  const DEFAULT_STATE = { capitalPartners: [], stores: [], products: [], contracts: [], colorCodeMap: {}, pembagiPctManual: {}, orderDb: [], pendingOrderSku: {}, payouts: [], vendorPayouts: [], adsMingguan: [], biayaOperasional: [], saldoDiluarKontrak: {}, biayaRetur: [] };
  STATE = Object.assign({}, DEFAULT_STATE, loaded);
}

async function saveState() {
  const body = JSON.stringify(STATE);
  // PENGAMAN: kalau data yg mau disimpan jauh lebih kecil dari yg sudah ada di Drive, kemungkinan
  // STATE di memori belum termuat penuh (race condition/bug) -- jangan timpa diam-diam, minta konfirmasi dulu.
  try {
    const metaRes = await driveApi(`/drive/v3/files/${stateFileId}?fields=size`);
    const meta = await metaRes.json();
    const currentSize = Number(meta.size) || 0;
    const newSize = body.length;
    if (currentSize > 50000 && newSize < currentSize * 0.3) {
      const proceed = confirm(
        `PERINGATAN: Data yang mau disimpan (${(newSize/1024).toFixed(0)}KB) jauh lebih kecil dari yang tersimpan sekarang di Drive (${(currentSize/1024).toFixed(0)}KB).\n\n` +
        `Ini bisa jadi tanda sebagian data belum termuat sempurna di sesi ini. Kalau tidak yakin, klik Batal, REFRESH halaman, lalu coba lagi.\n\n` +
        `Tetap simpan (timpa data lama)?`
      );
      if (!proceed) throw new Error('Penyimpanan dibatalkan demi keamanan data (ukuran anomali terdeteksi).');
    }
  } catch (e) {
    if (String(e.message).includes('dibatalkan demi keamanan')) throw e;
    // gagal cek metadata (mis. file baru) -- lanjut simpan normal, jangan blokir
  }
  // Simple upload (uploadType=media) cuma andal sampai ~5MB. Data kita (ribuan baris orderDb) bisa lebih
  // besar dari itu dan GAGAL DIAM-DIAM kalau pakai cara lama. Pakai resumable upload supaya andal di ukuran besar.
  const initRes = await driveApi(`/upload/drive/v3/files/${stateFileId}?uploadType=resumable`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
    body: JSON.stringify({}), // metadata kosong (nama file tidak berubah)
  });
  const uploadUrl = initRes.headers.get('Location');
  if (!uploadUrl) throw new Error('Gagal memulai resumable upload (tidak dapat URL sesi dari Drive).');
  const putRes = await fetch(uploadUrl, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
    body,
  });
  if (!putRes.ok) throw new Error(`Gagal upload data (HTTP ${putRes.status}): ${await putRes.text()}`);

  // VERIFIKASI: baca ulang ukuran file dari Drive, pastikan benar-benar tersimpan (bukan cuma HTTP 200 palsu/parsial)
  const verifyRes = await driveApi(`/drive/v3/files/${stateFileId}?fields=size`);
  const verifyMeta = await verifyRes.json();
  const savedSize = Number(verifyMeta.size) || 0;
  if (Math.abs(savedSize - body.length) > 100) { // toleransi kecil utk encoding, dsb
    throw new Error(`Verifikasi gagal: ukuran di Drive (${savedSize} byte) tidak cocok dgn yg baru dikirim (${body.length} byte). Data mungkin TIDAK tersimpan dgn benar -- coba lagi, jangan tutup halaman dulu.`);
  }
}

/* =========================================================================
   AUTH
   ========================================================================= */
let tokenClient;
let authReady = false;

function setupTokenClient() {
  if (typeof google === 'undefined' || !google.accounts) throw new Error('Library Google gagal dimuat.');
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: (resp) => {
      if (resp.error) { onLoginError(new Error(resp.error)); return; }
      accessToken = resp.access_token;
      onLoggedIn();
    },
    error_callback: (err) => onLoginError(new Error(err.message || 'Login dibatalkan/gagal.')),
  });
  authReady = true;
}

function login() {
  if (!authReady) { onLoginError(new Error('Google Sign-In belum siap, coba refresh halaman.')); return; }
  tokenClient.requestAccessToken();
}

function onLoginError(e) {
  const s = document.getElementById('gateStatus');
  if (s) { s.className = 'status-box show err'; s.textContent = 'Gagal: ' + e.message; }
  const btn = document.getElementById('btnGateLogin');
  if (btn) { btn.disabled = false; btn.textContent = 'Login dengan Google'; }
}

/* =========================================================================
   RENDER: GATE (belum login)
   ========================================================================= */
function renderGate() {
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="gate">
      <div class="wordmark">Outmark <span style="color:var(--accent)">OS</span></div>
      <p>Masuk dengan akun Google untuk mulai. Data kamu tersimpan di Google Drive kamu sendiri.</p>
      <button id="btnGateLogin">Login dengan Google</button>
      <div class="status-box" id="gateStatus"></div>
    </div>
  `;
  document.getElementById('btnGateLogin').addEventListener('click', () => {
    const btn = document.getElementById('btnGateLogin');
    btn.disabled = true; btn.textContent = 'Menunggu login...';
    login();
  });
}

async function onLoggedIn() {
  document.getElementById('authStatus').innerHTML = `<div class="email">● Tersambung ke Google Drive</div><button id="btnLogout">Keluar</button>`;
  document.getElementById('app').innerHTML = `<div class="loading-wrap">Memuat data dari Google Drive...</div>`;
  try {
    await loadState();
    document.getElementById('tabs').style.display = 'flex';
    switchTab('dashboard');
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="panel"><div class="status-box show err">Gagal memuat data: ${e.message}</div></div>`;
  }
  document.getElementById('btnLogout').addEventListener('click', () => { location.reload(); });
}

          if (row && row[iKode] && row[iNama]) {
            const kode2 = String(row[iKode]).slice(0, 2).toUpperCase();
            if (!pairs[kode2]) pairs[kode2] = String(row[iNama]).toUpperCase();
          }
        }
        Object.entries(pairs).forEach(([kode2, nama]) => {
          if (!STATE.capitalPartners.some(p => p.kode2 === kode2)) {
            STATE.capitalPartners.push({ id: uid('cp'), nama, kode2, kontak: '', tanggalBergabung: null, status: 'Aktif' });
            nPartnerAdded++;
          }
        });
      }

      // ---- Toko dari kolom SUMBER di PENJUALAN ----
      const wsPJ = wb.Sheets['PENJUALAN'];
      if (wsPJ) {
        const rows = XU.sheet_to_json(wsPJ, { header: 1 });
        const header = rows[0];
        const iSumber = header.indexOf('SUMBER');
        const sumberSet = new Set();
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (row && row[iSumber]) sumberSet.add(String(row[iSumber]).trim());
        }
        const platformGuess = (s) => {
          const up = s.toUpperCase();
          if (up.includes('SHOPEE')) return 'Shopee';
          if (up.includes('TIKTOK')) return 'TikTok';
          if (up.includes('TOKPED') || up.includes('TOKOPEDIA')) return 'Tokopedia';
          if (up.includes('LAZADA')) return 'Lazada';
          return 'Lainnya';
        };
        sumberSet.forEach(nama => {
          if (!STATE.stores.some(s => s.nama.toUpperCase() === nama.toUpperCase())) {
            STATE.stores.push({ id: uid('st'), nama, platform: platformGuess(nama), status: 'Aktif' });
            nStoreAdded++;
          }
        });
      }

      // ---- Produk (dari PENJUALAN: prefix SKU, brand, harga konveksi BE:BF) ----
      let nProductAdded = 0, nColorAdded = 0;
      if (wsPJ) {
        const pjRows = XU.sheet_to_json(wsPJ, { header: 1 });
        const pjHeader = pjRows[0];
        const counts = {}; const brandCounts = {}; const colorCounts = {};
        const iSKU = pjHeader.indexOf('No. SKU') >= 0 ? pjHeader.indexOf('No. SKU') : pjHeader.indexOf('No SKU');
        const iBrand = pjHeader.indexOf('BRAND');
        const iNamaBarang = pjHeader.indexOf('Nama Barang');
        const iWarnaCol = pjHeader.indexOf('Warna');
        for (let r = 1; r < pjRows.length; r++) {
          const row = pjRows[r];
          if (!row) continue;
          const sku = row[iSKU], nama = row[iNamaBarang], brand = row[iBrand], warnaVal = row[iWarnaCol];
          if (sku && nama) { const prefix = String(sku).slice(0,3).toUpperCase(); counts[prefix] = counts[prefix] || {}; counts[prefix][nama] = (counts[prefix][nama]||0)+1; }
          if (nama && brand) { brandCounts[nama] = brandCounts[nama] || {}; brandCounts[nama][brand] = (brandCounts[nama][brand]||0)+1; }
          if (sku && warnaVal && String(sku).length >= 6) {
            const kw = String(sku).slice(3,6).toUpperCase();
            colorCounts[kw] = colorCounts[kw] || {}; colorCounts[kw][String(warnaVal).toUpperCase()] = (colorCounts[kw][String(warnaVal).toUpperCase()]||0)+1;
          }
        }
        const majority = (obj) => Object.entries(obj).reduce((best,[k,n]) => n > (best[1]||-1) ? [k,n] : best, [null,-1])[0];
        Object.entries(colorCounts).forEach(([kode,obj]) => { if (!STATE.colorCodeMap[kode]) { STATE.colorCodeMap[kode] = majority(obj); nColorAdded++; } });

        const h2 = pjRows[1] || [];
        const iModel = h2.indexOf('MODEL'), iHarga = h2.indexOf('HARGA');
        const bePriceByKodeProduk = {};
        if (iModel >= 0 && iHarga >= 0) {
          for (let r = 2; r < pjRows.length; r++) {
            const row = pjRows[r];
            if (row && row[iModel] && typeof row[iHarga] === 'number') bePriceByKodeProduk[String(row[iModel]).toUpperCase()] = row[iHarga];
          }
        }
        Object.entries(counts).forEach(([prefix, obj]) => {
          const nama = majority(obj);
          if (STATE.products.some(p => p.nama === nama)) return;
          const brand = majority(brandCounts[nama] || {}) || '';
          const hargaKonveksi = {};
          SIZES.forEach(s => {
            const h = bePriceByKodeProduk[(nama + s).toUpperCase()];
            if (h != null) hargaKonveksi[s] = [{ harga: h, tanggal: null, sumber: 'migrasi' }];
          });
          STATE.products.push({ id: uid('pr'), nama, brand, prefix, hargaKonveksi });
          nProductAdded++;
        });
      }

      // ---- Kontrak (dari SYIRKAH WAKALAH, ditautkan ke Capital Partner via kode2) ----
      let nContractAdded = 0, nContractUpdated = 0;
      if (wsSW) {
        const swRows = XU.sheet_to_json(wsSW, { header: 1 });
        const swHeader = swRows[0];
        const iProduk = swHeader.indexOf('PRODUK'), iKodeInv = swHeader.indexOf('KODE INVESTOR');
        const iTglMasuk = swHeader.indexOf('TANGGAL MASUK'), iStockAwal = swHeader.indexOf('STOCK AWAL'), iStockAkhir = swHeader.indexOf('STOCK AKHIR');
        const iHargaModal = swHeader.indexOf('HARGA MODAL/PCS'), iNilaiMargin = swHeader.indexOf('NILAI MARGIN');
        const statusIdxs = swHeader.reduce((acc,h,i) => { if (h==='STATUS') acc.push(i); return acc; }, []);
        const iStatus = statusIdxs[0];
        const contractByKode = {}; STATE.contracts.forEach(c => contractByKode[c.kodeKontrak] = c);
        for (let r = 1; r < swRows.length; r++) {
          const row = swRows[r];
          if (!row || !row[iProduk] || !row[iKodeInv]) continue;
          const kodeKontrak = String(row[iKodeInv]);
          const kode2 = kodeKontrak.slice(0,2).toUpperCase();
          const partner = findPartnerByKode2(kode2);
          if (!partner) continue;
          let tglMasuk = null;
          if (row[iTglMasuk]) { tglMasuk = excelSerialToISO(row[iTglMasuk]); }
          const fresh = {
            produk: row[iProduk], capitalPartnerId: partner.id, kodeKontrak,
            tanggalMasuk: tglMasuk, stockAwal: Number(row[iStockAwal])||0, stockAkhir: Number(row[iStockAkhir])||0,
            hargaModalPcs: Number(row[iHargaModal])||0, nilaiMargin: Number(row[iNilaiMargin])||0,
            status: row[iStatus] || 'DANA SUDAH CAIR',
          };
          if (contractByKode[kodeKontrak]) {
            Object.assign(contractByKode[kodeKontrak], fresh); // update data yg sudah ada (perbaiki kalau ada yg salah, mis. tanggal)
            nContractUpdated++;
          } else {
            const c = { id: uid('ct'), ...fresh };
            STATE.contracts.push(c); contractByKode[kodeKontrak] = c;
            nContractAdded++;
          }
        }
      }

      // ---- Histori PENJUALAN -> orderDb (level order/SKU, 1 baris = 1 unit, utk fallback pencarian SKU order lama) ----
      let nHistAdded = 0, nHistUpdated = 0, nHistDipindahKePending = 0;
      if (wsPJ) {
        function toNumOrNull(v) { const n = Number(v); return (v!==null&&v!==undefined&&v!==''&&!isNaN(n)) ? n : null; }
        const histRows = XU.sheet_to_json(wsPJ, { header: 1 });
        const hh = histRows[0];
        const iNoRef = hh.indexOf('No Referensi')>=0?hh.indexOf('No Referensi'):hh.indexOf('No. Referensi');
        const iNamaBarang2 = hh.indexOf('Nama Barang'), iSKU2 = hh.indexOf('No. SKU')>=0?hh.indexOf('No. SKU'):hh.indexOf('No SKU');
        const iBrand2 = hh.indexOf('BRAND'), iWarna2 = hh.indexOf('Warna'), iSumber2 = hh.indexOf('SUMBER');
        const iAdmin2 = hh.indexOf('Admin'), iKomisiDinamis2 = hh.indexOf('Komisi Dinamis'), iOngkir2 = hh.indexOf('Ongkir');
        const iAfiliasi2 = hh.indexOf('Afiliasi'), iBiayaLayanan2 = hh.indexOf('Biaya Layanan'), iBiayaPesanan2 = hh.indexOf('Biaya Pesanan');
        const iPajak2 = hh.indexOf('Pajak'), iPendapatan2 = hh.indexOf('Pendapatan'), iProfit2 = hh.indexOf('Profit');
        const iModalInv2 = hh.indexOf('Modal Investor'), iProfitSetelah2 = hh.indexOf('Profit Setelah Investor');
        const iTglPenarikan2 = hh.indexOf('Tanggal Penarikan'), iTglPesan2 = hh.indexOf('Tanggal Pesan'), iStatus2 = hh.indexOf('Status');
        const iKodeKontrakHist2 = hh.indexOf('INVESTOR'); // kolom B -- kode kontrak ASLI yg dipakai investor pd sale ini (sumber kebenaran historis)
        // Dedup berdasarkan JUMLAH KEMUNCULAN (bukan sekadar ada/tidak), supaya order+SKU yg sama tapi
        // muncul berkali-kali di PENJUALAN (krn qty>1 dipecah jadi beberapa baris terpisah) TETAP semua kehitung,
        // tapi tetap idempotent kalau migrasi dijalankan ulang (tidak nambah dobel).
        // existingByKey: kumpulan REFERENSI baris orderDb yg sudah ada, per kombinasi order+SKU (bisa lebih dari 1, krn qty>1 dipecah jadi beberapa baris)
        const existingByKey = {};
        STATE.orderDb.forEach(r => { const k = r.orderId + '|' + (r.sku||''); existingByKey[k] = existingByKey[k] || []; existingByKey[k].push(r); });

        // Pra-pindai: hitung TOTAL & jumlah occurrence "Pending" per key dari source SEKARANG, supaya bisa
        // deteksi & bersihkan sisa migrasi versi lama (sblm aturan Pending ini ada) dgn benar -- termasuk kasus
        // langka di mana 1 key (order+SKU sama) py CAMPURAN occurrence Pending & non-Pending (indeksnya beda2).
        const totalCountPerKey = {}, pendingCountPerKey = {};
        for (let r = 1; r < histRows.length; r++) {
          const row = histRows[r]; if (!row) continue;
          const noRef = iNoRef>=0 ? row[iNoRef] : null; const nama = row[iNamaBarang2];
          if (!noRef || !nama) continue;
          const key = String(noRef) + '|' + (row[iSKU2]||'');
          totalCountPerKey[key] = (totalCountPerKey[key]||0) + 1;
          if (row[iStatus2] === 'Pending') pendingCountPerKey[key] = (pendingCountPerKey[key]||0) + 1;
        }
        Object.keys(totalCountPerKey).forEach(key => {
          const expectedNonPending = totalCountPerKey[key] - (pendingCountPerKey[key]||0);
          const existingRows = existingByKey[key] || [];
          if (existingRows.length > expectedNonPending) {
            const excess = existingRows.length - expectedNonPending;
            for (let i = 0; i < excess; i++) {
              const rowToRemove = existingRows[existingRows.length - 1 - i];
              const idx = STATE.orderDb.indexOf(rowToRemove);
              if (idx >= 0) { STATE.orderDb.splice(idx, 1); nHistDipindahKePending++; }
            }
            existingByKey[key] = existingRows.slice(0, expectedNonPending);
          }
        });

        const seenThisPass = {}; // occurrence index KHUSUS utk baris non-Pending (dipakai match existingByKey)
        for (let r = 1; r < histRows.length; r++) {
          const row = histRows[r];
          if (!row) continue;
          const noRef = iNoRef>=0 ? row[iNoRef] : null;
          const nama = row[iNamaBarang2];
          if (!noRef || !nama) continue;
          const sku = row[iSKU2];
          const key = String(noRef) + '|' + (sku||'');
          let tglPenarikan = row[iTglPenarikan2] ? excelSerialToISO(row[iTglPenarikan2]) : null;
          let tglPesan = row[iTglPesan2] ? excelSerialToISO(row[iTglPesan2]) : null;

          // Order berstatus "Pending" (belum final) -- JANGAN masuk Database Penjualan, taruh di "Menunggu Cair"
          // spy SKU-nya tetap diingat sampai statusnya jelas nanti (bukan transaksi cair beneran).
          if (row[iStatus2] === 'Pending') {
            const pendingKey = String(noRef);
            STATE.pendingOrderSku[pendingKey] = STATE.pendingOrderSku[pendingKey] || [];
            if (!STATE.pendingOrderSku[pendingKey].some(p => p.sku === (sku||null))) {
              STATE.pendingOrderSku[pendingKey].push({ sku: sku||null, qty: 1, warna: row[iWarna2]||null, storeName: row[iSumber2]||null, tanggalPesan: tglPesan });
            }
            continue;
          }

          seenThisPass[key] = (seenThisPass[key]||0) + 1;
          const occurrenceIdx = seenThisPass[key] - 1; // ke berapa (0-based) kemunculan key NON-PENDING ini
          const biayaLayananGabungan = (toNumOrNull(row[iBiayaLayanan2])||0) + (toNumOrNull(row[iOngkir2])||0) + (toNumOrNull(row[iBiayaPesanan2])||0);
          const freshData = {
            orderId: String(noRef), sumber: row[iSumber2]||null, produk: nama, sku: sku||null, brand: row[iBrand2]||null, warna: row[iWarna2]||null,
            qty: 1, hargaKonveksi: null, tanggalPenarikan: tglPenarikan, tanggalCair: null, tanggalPesan: tglPesan, status: row[iStatus2]||null,
            kodeKontrakHistoris: row[iKodeKontrakHist2]||null,
            pendapatan: toNumOrNull(row[iPendapatan2]), komisiPlatform: toNumOrNull(row[iAdmin2]),
            biayaLayanan: (iBiayaLayanan2>=0||iOngkir2>=0||iBiayaPesanan2>=0) ? biayaLayananGabungan : null,
            biayaPembayaran: null, komisiAfiliasi: toNumOrNull(row[iAfiliasi2]), komisiDinamis: toNumOrNull(row[iKomisiDinamis2]),
            biayaIklan: null, pajak: toNumOrNull(row[iPajak2]), totalBiaya: null, netSettlement: null,
            profit: toNumOrNull(row[iProfit2]), modalInvestor: toNumOrNull(row[iModalInv2]), profitSetelahInvestor: toNumOrNull(row[iProfitSetelah2]),
            capitalPartnerProduk: null, sumberData: 'migrasi_penjualan',
          };
          if (existingByKey[key] && existingByKey[key][occurrenceIdx]) {
            // sudah ada baris utk kemunculan ke-N ini -- REFRESH dengan hasil parsing terbaru (perbaiki kalau ada bug lama)
            Object.assign(existingByKey[key][occurrenceIdx], freshData);
            nHistUpdated++;
          } else {
            const newRow = { ...freshData };
            STATE.orderDb.push(newRow);
            existingByKey[key] = existingByKey[key] || [];
            existingByKey[key].push(newRow);
            nHistAdded++;
          }
        }
      }

      showMsg(msg, 'info', 'Menyimpan ke Google Drive (bisa beberapa detik untuk data sebesar ini)...');
      await saveState();
      showMsg(msg, 'ok', `Selesai: ${nPartnerAdded} Capital Partner, ${nStoreAdded} toko, ${nProductAdded} produk, ${nColorAdded} kode warna, ${nContractAdded} kontrak baru, ${nContractUpdated} kontrak diperbarui, ${nHistAdded} baris histori baru, ${nHistUpdated} baris histori di-refresh.` + (nHistDipindahKePending ? ` ${nHistDipindahKePending} baris "Pending" dipindah ke Menunggu Cair.` : ''));
      renderPartnerList(document.getElementById('partnerList'));
      renderStoreList(document.getElementById('storeList'));
    } catch (e) {
      showMsg(msg, 'err', 'Gagal migrasi: ' + e.message);
    }
  });

  document.getElementById('formPartner').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('partnerMsg');
    const nama = document.getElementById('p_nama').value.trim().toUpperCase();
    const kode2 = document.getElementById('p_kode').value.trim().toUpperCase();
    const kontak = document.getElementById('p_kontak').value.trim();
    const tanggalBergabung = document.getElementById('p_tanggal').value || null;

    if (kode2.length !== 2) { showMsg(msg, 'err', 'Kode harus persis 2 huruf.'); return; }
    if (STATE.capitalPartners.some(p => p.kode2 === kode2)) {
      showMsg(msg, 'err', `Kode "${kode2}" sudah dipakai oleh ${STATE.capitalPartners.find(p=>p.kode2===kode2).nama} -- pakai kode lain.`);
      return;
    }
    STATE.capitalPartners.push({ id: uid('cp'), nama, kode2, kontak, tanggalBergabung, status: 'Aktif' });
    await withSaving(msg, 'Capital Partner ditambahkan.', async () => {
      await saveState();
      document.getElementById('formPartner').reset();
      renderPartnerList(document.getElementById('partnerList'));
    });
  });

  document.getElementById('formStore').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('storeMsg');
    const nama = document.getElementById('s_nama').value.trim();
    const platform = document.getElementById('s_platform').value;
    if (STATE.stores.some(s => s.nama.toLowerCase() === nama.toLowerCase())) {
      showMsg(msg, 'err', 'Nama toko ini sudah ada.'); return;
    }
    STATE.stores.push({ id: uid('st'), nama, platform, status: 'Aktif' });
    await withSaving(msg, 'Toko ditambahkan.', async () => {
      await saveState();
      document.getElementById('formStore').reset();
      renderStoreList(document.getElementById('storeList'));
    });
  });

  document.getElementById('btnInferRollover').addEventListener('click', async () => {
    const msg = document.getElementById('inferRolloverMsg');
    if (!confirm('Tandai riwayat rollover dari kontrak lama? Ini akan MENGUBAH data kontrak (menambah field riwayat + memperbaiki beberapa tanggal placeholder). Yakin lanjut?')) return;
    showMsg(msg, 'info', 'Menganalisa...');
    try {
      const r = inferRolloverLineage();
      await saveState();
      let text = `${r.nDitandai} kontrak ditandai riwayat rollover-nya. ${r.nTglDiperbaiki} tanggal placeholder diperbaiki. ${r.nDilewati} pasangan dilewati (kemungkinan kontrak paralel/split, bukan rollover linear).`;
      showMsg(msg, 'ok', text);
      if (r.dilewatiList.length) console.log('Dilewati (perlu cek manual kalau perlu):', r.dilewatiList);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
}

function showMsg(el, type, text) { el.className = 'status-box show ' + type; el.textContent = text; }

async function withSaving(msgEl, successText, fn) {
  showMsg(msgEl, 'info', 'Menyimpan ke Google Drive...');
  try {
    await fn();
    showMsg(msgEl, 'ok', successText);
  } catch (e) {
    showMsg(msgEl, 'err', 'Gagal simpan: ' + e.message);
  }
}

function renderPartnerList(el) {
  if (!STATE.capitalPartners.length) { el.innerHTML = '<div class="empty-note">Belum ada Capital Partner terdaftar.</div>'; return; }
  el.innerHTML = `
    <table class="data">
      <thead><tr><th>Kode</th><th>Nama</th><th>Kontak</th><th>Bergabung</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${STATE.capitalPartners.map(p => `<tr>
          <td><b>${p.kode2}</b></td><td>${p.nama}</td><td>${p.kontak || '-'}</td>
          <td>${fmtTanggal(p.tanggalBergabung)}</td>
          <td><span class="pill ${p.status==='Aktif'?'ok':'off'}">${p.status}</span></td>
          <td><button class="icon-del" data-del-partner="${p.id}" title="Hapus">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('[data-del-partner]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus Capital Partner ini? (Hanya hapus dari daftar master, tidak menghapus kontrak yang sudah ada)')) return;
      STATE.capitalPartners = STATE.capitalPartners.filter(p => p.id !== btn.dataset.delPartner);
      await saveState();
      renderPartnerList(el);
    });
  });
}

function renderStoreList(el) {
  if (!STATE.stores.length) { el.innerHTML = '<div class="empty-note">Belum ada toko terdaftar.</div>'; return; }
  el.innerHTML = `
    <table class="data">
      <thead><tr><th>Nama Toko</th><th>Platform</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${STATE.stores.map(s => `<tr>
          <td>${s.nama}</td><td>${platformDot(s.platform)}${s.platform}</td>
          <td><span class="pill ${s.status==='Aktif'?'ok':'off'}">${s.status}</span></td>
          <td><button class="icon-del" data-del-store="${s.id}" title="Hapus">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('[data-del-store]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus toko ini dari daftar?')) return;
      STATE.stores = STATE.stores.filter(s => s.id !== btn.dataset.delStore);
      await saveState();
      renderStoreList(el);
    });
  });
}

async function applyBatchResult(result, tanggalPenarikanIso) {
  // Baris "Gagal" (blm pernah beneran settle) TIDAK dianggap final -- kalau sekarang platform koreksi jadi cair,
  // baris lama itu di-UPDATE jadi data settle yg sebenarnya (bukan diblokir, bukan juga dobel jadi 2 baris).
  const genuinelySettledKeys = new Set(STATE.orderDb.filter(r => r.pendapatan != null && r.status !== 'Gagal').map(r => r.orderId + '|' + r.sku));
  const rowByKey = {}; STATE.orderDb.forEach(r => { rowByKey[r.orderId + '|' + r.sku] = r; });
  const tglPenarikan = tanggalPenarikanIso || new Date().toISOString();
  let added = 0, updated = 0;

  result.cairSkuRows.forEach(r => {
    const key = r.orderId + '|' + r.sku;
    if (genuinelySettledKeys.has(key)) return; // sudah beneran settle sebelumnya, jangan diproses lagi
    const cpProduk = r.brand === 'URBAN OUTDOOR' ? capitalPartnerProduk(r.produk) : null;
    const pending = STATE.pendingOrderSku[r.orderId];
    const tanggalPesan = pending ? (pending.find(p => p.sku === r.sku) || pending[0] || {}).tanggalPesan || null : null;
    const fresh = {
      orderId: r.orderId, sumber: r.sumber||null, produk: r.produk, sku: r.sku, brand: r.brand, warna: r.warna||null,
      qty: r.qty, hargaKonveksi: r.hargaKonveksi||null, tanggalPenarikan: tglPenarikan, tanggalCair: r.tanggalCair||null, tanggalPesan,
      pendapatan: r.pendapatan??null, komisiPlatform: r.komisiPlatform??null, biayaLayanan: r.biayaLayanan??null,
      biayaPembayaran: r.biayaPembayaran??null, komisiAfiliasi: r.komisiAfiliasi??null, komisiDinamis: r.komisiDinamis??null,
      biayaIklan: r.biayaIklan??null, pajak: r.pajak??null, totalBiaya: r.totalBiaya??null, netSettlement: r.netSettlement??null,
      capitalPartnerProduk: cpProduk, status: 'Selesai (koreksi via UJUSO Auto)', sumberData: 'import_mingguan',
    };
    if (rowByKey[key]) {
      Object.assign(rowByKey[key], fresh); // update baris lama (mis. yg tadinya "Gagal") jadi data settle yg benar
      updated++;
    } else {
      const row = { ...fresh };
      STATE.orderDb.push(row); rowByKey[key] = row;
      added++;
    }
    genuinelySettledKeys.add(key);

    // Order ini SUDAH CAIR beneran sekarang -- keluarkan dari "Menunggu Cair" spy tidak nyangkut selamanya
    if (STATE.pendingOrderSku[r.orderId]) {
      STATE.pendingOrderSku[r.orderId] = STATE.pendingOrderSku[r.orderId].filter(p => p.sku !== r.sku);
      if (STATE.pendingOrderSku[r.orderId].length === 0) delete STATE.pendingOrderSku[r.orderId];
    }
  });

  // kurangi stock kontrak sesuai alokasi, auto-tutup kalau habis
  result.allocations.forEach(a => {
    if (!a.contractId) return;
    const c = STATE.contracts.find(x => x.id === a.contractId);
    if (!c) return;
    c.stockAkhir = Math.max(0, (c.stockAkhir||0) - a.qty);
    if (c.stockAkhir === 0) c.status = 'DANA SUDAH CAIR';
  });

  // catat kewajiban payout
  result.allocations.forEach(a => {
    if (!a.capitalPartnerId) return;
    STATE.payouts.push({ id: uid('po'), tanggalDihitung: tglPenarikan, produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor,
      capitalPartnerId: a.capitalPartnerId, kodeKontrak: a.kodeKontrak, qty: a.qty, rate: a.rate, payout: a.payout, tanggalDibayar: null,
      hargaModalPcs: a.hargaModalPcs||null, skuBreakdown: a.skuBreakdown||{}, orderIds: [...new Set((a.orderUnits||[]).map(u=>u.orderId))] });
  });
  Object.entries(result.vendorPayments).forEach(([brand, d]) => {
    STATE.vendorPayouts.push({ id: uid('vpo'), tanggalDihitung: tglPenarikan, brand, produk: [...d.produk].join(', '), qty: d.qty, total: d.total, tanggalDibayar: null, skuBreakdown: d.skuBreakdown||{} });
  });

  // Biaya retur/refund (order lama yg ditolak/dikembalikan konsumen, kita nanggung ongkirnya) -- catat sbg biaya
  // spy tetap masuk PNL, meski TIDAK diproses sbg penjualan baru (jumlah selalu negatif dari sumbernya).
  // Dedup by orderId -- kalau file yg sama di-import ulang, jangan dobel catat.
  const existingReturOrderIds = new Set(STATE.biayaRetur.map(r => r.orderId));
  (result.returAdjustments || []).forEach(r => {
    if (existingReturOrderIds.has(r.orderId)) return;
    STATE.biayaRetur.push({ id: uid('retur'), tanggalDihitung: r.tanggalCair || tglPenarikan, orderId: r.orderId, toko: r.toko, jumlah: Math.abs(r.jumlah), catatan: 'Retur/refund -- biaya ongkir/penyesuaian ditanggung' });
    existingReturOrderIds.add(r.orderId);
  });

  await saveState();
  return { added, updated };
}
