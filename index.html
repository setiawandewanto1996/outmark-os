// ---- Migrasi Biaya Iklan dari Excel UJUSO lama (sheet "Ads Mingguan") ----
// Struktur sheet lama: kolom Tanggal (macam2 format teks tanggal -- kolom Bulan/Tahun di sampingnya TIDAK selalu
// bisa dipakai, banyak baris #VALUE!/kosong krn formula rusak), lalu 3 kolom biaya per PLATFORM (Tiktok/Tokped/
// Shopee), BUKAN per toko spesifik -- makanya toko dipetakan MANUAL oleh user lewat dropdown (bukan dicocokkan
// otomatis dari nama), krn app ini bisa py >1 toko per platform & nama toko bisa beda2/diganti kapan saja.
// Kebanyakan baris berkelompok per tanggal MULAI MINGGU (selalu hari Kamis, sesuai siklus penarikan mingguan)
// dgn belasan-puluhan baris per minggu yg harus DIJUMLAHKAN; sebagian baris TERBARU (minggu yg blm "ditutup" jadi
// 1 rekap) masih tercatat per-hari -- makanya setiap baris di-floor ke hari Kamis pd/sebelum tanggalnya dulu,
// baru dijumlahkan per kelompok Kamis itu, supaya minggu yg blm ditutup pun tetap terhitung benar ke minggunya.
function parseTanggalAdsUJUSO(str) {
  str = String(str == null ? '' : str).trim();
  if (!str) return null;
  const bulanMap = { jan:0, feb:1, mar:2, apr:3, mei:4, may:4, jun:5, jul:6, agu:7, aug:7, sep:8, okt:9, oct:9, nov:10, des:11, dec:11 };
  // format dgn nama bulan teks, mis. "13 Mar 2025", "20-Mar-25", "27 Mar 25", "8 May 2025", "1 August 2026"
  let m = str.match(/^(\d{1,2})[\s-]+([A-Za-z]+)[\s-]+(\d{2,4})$/);
  if (m) {
    const day = Number(m[1]);
    const mon = bulanMap[m[2].toLowerCase().slice(0,3)];
    let year = Number(m[3]); if (year < 100) year += 2000;
    if (mon != null && day >= 1 && day <= 31) return new Date(Date.UTC(year, mon, day));
  }
  // format numerik DD/MM/YYYY -- urutan ini dikonfirmasi dari file asli lewat kolom Bulan yg masih valid persis
  // di baris2 berformat ini (mis. "01/05/2025" berpasangan dgn kolom Bulan="5")
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    const day = Number(m[1]), mon = Number(m[2]) - 1, year = Number(m[3]);
    if (mon >= 0 && mon <= 11 && day >= 1 && day <= 31) return new Date(Date.UTC(year, mon, day));
  }
  return null;
}

function floorKeKamis(date) {
  const day = date.getUTCDay(); // 0=Minggu .. 6=Sabtu, Kamis=4
  const diff = (day - 4 + 7) % 7;
  const d2 = new Date(date);
  d2.setUTCDate(d2.getUTCDate() - diff);
  return d2;
}

function parseNominalAdsUJUSO(v) {
  if (v == null || v === '') return 0;
  const n = Number(String(v).replace(/[^0-9.-]/g, ''));
  return isNaN(n) ? 0 : n;
}

// rows: hasil XLSX.utils.sheet_to_json(ws, {header:1}) dari sheet "Ads Mingguan". Return array minggu unik
// (diurutkan tanggal naik), tiap elemen {tanggalDariIso, tanggalSampaiIso, tiktok, tokped, shopee, nBarisSumber}.
function parseAdsMingguanSheet(rows) {
  const weekMap = new Map();
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const tglRaw = r[1];
    if (!tglRaw) continue;
    const d = parseTanggalAdsUJUSO(tglRaw);
    if (!d) continue;
    const kamis = floorKeKamis(d);
    const key = kamis.toISOString().slice(0, 10);
    if (!weekMap.has(key)) weekMap.set(key, { tiktok: 0, tokped: 0, shopee: 0, nBarisSumber: 0 });
    const w = weekMap.get(key);
    w.tiktok += parseNominalAdsUJUSO(r[4]);
    w.tokped += parseNominalAdsUJUSO(r[5]);
    w.shopee += parseNominalAdsUJUSO(r[6]);
    w.nBarisSumber++;
  }
  const keys = [...weekMap.keys()].sort();
  return keys.map(key => {
    const w = weekMap.get(key);
    const dari = new Date(key + 'T00:00:00.000Z');
    const sampai = new Date(dari); sampai.setUTCDate(sampai.getUTCDate() + 6);
    return {
      tanggalDariIso: dari.toISOString(), tanggalSampaiIso: sampai.toISOString(),
      tiktok: w.tiktok, tokped: w.tokped, shopee: w.shopee, nBarisSumber: w.nBarisSumber,
    };
  });
}

// mapping: { tiktok: storeId|'', tokped: storeId|'', shopee: storeId|'' } -- dipilih user lewat dropdown krn
// sheet lama cuma py kolom per PLATFORM, bukan per toko spesifik. Kolom yg TIDAK dipetakan (mapping kosong)
// dilewati sepenuhnya. Idempoten: skip kombinasi minggu+toko yg SUDAH ada entrinya (dicek by storeId +
// tanggalDari persis) supaya aman dijalankan ulang tanpa dobel kalau user re-upload file yg sama/lebih baru.
function terapkanMigrasiAdsMingguan(parsedWeeks, mapping) {
  let nEntriBaru = 0, nDilewatiSudahAda = 0, nDilewatiNol = 0;
  const detailBaru = [];
  ['tiktok', 'tokped', 'shopee'].forEach(platformKey => {
    const storeId = mapping[platformKey];
    if (!storeId) return;
    const store = STATE.stores.find(s => s.id === storeId);
    if (!store) return;
    parsedWeeks.forEach(w => {
      const biaya = w[platformKey];
      if (!biaya) { nDilewatiNol++; return; }
      const sudahAda = STATE.adsMingguan.some(a => a.storeId === storeId && a.tanggalDari && a.tanggalDari.slice(0,10) === w.tanggalDariIso.slice(0,10));
      if (sudahAda) { nDilewatiSudahAda++; return; }
      STATE.adsMingguan.push({
        id: uid('ads'), tanggalDari: w.tanggalDariIso, tanggalSampai: w.tanggalSampaiIso,
        storeId: store.id, storeName: store.nama, platform: store.platform, biaya,
        catatan: 'Migrasi dari Excel UJUSO (sheet Ads Mingguan)',
      });
      nEntriBaru++;
      detailBaru.push({ tanggalDari: w.tanggalDariIso, storeName: store.nama, biaya });
    });
  });
  return { nEntriBaru, nDilewatiSudahAda, nDilewatiNol, detailBaru };
}

let adsFilter = { storeId: '', tglDari: '', tglSampai: '' };

// BUG (ditemukan 2026-10-30, laporan Setiawan: klik "+ Tambah Biaya Iklan" saat mode "Input per hari" tidak ada
// respon apapun -- rentang tanggal normal tidak kena): ads_tglDari/ads_tglSampai dulu py attribute HTML `required`
// permanen, sedangkan toggle btnToggleAdsTglSatu cuma sembunyikan wrapper div-nya (style.display='none'), TIDAK
// ikut lepas `required`-nya. Dikonfirmasi lewat Playwright: field required yg disembunyikan via display:none di
// ANCESTOR (bukan di elemen itu sendiri) TETAP willValidate=true di Chromium nyata -- browser diam2 menolak
// submit form (event 'submit' tidak pernah terpicu sama sekali, makanya "tidak ada respon apapun", bukan error).
// Fix: `required` dilepas dari markup ads_tglDari/ads_tglSampai, validasi kosong/isi sepenuhnya diserahkan ke
// cek manual yg SUDAH ADA di submit handler (if (!tglDari || !tglSampai) ...) -- persis pola Biaya Operasional
// (opex_tglDari/opex_tglSampai) yg dari awal memang TIDAK pernah dikasih `required` di HTML.
function renderAds(container) {
  const activeStores = STATE.stores.filter(s => s.status === 'Aktif');
  let filtered = STATE.adsMingguan;
  if (adsFilter.storeId) filtered = filtered.filter(a => a.storeId === adsFilter.storeId);
  if (adsFilter.tglDari) filtered = filtered.filter(a => a.tanggalSampai && a.tanggalSampai.slice(0,10) >= adsFilter.tglDari);
  if (adsFilter.tglSampai) filtered = filtered.filter(a => a.tanggalDari && a.tanggalDari.slice(0,10) <= adsFilter.tglSampai);
  filtered = filtered.slice().sort((a,b) => new Date(b.tanggalDari||0) - new Date(a.tanggalDari||0));

  const totalFiltered = filtered.reduce((s,a) => s + (a.biaya||0), 0);
  const byStore = {};
  filtered.forEach(a => { byStore[a.storeName] = (byStore[a.storeName]||0) + (a.biaya||0); });

  container.innerHTML = `
    <div class="panel">
      <h2>Migrasi Biaya Iklan dari Excel <span class="pill">opsional</span></h2>
      <div class="desc">Isi otomatis riwayat Biaya Iklan mingguan dari sheet "Ads Mingguan" file Excel UJUSO lama. Sheet itu cuma punya biaya per platform (Tiktok/Tokped/Shopee), jadi pilih dulu toko yg sesuai per platform di bawah -- kolom yg tidak dipetakan akan dilewati. Yang sudah ada tidak akan ditimpa/dobel.</div>
      ${!activeStores.length ? '<div class="empty-note">Belum ada toko terdaftar. Tambah di tab Data Master dulu.</div>' : `
      <input type="file" id="fileMigrasiAds" accept=".xlsx" style="display:none">
      <button class="btn btn-ghost" id="btnPickFileAds">Pilih File Excel UJUSO</button>
      <span id="fileMigrasiAdsLabel" style="font-size:12px; color:var(--ink-soft); margin-left:8px;">Belum ada file dipilih</span>
      <div class="grid2" style="margin-top:10px;">
        <div class="field"><label>Kolom "Tiktok" &rarr; Toko</label>
          <select id="ads_map_tiktok"><option value="">-- Lewati --</option>${activeStores.map(s=>`<option value="${s.id}">${s.nama} (${s.platform})</option>`).join('')}</select>
        </div>
        <div class="field"><label>Kolom "Tokped" &rarr; Toko</label>
          <select id="ads_map_tokped"><option value="">-- Lewati --</option>${activeStores.map(s=>`<option value="${s.id}">${s.nama} (${s.platform})</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Kolom "Shopee" &rarr; Toko</label>
        <select id="ads_map_shopee"><option value="">-- Lewati --</option>${activeStores.map(s=>`<option value="${s.id}">${s.nama} (${s.platform})</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" id="btnMigrasiAds" style="margin-top:10px;" disabled>Proses Migrasi</button>
      <div class="status-box" id="migrasiAdsMsg"></div>
      `}
    </div>

    <div class="panel">
      <h2>Tambah Biaya Iklan</h2>
      <div class="desc">Catat biaya iklan per toko untuk 1 periode (biasanya 1 minggu, sesuai siklus penarikan).</div>
      ${!activeStores.length ? '<div class="empty-note">Belum ada toko terdaftar. Tambah di tab Data Master dulu.</div>' : `
      <form id="formAds">
        <div class="grid2">
          <div class="field" id="ads_tglDariWrap"><label>Tanggal Dari</label><input type="date" id="ads_tglDari"></div>
          <div class="field" id="ads_tglSampaiWrap"><label>Tanggal Sampai</label><input type="date" id="ads_tglSampai"></div>
          <div class="field" id="ads_tglSatuWrap" style="display:none;"><label>Tanggal</label><input type="date" id="ads_tglSatu"></div>
        </div>
        <button type="button" class="btn-ghost" id="btnToggleAdsTglSatu" style="border:none; background:none; padding:4px 0; font-size:12.5px; color:var(--accent); cursor:pointer; box-shadow:none;">+ Input per hari (tanpa rentang)</button>
        <div class="grid2" style="margin-top:12px;">
          <div class="field"><label>Toko</label>
            <select id="ads_store" required><option value="">Pilih toko</option>${activeStores.map(s=>`<option value="${s.id}">${s.nama} (${s.platform})</option>`).join('')}</select>
          </div>
          <div class="field"><label>Biaya Iklan (Rp)</label><input type="number" id="ads_biaya" required min="0"></div>
        </div>
        <div class="field"><label>Catatan (opsional)</label><input type="text" id="ads_catatan" placeholder="mis. kampanye flash sale"></div>
        <button type="submit" class="btn btn-primary">+ Tambah Biaya Iklan</button>
        <div class="status-box" id="adsMsg"></div>
      </form>
      `}
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total (sesuai filter)</div><div class="kpi-value">${fmtRp(totalFiltered)}</div></div>
      <div class="kpi"><div class="kpi-label">Jumlah Entri</div><div class="kpi-value">${filtered.length}</div></div>
    </div>

    <div class="panel">
      <h2>Filter</h2>
      <div class="grid2">
        <div class="field"><label>Toko</label>
          <select id="adsFilterStore"><option value="">Semua Toko</option>${activeStores.map(s=>`<option value="${s.id}" ${adsFilter.storeId===s.id?'selected':''}>${s.nama}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Urutkan</label><div class="desc" style="margin:0;">Terbaru dulu</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Dari Tanggal</label><input type="date" id="adsFilterTglDari" value="${adsFilter.tglDari}"></div>
        <div class="field"><label>Sampai Tanggal</label><input type="date" id="adsFilterTglSampai" value="${adsFilter.tglSampai}"></div>
      </div>
      ${renderRincianBar(byStore, 'Rincian per Toko')}
      <div style="overflow-x:auto; margin-top:10px;">
      ${!filtered.length ? '<div class="empty-note">Belum ada data.</div>' : `
      <table class="data compact">
        <thead><tr><th>Tanggal</th><th>Toko</th><th>Platform</th><th class="num">Biaya</th><th>Catatan</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(a => `<tr>
            <td>${fmtTanggal(a.tanggalDari,{short:true})} - ${fmtTanggal(a.tanggalSampai,{short:true})}</td>
            <td>${a.storeName}</td><td>${a.platform}</td><td class="num">${fmtRp(a.biaya)}</td>
            <td style="font-size:11px; color:var(--ink-soft);">${a.catatan||'-'}</td>
            <td><button class="icon-del" data-del-ads="${a.id}">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
      </div>
    </div>
  `;

  const btnPickFileAds = document.getElementById('btnPickFileAds');
  if (btnPickFileAds) {
    btnPickFileAds.addEventListener('click', () => document.getElementById('fileMigrasiAds').click());
    let pendingMigrasiAdsFile = null;
    document.getElementById('fileMigrasiAds').addEventListener('change', (e) => {
      if (e.target.files[0]) {
        pendingMigrasiAdsFile = e.target.files[0];
        document.getElementById('fileMigrasiAdsLabel').textContent = pendingMigrasiAdsFile.name;
        document.getElementById('btnMigrasiAds').disabled = false;
      }
    });
    document.getElementById('btnMigrasiAds').addEventListener('click', async () => {
      const msg = document.getElementById('migrasiAdsMsg');
      if (!pendingMigrasiAdsFile) return;
      const mapping = {
        tiktok: document.getElementById('ads_map_tiktok').value,
        tokped: document.getElementById('ads_map_tokped').value,
        shopee: document.getElementById('ads_map_shopee').value,
      };
      if (!mapping.tiktok && !mapping.tokped && !mapping.shopee) {
        showMsg(msg, 'err', 'Pilih minimal 1 toko tujuan (Tiktok/Tokped/Shopee) dulu.');
        return;
      }
      showMsg(msg, 'info', 'Membaca file...');
      try {
        const buf = await pendingMigrasiAdsFile.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets['Ads Mingguan'];
        if (!ws) { showMsg(msg, 'err', 'Sheet "Ads Mingguan" tidak ditemukan di file ini.'); return; }
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        const parsedWeeks = parseAdsMingguanSheet(rows);
        if (!parsedWeeks.length) { showMsg(msg, 'err', 'Tidak ada baris tanggal yg bisa dibaca dari sheet ini.'); return; }
        const result = terapkanMigrasiAdsMingguan(parsedWeeks, mapping);
        await withSaving(msg, `Migrasi selesai: ${parsedWeeks.length} minggu terbaca, ${result.nEntriBaru} entri biaya iklan baru ditambahkan${result.nDilewatiSudahAda ? `, ${result.nDilewatiSudahAda} dilewati (sudah ada sebelumnya)` : ''}.`, async () => {
          await saveState();
        });
        setTimeout(() => renderAds(container), 1000);
      } catch (e) {
        showMsg(msg, 'err', 'Gagal migrasi: ' + e.message);
      }
    });
  }

  const formAds = document.getElementById('formAds');
  if (formAds) {
    // Toggle "Tanggal Dari/Sampai" (default, biasanya 1 periode/minggu) <-> "Tanggal" tunggal (2026-10-27,
    // Setiawan: kadang input ads per hari jg) -- pola sama persis dgn toggle Satu Tanggal/Rentang di Biaya
    // Operasional (btnTogglelOpexRentang), cuma DIBALIK: di sini rentang yg default aktif, bukan 1 tanggal.
    document.getElementById('btnToggleAdsTglSatu').addEventListener('click', () => {
      const satuWrap = document.getElementById('ads_tglSatuWrap');
      const aktifkanSatu = satuWrap.style.display === 'none';
      document.getElementById('ads_tglDariWrap').style.display = aktifkanSatu ? 'none' : '';
      document.getElementById('ads_tglSampaiWrap').style.display = aktifkanSatu ? 'none' : '';
      satuWrap.style.display = aktifkanSatu ? '' : 'none';
      document.getElementById('btnToggleAdsTglSatu').textContent = aktifkanSatu
        ? '- Kembali ke rentang tanggal' : '+ Input per hari (tanpa rentang)';
    });
    formAds.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const msg = document.getElementById('adsMsg');
      const storeId = document.getElementById('ads_store').value;
      const store = activeStores.find(s => s.id === storeId);
      const satuAktif = document.getElementById('ads_tglSatuWrap').style.display !== 'none';
      let tglDari, tglSampai;
      if (satuAktif) {
        tglDari = tglSampai = document.getElementById('ads_tglSatu').value;
        if (!tglDari) { showMsg(msg, 'err', 'Isi tanggal dulu.'); return; }
      } else {
        tglDari = document.getElementById('ads_tglDari').value;
        tglSampai = document.getElementById('ads_tglSampai').value;
        if (!tglDari || !tglSampai) { showMsg(msg, 'err', 'Isi Tanggal Dari dan Tanggal Sampai dulu.'); return; }
      }
      const biaya = Number(document.getElementById('ads_biaya').value);
      const catatan = document.getElementById('ads_catatan').value.trim();
      if (!store) { showMsg(msg, 'err', 'Pilih toko dulu.'); return; }
      if (new Date(tglSampai) < new Date(tglDari)) { showMsg(msg, 'err', 'Tanggal Sampai tidak boleh sebelum Tanggal Dari.'); return; }
      STATE.adsMingguan.push({
        id: uid('ads'), tanggalDari: new Date(tglDari).toISOString(), tanggalSampai: new Date(tglSampai).toISOString(),
        storeId: store.id, storeName: store.nama, platform: store.platform, biaya, catatan: catatan||null,
      });
      await withSaving(msg, 'Biaya iklan ditambahkan.', async () => {
        await saveState();
        formAds.reset();
      });
      setTimeout(() => renderAds(container), 800);
    });
  }
  document.getElementById('adsFilterStore').addEventListener('change', (e) => { adsFilter.storeId = e.target.value; renderAds(container); });
  document.getElementById('adsFilterTglDari').addEventListener('change', (e) => { adsFilter.tglDari = e.target.value; renderAds(container); });
  document.getElementById('adsFilterTglSampai').addEventListener('change', (e) => { adsFilter.tglSampai = e.target.value; renderAds(container); });
  container.querySelectorAll('[data-del-ads]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus entri biaya iklan ini?')) return;
      STATE.adsMingguan = STATE.adsMingguan.filter(a => a.id !== btn.dataset.delAds);
      await saveState();
      renderAds(container);
    });
  });
}

/* =========================================================================
   TAB: BIAYA OPERASIONAL
   ========================================================================= */
let opexFilter = { kategori: '', tglDari: '', tglSampai: '' };
// Edit-in-place utk Biaya Operasional (2026-10-27, Setiawan: "jika aku ingin mengganti kategori yang sudah
// di input disini apakah bisa tanpa perlu menghapus dulu") -- pola SAMA PERSIS dgn edit Slip Gaji
// (editingSlipGajiId): id yg sedang diedit disimpan di var module-level ini, form "Tambah" di atas dipakai
// ULANG sbg form edit (judul/isi/tombol berubah kalau ada yg sedang diedit), bukan edit inline di baris tabel.
let editingOpexId = null;
function renderOpex(container) {
  let filtered = STATE.biayaOperasional;
  if (opexFilter.kategori) filtered = filtered.filter(o => o.kategori === opexFilter.kategori);
  if (opexFilter.tglDari) filtered = filtered.filter(o => o.tanggalSampai && o.tanggalSampai.slice(0,10) >= opexFilter.tglDari);
  if (opexFilter.tglSampai) filtered = filtered.filter(o => o.tanggalDari && o.tanggalDari.slice(0,10) <= opexFilter.tglSampai);
  filtered = filtered.slice().sort((a,b) => new Date(b.tanggalDari||0) - new Date(a.tanggalDari||0));

  const totalFiltered = filtered.reduce((s,o) => s + (o.jumlah||0), 0);
  const byKategori = {};
  filtered.forEach(o => { byKategori[o.kategori] = (byKategori[o.kategori]||0) + (o.jumlah||0); });

  const editingOpex = editingOpexId ? STATE.biayaOperasional.find(o => o.id === editingOpexId) : null;
  const editingRentang = editingOpex ? editingOpex.tanggalDari.slice(0,10) !== editingOpex.tanggalSampai.slice(0,10) : false;

  container.innerHTML = `
    <div class="panel">
      <h2>${editingOpex ? 'Edit Biaya Operasional' : 'Tambah Biaya Operasional'}</h2>
      <div class="desc">Catat biaya non-produksi (gaji, sewa, listrik, dll). Biasanya cukup 1 tanggal -- pakai rentang tanggal cuma kalau biayanya memang utk 1 periode (mis. gaji/sewa bulanan).</div>
      <form id="formOpex">
        <div class="grid2">
          <div class="field" id="opex_tglSatuWrap" style="${editingRentang ? 'display:none;' : ''}"><label>Tanggal</label><input type="date" id="opex_tglSatu" value="${editingOpex ? editingOpex.tanggalDari.slice(0,10) : ''}" ${editingRentang ? '' : 'required'}></div>
          <div class="field" id="opex_tglDariWrap" style="${editingRentang ? '' : 'display:none;'}"><label>Tanggal Dari</label><input type="date" id="opex_tglDari" value="${editingOpex ? editingOpex.tanggalDari.slice(0,10) : ''}"></div>
          <div class="field" id="opex_tglSampaiWrap" style="${editingRentang ? '' : 'display:none;'}"><label>Tanggal Sampai</label><input type="date" id="opex_tglSampai" value="${editingOpex ? editingOpex.tanggalSampai.slice(0,10) : ''}"></div>
        </div>
        <button type="button" class="btn-ghost" id="btnTogglelOpexRentang" style="border:none; background:none; padding:4px 0; font-size:12.5px; color:var(--accent); cursor:pointer; box-shadow:none;">${editingRentang ? '- Kembali ke 1 tanggal saja' : '+ Jadikan rentang tanggal (mis. gaji/sewa bulanan)'}</button>
        <div class="grid2" style="margin-top:12px;">
          <div class="field"><label>Kategori</label>
            <select id="opex_kategori" required><option value="">Pilih kategori</option>${STATE.opexKategori.map(k=>`<option value="${k}" ${editingOpex && editingOpex.kategori===k ? 'selected' : ''}>${k}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Jumlah (Rp)</label><input type="number" id="opex_jumlah" required min="0" value="${editingOpex ? editingOpex.jumlah : ''}"></div>
        </div>
        <div class="field"><label>Catatan (opsional)</label><input type="text" id="opex_catatan" placeholder="mis. gaji Agustus minggu ke-3" value="${editingOpex && editingOpex.catatan ? editingOpex.catatan.replace(/"/g,'&quot;') : ''}"></div>
        <button type="submit" class="btn btn-primary">${editingOpex ? 'Simpan Perubahan' : '+ Tambah Biaya Operasional'}</button>
        ${editingOpex ? `<button type="button" class="btn btn-ghost" id="btnBatalEditOpex" style="margin-top:8px;">Batal Edit</button>` : ''}
        <div class="status-box" id="opexMsg"></div>
      </form>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total (sesuai filter)</div><div class="kpi-value">${fmtRp(totalFiltered)}</div></div>
      <div class="kpi"><div class="kpi-label">Jumlah Entri</div><div class="kpi-value">${filtered.length}</div></div>
    </div>

    <div class="panel">
      <h2>Filter</h2>
      <div class="field"><label>Kategori</label>
        <select id="opexFilterKategori"><option value="">Semua Kategori</option>${STATE.opexKategori.map(k=>`<option value="${k}" ${opexFilter.kategori===k?'selected':''}>${k}</option>`).join('')}</select>
      </div>
      <div class="grid2">
        <div class="field"><label>Dari Tanggal</label><input type="date" id="opexFilterTglDari" value="${opexFilter.tglDari}"></div>
        <div class="field"><label>Sampai Tanggal</label><input type="date" id="opexFilterTglSampai" value="${opexFilter.tglSampai}"></div>
      </div>
      ${renderRincianBar(byKategori, 'Rincian per Kategori')}
      <div style="overflow-x:auto; margin-top:10px;">
      ${!filtered.length ? '<div class="empty-note">Belum ada data.</div>' : `
      <table class="data compact">
        <thead><tr><th>Tanggal</th><th>Kategori</th><th class="num">Jumlah</th><th>Catatan</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(o => `<tr>
            <td>${fmtRentangTanggal(o.tanggalDari,o.tanggalSampai,{short:true})}</td>
            <td>${o.kategori}</td><td class="num">${fmtRp(o.jumlah)}</td>
            <td style="font-size:11px; color:var(--ink-soft);">${o.catatan||'-'}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost" data-edit-opex="${o.id}" style="padding:3px 8px; font-size:11px;">Edit</button>
              <button class="icon-del" data-del-opex="${o.id}">✕</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`}
      </div>
    </div>
  `;

  document.getElementById('btnTogglelOpexRentang').addEventListener('click', () => {
    const dariWrap = document.getElementById('opex_tglDariWrap');
    const aktifkanRentang = dariWrap.style.display === 'none';
    document.getElementById('opex_tglSatuWrap').style.display = aktifkanRentang ? 'none' : '';
    dariWrap.style.display = aktifkanRentang ? '' : 'none';
    document.getElementById('opex_tglSampaiWrap').style.display = aktifkanRentang ? '' : 'none';
    document.getElementById('btnTogglelOpexRentang').textContent = aktifkanRentang
      ? '- Kembali ke 1 tanggal saja' : '+ Jadikan rentang tanggal (mis. gaji/sewa bulanan)';
  });
  document.getElementById('formOpex').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('opexMsg');
    // Default: 1 tanggal saja (tanggalDari = tanggalSampai = tanggal itu) -- rentang beda cuma kalau toggle
    // "+ Jadikan rentang tanggal" di atas diaktifkan (utk kasus spt gaji/sewa bulanan). Field yg disimpan ke
    // STATE tetap tanggalDari/tanggalSampai spt sebelumnya (overlaps() di computeOpexRowsForPeriode tdk berubah).
    const rentangAktif = document.getElementById('opex_tglDariWrap').style.display !== 'none';
    let tglDari, tglSampai;
    if (rentangAktif) {
      tglDari = document.getElementById('opex_tglDari').value;
      tglSampai = document.getElementById('opex_tglSampai').value;
      if (!tglDari || !tglSampai) { showMsg(msg, 'err', 'Isi Tanggal Dari dan Tanggal Sampai dulu.'); return; }
    } else {
      tglDari = tglSampai = document.getElementById('opex_tglSatu').value;
      if (!tglDari) { showMsg(msg, 'err', 'Isi tanggal dulu.'); return; }
    }
    const kategori = document.getElementById('opex_kategori').value;
    const jumlah = Number(document.getElementById('opex_jumlah').value);
    const catatan = document.getElementById('opex_catatan').value.trim();
    if (!kategori) { showMsg(msg, 'err', 'Pilih kategori dulu.'); return; }
    if (new Date(tglSampai) < new Date(tglDari)) { showMsg(msg, 'err', 'Tanggal Sampai tidak boleh sebelum Tanggal Dari.'); return; }
    if (editingOpexId) {
      const o = STATE.biayaOperasional.find(x => x.id === editingOpexId);
      Object.assign(o, {
        tanggalDari: new Date(tglDari).toISOString(), tanggalSampai: new Date(tglSampai).toISOString(),
        kategori, jumlah, catatan: catatan||null,
      });
    } else {
      STATE.biayaOperasional.push({
        id: uid('opex'), tanggalDari: new Date(tglDari).toISOString(), tanggalSampai: new Date(tglSampai).toISOString(),
        kategori, jumlah, catatan: catatan||null,
      });
    }
    const wasEditing = !!editingOpexId;
    editingOpexId = null;
    await withSaving(msg, wasEditing ? 'Biaya operasional diperbarui.' : 'Biaya operasional ditambahkan.', async () => {
      await saveState();
      document.getElementById('formOpex').reset();
    });
    setTimeout(() => renderOpex(container), 800);
  });
  const btnBatalEditOpex = document.getElementById('btnBatalEditOpex');
  if (btnBatalEditOpex) btnBatalEditOpex.addEventListener('click', () => { editingOpexId = null; renderOpex(container); });
  document.getElementById('opexFilterKategori').addEventListener('change', (e) => { opexFilter.kategori = e.target.value; renderOpex(container); });
  document.getElementById('opexFilterTglDari').addEventListener('change', (e) => { opexFilter.tglDari = e.target.value; renderOpex(container); });
  document.getElementById('opexFilterTglSampai').addEventListener('change', (e) => { opexFilter.tglSampai = e.target.value; renderOpex(container); });
  container.querySelectorAll('[data-edit-opex]').forEach(btn => {
    btn.addEventListener('click', () => { editingOpexId = btn.dataset.editOpex; renderOpex(container); });
  });
  container.querySelectorAll('[data-del-opex]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus entri biaya operasional ini?')) return;
      if (editingOpexId === btn.dataset.delOpex) editingOpexId = null;
      STATE.biayaOperasional = STATE.biayaOperasional.filter(o => o.id !== btn.dataset.delOpex);
      await saveState();
      renderOpex(container);
    });
  });
}

/* =========================================================================
   TAB: INVESTASI & DIVIDEN
   ========================================================================= */
// Baris "Investasi"/"Dividen/Share Profit" dll (2026-10-29, permintaan Setiawan: "ada kategori yang
// posisinya seperti dengan payout capital partner seperti investasi atau Deviden/share profit ... termasuk
// jika ada biaya yang sifatnya investasi untuk pengembangan perusahaan") -- posisinya di PNL SAMA PERSIS
// seperti Payout Capital Partner: dikurangkan dari Nett Margin utk dapat Profit Akhir Perusahaan (lihat
// computePNL). Kategori dikelola sendiri oleh user (tab Data Master, "Kelola Kategori Investasi & Dividen"),
// bentuk data & UI-nya (form tambah/edit, filter, Rincian per Kategori) SENGAJA disalin persis dari pola
// Biaya Operasional (renderOpex) di atas, termasuk edit-in-place (editingAlokasiId, sama pola dgn
// editingOpexId/editingSlipGajiId) -- supaya konsisten & user sudah familiar dgn cara pakainya.
let alokasiFilter = { kategori: '', tglDari: '', tglSampai: '' };
let editingAlokasiId = null;
function renderAlokasiProfit(container) {
  let filtered = STATE.alokasiProfit;
  if (alokasiFilter.kategori) filtered = filtered.filter(a => a.kategori === alokasiFilter.kategori);
  if (alokasiFilter.tglDari) filtered = filtered.filter(a => a.tanggalSampai && a.tanggalSampai.slice(0,10) >= alokasiFilter.tglDari);

    if (editingAlokasiId) {

  container.querySelectorAll('[data-del-alokasi]').forEach(btn => {

      await saveState();
      renderAlokasiProfit(container);
    });
  });
}

let pnlFilter = { dari: '', sampai: '', preset: 'bulan_ini', basis: 'cair' };
let skuProfitFilter = { search: '', page: 1 };
const SKU_PROFIT_PAGE_SIZE = 30;

// ==========================================================================
// PROFIT PER SKU (breakdown per produk/SKU yg SUDAH CAIR) -- permintaan user 2026-09-10, pelengkap tab PNL.
// Basis tanggal: tanggal CAIR (tanggalPenarikan), SAMA PERSIS dgn computePNL() -- dipanggil dgn dari/sampai yg
// sama persis dgn pnlFilter di tab PNL, spy 1 basis tanggal yg konsisten.
//
// Biaya yg BISA ditelusur langsung ke 1 SKU (Modal Konveksi, Komisi Platform, Biaya Layanan, Biaya Pembayaran,
// Komisi Afiliasi, Komisi Dinamis, Pajak) dijumlah LANGSUNG per SKU dari orderDb -- EKSAK, bukan perkiraan.
// Payout Capital Partner (investor) per SKU juga EKSAK: tiap entri STATE.payouts sudah py skuBreakdown{sku:qty}
// + rate flat per unit (rate sama utk semua SKU dlm 1 kontrak, krn margin investor tdk beda per warna/size),
// jadi payoutPerSku = qty_sku_di_breakdown * rate.
//
// Biaya Iklan (Ads Mingguan), Biaya Retur, & Biaya Operasional TIDAK tercatat per SKU/order (dicatat per-toko
// atau company-wide) -- 3 biaya ini DIALOKASIKAN proporsional ke tiap SKU:
//   - Iklan & Retur: proporsional dari porsi omzet SKU tsb thdp total omzet TOKO yg sama pd periode ini.
//   - Operasional: proporsional dari porsi omzet SKU tsb thdp total omzet SELURUH PERUSAHAAN pd periode ini.
// Total tiap biaya alokasi ini (dijumlah semua SKU) SAMA PERSIS dgn total biaya aslinya -- yg perkiraan cuma
// CARA BAGINYA ke tiap SKU, bukan totalnya.
//
// CATATAN AKURASI: "Modal" di sini dijumlah dari field r.hargaKonveksi per baris orderDb (fallback live lookup
// spt di computeTokoBreakdown), BUKAN dari STATE.vendorPayouts.total spt "Biaya Modal" di computePNL --
// vendorPayouts cuma simpan qty per SKU (bukan Rp per SKU), jadi tdk bisa dipecah eksak per SKU dari situ.
// Akibatnya total "Profit Bersih" semua SKU di sini bisa beda TIPIS dari "Profit Akhir Perusahaan" di tabel
// PNL kalau vendorPayouts.total pernah tercatat beda dari hargaKonveksi*qty saat itu (jarang, tp mungkin kalau
// harga konveksi baru diisi belakangan setelah payout vendor sempat tercatat pakai harga lain).
//
// DRILL-DOWN PER ORDER (2026-09-10, permintaan user): tiap grup SKU juga bawa `orders[]` -- rincian per nomor
// pesanan (orderId) di dalam SKU itu. Pendapatan/Modal/Beban Langsung per order EKSAK (langsung dari baris
// orderDb-nya, orderId+sku itu sendiri sudah unik). Iklan/Retur/Operasional/Payout Investor di level SKU
// (yg SUDAH dialokasikan proporsional dari toko/company-wide ke SKU, lihat komentar di atas) DIALOKASIKAN
// SEKALI LAGI ke tiap order proporsional dari porsi omzet order tsb thdp omzet total SKU-nya -- konsisten
// dgn metode yg sama, bukan estimasi baru. Total tiap kolom kalau dijumlah semua order dlm 1 SKU SAMA PERSIS
// dgn angka SKU di atasnya (cuma cara baginya makin terperinci per order, bukan re-estimasi).
// dateBasis (FITUR BARU 2026-09-18, permintaan user, sama pola dgn computePNL): 'cair' (default) filter pakai
// tanggalPenarikan; 'pesan' filter pakai tanggalPesan (fallback ke tanggalPenarikan kalau kosong, sama spt
// Dashboard/computePNL) -- dipanggil dgn basis yg SAMA PERSIS dgn pnlFilter.basis di tabel PNL di atasnya, spy
// panel ini tidak pernah beda basis dari tabel yg jadi rujukannya.
function computeProfitPerSku(dari, sampai, dateBasis) {
  const inRange = (isoStr) => { if (!isoStr) return false; const d = isoStr.slice(0,10); return (!dari || d >= dari) && (!sampai || d <= sampai); };
  const overlaps = (dariStr, sampaiStr) => {
    if (!dariStr || !sampaiStr) return false;
    const a1 = dariStr.slice(0,10), a2 = sampaiStr.slice(0,10);
    return (!sampai || a1 <= sampai) && (!dari || a2 >= dari);
  };
  const effectiveHarga = (r) => r.hargaKonveksi != null ? r.hargaKonveksi : lookupHargaKonveksiBySku(r.sku);
  const pakaiTglPesan = dateBasis === 'pesan';

  const rows = STATE.orderDb.filter(r => inRange(pakaiTglPesan ? (r.tanggalPesan || r.tanggalPenarikan) : r.tanggalPenarikan) && r.sku);

  const bySku = {};
  rows.forEach(r => {
    const key = r.sku;
    if (!bySku[key]) bySku[key] = {
      sku: key, produk: null, warna: null, qty: 0, pendapatan: 0, modal: 0,
      komisiPlatform: 0, biayaLayanan: 0, biayaPembayaran: 0, komisiAfiliasi: 0, komisiDinamis: 0, pajak: 0,
      biayaIklan: 0, biayaRetur: 0, biayaOperasional: 0, payoutInvestor: 0, alokasiProfit: 0, byToko: {}, ordersByKey: {},
    };
    const g = bySku[key];
    g.qty += r.qty||1;
    g.pendapatan += r.pendapatan||0;
    const h = effectiveHarga(r);
    const modalBaris = h != null ? (r.qty||1) * h : 0;
    if (h != null) g.modal += modalBaris;
    // Math.abs() krn komisi/biaya dari settlement Shopee/TikTok tersimpan sbg angka negatif (lihat catatan di computePNL)
    g.komisiPlatform += Math.abs(r.komisiPlatform||0);
    g.biayaLayanan += Math.abs(r.biayaLayanan||0);
    g.biayaPembayaran += Math.abs(r.biayaPembayaran||0);
    g.komisiAfiliasi += Math.abs(r.komisiAfiliasi||0);
    g.komisiDinamis += Math.abs(r.komisiDinamis||0);
    g.pajak += Math.abs(r.pajak||0);
    const toko = r.sumber || 'Tidak diketahui';
    g.byToko[toko] = (g.byToko[toko]||0) + (r.pendapatan||0);
    if (!g.produk && r.produk) g.produk = r.produk;
    if (!g.warna && r.warna) g.warna = r.warna;
    // orderId+sku sudah unik di orderDb (dipakai sbg key jg di applyBatchResult) -- 1 baris = 1 order utk SKU ini
    const orderKey = r.orderId || '(tanpa order ID)';
    if (!g.ordersByKey[orderKey]) g.ordersByKey[orderKey] = {
      orderId: r.orderId||null, sumber: r.sumber||null, qty: 0, pendapatan: 0, modal: 0,
      bebanLangsung: 0, tanggalPenarikan: r.tanggalPenarikan||null, tanggalPesan: r.tanggalPesan||null,
    };
    const o = g.ordersByKey[orderKey];
    o.qty += r.qty||1;
    o.pendapatan += r.pendapatan||0;
    o.modal += modalBaris;
    o.bebanLangsung += Math.abs(r.komisiPlatform||0) + Math.abs(r.biayaLayanan||0) + Math.abs(r.biayaPembayaran||0) + Math.abs(r.komisiAfiliasi||0) + Math.abs(r.komisiDinamis||0) + Math.abs(r.pajak||0);
  });

  const totalOmzetPerusahaan = rows.reduce((s,r) => s + (r.pendapatan||0), 0);
  const omzetPerToko = {};
  rows.forEach(r => { const toko = r.sumber || 'Tidak diketahui'; omzetPerToko[toko] = (omzetPerToko[toko]||0) + (r.pendapatan||0); });

  const semuaToko = new Set([...Object.keys(omzetPerToko), ...STATE.adsMingguan.map(a=>a.storeName), ...STATE.biayaRetur.map(r=>r.toko)]);
  const iklanPerToko = {}, returPerToko = {};
  semuaToko.forEach(toko => {
    iklanPerToko[toko] = STATE.adsMingguan.filter(a => a.storeName === toko && overlaps(a.tanggalDari, a.tanggalSampai)).reduce((s,a)=>s+(a.biaya||0),0);
    returPerToko[toko] = STATE.biayaRetur.filter(r => r.toko === toko && inRange(r.tanggalDihitung)).reduce((s,r)=>s+(r.jumlah||0),0);
  });
  const totalOpex = STATE.biayaOperasional.filter(o => overlaps(o.tanggalDari, o.tanggalSampai)).reduce((s,o)=>s+(o.jumlah||0),0);
  // Investasi & Dividen (2026-10-29) -- dialokasikan proporsional per SKU dgn metode SAMA PERSIS dgn Biaya
  // Operasional (proporsional dari omzet SKU thdp omzet SELURUH PERUSAHAAN), krn sama2 dicatat company-wide
  // (bukan per SKU/toko). Supaya "Total Profit Bersih" panel ini tetap = "Profit Akhir Perusahaan" di tabel
  // PNL di atasnya (1 sumber kebenaran yg sama, cuma cara baginya perkiraan).
  const totalAlokasi = STATE.alokasiProfit.filter(a => overlaps(a.tanggalDari, a.tanggalSampai)).reduce((s,a)=>s+(a.jumlah||0),0);

  Object.values(bySku).forEach(g => {
    Object.entries(g.byToko).forEach(([toko, omzetSkuDiToko]) => {
      const totalOmzetToko = omzetPerToko[toko] || 0;
      const share = totalOmzetToko > 0 ? omzetSkuDiToko / totalOmzetToko : 0;
      g.biayaIklan += (iklanPerToko[toko]||0) * share;
      g.biayaRetur += (returPerToko[toko]||0) * share;
    });
    const shareCompany = totalOmzetPerusahaan > 0 ? g.pendapatan / totalOmzetPerusahaan : 0;
    g.biayaOperasional = totalOpex * shareCompany;
    g.alokasiProfit = totalAlokasi * shareCompany;
  });

  STATE.payouts.filter(p => inRange(p.tanggalDihitung) && p.rate != null).forEach(p => {
    Object.entries(p.skuBreakdown||{}).forEach(([sku, qtySku]) => {
      if (!bySku[sku]) return; // SKU ini tdk muncul di orderDb pd rentang tanggal cair yg sama -- lewati
      bySku[sku].payoutInvestor += qtySku * p.rate;
    });
  });

  const list = Object.values(bySku).map(g => {
    const bebanLangsung = g.komisiPlatform + g.biayaLayanan + g.biayaPembayaran + g.komisiAfiliasi + g.komisiDinamis + g.pajak;
    const profitBersih = g.pendapatan - g.modal - bebanLangsung - g.biayaIklan - g.biayaRetur - g.biayaOperasional - g.payoutInvestor - g.alokasiProfit;
    const marginPct = g.pendapatan > 0 ? (profitBersih / g.pendapatan * 100) : null;
    // Alokasikan Iklan/Retur/Operasional/Payout Investor/Alokasi Profit SKU ini ke tiap order, proporsional omzet order thdp omzet SKU
    const orders = Object.values(g.ordersByKey).map(o => {
      const shareInSku = g.pendapatan > 0 ? o.pendapatan / g.pendapatan : 0;
      const oIklan = g.biayaIklan * shareInSku;
      const oRetur = g.biayaRetur * shareInSku;
      const oOpex = g.biayaOperasional * shareInSku;
      const oPayout = g.payoutInvestor * shareInSku;
      const oAlokasi = g.alokasiProfit * shareInSku;
      const oProfit = o.pendapatan - o.modal - o.bebanLangsung - oIklan - oRetur - oOpex - oPayout - oAlokasi;
      const oMarginPct = o.pendapatan > 0 ? (oProfit / o.pendapatan * 100) : null;
      return { ...o, biayaIklan: oIklan, biayaRetur: oRetur, biayaOperasional: oOpex, payoutInvestor: oPayout, alokasiProfit: oAlokasi, profitBersih: oProfit, marginPct: oMarginPct };
    });
    orders.sort((a,b) => b.pendapatan - a.pendapatan);
    const { ordersByKey, ...gTanpaOrdersByKey } = g;
    return { ...gTanpaOrdersByKey, bebanLangsung, profitBersih, marginPct, orders };
  });
  list.sort((a,b) => b.pendapatan - a.pendapatan);
  return list;
}

function pnlDateRangeFromPreset(preset) {
  const now = new Date();
  const y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
  if (preset === 'minggu_ini') {
    const dow = now.getUTCDay() || 7; // Senin=1..Minggu=7
    const senin = new Date(Date.UTC(y,m,d-dow+1));
    return { dari: senin.toISOString().slice(0,10), sampai: new Date().toISOString().slice(0,10) };
  }
  if (preset === 'bulan_ini') {
    return { dari: new Date(Date.UTC(y,m,1)).toISOString().slice(0,10), sampai: new Date().toISOString().slice(0,10) };
  }
  if (preset === 'bulan_lalu') {
    return { dari: new Date(Date.UTC(y,m-1,1)).toISOString().slice(0,10), sampai: new Date(Date.UTC(y,m,0)).toISOString().slice(0,10) };
  }
  return { dari: '', sampai: '' };
}

// dateBasis: 'cair' (default, dipakai tab PNL) filter baris orderDb pakai tanggalPenarikan, sesuai laporan
// akuntansi resmi (biaya modal ikut dari STATE.vendorPayouts, sesuai batch settle-nya). 'pesan' (dipakai
// Dashboard, permintaan user 2026-09-10 spy Omzet/Biaya/Biaya Iklan bisa dibandingkan apple-to-apple utk
// keputusan budget ads harian/mingguan -- pesanan yg blm/telat cair jgn bikin perbandingan ads-vs-sales
// kelihatan boros padahal cuma soal timing) filter pakai tanggalPesan (fallback ke tanggalPenarikan kalau
// tanggalPesan kosong, sama spt Dashboard) DAN biaya modal dihitung LANGSUNG dari orderDb.hargaKonveksi
// (bukan vendorPayouts, krn vendorPayouts dicatat per BATCH SETTLE bukan per tanggal pesan, jadi tdk nyambung
// kalau basisnya pesan). Iklan/Retur/Operasional/Payout Investor TETAP pakai tanggal & rentang aslinya
// masing2 (overlap dgn dari/sampai yg sama) di KEDUA basis -- iklan mingguan SUDAH inheren berbasis "kapan
// iklan itu jalan" (bukan kapan cair), jadi otomatis nyambung dgn pesanan yg dihasilkannya di periode yg sama.
// Dipakai computePNL DAN panel rincian "Biaya Operasional" yg bisa diklik di tab PNL (renderPnl) -- "overlaps"
// di sini SENGAJA sama persis logikanya dgn yg dipakai computePNL, supaya total baris rincian yg ditampilkan
// SELALU sama persis dgn angka Biaya Operasional di tabel PNL (ekstraksi murni, 1 sumber kebenaran).
function computeOpexRowsForPeriode(dari, sampai) {
  const overlaps = (dariStr, sampaiStr) => {
    if (!dariStr || !sampaiStr) return false;
    const a1 = dariStr.slice(0,10), a2 = sampaiStr.slice(0,10);
    return (!sampai || a1 <= sampai) && (!dari || a2 >= dari);
  };
  return STATE.biayaOperasional.filter(o => overlaps(o.tanggalDari, o.tanggalSampai));
}

// Sama persis pola/logic overlap-nya dgn computeOpexRowsForPeriode di atas, sumbernya STATE.alokasiProfit
// (Investasi/Dividen, 2026-10-29). Dipakai computePNL DAN panel rincian yg bisa diklik di tab PNL (renderPnl).
function computeAlokasiRowsForPeriode(dari, sampai) {
  const overlaps = (dariStr, sampaiStr) => {
    if (!dariStr || !sampaiStr) return false;
    const a1 = dariStr.slice(0,10), a2 = sampaiStr.slice(0,10);
    return (!sampai || a1 <= sampai) && (!dari || a2 >= dari);
  };
  return STATE.alokasiProfit.filter(a => overlaps(a.tanggalDari, a.tanggalSampai));
}

// Render blok "Rincian per ..." (Kategori di Biaya Operasional & drilldown PNL, Toko di Ads Mingguan --
// 2026-10-27, Setiawan minta kedua2nya dirapihkan) -- SATU fungsi generik dipakai di semua tempat spy
// tampilannya selalu konsisten. Sebelumnya berupa chip flex-wrap (atau, utk Ads, 1 kalimat panjang
// "A: Rp x · B: Rp y · ...") TANPA urutan jelas -- susah dibandingkan mana yg paling besar sekilas.
// Sekarang: diurutkan Rp TERBESAR dulu + bar proporsional thdp yg terbesar, pola yg sama dgn "Margin per
// Jenis Produk"/Omzet-per-Toko (list diurutkan + bar, bukan chip/kalimat acak).
// opts.clickable (2026-10-27, drilldown kategori PNL): tiap baris dikasih data-rincian-click="<key
// ter-encodeURIComponent>" + cursor pointer, dipakai caller (renderPnl) utk toggle tabel rincian PER
// kategori saat barisnya diklik -- 2 caller lain (Opex-tab, Ads-tab) TIDAK pakai opt ini, tetap statis.
// opts.targetPrefix (2026-10-29, drilldown kedua -- Investasi & Dividen -- ditambah di renderPnl):
// dipakai bareng opts.clickable, jadi id target toggle (data-rincian-target) = `${targetPrefix}${key}`,
// supaya 1 fungsi generik ini bisa dipakai utk BEBERAPA blok drilldown berbeda di 1 halaman yg sama (tiap
// blok punya prefix id sendiri, mis. "pnlOpexKatRows_" vs "pnlAlokasiKatRows_") tanpa saling tabrakan.
function renderRincianBar(byMap, label, opts) {
  opts = opts || {};
  const entries = Object.entries(byMap).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '';
  const max = Math.max(1, ...entries.map(([, t]) => t));
  return `
    <div style="margin-top:12px;">
      <div style="font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px;">${label}</div>
      <div>${entries.map(([k, t]) => `
        <div class="rincian-bar-row"${opts.clickable ? ` data-rincian-click="${encodeURIComponent(k)}" data-rincian-target="${(opts.targetPrefix||'')}${encodeURIComponent(k)}" style="cursor:pointer;" title="Klik utk lihat rincian baris ${k}"` : ''}>
          <span style="font-size:12.5px; color:${opts.clickable ? 'var(--accent)' : 'var(--ink)'}; ${opts.clickable ? 'text-decoration:underline;' : ''} white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${k}">${k}</span>
          <div class="margin-bar-track"><div class="margin-bar-fill" style="width:${(t/max*100).toFixed(1)}%; background:var(--accent);"></div></div>
          <span class="tnum" style="font-size:12.5px; font-weight:700; color:var(--ink); text-align:right;">${fmtRp(t)}</span>
        </div>
      `).join('')}</div>
    </div>
  `;
}

function computePNL(dari, sampai, dateBasis) {
  const inRange = (isoStr) => { if (!isoStr) return false; const d = isoStr.slice(0,10); return (!dari || d >= dari) && (!sampai || d <= sampai); };
  const overlaps = (dariStr, sampaiStr) => { // utk entri ber-rentang (ads/opex): overlap dgn rentang filter
    if (!dariStr || !sampaiStr) return false;
    const a1 = dariStr.slice(0,10), a2 = sampaiStr.slice(0,10);
    return (!sampai || a1 <= sampai) && (!dari || a2 >= dari);
  };
  const pakaiTglPesan = dateBasis === 'pesan';

  const orderRows = pakaiTglPesan
    ? STATE.orderDb.filter(r => inRange(r.tanggalPesan || r.tanggalPenarikan))
    : STATE.orderDb.filter(r => inRange(r.tanggalPenarikan));
  const pendapatan = orderRows.reduce((s,r) => s + (r.pendapatan||0), 0);

  let biayaModal;
  if (pakaiTglPesan) {
    const effectiveHarga = (r) => r.hargaKonveksi != null ? r.hargaKonveksi : lookupHargaKonveksiBySku(r.sku);
    biayaModal = orderRows.reduce((s,r) => { const h = effectiveHarga(r); return h != null ? s + (r.qty||1) * h : s; }, 0);
  } else {
    const vendorRows = STATE.vendorPayouts.filter(v => inRange(v.tanggalDihitung));
    biayaModal = vendorRows.reduce((s,v) => s + (v.total||0), 0);
  }

  // NB: komisiPlatform/biayaLayanan/biayaPembayaran/komisiAfiliasi/komisiDinamis/pajak diambil APA ADANYA dari
  // laporan settlement Shopee/TikTok, yg menuliskan biaya² itu sbg angka NEGATIF (krn memang pengurang settlement).
  // Data migrasi histori lama kadang malah menyimpannya POSITIF. Supaya konsisten dijumlahkan sbg "beban" (nilai
  // yg lalu DIKURANGKAN dari margin), semua dibungkus Math.abs() di sini -- ditemukan 2026-09-18 stlh user lapor
  // Total Beban Penjualan tampil NEGATIF (minus ketemu minus jadi nambah profit, bukan mengurangi).
  const komisiPlatform = orderRows.reduce((s,r) => s + Math.abs(r.komisiPlatform||0), 0);
  const biayaLayanan = orderRows.reduce((s,r) => s + Math.abs(r.biayaLayanan||0), 0);
  const biayaPembayaran = orderRows.reduce((s,r) => s + Math.abs(r.biayaPembayaran||0), 0);
  const komisiAfiliasi = orderRows.reduce((s,r) => s + Math.abs(r.komisiAfiliasi||0), 0);
  const komisiDinamis = orderRows.reduce((s,r) => s + Math.abs(r.komisiDinamis||0), 0);
  const pajak = orderRows.reduce((s,r) => s + Math.abs(r.pajak||0), 0);
  const adsRows = STATE.adsMingguan.filter(a => overlaps(a.tanggalDari, a.tanggalSampai));
  const biayaIklan = adsRows.reduce((s,a) => s + (a.biaya||0), 0);
  const returRows = STATE.biayaRetur.filter(r => inRange(r.tanggalDihitung));
  const biayaRetur = returRows.reduce((s,r) => s + (r.jumlah||0), 0);
  const bebanPenjualan = komisiPlatform + biayaLayanan + biayaPembayaran + komisiAfiliasi + komisiDinamis + pajak + biayaIklan + biayaRetur;

  const grossMargin = pendapatan - biayaModal;

  const opexRows = computeOpexRowsForPeriode(dari, sampai);
  const biayaOperasional = opexRows.reduce((s,o) => s + (o.jumlah||0), 0);

  const nettMargin = grossMargin - bebanPenjualan - biayaOperasional;

  const payoutRows = STATE.payouts.filter(p => inRange(p.tanggalDihitung));
  const payoutInvestor = payoutRows.reduce((s,p) => s + (p.payout||0), 0);

  // Investasi & Dividen (2026-10-29) -- posisinya SAMA PERSIS spt Payout Capital Partner: dikurangkan dari
  // Nett Margin, SETELAH Payout Capital Partner, utk dapat Profit Akhir Perusahaan.
  const alokasiRows = computeAlokasiRowsForPeriode(dari, sampai);
  const alokasiProfit = alokasiRows.reduce((s,a) => s + (a.jumlah||0), 0);

  const profitAkhir = nettMargin - payoutInvestor - alokasiProfit;

  return { pendapatan, biayaModal, grossMargin, komisiPlatform, biayaLayanan, biayaPembayaran, komisiAfiliasi, komisiDinamis, pajak, biayaIklan, biayaRetur, bebanPenjualan, biayaOperasional, nettMargin, payoutInvestor, alokasiProfit, profitAkhir, nOrder: orderRows.length };
}

  function wireProfitPerSkuHandlers(el) {
    const searchEl = el.querySelector('#skuProfitSearch');

let dashFilter = { dari: '', sampai: '', preset: 'bulan_ini' };

// Rincian biaya utk 1 toko/platform (dipakai Dashboard, panel "Omzet per Toko/Platform") -- SEMUA komponen di sini
// tertelusur (traceable) sampai baris order/entri aslinya yg punya nama toko sbg field (r.sumber / a.storeName /
// r.toko), jadi akurat per toko -- BEDA dgn Payout Capital Partner (investor) yg SENGAJA tidak dipecah di sini,
// krn payout dihitung per kontrak+tanggal (bukan per toko/order), sehingga tdk bisa dipecah per toko scr pasti
// tanpa mengira-ngira. Makanya angka "Margin Kotor" di sini adalah SEBELUM payout investor -- utk profit
// perusahaan setelah payout investor (yg memang company-wide, bukan per toko), lihat tab PNL.
function computeTokoBreakdown(namaToko, rowsForToko, dari, sampai) {
  const overlaps = (dariStr, sampaiStr) => {
    if (!dariStr || !sampaiStr) return false;
    const a1 = dariStr.slice(0,10), a2 = sampaiStr.slice(0,10);
    return (!sampai || a1 <= sampai) && (!dari || a2 >= dari);
  };
  const omzet = rowsForToko.reduce((s,r) => s + (r.pendapatan||0), 0);
  const qty = rowsForToko.reduce((s,r) => s + (r.qty||1), 0);
  // PENTING: r.hargaKonveksi di orderDb di-cache SEKALI sewaktu Import Mingguan & tidak pernah dihitung ulang
  // otomatis -- kalau harga konveksinya baru diisi ke Data Master BELAKANGAN (alur normal user: import dulu,
  // lengkapi Data Master belakangan), baris lama akan tetap keliatan "kosong" selamanya walau harganya sudah
  // ada. Supaya Dashboard SELALU akurat tanpa user harus jalankan alat "Perbarui Harga Konveksi" dulu, di sini
  // pakai fallback: kalau field cache-nya null, coba cari live ke Data Master SEKARANG lewat
  // lookupHargaKonveksiBySku -- baris dianggap "masih kosong" (missingDetail) HANYA kalau live lookup ini pun
  // masih gagal (genuine belum ada datanya). Alat "Perbarui Harga Konveksi yang Kosong dari Data Master" di tab
  // Import Mingguan tetap berguna utk menyimpan hasilnya permanen ke orderDb, tapi Dashboard tidak lagi
  // bergantung padanya utk tampil benar.
  const effectiveHarga = (r) => r.hargaKonveksi != null ? r.hargaKonveksi : lookupHargaKonveksiBySku(r.sku);
  const modal = rowsForToko.reduce((s,r) => { const h = effectiveHarga(r); return h != null ? s + (r.qty||1) * h : s; }, 0);
  const qtyTanpaHargaKonveksi = rowsForToko.reduce((s,r) => effectiveHarga(r) == null ? s + (r.qty||1) : s, 0);
  // Rincian per-SKU knp harga konveksi kosong, supaya user bisa langsung ke Data Master benerin data yg tepat
  // (bukan cuma dikasih tau ada yg kurang tanpa tau yg mana)
  const missingBySku = {};
  rowsForToko.filter(r => effectiveHarga(r) == null).forEach(r => {
    const key = r.sku || '(tanpa SKU)';
    if (!missingBySku[key]) missingBySku[key] = { sku: key, produk: r.produk || '-', qty: 0, reason: diagnoseMissingHargaKonveksi(r.sku) };
    missingBySku[key].qty += (r.qty||1);
  });
  const missingDetail = Object.values(missingBySku).sort((a,b) => b.qty - a.qty);
  // Math.abs() krn komisi/biaya dari settlement Shopee/TikTok tersimpan sbg angka negatif (lihat catatan di computePNL)
  const komisiPlatform = rowsForToko.reduce((s,r) => s + Math.abs(r.komisiPlatform||0), 0);
  const biayaLayanan = rowsForToko.reduce((s,r) => s + Math.abs(r.biayaLayanan||0), 0);
  const biayaPembayaran = rowsForToko.reduce((s,r) => s + Math.abs(r.biayaPembayaran||0), 0);
  const komisiAfiliasi = rowsForToko.reduce((s,r) => s + Math.abs(r.komisiAfiliasi||0), 0);
  const komisiDinamis = rowsForToko.reduce((s,r) => s + Math.abs(r.komisiDinamis||0), 0);
  const pajak = rowsForToko.reduce((s,r) => s + Math.abs(r.pajak||0), 0);
  const adsRows = STATE.adsMingguan.filter(a => a.storeName === namaToko && overlaps(a.tanggalDari, a.tanggalSampai));
  const biayaIklan = adsRows.reduce((s,a) => s + (a.biaya||0), 0);
  const returRows = STATE.biayaRetur.filter(r => r.toko === namaToko && r.tanggalDihitung && (() => { const d = r.tanggalDihitung.slice(0,10); return (!dari || d >= dari) && (!sampai || d <= sampai); })());
  const biayaRetur = returRows.reduce((s,r) => s + (r.jumlah||0), 0);
  const bebanPenjualan = komisiPlatform + biayaLayanan + biayaPembayaran + komisiAfiliasi + komisiDinamis + pajak + biayaIklan + biayaRetur;
  const marginKotor = omzet - modal - bebanPenjualan;
  const marginPct = omzet > 0 ? (marginKotor / omzet * 100) : null;
  return { omzet, qty, modal, qtyTanpaHargaKonveksi, missingDetail, komisiPlatform, biayaLayanan, biayaPembayaran, komisiAfiliasi, komisiDinamis, pajak, biayaIklan, biayaRetur, bebanPenjualan, marginKotor, marginPct };
}
function renderDashboard(container) {
  if (dashFilter.preset !== 'custom' && (!dashFilter.dari || !dashFilter.sampai)) {
    Object.assign(dashFilter, pnlDateRangeFromPreset(dashFilter.preset));
  }
  const inRange = (isoStr) => { if (!isoStr) return false; const d = isoStr.slice(0,10); return (!dashFilter.dari || d >= dashFilter.dari) && (!dashFilter.sampai || d <= dashFilter.sampai); };
  // SEMUA KPI Dashboard (Omzet, Qty, Profit, breakdown Toko & Produk) dipakaikan TANGGAL PESAN (bukan tanggal
  // cair) -- permintaan user 2026-09-10, revisi dari keputusan awal (yg tadinya Profit sengaja dibiarkan
  // tanggal cair). User: "aku inginkan agar dashboard itu menyesuaikan tampilan penjualan sesuai tanggal
  // pesanan, sehingga nanti match dengan biaya dan biaya ads, jadi aku tidak boros saat mengeluarkan budget
  // ads." -- Dashboard ini dipakai utk keputusan operasional harian/mingguan (terutama kalibrasi budget ads),
  // jadi Omzet & Profit HARUS satu basis tanggal yg sama (tanggal pesan) spy bisa dibandingkan apple-to-apple
  // dgn Biaya Iklan periode yg sama, tanpa terdistorsi jeda settlement platform (yg bisa berminggu-minggu).
  // Tab PNL (computePNL default/tanpa dateBasis) TETAP berbasis tanggal cair sbg laporan akuntansi resmi --
  // TIDAK diubah, krn itu laporan settlement yg terpisah tujuannya dari Dashboard operasional ini.
  //
  // BUG DITEMUKAN 2026-09-10 (user lapor Omzet SHOPEE_UOUT Agustus cuma Rp53jt, seharusnya ~Rp118jt): tanggalPesan
  // TIDAK SELALU terisi -- baris hasil migrasi Excel lama cuma keisi kalau sheet PENJUALAN py kolom "Tanggal
  // Pesan" & terisi di baris itu; baris hasil Import Mingguan cuma keisi kalau order-nya sempat tercatat di
  // pendingOrderSku (dari upload "Update Daftar Pesanan") entah sekarang atau di histori. Kalau dipakai APA
  // ADANYA (fallback ke DIBUANG), baris yg tanggalPesan-nya kosong DIAM2 HILANG dari Omzet Dashboard walau
  // pendapatannya valid & sudah cair -- persis gejala yg dilaporkan. Fix: fallback ke tanggalPenarikan kalau
  // tanggalPesan kosong (pola yg sama persis sudah dipakai di sort Database Penjualan:
  // `tanggalPenarikan||tanggalPesan`), spy TIDAK PERNAH ada baris yg diam2 hilang cuma krn field tanggal
  // pesannya belum/tidak diketahui -- baris itu tetap kehitung (pakai tanggal cairnya), cuma jadi kurang presisi
  // utk baris spesifik itu, drpd hilang total dari laporan. computePNL(...,'pesan') di bawah pakai fallback yg
  // SAMA PERSIS spy Profit & Omzet konsisten satu populasi pesanan.
  const rows = STATE.orderDb.filter(r => inRange(r.tanggalPesan || r.tanggalPenarikan));
  // Supaya kelihatan di UI kalau ada baris yg "kehitung" pakai fallback tanggal cair (bkn tanggal pesan asli) --
  // user berhak tahu sebagian Omzet di bawah ini presisinya lebih rendah, bukan cuma didiamkan begitu saja.
  const nRowsFallbackTglPesan = rows.filter(r => !r.tanggalPesan).length;

  const totalOmzetCair = rows.reduce((s,r) => s + (r.pendapatan||0), 0);
  // Diminta user 2026-09-10: omset dari order yg sudah DIPESAN tp blm CAIR tetap ikut dihitung sbg "capaian
  // marketing" ("walaupun ada kemungkinan gagal, itu bukti marketing sudah bekerja") -- tapi tetap dipisah
  // jelas (bukan dicampur diam2) sesuai konvensi app ini: Total Omzet = Sudah Cair + Estimasi Belum Cair.
  const estimasiBelumCair = computeOmzetEstimasiBelumCair(dashFilter.dari, dashFilter.sampai);
  const totalOmzet = totalOmzetCair + estimasiBelumCair.total;
  const totalQty = rows.reduce((s,r) => s + (r.qty||1), 0);
  // DULU: totalProfit = rows.reduce((s,r) => s + (r.profit||0), 0) -- SALAH, krn field `profit` di tiap baris
  // order cuma pernah keisi utk data lama hasil migrasi Excel (migrasi_penjualan). Baris hasil Import Mingguan
  // (cara kerja normal sekarang) TIDAK PERNAH punya field `profit`, jadi KPI ini diam2 kurang akurat (0 atau
  // understated) utk data terbaru. Diperbaiki dgn pakai computePNL() -- 1 sumber kebenaran (skrg dgn parameter
  // dateBasis='pesan' spy basisnya sama dgn Omzet di atas, lihat komentar panjang di definisi computePNL()).
  const pnlForDash = computePNL(dashFilter.dari, dashFilter.sampai, 'pesan');
  const totalProfit = pnlForDash.profitAkhir;

  const rowsBySumber = {};
  rows.forEach(r => { const k = r.sumber || 'Tidak diketahui'; rowsBySumber[k] = rowsBySumber[k] || []; rowsBySumber[k].push(r); });
  const bySumber = {};
  Object.entries(rowsBySumber).forEach(([k, rowsToko]) => { bySumber[k] = computeTokoBreakdown(k, rowsToko, dashFilter.dari, dashFilter.sampai); });
  const sumberList = Object.entries(bySumber).sort((a,b) => b[1].omzet - a[1].omzet);
  const maxOmzetSumber = Math.max(1, ...sumberList.map(([,v]) => v.omzet));

  // KPI card "Margin Kotor" (2026-10-24, perapihan tampilan Dashboard) -- SENGAJA tidak bikin definisi "profit"
  // baru, cuma menjumlahkan v.marginKotor yg SUDAH dihitung per toko di atas (Omzet-Modal-Beban Penjualan,
  // SEBELUM Payout Investor -- sama persis dgn yg tampil kalau toko di-klik di panel "Omzet per Toko/Platform"
  // di bawah). % dibagi thdp totalOmzetCair krn v.omzet per toko itu basis cair (bukan termasuk estimasi
  // belum-cair yg ada di totalOmzet).
  const totalMarginKotor = sumberList.reduce((s,[,v]) => s + v.marginKotor, 0);
  const marginKotorPct = totalOmzetCair > 0 ? (totalMarginKotor / totalOmzetCair * 100) : null;
  const totalProfitPct = totalOmzet > 0 ? (totalProfit / totalOmzet * 100) : null;

  // Panel "Margin per Jenis Produk" di Dashboard -- pakai fungsi yg SAMA PERSIS dgn panel di tab Database
  // Penjualan (computeMarginPerJenisProduk, metodologi "asumsi pukul rata" packing/payout investor, lihat
  // komentar di definisinya) spy TIDAK ada definisi profit baru yg beda sendiri cuma utk Dashboard ini.
  // Diambil 6 teratas (produk margin paling tipis dulu) spy ringkas, "lihat semua" via tab Database Penjualan.
  const margePerProdukDash = computeMarginPerJenisProduk(rows).slice(0, 6);

  // Panel "Order Terbaru" -- 6 baris plg baru dari populasi `rows` yg sama persis dipakai KPI Dashboard di atas
  // (basis tanggal pesan, fallback tanggal cair kalau tanggal pesan kosong -- lihat catatan panjang di atas).
  const recentOrders = rows.slice()
    .sort((a,b) => new Date(b.tanggalPesan||b.tanggalPenarikan||0) - new Date(a.tanggalPesan||a.tanggalPenarikan||0))

/* =========================================================================

const NAMA_BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function namaBulanID(n) { return NAMA_BULAN_ID[(n - 1 + 12) % 12] || '-'; }

// Cocokkan teks periode di kop tiap sheet slip lama (mis. "November 2025", "NOVEMBER 2025", "Agustus 2026")
// dgn nama bulan Indonesia scr case-insensitive, ambil 4 digit tahun dari teks yg sama.
function parsePeriodeSlipGaji(text) {
  if (!text) return null;
  const t = String(text).trim();
  const yearMatch = t.match(/(\d{4})/);
  if (!yearMatch) return null;
  const tahun = Number(yearMatch[1]);
  const lower = t.toLowerCase();
  for (let i = 0; i < NAMA_BULAN_ID.length; i++) {
    if (lower.includes(NAMA_BULAN_ID[i].toLowerCase())) return { bulan: i + 1, tahun };
  }
  return null;
}

// Baca 1 sheet slip gaji individual dari file Excel Slip Gaji lama (dibaca via XLSX.utils.sheet_to_json(ws,{header:1}),
// jadi array-of-array 0-indexed per baris/kolom sheet). Formatnya TETAP: NIK di baris 6, Nama Karyawan baris 7,
// header PENDAPATAN/POTONGAN baris 9, baris "JUMLAH ..." dicari otomatis krn jumlah barisnya beda2 tiap bulan/karyawan
// (kadang 5 komponen, kadang cuma 3). Return null kalau sheet ini BUKAN slip individual yg valid (mis. sheet rekap
// bulanan yg formatnya beda total, atau sheet kosong/generik) -- supaya proses migrasi otomatis melewati sheet2 itu.
function parseSlipGajiSheet(rows) {
  if (!rows || rows.length < 10) return null;
  const rowAt = (i) => rows[i] || [];
  if (String(rowAt(5)[0] || '').trim() !== 'NIK') return null;
  if (String(rowAt(6)[0] || '').trim() !== 'Nama Karyawan') return null;
  if (String(rowAt(8)[0] || '').trim() !== 'PENDAPATAN') return null;
  const nik = String(rowAt(5)[1] || '').trim();
  const nama = String(rowAt(6)[1] || '').trim();
  if (!nama) return null;
  const periode = parsePeriodeSlipGaji(rowAt(1)[6]);
  if (!periode) return null;

  let jIdx = -1;
  for (let i = 9; i < rows.length; i++) {
    if (String(rowAt(i)[0] || '').trim() === 'JUMLAH PENDAPATAN') { jIdx = i; break; }
  }
  if (jIdx === -1) return null;

  const pendapatan = [], potongan = [];
  for (let i = 9; i < jIdx; i++) {
    const r = rowAt(i);
    const labelP = String(r[0] || '').trim();
    if (labelP && labelP !== '-') pendapatan.push({ label: labelP, jumlah: Number(r[2]) || 0 });
    const labelK = String(r[4] || '').trim();
    if (labelK && labelK !== '-') potongan.push({ label: labelK, jumlah: Number(r[6]) || 0 });
  }
  return { nik, nama, bulan: periode.bulan, tahun: periode.tahun, pendapatan, potongan };
}

// Baca SEMUA sheet dlm 1 workbook Excel Slip Gaji lama -- sheet yg bukan slip individual (kosong/generik, atau
// rekap bulanan yg layoutnya beda) otomatis dilewati lewat parseSlipGajiSheet, jadi tidak perlu cocokkan nama sheet.
function parseSlipGajiWorkbook(wb) {
  const XU = XLSX.utils;
  const hasil = [];
  wb.SheetNames.forEach(namaSheet => {
    const rows = XU.sheet_to_json(wb.Sheets[namaSheet], { header: 1 });
    const parsed = parseSlipGajiSheet(rows);
    if (parsed) hasil.push(Object.assign({ sheetName: namaSheet }, parsed));
  });
  return hasil;
}

// Terapkan hasil parse ke STATE: cocokkan/bikin Karyawan (by NIK, fallback by nama kalau NIK kosong di salah satu
// sisi), lalu tambahkan slip gaji utk tiap periode yg BELUM ADA -- idempotent, aman dijalankan berkali2 (mis. kalau
// file Excel lama nanti nambah bulan baru lagi sebelum akhirnya pindah total ke sistem ini).
function terapkanMigrasiSlipGaji(parsedRecords) {
  let nKaryawanBaru = 0, nSlipBaru = 0, nSlipDilewati = 0;
  const now = new Date().toISOString();
  parsedRecords.forEach(rec => {
    let karyawan = STATE.karyawan.find(k => (rec.nik && k.nik === rec.nik) || (k.nama && rec.nama && k.nama.toUpperCase() === rec.nama.toUpperCase()));
    if (!karyawan) {
      karyawan = { id: uid('ky'), nik: rec.nik || null, nama: rec.nama, status: 'Aktif' };
      STATE.karyawan.push(karyawan);
      nKaryawanBaru++;
    }
    const sudahAda = STATE.slipGaji.some(s => s.karyawanId === karyawan.id && s.bulan === rec.bulan && s.tahun === rec.tahun);
    if (sudahAda) { nSlipDilewati++; return; }
    STATE.slipGaji.push({ id: uid('sg'), karyawanId: karyawan.id, bulan: rec.bulan, tahun: rec.tahun, pendapatan: rec.pendapatan, potongan: rec.potongan, createdAt: now, updatedAt: now });
    nSlipBaru++;
  });
  return { nKaryawanBaru, nSlipBaru, nSlipDilewati };
}

// terbilang: ubah angka jadi teks bahasa Indonesia (dipakai utk baris terbilang di bawah GAJI BERSIH pada slip)
const TERBILANG_SATUAN = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
function terbilang(n) {
  n = Math.floor(Math.abs(n || 0));
  if (n < 12) return TERBILANG_SATUAN[n];
  if (n < 20) return terbilang(n - 10) + ' Belas';
  if (n < 100) return terbilang(Math.floor(n / 10)) + ' Puluh' + (n % 10 ? ' ' + terbilang(n % 10) : '');
  if (n < 200) return 'Seratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 1000) return terbilang(Math.floor(n / 100)) + ' Ratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 2000) return 'Seribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1000000) return terbilang(Math.floor(n / 1000)) + ' Ribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + ' Juta' + (n % 1000000 ? ' ' + terbilang(n % 1000000) : '');
  if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + ' Miliar' + (n % 1000000000 ? ' ' + terbilang(n % 1000000000) : '');
  return terbilang(Math.floor(n / 1000000000000)) + ' Triliun' + (n % 1000000000000 ? ' ' + terbilang(n % 1000000000000) : '');
}
function terbilangRupiah(n) {
  n = Math.round(n || 0);
  if (n === 0) return 'Nol Rupiah';
  return (n < 0 ? 'Minus ' : '') + terbilang(n) + ' Rupiah';
}

// Format "LABEL,JUMLAH" per baris (sama spt pola textarea "Tambah Transaksi Manual") -- dipisah pakai koma TERAKHIR
// di baris itu supaya label boleh mengandung koma (jarang, tapi jaga-jaga).
function parseSlipLines(text) {
  return (text || '').split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const idx = line.lastIndexOf(',');
    if (idx === -1) return { label: line, jumlah: 0 };
    const label = line.slice(0, idx).trim();
    const jumlahRaw = line.slice(idx + 1).trim().replace(/[^\d.-]/g, '');
    return { label, jumlah: Number(jumlahRaw) || 0 };
  });
}
function formatSlipLines(items) {
  return (items || []).map(it => `${it.label},${it.jumlah}`).join('\n');
}
function computeSlipTotals(slip) {
  const jumlahPendapatan = (slip.pendapatan || []).reduce((s, it) => s + (it.jumlah || 0), 0);
  const jumlahPotongan = (slip.potongan || []).reduce((s, it) => s + (it.jumlah || 0), 0);
  return { jumlahPendapatan, jumlahPotongan, gajiBersih: jumlahPendapatan - jumlahPotongan };
}
// Gabungkan 1 record slipGaji + data karyawan + pengaturan kop surat jadi 1 objek siap-tampil/siap-cetak.
function buildSlipView(slip) {
  const karyawan = STATE.karyawan.find(k => k.id === slip.karyawanId);
  const totals = computeSlipTotals(slip);
  return {
    id: slip.id,
    nik: karyawan ? (karyawan.nik || '-') : '-',
    nama: karyawan ? karyawan.nama : '(karyawan sudah dihapus)',
    bulan: slip.bulan, tahun: slip.tahun,
    bulanTahun: namaBulanID(slip.bulan) + ' ' + slip.tahun,
    pendapatan: slip.pendapatan || [], potongan: slip.potongan || [],
    jumlahPendapatan: totals.jumlahPendapatan, jumlahPotongan: totals.jumlahPotongan, gajiBersih: totals.gajiBersih,
    terbilang: terbilangRupiah(totals.gajiBersih),
    namaPerusahaan: STATE.slipGajiSettings.namaPerusahaan, alamatBaris: STATE.slipGajiSettings.alamatBaris,
    logoDataUri: STATE.slipGajiSettings.logoDataUri || null,
    emailKontak: STATE.slipGajiSettings.emailKontak || null,
  };
}

// Buka jendela baru berisi 1 atau banyak slip (dipisah per halaman via CSS page-break), lalu panggil print() --
// mengandalkan "Save as PDF" bawaan browser, jadi tidak perlu tambah library PDF baru di aplikasi ini.
function bukaCetakSlip(slipIds) {
  const views = slipIds.map(id => STATE.slipGaji.find(s => s.id === id)).filter(Boolean).map(buildSlipView);
  if (!views.length) { alert('Tidak ada slip gaji yang bisa dicetak.'); return; }
  const html = buildSlipPrintHtml(views);
  const w = window.open('', '_blank');
  if (!w) { alert('Popup diblokir browser. Izinkan popup utk situs ini agar bisa cetak slip gaji.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 300);
}
