function labelForPlatform(platform) {
  if (platform === 'Shopee') return { order: 'Order All', income: 'Income Sudah Dilepas' };
  return { order: 'Semua Pesanan', income: 'Income' };
}

// Bersihkan "Menunggu Cair" dari order yg TERNYATA sudah ada di Database Penjualan (sudah cair beneran),
// tapi ketinggalan di pendingOrderSku krn belum pernah dibersihkan (mis. dari sebelum perbaikan ini ada).
// Batalkan alokasi kontrak utk 1 order ID -- order TETAP tercatat sbg penjualan di Database Penjualan,
// tapi stok kontrak dikembalikan & payout terkait dihapus (dianggap "tidak terikat modal investor manapun").
// HANYA aman kalau payout itu PERSIS 1 order (spt hasil Tambah Transaksi Manual) -- kalau payout itu gabungan
// dari BEBERAPA order sekaligus (batch normal), TIDAK disentuh (supaya tidak salah kurangi qty order lain).
function reverseContractAllocation(orderId) {
  const payoutsTerkait = STATE.payouts.filter(p => (p.orderIds||[]).includes(orderId));
  let nDibatalkan = 0, nDilewati = 0, totalQtyDikembalikan = 0;
  payoutsTerkait.forEach(p => {
    if ((p.orderIds||[]).length > 1) { nDilewati++; return; } // gabungan bbrp order, tidak aman disentuh
    const kontrak = STATE.contracts.find(c => c.kodeKontrak === p.kodeKontrak);
    if (kontrak) {
      kontrak.stockAkhir += p.qty;
      if (kontrak.status !== 'DANA BELUM CAIR') kontrak.status = 'DANA BELUM CAIR';
      totalQtyDikembalikan += p.qty;
    }
    const idx = STATE.payouts.indexOf(p);
    STATE.payouts.splice(idx, 1);
    nDibatalkan++;
  });
  return { nDibatalkan, nDilewati, totalQtyDikembalikan };
}

// ==========================================================================
// HITUNG ULANG ALOKASI PER TANGGAL PENARIKAN
// ==========================================================================
// Menggantikan pendekatan lama "alokasikanOrderKeKontrak" (pilih 1 kontrak per order) -- ternyata SALAH
// utk order yg isinya BANYAK produk sekaligus (mis. 585620049046766664: 1 order, 3 SKU beda ukuran, semua
// produk OSWALD). Pendekatan yg benar (sesuai arahan user): jangan ikat ke 1 kontrak manual, tapi HITUNG ULANG
// SEMUA alokasi utk 1 Tanggal Penarikan sekaligus -- gabungkan SEMUA order Urban Outdoor yg tercatat di
// tanggal itu (STATE.orderDb, bukan cuma 1 order yg "hilang" payoutnya), lalu jalankan ulang algoritma
// FIFO/largest-remainder yg SAMA (allocateUnitsToContracts) spt batch normal. Ini otomatis membetulkan
// order manapun di tanggal itu yg pernah "nyangkut" tanpa payout (mis. akibat Batalkan Alokasi), TANPA perlu
// tahu order mana persisnya yg bermasalah.
//
// User sudah diberi tahu & MEMILIH SENDIRI opsi paling destruktif: HAPUS SEMUA payout investor di tanggal itu,
// lalu hitung ulang dari nol (bukan cuma menambal yg kurang) -- supaya tidak ada duplikat/salah hitung kalau
// sebagian sudah benar & sebagian belum. Konsekuensi yg disadari & diterima: payout yg sudah ditandai
// "Sudah Dibayar" di tanggal itu HILANG status itu (payout lama dihapus, diganti payout baru blm dibayar) --
// harus ditandai ulang manual. Krn itu prosesnya dipecah 3 tahap spy ada jaring pengaman:
//   1. summarizeRecomputeForDate -- READ-ONLY, utk ditampilkan sbg peringatan/konfirmasi SEBELUM apa2 dihapus.
//   2. beginRecomputeForDate -- MENGHAPUS payout lama & mengembalikan stok kontrak (disimpan snapshotnya di
//      recomputeUndoSnapshot supaya BISA dibatalkan), lalu menghitung alokasi baru (BELUM ditulis sbg payout).
//      Kalau ada kasus "Perlu Kontrak Baru" (rollover), user masih harus memutuskan dulu di step ini.
//   3a. undoRecomputeForDate -- kalau user klik Batal di titik ini: kembalikan PERSIS spt semula.
//   3b. finalizeRecomputeForDate -- kalau user konfirmasi: terapkan alokasi baru (kurangi stok, buat payout
//       baru sumberData 'hitung_ulang_tanggal'), lalu saveState(). Setelah ini TIDAK bisa di-undo lagi.
function summarizeRecomputeForDate(dateStr) {
  const payoutsForDate = STATE.payouts.filter(p => p.tanggalDihitung && p.tanggalDihitung.slice(0,10) === dateStr);
  const sudahDibayar = payoutsForDate.filter(p => p.tanggalDibayar);
  const rowsForDate = STATE.orderDb.filter(r => r.brand === 'URBAN OUTDOOR' && r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) === dateStr && r.pendapatan != null && r.status !== 'Gagal');
  return {
    dateStr,
    nPayoutLama: payoutsForDate.length,
    totalQtyPayoutLama: payoutsForDate.reduce((s,p) => s + (p.qty||0), 0),
    totalRpPayoutLama: payoutsForDate.reduce((s,p) => s + (p.payout||0), 0),
    sudahDibayarList: sudahDibayar.map(p => ({ namaInvestor: p.namaInvestor, kodeKontrak: p.kodeKontrak, qty: p.qty, payout: p.payout })),
    // Rincian SEMUA payout yg ada saat ini (bukan cuma yg sudah dibayar) -- supaya kalau ada yg kelihatan
    // ganjil (mis. lebih dari 1 baris utk kode kontrak yg sama di tanggal yg sama, sisa dari proses lama
    // yg belum bersih), langsung kelihatan di sini SEBELUM diputuskan hitung ulang lagi, bukan ketebak2an.
    rincianPayoutLama: payoutsForDate.map(p => ({ namaInvestor: p.namaInvestor, kodeKontrak: p.kodeKontrak, produk: p.produk, qty: p.qty, payout: p.payout, sumberData: p.sumberData||'-', sudahDibayar: !!p.tanggalDibayar })),
    nOrderRows: rowsForDate.length,
    totalQtyOrderRows: rowsForDate.reduce((s,r) => s + (r.qty||1), 0),
  };
}

let recomputeUndoSnapshot = null; // { dateStr, deletedPayouts: [...], contractChanges: [{contractId, stockDelta, statusWasClosedBefore}] }

// MUTASI: hapus semua payout investor di tanggal ini & kembalikan stok kontrak terkait, lalu hitung ulang
// alokasi dari SEMUA baris Database Penjualan (Urban Outdoor) di tanggal itu. Alokasi hasilnya BELUM
// dituliskan sbg payout baru -- masih perlu lolos finalizeRecomputeForDate (& keputusan rollover kalau ada).
function beginRecomputeForDate(dateStr) {
  if (recomputeUndoSnapshot) throw new Error('Ada proses hitung ulang lain yg belum selesai/dibatalkan -- selesaikan atau batalkan itu dulu.');
  const payoutsForDate = STATE.payouts.filter(p => p.tanggalDihitung && p.tanggalDihitung.slice(0,10) === dateStr);
  const snapshot = { dateStr, deletedPayouts: JSON.parse(JSON.stringify(payoutsForDate)), contractChanges: [], removedPhantomContracts: [] };

  payoutsForDate.forEach(p => {
    const kontrak = STATE.contracts.find(c => c.kodeKontrak === p.kodeKontrak);
    if (kontrak) {
      snapshot.contractChanges.push({ contractId: kontrak.id, stockDelta: p.qty, statusWasClosedBefore: kontrak.status === 'DANA SUDAH CAIR' });
      kontrak.stockAkhir += p.qty;
      if (kontrak.status !== 'DANA BELUM CAIR') kontrak.status = 'DANA BELUM CAIR';
    }
    const idx = STATE.payouts.indexOf(p);
    if (idx >= 0) STATE.payouts.splice(idx, 1);
  });

  // Kontrak yg dulu lahir dari ROLLOVER khusus utk tanggal ini (mis. hasil "Hitung Ulang" atau import
  // sebelumnya utk tanggal yg SAMA) harus ikut "dilenyapkan sementara" kalau kita benar2 mau hitung ulang
  // dari nol -- kalau tidak, modal kontrak ini ikut kehitung di computePembagiPct() dan keliru menggeser
  // persentase pembagian, mengambil jatah investor lain tanpa alasan (mis. IDO049 yg lahir dari rollover
  // IDO047 di tanggal ini ikut menaikkan % investor ID di perhitungan ulang, padahal seharusnya BELUM ada
  // sama sekali sebelum hitung ulang ini selesai). HANYA dilenyapkan kalau kontrak itu TIDAK PERNAH dipakai
  // di payout tanggal LAIN -- kalau sudah pernah dipakai nyata di tanggal lain, itu kontrak asli yg harus
  // tetap ada, jangan disentuh.
  const kodeKontrakUsedElsewhere = new Set(
    STATE.payouts
      .filter(p => !(p.tanggalDihitung && p.tanggalDihitung.slice(0,10) === dateStr))
      .map(p => p.kodeKontrak)
  );
  const phantomContracts = STATE.contracts.filter(c =>
    c.rolledForTanggalPenarikan === dateStr && !kodeKontrakUsedElsewhere.has(c.kodeKontrak)
  );
  phantomContracts.forEach(c => {
    snapshot.removedPhantomContracts.push(JSON.parse(JSON.stringify(c)));
    const idx = STATE.contracts.indexOf(c);
    if (idx >= 0) STATE.contracts.splice(idx, 1);
  });

  recomputeUndoSnapshot = snapshot;

  const rowsForDate = STATE.orderDb.filter(r => r.brand === 'URBAN OUTDOOR' && r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) === dateStr && r.pendapatan != null && r.status !== 'Gagal');
  const qtyPerProduk = {};
  rowsForDate.forEach(r => { const cp = capitalPartnerProduk(r.produk); qtyPerProduk[cp] = (qtyPerProduk[cp]||0) + (r.qty||1); });
  const cairSkuRowsForDate = rowsForDate.map(r => ({ orderId: r.orderId, sku: r.sku, qty: r.qty||1, produk: r.produk }));
  const allocations = allocateUnitsToContracts(qtyPerProduk, cairSkuRowsForDate);

  return { dateStr, allocations, qtyPerProduk, rowsForDate, nPayoutLamaDihapus: payoutsForDate.length, nKontrakPhantomDilenyapkan: phantomContracts.length };
}

// Batalkan proses hitung ulang yg SEDANG preview (setelah beginRecomputeForDate, SEBELUM finalizeRecomputeForDate)
// -- kembalikan payout lama, kontrak phantom yg sempat dilenyapkan, & stok kontrak PERSIS spt sebelum
// beginRecomputeForDate dipanggil.
function undoRecomputeForDate() {
  if (!recomputeUndoSnapshot) return;
  const snap = recomputeUndoSnapshot;
  (snap.removedPhantomContracts || []).forEach(c => STATE.contracts.push(c));
  snap.contractChanges.forEach(cc => {
    const kontrak = STATE.contracts.find(c => c.id === cc.contractId);
    if (kontrak) {
      kontrak.stockAkhir -= cc.stockDelta;
      if (cc.statusWasClosedBefore && kontrak.stockAkhir <= 0) kontrak.status = 'DANA SUDAH CAIR';
    }
  });
  snap.deletedPayouts.forEach(p => STATE.payouts.push(p));
  recomputeUndoSnapshot = null;
}

// FINALISASI: dipanggil setelah keputusan rollover (kalau ada, lewat resolveRolloverIntoAllocations) sudah
// selesai. Menulis alokasi baru sbg payout baru (sumberData 'hitung_ulang_tanggal') + mengurangi stok kontrak
// sesuai hasil akhir, lalu saveState(). Setelah ini recomputeUndoSnapshot dibuang -- tidak bisa di-undo lagi.
async function finalizeRecomputeForDate(result, rolloverResolutions) {
  if (rolloverResolutions && Object.keys(rolloverResolutions).length) {
    resolveRolloverIntoAllocations(result, rolloverResolutions, result.dateStr);
  }
  const tglIso = new Date(result.dateStr + 'T00:00:00.000Z').toISOString();
  result.allocations.forEach(a => {
    if (!a.contractId) return;
    const c = STATE.contracts.find(x => x.id === a.contractId);
    if (!c) return;
    c.stockAkhir = Math.max(0, (c.stockAkhir||0) - a.qty);
    if (c.stockAkhir === 0) c.status = 'DANA SUDAH CAIR';
  });
  let nPayoutBaru = 0;
  result.allocations.forEach(a => {
    if (!a.capitalPartnerId) return;
    STATE.payouts.push({
      id: uid('po'), tanggalDihitung: tglIso, produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor,
      capitalPartnerId: a.capitalPartnerId, kodeKontrak: a.kodeKontrak, qty: a.qty, rate: a.rate, payout: a.payout,
      tanggalDibayar: null, hargaModalPcs: a.hargaModalPcs||null, skuBreakdown: a.skuBreakdown||{},
      orderIds: [...new Set((a.orderUnits||[]).map(u=>u.orderId))], sumberData: 'hitung_ulang_tanggal',
    });
    nPayoutBaru++;
  });
  recomputeUndoSnapshot = null;
  await saveState();
  return { nPayoutBaru };
}

// ==========================================================================
// KOREKSI TANGGAL PENARIKAN YG SALAH INPUT
// ==========================================================================
// Bukan utk hitung ulang alokasi -- ini utk kasus Tanggal Penarikan-nya sendiri yg SALAH tercatat di Database
// Penjualan (mis. seharusnya 28/08 tapi kesimpan 27/08, krn salah pilih tanggal saat Tambah Transaksi Manual/
// import). HANYA mengubah field tanggalPenarikan di baris orderDb yg cocok -- TIDAK menyentuh payout sama
// sekali. DIBLOKIR kalau order ini SUDAH punya payout investor (STATE.payouts.orderIds mengandung order ini)
// -- supaya tidak menciptakan payout yg "nyasar" ke tanggal lama sementara orderDb-nya sudah pindah tanggal
// (payout & orderDb harus tetap match tanggalnya, krn Hitung Ulang Alokasi & laporan lain mengelompokkan
// berdasarkan tanggal ini). Kalau order-nya sudah py payout, selesaikan/pindahkan dulu (mis. Batalkan Alokasi,
// atau Hitung Ulang Alokasi di tanggal lama) sebelum koreksi tanggal di sini.
function previewKoreksiTanggalPenarikan(orderIds) {
  const rows = STATE.orderDb.filter(r => orderIds.includes(r.orderId));
  if (!rows.length) throw new Error('Tidak ditemukan baris Database Penjualan utk Order ID tsb.');
  const tanggalLamaSet = [...new Set(rows.map(r => r.tanggalPenarikan ? r.tanggalPenarikan.slice(0,10) : null))];
  const payoutsTerkait = STATE.payouts.filter(p => orderIds.some(id => (p.orderIds||[]).includes(id)));
  return { rows, tanggalLamaSet, nRows: rows.length, totalQty: rows.reduce((s,r)=>s+(r.qty||1),0), adaPayoutTerkait: payoutsTerkait.length > 0, payoutsTerkait };
}

function terapkanKoreksiTanggalPenarikan(orderIds, tanggalBaruStr) {
  const payoutsTerkait = STATE.payouts.filter(p => orderIds.some(id => (p.orderIds||[]).includes(id)));
  if (payoutsTerkait.length) throw new Error('Order ini sudah punya payout investor -- selesaikan/pindahkan payoutnya dulu (mis. Batalkan Alokasi, atau Hitung Ulang Alokasi di tanggal lama) sebelum mengubah Tanggal Penarikan.');
  const tglIso = new Date(tanggalBaruStr + 'T00:00:00.000Z').toISOString();
  let nUpdated = 0;
  STATE.orderDb.forEach(r => { if (orderIds.includes(r.orderId)) { r.tanggalPenarikan = tglIso; nUpdated++; } });
  return { nUpdated };
}

// Pembayaran Konveksi/Supplier (STATE.vendorPayouts) TIDAK menyimpan orderIds sama sekali -- cuma agregat
// per [tanggalDihitung, brand] (lihat applyBatchResult: 1 entri vendorPayouts bisa mewakili BANYAK order
// sekaligus dari 1 batch). Krn itu koreksi tanggal di atas SENGAJA tidak ikut memindahkan vendorPayouts --
// beresiko salah kalau entrinya ternyata gabungan bbrp order. Fungsi ini HANYA menganggap suatu entri
// vendorPayouts "aman dipindah" kalau, SETELAH koreksi orderDb di atas, sudah TIDAK ADA SATU PUN baris
// orderDb (brand apapun) yg masih mengacu ke tanggal lama itu -- artinya tanggal lama itu memang sudah
// "kosong" & entri vendorPayouts yg nyangkut di sana pasti murni milik order yg baru saja dipindah, bukan
// tercampur order lain yg TIDAK ikut dipindah.
function cariVendorPayoutYatimSetelahKoreksi(tanggalLamaStr) {
  const masihAdaOrderDb = STATE.orderDb.some(r => r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) === tanggalLamaStr);
  if (masihAdaOrderDb) return []; // tanggal lama masih dipakai order lain -- jangan sentuh, tidak aman dipisah
  return STATE.vendorPayouts.filter(v => v.tanggalDihitung && v.tanggalDihitung.slice(0,10) === tanggalLamaStr);
}

function pindahkanVendorPayoutKeTanggalBaru(vendorPayoutIds, tanggalBaruStr) {
  const tglIso = new Date(tanggalBaruStr + 'T00:00:00.000Z').toISOString();
  let nUpdated = 0;
  STATE.vendorPayouts.forEach(v => { if (vendorPayoutIds.includes(v.id)) { v.tanggalDihitung = tglIso; nUpdated++; } });
  return { nUpdated };
}

function cleanupPendingAlreadySettled() {
  const settledKeys = new Set(STATE.orderDb.map(r => r.orderId + '|' + r.sku));
  let nRemoved = 0, nOrdersAffected = 0;
  Object.keys(STATE.pendingOrderSku).forEach(orderId => {
    const before = STATE.pendingOrderSku[orderId].length;
    STATE.pendingOrderSku[orderId] = STATE.pendingOrderSku[orderId].filter(p => !settledKeys.has(orderId + '|' + p.sku));
    const removed = before - STATE.pendingOrderSku[orderId].length;
    if (removed > 0) { nRemoved += removed; nOrdersAffected++; }
    if (STATE.pendingOrderSku[orderId].length === 0) delete STATE.pendingOrderSku[orderId];
  });
  return { nRemoved, nOrdersAffected };
}

async function uploadOrderListOnly(store, orderFile) {
  const wb = XLSX.read(await orderFile.arrayBuffer(), { type:'array' }); // TANPA cellDates -- baca angka mentah
  let count = 0, nDibatalkan = 0;
  function toIso(v) { return excelSerialToISO(v); }
  const STATUS_BATAL = new Set(['Batal', 'Dibatalkan']); // istilah beda per platform, artinya sama
  if (store.platform === 'Shopee') {
    const objs = rowsToObjects(sheetToRows(wb.Sheets['orders']), 0, 1);
    const byOrder = {}; const statusById = {};
    objs.forEach(o => {
      const id = String(o['No. Pesanan']);
      byOrder[id] = byOrder[id] || [];
      byOrder[id].push({ sku: o['Nomor Referensi SKU'], qty: Number(o['Jumlah'])||0, warna: parseWarna(o['Nama Variasi']), storeName: store.nama, tanggalPesan: toIso(o['Waktu Pesanan Dibuat']) });
      statusById[id] = o['Status Pesanan'];
    });
    Object.entries(byOrder).forEach(([id, rows]) => {
      if (STATUS_BATAL.has(statusById[id])) { delete STATE.pendingOrderSku[id]; nDibatalkan++; }
      else { STATE.pendingOrderSku[id] = rows; count++; } // timpa (bukan tambah) -- data terbaru dari upload ini
    });
  } else {
    const objs = rowsToObjects(sheetToRows(wb.Sheets['OrderSKUList']), 0, 2);
    const byOrder = {}; const statusById = {};
    objs.forEach(o => {
      const id = String(o['Order ID']);
      byOrder[id] = byOrder[id] || [];
      byOrder[id].push({ sku: o['Seller SKU'], qty: Number(o['Quantity'])||0, warna: parseWarna(o['Variation']), storeName: store.nama, tanggalPesan: toIso(o['Created Time']) });
      statusById[id] = o['Order Status'];
    });
    Object.entries(byOrder).forEach(([id, rows]) => {
      if (STATUS_BATAL.has(statusById[id])) { delete STATE.pendingOrderSku[id]; nDibatalkan++; }
      else { STATE.pendingOrderSku[id] = rows; count++; }
    });
  }
  await saveState();
  return { count, nDibatalkan };
}

function renderImport(container) {
  const activeStores = STATE.stores.filter(s => s.status === 'Aktif');
  const nPending = Object.keys(STATE.pendingOrderSku).length;
  container.innerHTML = `

    const btnManual = document.getElementById('btnManualTransaction');

      const msg = document.getElementById('manualTransactionMsg');
      const store = activeStores.find(s => s.id === document.getElementById('mt_store').value);

      const skuRowsRaw = document.getElementById('mt_skuRows').value.split('\n').map(s => s.trim()).filter(Boolean);

      showMsg(msg, 'info', 'Memproses preview...');

        const result = await prepareManualTransaction({ orderId, store, skuRows, pendapatan, netSettlement, tanggalCairStr });

      renderVendorOrphanManualArea(document.getElementById('vendorOrphanManualArea'), container);

    const btnCekRecompute = document.getElementById('btnCekRecompute');
    if (btnCekRecompute) btnCekRecompute.addEventListener('click', () => {
      const msg = document.getElementById('recomputeMsg');
      const dateStr = document.getElementById('rc_tanggal').value;
      if (!dateStr) { showMsg(msg, 'err', 'Pilih tanggal penarikan dulu.'); return; }

      if (summary.nPayoutLama === 0 && summary.nOrderRows === 0) {

        renderRecomputeArea(document.getElementById('recomputeArea'), container);
        return;
      }
      recomputeSummary = summary; recomputePreviewResult = null; recomputeRolloverResolutions = {};
      showMsg(msg, 'info', 'Cek ringkasan di bawah sebelum konfirmasi.');
      renderRecomputeArea(document.getElementById('recomputeArea'), container);
    });

    const storeSelect = document.getElementById('imp_store');
    storeSelect.addEventListener('change', () => {
      const store = activeStores.find(s => s.id === storeSelect.value);
      const fields = document.getElementById('imp_fileFields');

    document.getElementById('btnAddToBatch').addEventListener('click', () => {
      const msg = document.getElementById('addBatchMsg');
      const store = activeStores.find(s => s.id === storeSelect.value);
      const incomeFile = document.getElementById('imp_incomeFile').files[0];
      if (!store || !incomeFile) { showMsg(msg, 'err', 'Pilih toko dan file Income dulu.'); return; }
      pendingStoreImports.push({ store, incomeFile });

  container.querySelectorAll('[data-remove-batch]').forEach(btn => {

  if (manualPreviewResult) renderManualPreview(document.getElementById('manualPreviewArea'), container);

async function runWeeklyImport() {
  const msg = document.getElementById('importStatus');
  if (!pendingStoreImports.length) { showMsg(msg, 'err', 'Tambah minimal 1 toko ke batch dulu.'); return; }
  if (!STATE.contracts.length) { showMsg(msg, 'err', 'Belum ada kontrak. Tambah/migrasi kontrak di tab Produk & Kontrak dulu.'); return; }
  showMsg(msg, 'info', 'Memproses file...');
  try {
    const readWB = async (f) => XLSX.read(await f.arrayBuffer(), { type:'array' }); // TANPA cellDates -- baca angka mentah
    const storeImports = await Promise.all(pendingStoreImports.map(async si => ({
      store: si.store, incomeWb: await readWB(si.incomeFile),
    })));
    const result = await processWeeklyBatch(storeImports);
    lastBatchResult = result;
    const ms = result.matchStats;
    const foundTotal = ms.shopeeFound + ms.tiktokFound, notFoundTotal = ms.shopeeNotFound + ms.tiktokNotFound;
    let text = `Berhasil: ${result.cairSkuRows.length} baris SKU cair (dari ${foundTotal} order ketemu), ${Object.keys(result.qtyPerProduk).length} produk Urban Outdoor terdampak.`;
    if (result.nSkippedAlreadyRecorded) text += ` (${result.nSkippedAlreadyRecorded} order sudah pernah tercatat, tidak dihitung ulang)`;
    showMsg(msg, notFoundTotal ? 'err' : 'ok', text + (notFoundTotal ? ` ⚠ ${notFoundTotal} order tidak ketemu SKU-nya -- coba "Update Daftar Pesanan" dulu di panel atas.` : ''));
    renderImportPreview(document.getElementById('importPreview'), result);
  } catch (e) {
    console.error(e);
    showMsg(msg, 'err', 'Gagal: ' + e.message);
  }
}

let rolloverResolutions = {}; // key (kode2|produk) -> { tipe: 'putar_penuh'|'putar_modal'|'stop', hargaBaru }

// `resolutions` diteruskan sbg parameter (bukan hardcode ke rolloverResolutions global) supaya bisa dipakai
// ulang di alur lain (mis. manualRolloverResolutions milik Tambah Transaksi Manual) tanpa saling menimpa.
function renderRolloverCase(a, key, resolutions) {
  const res = resolutions[key];
  const modalLama = a.qtyKontrakLama * a.hargaModalPcsLama;
  const profitLama = a.qtyKontrakLama * a.nilaiMarginLama;
  return `
    <div style="border:1px solid #E8C2B8; border-radius:3px; padding:12px; margin-top:8px; background:#fff;" data-rollover-case="${key}">
      <div style="font-weight:600; font-size:13px;">${a.namaInvestor} &middot; ${a.produk} &middot; ${a.qty} unit perlu keputusan</div>
      <div class="desc" style="margin:4px 0;">Kontrak ${a.kodeKontrakLama} habis. Modal awal: ${fmtRp(modalLama)} &middot; Profit terkumpul: ${fmtRp(profitLama)}</div>
      ${res ? `
        <div class="status-box show ok" style="margin-top:6px;">
          ${res.tipe === 'stop' ? 'Dipilih: STOP -- sisa unit dialihkan ke investor aktif lain.' : `Dipilih: ${res.tipe === 'putar_penuh' ? 'Putar Penuh' : 'Putar Modal Saja'} -- Harga baru ${fmtRp(res.hargaBaru)}, kontrak baru: ${generateNextKodeKontrak(a.kodeKontrakLama)}`}
          <button class="btn btn-ghost" data-rollover-ubah="${key}" style="margin-left:8px; padding:2px 8px; font-size:10px;">Ubah</button>
        </div>
      ` : `
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
          <button class="btn btn-ghost" data-rollover-pilih="putar_penuh" data-case-key="${key}">Putar Penuh</button>
          <button class="btn btn-ghost" data-rollover-pilih="putar_modal" data-case-key="${key}">Putar Modal Saja</button>
          <button class="btn btn-ghost" data-rollover-pilih="stop" data-case-key="${key}">Stop</button>
        </div>
        <div id="rolloverInputArea_${key}"></div>
      `}
    </div>
  `;
}

function wireRolloverHandlers(el, resolutions, rerender) {
  el.querySelectorAll('[data-rollover-pilih]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.caseKey, tipe = btn.dataset.rolloverPilih;
      if (tipe === 'stop') { resolutions[key] = { tipe: 'stop' }; rerender(); return; }
      const area = document.getElementById('rolloverInputArea_' + key);
      area.innerHTML = `
        <div class="grid2" style="margin-top:8px; max-width:400px;">
          <div class="field"><label>Harga Modal Baru (Rp)</label><input type="number" id="rolloverHarga_${key}" min="1"></div>
        </div>
        <button class="btn btn-primary" data-confirm-rollover="${key}" data-tipe="${tipe}" style="padding:6px 12px; font-size:12px;">Konfirmasi</button>
      `;
      document.getElementById('rolloverInputArea_' + key).querySelector('[data-confirm-rollover]').addEventListener('click', () => {
        const harga = Number(document.getElementById('rolloverHarga_' + key).value);
        if (!harga || harga <= 0) { alert('Isi harga modal baru dulu.'); return; }
        resolutions[key] = { tipe, hargaBaru: harga };
        rerender();
      });
    });
  });
  el.querySelectorAll('[data-rollover-ubah]').forEach(btn => {
    btn.addEventListener('click', () => { delete resolutions[btn.dataset.rolloverUbah]; rerender(); });
  });
}

// Preview khusus Tambah Transaksi Manual -- dipisah dari renderImportPreview krn kontennya lebih ringkas
// (cuma 1 order) & punya kasus tambahan "produk tidak punya kontrak aktif sama sekali" yg tidak muncul
// di alur Import Mingguan biasa (lihat manualNeedsAttention). Tujuannya spy keputusan rollover/peringatan
// "tidak ada kontrak" WAJIB dilihat & diputuskan dulu sebelum data ditulis -- sebelumnya alur manual
// langsung applyBatchResult tanpa pernah menampilkan result.allocations ke user sama sekali.
function renderManualPreview(el, container) {
  if (!manualPreviewResult) { el.innerHTML = ''; return; }
  const result = manualPreviewResult;
  const { perluKontrakBaru, tanpaKontrakSamaSekali } = manualNeedsAttention(result);
  const semuaRolloverSelesai = perluKontrakBaru.every(a => manualRolloverResolutions[a.kode2 + '|' + a.produk]);
  const bisaSimpanNormal = semuaRolloverSelesai && !tanpaKontrakSamaSekali.length;
  const rerender = () => renderManualPreview(el, container);

  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3;">
      <div style="font-weight:600; margin-bottom:8px;">Preview Alokasi (belum tersimpan)</div>
      <table class="data compact">
        <thead><tr><th>Produk</th><th>Investor</th><th>Kode Kontrak</th><th class="num">Qty</th><th class="num">Payout</th><th>Catatan</th></tr></thead>
        <tbody>${result.allocations.map(a => `<tr>
          <td>${a.produk}</td><td>${a.namaInvestor||'-'}</td><td>${a.kodeKontrak||'-'}</td>
          <td class="num">${a.qty}</td><td class="num">${a.payout?fmtRpCompact(a.payout):'-'}</td>
          <td style="font-size:11px;color:var(--ink-soft);white-space:normal;">${a.catatan||'-'}</td>
        </tr>`).join('')}</tbody>
      </table>
      ${tanpaKontrakSamaSekali.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ Produk ini TIDAK PUNYA kontrak aktif sama sekali</b> (${tanpaKontrakSamaSekali.map(a=>`${a.produk}: ${a.qty} unit`).join(', ')}) --
        kalau disimpan sekarang, unit ini TIDAK akan terikat ke investor manapun (persis kasus yg pernah ditemukan sebelumnya).
        Sebaiknya tambah/aktifkan kontrak dulu di tab <b>Produk &amp; Kontrak</b>, lalu ulangi "Cek &amp; Proses" di atas.
        Kalau tetap mau disimpan sekarang, pakai tombol "Simpan Tanpa Investor" di bawah, lalu alokasikan belakangan lewat
        panel <b>"Hitung Ulang Alokasi per Tanggal Penarikan"</b> begitu kontraknya sudah ada.
      </div>` : ''}
      ${perluKontrakBaru.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ PERLU KEPUTUSAN -- Kontrak Habis (wajib diputuskan sebelum simpan):</b>
        ${perluKontrakBaru.map(a => renderRolloverCase(a, a.kode2 + '|' + a.produk, manualRolloverResolutions)).join('')}
      </div>` : ''}
      <div style="margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="btnKonfirmasiManual" ${!bisaSimpanNormal?'disabled':''}>Konfirmasi &amp; Simpan sebagai Cair</button>
        ${(tanpaKontrakSamaSekali.length && semuaRolloverSelesai) ? `<button class="btn btn-ghost" id="btnPaksaSimpanTanpaKontrak">Simpan Tanpa Investor (tidak disarankan)</button>` : ''}
        <button class="btn btn-ghost" id="btnBatalPreviewManual">Batal</button>
      </div>
      <div class="status-box" id="manualConfirmMsg"></div>
    </div>
  `;
  wireRolloverHandlers(el, manualRolloverResolutions, rerender);
  document.getElementById('btnBatalPreviewManual').addEventListener('click', () => {
    manualPreviewResult = null; manualRolloverResolutions = {};
    renderImport(container);
  });
  const btnKonfirmasi = document.getElementById('btnKonfirmasiManual');
  if (btnKonfirmasi) btnKonfirmasi.addEventListener('click', () => confirmManualTransaction(container));
  const btnPaksa = document.getElementById('btnPaksaSimpanTanpaKontrak');
  if (btnPaksa) btnPaksa.addEventListener('click', () => {
    if (!confirm('Simpan tanpa investor? Unit ini akan tercatat sbg penjualan TAPI tidak terikat modal investor manapun sampai kamu alokasikan manual nanti.')) return;
    confirmManualTransaction(container);
  });
}

async function confirmManualTransaction(container) {
  const msg = document.getElementById('manualConfirmMsg');
  showMsg(msg, 'info', 'Menyimpan...');
  try {
    const { added, updated } = await finalizeManualTransaction(manualPreviewResult, manualTanggalCairStr, manualRolloverResolutions);
    const totalUnit = Object.values(manualPreviewResult.qtyPerProduk).reduce((a,b)=>a+Math.round(b),0)
      + manualPreviewResult.allocations.filter(a=>!a.capitalPartnerId).reduce((s,a)=>s+a.qty,0);
    manualPreviewResult = null; manualRolloverResolutions = {}; manualTanggalCairStr = '';
    document.getElementById('mt_orderId').value = ''; document.getElementById('mt_skuRows').value = '';
    document.getElementById('mt_pendapatan').value = ''; document.getElementById('mt_settlement').value = '';
    const topMsg = document.getElementById('manualTransactionMsg');
    showMsg(topMsg, 'ok', `Tersimpan sebagai transaksi cair (${added} baris baru${updated?`, ${updated} diperbarui`:''}, ${totalUnit} unit total). Stok kontrak & payout investor sudah diperbarui otomatis.`);
    renderImport(container);
  } catch (e) {
    showMsg(msg, 'err', 'Gagal simpan: ' + e.message);
  }
}

// Panel "Hitung Ulang Alokasi per Tanggal Penarikan" -- 2 tampilan tergantung state:
//   1. recomputeSummary ada, recomputePreviewResult belum -- tahap konfirmasi (READ-ONLY, blm ada yg dihapus).

  el.innerHTML = `

        <tbody>

          <thead><tr><th>Investor</th><th>Kode Kontrak</th><th>Produk</th><th class="num">Qty</th><th class="num">Payout</th><th>Sumber</th><th>Status</th></tr></thead>
          <tbody>${s.rincianPayoutLama.map(p => `<tr>
            <td>${p.namaInvestor||'-'}</td><td>${p.kodeKontrak||'-'}</td><td>${p.produk||'-'}</td>
            <td class="num">${p.qty}</td><td class="num">${fmtRpCompact(p.payout||0)}</td>
            <td style="font-size:11px;">${p.sumberData}</td><td style="font-size:11px;">${p.sudahDibayar?'Sudah Dibayar':'-'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </details>` : ''}
      ${s.sudahDibayarList.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ ${s.sudahDibayarList.length} payout di tanggal ini SUDAH ditandai "Sudah Dibayar"</b> -- status itu akan HILANG (payout lama dihapus, diganti payout baru yang belum dibayar) &amp; perlu ditandai ulang manual setelah hitung ulang selesai:
        <div style="font-size:11px; margin-top:6px; line-height:1.8;">
          ${s.sudahDibayarList.map(p => `${p.namaInvestor||'-'} &middot; ${p.kodeKontrak||'-'} &middot; ${p.qty} unit &middot; ${fmtRp(p.payout||0)}`).join('<br>')}
        </div>
      </div>` : ''}
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnMulaiRecompute">Ya, Hapus &amp; Hitung Ulang</button>
        <button class="btn btn-ghost" id="btnBatalRecomputeSummary">Batal</button>
      </div>
    </div>
  `;
  document.getElementById('btnMulaiRecompute').addEventListener('click', () => {
    try {
      recomputePreviewResult = beginRecomputeForDate(s.dateStr);
      recomputeRolloverResolutions = {};
      renderRecomputeArea(el, container);
    } catch (e) {
      showMsg(document.getElementById('recomputeMsg'), 'err', 'Gagal: ' + e.message);
    }
  });
  document.getElementById('btnBatalRecomputeSummary').addEventListener('click', () => {
    recomputeSummary = null;
    renderRecomputeArea(el, container);
  });
}

      <div class="status-box" id="recomputeConfirmMsg"></div>
    </div>
  `;
  wireRolloverHandlers(el, recomputeRolloverResolutions, rerender);
  document.getElementById('btnBatalRecomputePreview').addEventListener('click', () => {
    undoRecomputeForDate();
    recomputePreviewResult = null; recomputeSummary = null; recomputeRolloverResolutions = {};
    renderImport(container);
  });
  const btnKonfirmasi = document.getElementById('btnKonfirmasiRecompute');
  if (btnKonfirmasi) btnKonfirmasi.addEventListener('click', async () => {
    const msg = document.getElementById('recomputeConfirmMsg');
    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const { nPayoutBaru } = await finalizeRecomputeForDate(result, recomputeRolloverResolutions);
      recomputePreviewResult = null; recomputeSummary = null; recomputeRolloverResolutions = {};
      const rcTanggal = document.getElementById('rc_tanggal'); if (rcTanggal) rcTanggal.value = '';
      showMsg(document.getElementById('recomputeMsg'), 'ok', `Hitung ulang selesai -- ${nPayoutBaru} payout baru dibuat utk ${result.dateStr}. Cek Laporan Penarikan &amp; tandai ulang "Sudah Dibayar" kalau ada yang perlu.`);
      renderImport(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal simpan: ' + e.message);
    }
  });
}

// Panel "Koreksi Tanggal Penarikan (Salah Input)" -- tahap konfirmasi tunggal (READ-ONLY sampai user klik
// "Ya, Ubah Tanggal Penarikan"). Diblokir total kalau order yg mau dikoreksi SUDAH punya payout investor,
// supaya payout tidak "nyasar" ke tanggal lama sementara orderDb-nya sudah pindah tanggal.
function renderKoreksiTanggalArea(el, container) {
  if (!koreksiTanggalPreview) { el.innerHTML = ''; return; }
  const p = koreksiTanggalPreview;
  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3;">
      <div style="font-weight:600; margin-bottom:8px;">Konfirmasi Koreksi Tanggal Penarikan</div>
      <table class="data compact">
        <tbody>
          <tr><td>Order ID</td><td>${p.orderIds.join(', ')}</td></tr>
          <tr><td>Baris Database Penjualan ditemukan</td><td class="num">${p.nRows} baris / ${p.totalQty} unit</td></tr>
          <tr><td>Tanggal Penarikan saat ini (tercatat)</td><td class="num">${p.tanggalLamaSet.filter(Boolean).map(d=>fmtTanggal(d)).join(', ') || '-'}</td></tr>
          <tr><td>Akan diubah menjadi</td><td class="num">${fmtTanggal(p.tanggalBaru)}</td></tr>

      </table>

        <b>⚠ Order ini SUDAH punya ${p.payoutsTerkait.length} payout investor</b> -- tidak bisa diubah tanggalnya dulu spy payout tidak jadi nyasar ke tanggal lama.
        Selesaikan dulu payoutnya (mis. "Batalkan Alokasi" di atas, atau "Hitung Ulang Alokasi" di tanggal lama), baru ulangi koreksi ini.
        <table class="data compact" style="margin-top:8px; background:#fff;">
          <thead><tr><th>Tgl Dihitung</th><th>Investor</th><th>Kode Kontrak</th><th class="num">Qty</th><th>Sumber</th><th>Jumlah Order Digabung</th></tr></thead>
          <tbody>${p.payoutsTerkait.map(po => `<tr>
            <td>${fmtTanggal(po.tanggalDihitung)}</td><td>${po.namaInvestor||'-'}</td><td>${po.kodeKontrak||'-'}</td>
            <td class="num">${po.qty}</td><td style="font-size:11px;">${po.sumberData||'import_mingguan (batch normal)'}</td>
            <td class="num">${(po.orderIds||[]).length}${(po.orderIds||[]).length>1?' order (gabungan batch)':' order (berdiri sendiri)'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>` : `
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnKonfirmasiKoreksiTanggal">Ya, Ubah Tanggal Penarikan</button>
        <button class="btn btn-ghost" id="btnBatalKoreksiTanggal">Batal</button>
      </div>`}
    </div>
  `;
  const btnKonfirmasi = document.getElementById('btnKonfirmasiKoreksiTanggal');
  if (btnKonfirmasi) btnKonfirmasi.addEventListener('click', async () => {
    const msg = document.getElementById('koreksiTanggalMsg');
    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const { nUpdated } = terapkanKoreksiTanggalPenarikan(p.orderIds, p.tanggalBaru);
      await saveState();
      // Cek apakah ada Pembayaran Konveksi/Supplier yg "ketinggalan" di tanggal lama -- vendorPayouts TIDAK
      // menyimpan orderIds, jadi ini cuma ditawarkan kalau tanggal lama itu SUDAH benar2 kosong dari orderDb
      // (lihat catatan di cariVendorPayoutYatimSetelahKoreksi).
      const orphansByDate = {};
      p.tanggalLamaSet.filter(Boolean).forEach(tglLama => {
        const orphans = cariVendorPayoutYatimSetelahKoreksi(tglLama);
        if (orphans.length) orphansByDate[tglLama] = orphans;
      });
      koreksiTanggalPreview = null;
      const ktOrderIds = document.getElementById('kt_orderIds'); if (ktOrderIds) ktOrderIds.value = '';
      const ktTanggalBaru = document.getElementById('kt_tanggalBaru'); if (ktTanggalBaru) ktTanggalBaru.value = '';
      showMsg(document.getElementById('koreksiTanggalMsg'), 'ok', `${nUpdated} baris Database Penjualan diperbarui ke tanggal ${fmtTanggal(p.tanggalBaru)}.`);
      if (Object.keys(orphansByDate).length) {
        vendorOrphanFollowup = { tanggalBaru: p.tanggalBaru, orphansByDate };
      }
      renderImport(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  const btnBatal = document.getElementById('btnBatalKoreksiTanggal');
  if (btnBatal) btnBatal.addEventListener('click', () => { koreksiTanggalPreview = null; renderKoreksiTanggalArea(el, container); });
}

// Muncul SETELAH koreksi tanggal orderDb berhasil, HANYA kalau ditemukan entri Pembayaran Konveksi/Supplier
// yg "ketinggalan" di tanggal lama & sudah terbukti aman dipindah (lihat cariVendorPayoutYatimSetelahKoreksi

// baru saja dikoreksi). Opsional -- boleh diabaikan (klik Lewati) kalau user mau urus manual sendiri.
function renderVendorOrphanFollowup(el, container) {
  if (!vendorOrphanFollowup) { el.innerHTML = ''; return; }
  const f = vendorOrphanFollowup;
  const allOrphans = Object.values(f.orphansByDate).flat();
  const totalRp = allOrphans.reduce((s,v) => s + (v.total||0), 0);
  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3; margin-top:10px;">
      <div style="font-weight:600; margin-bottom:8px;">⚠ Ditemukan Pembayaran Konveksi/Supplier yang Ketinggalan di Tanggal Lama</div>
      <div class="desc">Tanggal Penjualan sudah dikoreksi, tapi Pembayaran Konveksi/Supplier (biaya ke pembuat barang) utk order ini TIDAK ikut pindah otomatis -- fitur ini tidak menyimpan Order ID per entri, cuma agregat per tanggal+brand. Entri di bawah ini AMAN dipindah krn tanggal lamanya sudah tidak dipakai order manapun lagi (dipastikan sblm ditawarkan), jadi pasti murni milik order yang baru dikoreksi.</div>
      <table class="data compact" style="margin-top:8px;">
        <thead><tr><th>Tgl Lama</th><th>Brand</th><th>Produk</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
        <tbody>${Object.entries(f.orphansByDate).map(([tglLama, orphans]) => orphans.map(v => `<tr>
          <td>${fmtTanggal(tglLama)}</td><td>${v.brand}</td><td>${v.produk}</td><td class="num">${v.qty}</td><td class="num">${fmtRp(v.total)}</td>
        </tr>`).join('')).join('')}</tbody>
      </table>
      <div style="margin-top:8px; font-size:12px;">Total: <b>${fmtRp(totalRp)}</b> -- akan dipindah ke tanggal <b>${fmtTanggal(f.tanggalBaru)}</b></div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnPindahkanVendorOrphan">Ya, Pindahkan Juga</button>
        <button class="btn btn-ghost" id="btnLewatiVendorOrphan">Lewati (urus manual sendiri)</button>
      </div>
      <div class="status-box" id="vendorOrphanMsg"></div>
    </div>
  `;
  document.getElementById('btnPindahkanVendorOrphan').addEventListener('click', async () => {
    const msg = document.getElementById('vendorOrphanMsg');
    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const ids = allOrphans.map(v => v.id);
      const { nUpdated } = pindahkanVendorPayoutKeTanggalBaru(ids, f.tanggalBaru);
      await saveState();
      vendorOrphanFollowup = null;
      showMsg(document.getElementById('koreksiTanggalMsg'), 'ok', `${nUpdated} entri Pembayaran Konveksi/Supplier juga dipindah ke tanggal ${fmtTanggal(f.tanggalBaru)}.`);
      renderImport(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  document.getElementById('btnLewatiVendorOrphan').addEventListener('click', () => {
    vendorOrphanFollowup = null;
    renderVendorOrphanFollowup(el, container);
  });
}

/* =========================================================================
   TAB: DATABASE PENJUALAN
   ========================================================================= */
let dbFilters = { produk: '', brand: '', sumber: '', search: '', tglPesanDari: '', tglPesanSampai: '', tglPenarikanDari: '', tglPenarikanSampai: '', page: 1 };
const DB_PAGE_SIZE = 50;
let showPendingOrders = false;
let pendingPage = 1;
let pendingSearch = '';

function renderDatabase(container) {
  const db = STATE.orderDb;
  const nPending = Object.keys(STATE.pendingOrderSku).length;
  if (!db.length && !nPending) {
    container.innerHTML = `<div class="panel"><div class="empty-note">Database masih kosong. Migrasi dari file UJUSO di tab Data Master, atau proses Import Mingguan dulu.</div></div>`;
    return;
  }
  const allPendingIds = Object.keys(STATE.pendingOrderSku);
  const pendingIds = pendingSearch
    ? allPendingIds.filter(id => id.toLowerCase().includes(pendingSearch.toLowerCase()) || STATE.pendingOrderSku[id].some(r => (r.sku||'').toLowerCase().includes(pendingSearch.toLowerCase())))
    : allPendingIds;
  const pendingTotalPages = Math.max(1, Math.ceil(pendingIds.length / DB_PAGE_SIZE));
  pendingPage = Math.min(pendingPage, pendingTotalPages);
  const pendingPageIds = pendingIds.slice((pendingPage-1)*DB_PAGE_SIZE, pendingPage*DB_PAGE_SIZE);

  const pendingPanel = `
    <div class="panel">
      <h2>Pesanan Menunggu Cair <span class="pill">${nPending}</span></h2>
      <div class="desc">Order dari file "Semua Pesanan"/"Order All" yang belum ketemu pasangan cair-nya di Income (atau berstatus "Pending" dari histori). SKU-nya tetap diingat sistem sampai kapan pun akhirnya cair.</div>
      <button class="btn btn-ghost" id="btnTogglePending">${showPendingOrders ? 'Sembunyikan' : 'Lihat Daftar'}</button>
      <button class="btn btn-ghost" id="btnCleanupPending" style="margin-left:8px;">Bersihkan yang Sudah Cair</button>
      <div class="status-box" id="cleanupPendingMsg"></div>
      ${showPendingOrders ? `
      <div class="field" style="margin-top:10px; max-width:320px;"><label>Cari Order ID / SKU</label><input type="text" id="pendingSearchInput" value="${pendingSearch}" placeholder="ketik order ID atau SKU..."></div>
      <div class="desc">${pendingIds.length.toLocaleString('id-ID')} order cocok pencarian.</div>
      <div style="overflow-x:auto; margin-top:10px;">
      <table class="data compact">
        <thead><tr><th>Order ID</th><th>Toko</th><th>SKU</th><th class="num">Qty</th></tr></thead>
        <tbody>
          ${pendingPageIds.map(id => STATE.pendingOrderSku[id].map(r => `<tr>
            <td style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;">${id}</td><td>${r.storeName||'-'}</td>
            <td style="font-size:10.5px;">${r.sku||'-'}</td><td class="num">${r.qty}</td>
          </tr>`).join('')).join('')}
        </tbody>
      </table>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:12px;">
        <button class="btn btn-ghost" id="pendingPrevPage" ${pendingPage<=1?'disabled':''}>&larr; Sebelumnya</button>
        <span class="desc">Halaman ${pendingPage} dari ${pendingTotalPages}</span>
        <button class="btn btn-ghost" id="pendingNextPage" ${pendingPage>=pendingTotalPages?'disabled':''}>Selanjutnya &rarr;</button>
      </div>
      ` : ''}
    </div>
  `;

  if (!db.length) {
    container.innerHTML = pendingPanel + `<div class="panel"><div class="empty-note">Belum ada transaksi cair tercatat.</div></div>`;
    wirePendingHandlers(container);
    return;
  }
  const produkList = [...new Set(db.map(r => r.produk))].filter(Boolean).sort();
  const brandList = [...new Set(db.map(r => r.brand))].filter(Boolean).sort();
  const sumberList = [...new Set(db.map(r => r.sumber))].filter(Boolean).sort();

  let filtered = db;
  if (dbFilters.produk) filtered = filtered.filter(r => r.produk === dbFilters.produk);
  if (dbFilters.brand) filtered = filtered.filter(r => r.brand === dbFilters.brand);
  if (dbFilters.sumber) filtered = filtered.filter(r => r.sumber === dbFilters.sumber);
  if (dbFilters.search) {
    const s = dbFilters.search.toLowerCase();
    filtered = filtered.filter(r => (r.orderId||'').toLowerCase().includes(s) || (r.sku||'').toLowerCase().includes(s));
  }
  if (dbFilters.tglPesanDari) filtered = filtered.filter(r => r.tanggalPesan && r.tanggalPesan.slice(0,10) >= dbFilters.tglPesanDari);
  if (dbFilters.tglPesanSampai) filtered = filtered.filter(r => r.tanggalPesan && r.tanggalPesan.slice(0,10) <= dbFilters.tglPesanSampai);
  if (dbFilters.tglPenarikanDari) filtered = filtered.filter(r => r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) >= dbFilters.tglPenarikanDari);
  if (dbFilters.tglPenarikanSampai) filtered = filtered.filter(r => r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) <= dbFilters.tglPenarikanSampai);
  filtered = filtered.slice().sort((a,b) => new Date(b.tanggalPenarikan||b.tanggalPesan||0) - new Date(a.tanggalPenarikan||a.tanggalPesan||0));

  const totalPages = Math.max(1, Math.ceil(filtered.length / DB_PAGE_SIZE));
  dbFilters.page = Math.min(dbFilters.page, totalPages);
  const pageRows = filtered.slice((dbFilters.page-1)*DB_PAGE_SIZE, dbFilters.page*DB_PAGE_SIZE);
  const fromImport = db.filter(r => r.sumberData === 'import_mingguan').length;
  const sumFiltered = (f) => filtered.reduce((s,r) => s + (r[f]||0), 0);
  const anyFilterActive = dbFilters.produk || dbFilters.brand || dbFilters.sumber || dbFilters.search ||
    dbFilters.tglPesanDari || dbFilters.tglPesanSampai || dbFilters.tglPenarikanDari || dbFilters.tglPenarikanSampai;

  container.innerHTML = pendingPanel + `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total Baris</div><div class="kpi-value">${db.length.toLocaleString('id-ID')}</div></div>
      <div class="kpi"><div class="kpi-label">Dari Migrasi PENJUALAN</div><div class="kpi-value">${(db.length-fromImport).toLocaleString('id-ID')}</div></div>
      <div class="kpi"><div class="kpi-label">Ditambahkan via App</div><div class="kpi-value">${fromImport.toLocaleString('id-ID')}</div></div>
    </div>
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Filter</h2>
        ${anyFilterActive ? `<button class="btn btn-ghost" id="btnClearFilters" style="padding:5px 10px; font-size:11px;">Bersihkan Semua Filter</button>` : ''}
      </div>
      <div class="grid2" style="margin-top:10px;">
        <div class="field"><label>Filter Produk</label>
          <select id="dbFilterProduk"><option value="">Semua Produk</option>${produkList.map(p=>`<option value="${p}" ${dbFilters.produk===p?'selected':''}>${p}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Filter Brand</label>
          <select id="dbFilterBrand"><option value="">Semua Brand</option>${brandList.map(b=>`<option value="${b}" ${dbFilters.brand===b?'selected':''}>${b}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Filter Sumber/Platform</label>
        <select id="dbFilterSumber"><option value="">Semua Sumber</option>${sumberList.map(s=>`<option value="${s}" ${dbFilters.sumber===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Cari Order ID / SKU</label><input type="text" id="dbFilterSearch" value="${dbFilters.search}" placeholder="ketik order ID atau SKU..."></div>
      <div class="grid2">
        <div class="field"><label>Tgl Pesanan Dari</label><input type="date" id="dbFilterTglPesanDari" value="${dbFilters.tglPesanDari}"></div>
        <div class="field"><label>Tgl Pesanan Sampai</label><input type="date" id="dbFilterTglPesanSampai" value="${dbFilters.tglPesanSampai}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Tgl Penarikan Dari</label><input type="date" id="dbFilterTglPenarikanDari" value="${dbFilters.tglPenarikanDari}"></div>
        <div class="field"><label>Tgl Penarikan Sampai</label><input type="date" id="dbFilterTglPenarikanSampai" value="${dbFilters.tglPenarikanSampai}"></div>
      </div>
      <div class="desc" style="margin-top:10px;">${filtered.length.toLocaleString('id-ID')} baris cocok filter &middot; halaman ${dbFilters.page} dari ${totalPages}</div>
      <div class="desc">Total (sesuai filter): Pendapatan <b>${fmtRp(sumFiltered('pendapatan'))}</b> &middot; Profit <b>${fmtRp(sumFiltered('profit'))}</b></div>
      <div style="overflow-x:auto; margin-top:8px;">

            <td>${r.produk||'-'}</td><td style="font-size:10.5px;">${r.sku||'-'}</td><td style="font-size:10.5px;">${r.warna||'-'}</td>
            <td>${r.brand||'-'}</td><td>${platformDot(r.sumber)}${r.sumber||'-'}</td>
            <td class="num">${r.qty!=null?r.qty:1}</td>
            <td class="num">${r.pendapatan!=null?fmtRpCompact(r.pendapatan):'-'}</td>
            <td class="num">${r.komisiPlatform!=null?fmtRpCompact(r.komisiPlatform):'-'}</td>

        <button class="btn btn-ghost" id="dbNextPage" ${dbFilters.page>=totalPages?'disabled':''}>Selanjutnya &rarr;</button>
      </div>
    </div>
  `;
  document.getElementById('dbFilterProduk').addEventListener('change', (e) => { dbFilters.produk = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterBrand').addEventListener('change', (e) => { dbFilters.brand = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterSumber').addEventListener('change', (e) => { dbFilters.sumber = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterSearch').addEventListener('input', (e) => { dbFilters.search = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterTglPesanDari').addEventListener('change', (e) => { dbFilters.tglPesanDari = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterTglPesanSampai').addEventListener('change', (e) => { dbFilters.tglPesanSampai = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterTglPenarikanDari').addEventListener('change', (e) => { dbFilters.tglPenarikanDari = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  document.getElementById('dbFilterTglPenarikanSampai').addEventListener('change', (e) => { dbFilters.tglPenarikanSampai = e.target.value; dbFilters.page = 1; renderDatabase(container); });
  const clearBtn = document.getElementById('btnClearFilters');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    dbFilters = { produk:'', brand:'', sumber:'', search:'', page:1, tglPesanDari:'', tglPesanSampai:'', tglPenarikanDari:'', tglPenarikanSampai:'' };
    renderDatabase(container);
  });
  document.getElementById('dbPrevPage').addEventListener('click', () => { dbFilters.page--; renderDatabase(container); });
  document.getElementById('dbNextPage').addEventListener('click', () => { dbFilters.page++; renderDatabase(container); });
  wirePendingHandlers(container);
}

function wirePendingHandlers(container) {
  const btn = document.getElementById('btnTogglePending');
  if (btn) btn.addEventListener('click', () => { showPendingOrders = !showPendingOrders; renderDatabase(container); });
  const cleanupBtn = document.getElementById('btnCleanupPending');
  if (cleanupBtn) cleanupBtn.addEventListener('click', async () => {
    const msg = document.getElementById('cleanupPendingMsg');
    showMsg(msg, 'info', 'Membersihkan...');
    try {
      const { nRemoved, nOrdersAffected } = cleanupPendingAlreadySettled();
      await saveState();
      showMsg(msg, 'ok', nRemoved ? `${nRemoved} baris (dari ${nOrdersAffected} order) dikeluarkan dari Menunggu Cair karena ternyata sudah ada di Database Penjualan.` : 'Tidak ada yang perlu dibersihkan -- semua di Menunggu Cair memang belum cair.');
      renderDatabase(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  const searchInput = document.getElementById('pendingSearchInput');
  if (searchInput) searchInput.addEventListener('input', (e) => { pendingSearch = e.target.value; pendingPage = 1; renderDatabase(container); });
  const prev = document.getElementById('pendingPrevPage');
  if (prev) prev.addEventListener('click', () => { pendingPage--; renderDatabase(container); });
  const next = document.getElementById('pendingNextPage');
  if (next) next.addEventListener('click', () => { pendingPage++; renderDatabase(container); });
}

      ${!activeContracts.length ? '<div class="empty-note">Belum ada kontrak aktif.</div>' : `

        <thead><tr>
          <th>Produk</th><th>Kode</th><th>Capital Partner</th><th>Masuk</th>
          <th class="num">Harga/Pcs</th><th class="num">Stock Awal</th><th class="num">Modal Awal</th>

            const terjual = (c.stockAwal||0) - (c.stockAkhir||0);

              <td>${c.produk}</td>

      <div id="partnerTotalView"></div>

    <div class="panel">
      <h2>Saldo di Luar Kontrak</h2>
      <div class="desc">Sisa pembulatan dari rollover kontrak (Putar Penuh/Putar Modal Saja) yang belum genap jadi 1 unit produk apa pun. Terkumpul lintas produk per investor. Murni informasi -- dipakainya kapan &amp; ke produk apa, kamu putuskan manual.</div>
      <div id="saldoDiluarView"></div>

    <div class="panel">
      <h2>Pembagi Qty SW</h2>
      <div class="desc">Qty = Stock Awal kontrak yang sedang aktif (DANA BELUM CAIR) per capital partner, per produk.</div>
      <div id="pctView"></div>
    </div>

    <div class="panel">
      <h2>Tambah Kontrak Baru</h2>
      <div class="desc">Investor baru masuk, atau putaran baru untuk investor lama.</div>
      <form id="formKontrak">
        <div class="grid2">
          <div class="field"><label>Produk</label>
            <select id="k_produk" required><option value="">Pilih produk</option>${STATE.products.map(p=>`<option value="${p.nama}">${p.nama}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Capital Partner</label>
            <select id="k_partner" required><option value="">Pilih partner</option>${STATE.capitalPartners.map(p=>`<option value="${p.id}">${p.kode2} - ${p.nama}</option>`).join('')}</select>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>Kode Kontrak</label><input type="text" id="k_kode" required placeholder="mis. IDO049" style="text-transform:uppercase;"></div>
          <div class="field"><label>Tanggal Masuk</label><input type="date" id="k_tanggal" required></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Stock Awal (qty)</label><input type="number" id="k_stock" required min="1"></div>
          <div class="field"><label>Harga Modal/Pcs (Rp)</label><input type="number" id="k_harga" required min="0"></div>
        </div>
        <div class="field"><label>Nilai Margin per Unit (Rp)</label><input type="number" id="k_margin" required min="0" value="5000"></div>
        <button type="submit" class="btn btn-primary">+ Tambah Kontrak</button>
        <div class="status-box" id="kontrakMsg"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Kode Warna</h2>
      <div class="desc">Kode 3 huruf posisi ke-4&ndash;6 pada No.SKU (mis. "OSWHTM06" &rarr; kode "HTM").</div>
      <div class="grid2" id="colorCodeList" style="margin-bottom:10px;"></div>
      <div class="grid2">
        <div class="field"><label>Kode Baru (3 huruf)</label><input type="text" id="cw_kode" maxlength="3" placeholder="mis. BLU" style="text-transform:uppercase;"></div>
        <div class="field"><label>Nama Warna</label><input type="text" id="cw_nama" placeholder="mis. BIRU"></div>
      </div>
      <button class="btn btn-ghost" id="btnAddColorCode">+ Tambah Kode Warna</button>
      <div class="status-box" id="colorCodeMsg"></div>
    </div>
  `;

  // ---- Handlers: Tambah Produk ----
  document.getElementById('formProduk').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('produkMsg');
    const nama = document.getElementById('pr_nama').value.trim().toUpperCase();
    const brand = document.getElementById('pr_brand').value.trim().toUpperCase();
    const prefix = document.getElementById('pr_prefix').value.trim().toUpperCase();
    if (prefix.length !== 3) { showMsg(msg, 'err', 'Prefix harus persis 3 huruf.'); return; }
    if (STATE.products.some(p => p.prefix === prefix)) { showMsg(msg, 'err', `Prefix "${prefix}" sudah dipakai produk lain.`); return; }
    if (STATE.products.some(p => p.nama === nama)) { showMsg(msg, 'err', `Produk "${nama}" sudah terdaftar.`); return; }
    const hargaKonveksi = {};
    document.querySelectorAll('.pr-harga-size').forEach(inp => {
      const v = Number(inp.value);
      if (v > 0) hargaKonveksi[inp.dataset.size] = [{ harga: v, tanggal: new Date().toISOString(), sumber: 'manual' }];
    });
    STATE.products.push({ id: uid('pr'), nama, brand, prefix, hargaKonveksi });
    await withSaving(msg, `Produk "${nama}" ditambahkan.`, async () => { await saveState(); });
    setTimeout(() => renderKontrak(container), 800);
  });

  // ---- Handlers: klik nama produk -> expand editor harga ----
  container.querySelectorAll('.produk-link').forEach(el => {
    el.addEventListener('click', () => {
      expandedProduk = expandedProduk === el.dataset.produk ? null : el.dataset.produk;
      renderKontrak(container);
    });
  });
  const btnTutupDetail = document.getElementById('btnTutupDetailProduk');
  if (btnTutupDetail) btnTutupDetail.addEventListener('click', () => { expandedProduk = null; renderKontrak(container); });
  container.querySelectorAll('[data-hist-toggle]').forEach(pill => {
    pill.addEventListener('click', () => {
      const el = document.getElementById('hist_' + pill.dataset.histToggle);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    });
  });
  const btnUpdateHarga = document.getElementById('btnUpdateHargaProduk');
  if (btnUpdateHarga) {
    btnUpdateHarga.addEventListener('click', async () => {
      const namaProduk = btnUpdateHarga.dataset.produk;
      let nUpdated = 0;
      document.querySelectorAll('.update-harga-size-input').forEach(inp => {
        const size = inp.dataset.size;
        const newVal = Number(inp.value);
        const cur = getCurrentHarga(namaProduk, size);
        if (newVal > 0 && newVal !== cur) { addHargaHistory(namaProduk, size, newVal, 'manual'); nUpdated++; }
      });
      await saveState();
      const msg = document.getElementById('updateHargaProdukMsg');
      showMsg(msg, 'ok', nUpdated > 0 ? `${nUpdated} size diupdate, berlaku hari ini.` : 'Tidak ada perubahan.');
      setTimeout(() => renderKontrak(container), 900);
    });

  // ---- Handlers: Tambah Kontrak ----
  document.getElementById('formKontrak').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('kontrakMsg');
    const produk = document.getElementById('k_produk').value;
    const capitalPartnerId = document.getElementById('k_partner').value;
    const kodeKontrak = document.getElementById('k_kode').value.trim().toUpperCase();

    STATE.contracts.push({ id: uid('ct'), produk, capitalPartnerId, kodeKontrak, tanggalMasuk, stockAwal, stockAkhir: stockAwal, hargaModalPcs, nilaiMargin, status: 'DANA BELUM CAIR' });

  // ---- Handlers: Tutup Kontrak ----
  container.querySelectorAll('[data-close-kontrak]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Tutup kontrak ini? Status jadi "DANA SUDAH CAIR", tidak lagi dapat alokasi qty baru.')) return;
      const c = STATE.contracts.find(x => x.id === btn.dataset.closeKontrak);
      if (c) { c.status = 'DANA SUDAH CAIR'; c.stockAkhir = 0; }
      await saveState();
      renderKontrak(container);
    });
  });

  // ---- Handlers: Jejak Rollover (telusuri mundur ke kontrak asal, dan maju ke kontrak lanjutan) ----
  container.querySelectorAll('[data-riwayat-toggle]').forEach(pill => {
    pill.addEventListener('click', () => {
      const kode = pill.dataset.riwayatToggle;
      const target = document.getElementById('riwayat_' + kode);
      if (!target) return;
      if (target.style.display === 'block') { target.style.display = 'none'; return; }
      // Telusuri mundur: kontrak ini -> asal-usulnya (rolledFromKodeKontrak), berlapis kalau ada
      const rantaiMundur = [];
      let cur = STATE.contracts.find(x => x.kodeKontrak === kode);
      while (cur && cur.rolledFromKodeKontrak) {
        rantaiMundur.push(cur.rolledFromKodeKontrak + (cur.rolledTipe ? ` (${cur.rolledTipe==='putar_penuh'?'putar penuh':'putar modal saja'})` : ''));
        cur = STATE.contracts.find(x => x.kodeKontrak === cur.rolledFromKodeKontrak);
      }
      // Telusuri maju: kontrak lain yg rolledFrom = kode ini
      const lanjutan = STATE.contracts.filter(x => x.rolledFromKodeKontrak === kode);
      let html = '';
      if (rantaiMundur.length) html += `<div><b>Asal:</b> ${rantaiMundur.reverse().join(' &rarr; ')} &rarr; ${kode}</div>`;
      if (lanjutan.length) html += `<div><b>Lanjutan:</b> ${kode} &rarr; ${lanjutan.map(x=>x.kodeKontrak+(x.rolledTipe?` (${x.rolledTipe==='putar_penuh'?'putar penuh':'putar modal saja'})`:'')).join(', ')}</div>`;

      target.style.display = 'block';

    await withSaving(msg, `Kode ${kode} -> ${nama} tersimpan.`, async () => { await saveState(); });

  // ---- Total per Capital Partner (dana aktif dikelola, lintas produk) ----
  const totalByPartner = {};
  activeContracts.forEach(c => {
    const partner = findPartnerById(c.capitalPartnerId);
    if (!partner) return;
    const modal = (c.stockAwal||0) * (c.hargaModalPcs||0);
    totalByPartner[partner.id] = totalByPartner[partner.id] || { nama: partner.nama, kode2: partner.kode2, totalModal: 0, produkSet: new Set(), nKontrak: 0 };
    totalByPartner[partner.id].totalModal += modal;
    totalByPartner[partner.id].produkSet.add(c.produk);
    totalByPartner[partner.id].nKontrak++;
  });
  const partnerTotalEl = document.getElementById('partnerTotalView');
  const partnerTotalList = Object.values(totalByPartner).sort((a,b) => b.totalModal - a.totalModal);
  if (!partnerTotalList.length) { partnerTotalEl.innerHTML = '<div class="empty-note">Belum ada kontrak aktif.</div>'; }
  else {
    partnerTotalEl.innerHTML = `
      <table class="data">
        <thead><tr><th>Kode</th><th>Nama</th><th class="num">Jml Produk</th><th class="num">Jml Kontrak</th><th class="num">Total Dana Dikelola</th></tr></thead>
        <tbody>
          ${partnerTotalList.map(p => `<tr>
            <td><b>${p.kode2}</b></td><td>${p.nama}</td><td class="num">${p.produkSet.size}</td>
            <td class="num">${p.nKontrak}</td><td class="num">${fmtRp(p.totalModal)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  // ---- Saldo di Luar Kontrak ----
  const saldoEl = document.getElementById('saldoDiluarView');
  const saldoEntries = Object.entries(STATE.saldoDiluarKontrak || {}).filter(([,v]) => v > 0);
  if (!saldoEntries.length) { saldoEl.innerHTML = '<div class="empty-note">Belum ada saldo di luar kontrak.</div>'; }
  else {
    saldoEl.innerHTML = `
      <table class="data">
        <thead><tr><th>Kode</th><th>Nama</th><th class="num">Saldo</th></tr></thead>
        <tbody>
          ${saldoEntries.map(([cpId, jumlah]) => {

function fmtRp(n) { if (n==null||isNaN(n)) return '-'; return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
// Titik warna kecil di depan nama toko/platform, biar gampang dibedain sekilas (Shopee/TikTok/Tokopedia/lainnya).
function platformDot(sumberOrNama) {
  if (!sumberOrNama) return '';
  const up = String(sumberOrNama).toUpperCase();
  let cls = 'lainnya';
  if (up.includes('SHOPEE')) cls = 'shopee';
  else if (up.includes('TIKTOK')) cls = 'tiktok';
  else if (up.includes('TOKPED') || up.includes('TOKOPEDIA')) cls = 'tokopedia';
  return `<span class="platform-dot ${cls}"></span>`;
}
// Format tanggal LANGSUNG dari teks ISO (YYYY-MM-DD...) tanpa lewat konversi zona waktu browser,
// supaya tanggal yg ditampilkan SELALU sama persis dgn tanggal yg tersimpan, di zona waktu manapun dibuka.
function fmtTanggal(isoString, opts) {
  if (!isoString) return '-';
  const datePart = String(isoString).slice(0, 10); // "YYYY-MM-DD"
  const [y, m, d] = datePart.split('-');
  if (!y || !m || !d) return '-';
  if (opts && opts.short) return `${d}/${m}/${y.slice(2)}`;
  return `${d}/${m}/${y}`;
}
function fmtRpCompact(n) {
  if (n==null||isNaN(n)) return '-';
  n = Math.round(n);
  if (Math.abs(n) >= 1000000) return (n/1000000).toLocaleString('id-ID',{maximumFractionDigits:2}) + 'jt';
  return n.toLocaleString('id-ID');
}

// Rekonstruksi PERKIRAAN payouts dari histori PENJUALAN yg sudah dimigrasi -- SEPENUHNYA TERPISAH dari alur
// Tandai riwayat rollover utk kontrak2 LAMA (dari migrasi UJUSO) berdasarkan pola: kontrak sebelumnya
// habis total (stockAkhir=0) tepat sebelum kontrak berikutnya (nomor urut+1, investor+produk sama) mulai.
// TIDAK menandai kalau kontrak sebelumnya masih ada sisa (brarti bukan rollover linear, tapi kontrak paralel/split).
// Juga perbaiki tanggal placeholder (2025-01-01) dgn interpolasi dari tetangganya dlm urutan yg sama.
function inferRolloverLineage() {
  const groups = {};
  STATE.contracts.forEach(c => {
    const m = String(c.kodeKontrak).match(/^([A-Z]{2})([A-Z])(\d+)$/i);
    if (!m) return;
    const key = (m[1]+m[2]).toUpperCase();
    groups[key] = groups[key] || [];
    groups[key].push({ c, num: parseInt(m[3],10) });
  });

  let nTglDiperbaiki = 0, nDitandai = 0, nDilewati = 0;
  const dilewatiList = [];

  Object.values(groups).forEach(list => {
    list.sort((a,b) => a.num - b.num);
    list.forEach((item, i) => {
      const tgl = item.c.tanggalMasuk ? item.c.tanggalMasuk.slice(0,10) : null;
      if (tgl === '2025-01-01') {
        const prev = list[i-1], next = list[i+1];
        if (prev && prev.c.tanggalMasuk && next && next.c.tanggalMasuk) {
          const tPrev = new Date(prev.c.tanggalMasuk).getTime(), tNext = new Date(next.c.tanggalMasuk).getTime();
          item.c.tanggalMasuk = new Date(tPrev + (tNext - tPrev) / 2).toISOString();
          nTglDiperbaiki++;
        }
      }
    });
    list.sort((a,b) => new Date(a.c.tanggalMasuk||0) - new Date(b.c.tanggalMasuk||0));
    for (let i = 1; i < list.length; i++) {
      const prev = list[i-1].c, cur = list[i].c;
      if (cur.rolledFromKodeKontrak) continue;
      if ((prev.stockAkhir||0) === 0) {
        cur.rolledFromKodeKontrak = prev.kodeKontrak;
        cur.rolledTipe = 'historis';
        nDitandai++;
      } else {
        dilewatiList.push(`${prev.kodeKontrak} -> ${cur.kodeKontrak} (${prev.kodeKontrak} masih sisa ${prev.stockAkhir})`);
        nDilewati++;
      }
    }
  });
  return { nTglDiperbaiki, nDitandai, nDilewati, dilewatiList };
}

// Import Mingguan asli. TIDAK PERNAH menyentuh STATE.contracts atau STATE.orderDb -- cuma BACA dari orderDb,
// TULIS ke STATE.payouts/vendorPayouts saja. Aman dijalankan berkali-kali (hapus hasil lama dulu tiap kali).
// PAKAI kodeKontrakHistoris (kolom B di PENJUALAN) LANGSUNG sbg sumber kebenaran -- BUKAN hitung ulang alokasi
// pakai kontrak yg aktif SEKARANG, supaya akurat kalau kontrak sudah berganti sejak saat itu (mis. IWO013->IWO014).
function backfillPayoutsFromHistory() {
  STATE.payouts = STATE.payouts.filter(p => p.sumberData !== 'backfill_estimasi');
  STATE.vendorPayouts = STATE.vendorPayouts.filter(p => p.sumberData !== 'backfill_estimasi');

  const histRows = STATE.orderDb.filter(r => r.sumberData === 'migrasi_penjualan' && r.tanggalPenarikan && r.produk);
  const byDate = {};
  histRows.forEach(r => { const d = r.tanggalPenarikan.slice(0,10); byDate[d] = byDate[d] || []; byDate[d].push(r); });

  let nBackfilled = 0, nTanpaKodeKontrak = 0;
  Object.entries(byDate).forEach(([date, rows]) => {
    // ---- INVESTOR: kelompokkan LANGSUNG per kodeKontrakHistoris (dari kolom B) -- bukan re-alokasi ----
    const byKontrak = {};
    rows.forEach(r => {
      const p = findProduct(r.produk);
      if (!p || p.brand !== 'URBAN OUTDOOR') return;
      if (!r.kodeKontrakHistoris) { nTanpaKodeKontrak++; return; }
      const key = r.kodeKontrakHistoris + '|' + capitalPartnerProduk(r.produk);
      byKontrak[key] = byKontrak[key] || { kodeKontrak: r.kodeKontrakHistoris, produk: capitalPartnerProduk(r.produk), rows: [] };
      byKontrak[key].rows.push(r);
    });
    Object.values(byKontrak).forEach(group => {
      const kode2 = group.kodeKontrak.slice(0,2).toUpperCase();
      const partner = findPartnerByKode2(kode2);
      const kontrakRef = STATE.contracts.find(c => c.kodeKontrak === group.kodeKontrak); // cari kontraknya (aktif atau sudah tutup)
      const qty = group.rows.reduce((s,r) => s + (r.qty||1), 0);
      const skuBreakdown = {};
      group.rows.forEach(r => { if (r.sku) skuBreakdown[r.sku] = (skuBreakdown[r.sku]||0) + (r.qty||1); });
      STATE.payouts.push({
        id: uid('po'), tanggalDihitung: new Date(date).toISOString(), produk: group.produk, kode2,
        namaInvestor: partner ? partner.nama : kode2, capitalPartnerId: partner ? partner.id : null,
        kodeKontrak: group.kodeKontrak, qty, rate: kontrakRef ? kontrakRef.nilaiMargin : null,
        payout: kontrakRef ? qty*kontrakRef.nilaiMargin : null, tanggalDibayar: null,
        hargaModalPcs: kontrakRef ? kontrakRef.hargaModalPcs : null, skuBreakdown,
        orderIds: [...new Set(group.rows.map(r=>r.orderId))], sumberData: 'backfill_estimasi',
      });
      nBackfilled++;
    });

    // ---- VENDOR/KONVEKSI: SEMUA brand TERMASUK Urban Outdoor (arus uang beda: investor dapat margin,
    // konveksi/pembuat barang dapat harga produksi -- 2 hal terpisah utk produk yg sama) ----
    const vendorByBrand = {};
    rows.forEach(r => {
      if (!r.sku) return;
      const harga = lookupHargaKonveksiBySku(r.sku);
      if (!harga) return;
      const b = r.brand || 'TIDAK DIKETAHUI';
      vendorByBrand[b] = vendorByBrand[b] || { qty:0, total:0, produk:new Set(), skuBreakdown:{} };
      vendorByBrand[b].qty += (r.qty||1); vendorByBrand[b].total += (r.qty||1)*harga; vendorByBrand[b].produk.add(r.produk);
      vendorByBrand[b].skuBreakdown[r.sku] = (vendorByBrand[b].skuBreakdown[r.sku]||0) + (r.qty||1);
    });
    Object.entries(vendorByBrand).forEach(([brand,d]) => {
      STATE.vendorPayouts.push({ id: uid('vpo'), tanggalDihitung: new Date(date).toISOString(), brand,
        produk: [...d.produk].join(', '), qty: d.qty, total: d.total, tanggalDibayar: null,
        skuBreakdown: d.skuBreakdown, sumberData: 'backfill_estimasi' });
    });
  });

  return { nBackfilled, nTanpaKodeKontrak };
}

function wireDrilldownHandlers(container) {
  container.querySelectorAll('.row-drilldown').forEach(tr => {
    tr.addEventListener('click', () => {
      const payoutId = tr.dataset.drillPayout, label = tr.dataset.drillLabel;
      const payout = STATE.payouts.find(p => p.id === payoutId);
      const el = document.getElementById('drilldown_' + payoutId);
      if (!payout || !el) return;
      if (el.style.display === 'block') { el.style.display = 'none'; return; }
      const skusForLabel = Object.keys(payout.skuBreakdown||{}).filter(sku => skuToSizeLabel(payout.produk, sku) === label);
      const orderRows = STATE.orderDb.filter(r => (payout.orderIds||[]).includes(r.orderId) && skusForLabel.includes(r.sku) && capitalPartnerProduk(r.produk) === payout.produk);
      el.innerHTML = `<b>${label}</b> -- Order ID: ${orderRows.length ? orderRows.map(r=>r.orderId).join(', ') : '(tidak ditemukan di database)'}`;
      el.style.display = 'block';
    });
  });
}

      if (!confirm(`Tandai ${nTarget} entri histori (perkiraan) sebagai sudah dibayar? Cuma yg bersumber dari backfill histori -- payout dari batch mingguan yg sungguhan TIDAK ikut tertandai.`)) return;
      showMsg(msg, 'info', 'Menandai...');
      try {
        const now = new Date().toISOString();
        let n = 0;
        STATE.payouts.forEach(p => { if (p.sumberData === 'backfill_estimasi' && !p.tanggalDibayar) { p.tanggalDibayar = now; n++; } });
        await saveState();
        showMsg(msg, 'ok', `${n} entri histori ditandai sudah dibayar.`);
        renderLaporan(container);

  const statusFilterEl = document.getElementById('laporanStatusFilter');
  if (statusFilterEl) statusFilterEl.addEventListener('change', (e) => { laporanFilter.status = e.target.value; renderLaporan(container); });

  renderLaporanTable(document.getElementById('laporanTableArea'), container);
}

function renderVendorDetailTable(vendorPayout) {
  const bySizeLabel = {}; // "PRODUKSIZE" -> {qty, harga, produkNama}
  Object.entries(vendorPayout.skuBreakdown || {}).forEach(([sku, qty]) => {
    const prefix = String(sku).toUpperCase().slice(0,3);
    const p = STATE.products.find(pr => pr.prefix === prefix);
    if (!p) return;
    const sizeCode = String(sku).toUpperCase().slice(-2);
    const size = SIZE_CODE_MAP[sizeCode];
    if (!size) return;
    const label = p.nama + size;
    const harga = lookupHargaKonveksiBySku(sku) || 0;
    bySizeLabel[label] = bySizeLabel[label] || { qty: 0, harga, produkNama: p.nama };
    bySizeLabel[label].qty += qty;
  });
  const produkOrder = [...new Set(Object.values(bySizeLabel).map(v=>v.produkNama))].sort();
  let totalQty = 0, totalRp = 0;
  const rows = [];
  produkOrder.forEach(produkNama => {
    SIZES.forEach(s => {
      const label = produkNama + s;
      const g = bySizeLabel[label];
      const qty = g ? g.qty : 0;
      const harga = g ? g.harga : (getCurrentHarga(produkNama, s) || 0);
      const total = qty * harga;
      totalQty += qty; totalRp += total;
      rows.push({ label, harga, qty, total });
    });
  });
  return `
    <table class="data compact">
      <thead><tr><th>Kode Produk</th><th class="num">Harga</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.label}</td><td class="num">${r.harga?fmtRpCompact(r.harga):'-'}</td><td class="num">${r.qty||'-'}</td><td class="num">${r.total?fmtRp(r.total):'-'}</td></tr>`).join('')}
        <tr style="font-weight:600; border-top:2px solid var(--ink);"><td colspan="2">TOTAL</td><td class="num">${totalQty}</td><td class="num">${fmtRp(totalRp)}</td></tr>
      </tbody>
    </table>
  `;
}

function renderLaporanTable(el, container) {
  const isVendor = laporanFilter.tab === 'vendor';
  const list = isVendor ? STATE.vendorPayouts : STATE.payouts;
  let filtered = list;
  if (!isVendor) {
    if (laporanFilter.status === 'belum') filtered = filtered.filter(x => !x.tanggalDibayar);
    else if (laporanFilter.status === 'sudah') filtered = filtered.filter(x => x.tanggalDibayar);
  }
  filtered = filtered.slice().sort((a,b) => new Date(b.tanggalDihitung||0) - new Date(a.tanggalDihitung||0));

  if (!filtered.length) { el.innerHTML = '<div class="empty-note">Tidak ada data.</div>'; return; }

  if (isVendor) {
    el.innerHTML = `
      <table class="data compact">
        <thead><tr><th>Tgl Dihitung</th><th>Brand</th><th>Produk</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${filtered.map(v => `<tr class="row-drilldown" style="cursor:pointer;" data-vendor-toggle="${v.id}">
            <td>${fmtTanggal(v.tanggalDihitung)}</td><td>${v.brand}</td><td style="font-size:11px;">${v.produk}</td>
            <td class="num">${v.qty}</td><td class="num">${fmtRp(v.total)}</td>
          </tr>
          <tr id="vendorDetailRow_${v.id}" style="display:none;"><td colspan="5">${renderVendorDetailTable(v)}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
    el.querySelectorAll('[data-vendor-toggle]').forEach(tr => {
      tr.addEventListener('click', () => {
        const row = document.getElementById('vendorDetailRow_' + tr.dataset.vendorToggle);
        if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
      });
    });
  } else {
    el.innerHTML = `
      <table class="data compact">
        <thead><tr><th>Tgl Dihitung</th><th>Investor</th><th>Produk</th><th>Kontrak</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Payout</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(p => `<tr>
            <td>${fmtTanggal(p.tanggalDihitung)}${p.sumberData==='backfill_estimasi'?' <span class="pill" style="font-size:9px;">perkiraan</span>':''}</td><td>${p.namaInvestor||'-'}</td><td>${p.produk}</td><td style="font-size:11px;">${p.kodeKontrak||'-'}</td>
            <td class="num">${p.qty}</td><td class="num">${p.rate?fmtRpCompact(p.rate):'-'}</td><td class="num">${p.payout?fmtRp(p.payout):'-'}</td>
            <td>${p.tanggalDibayar ? `<span class="pill ok">Lunas ${fmtTanggal(p.tanggalDibayar,{short:true})}</span>` : `<span class="pill pending">Belum</span>`}</td>
            <td>${!p.tanggalDibayar ? `<button class="btn btn-ghost" data-mark-payout="${p.id}" style="padding:4px 8px; font-size:11px;">Tandai Dibayar</button>` : ''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
    el.querySelectorAll('[data-mark-payout]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const p = STATE.payouts.find(x => x.id === btn.dataset.markPayout);
        if (p) p.tanggalDibayar = new Date().toISOString();
        await saveState();
        renderLaporan(container);
      });
    });
  }
}

        <div class="field"><label>Sampai Tanggal</label><input type="date" id="adsFilterTglSampai" value="${adsFilter.tglSampai}"></div>
      </div>
      ${Object.keys(byStore).length ? `
      <div class="desc" style="margin-top:10px;"><b>Rincian per toko:</b> ${Object.entries(byStore).map(([s,t])=>`${s}: ${fmtRp(t)}`).join(' &middot; ')}</div>

        <thead><tr><th>Tanggal</th><th>Toko</th><th>Platform</th><th class="num">Biaya</th><th>Catatan</th><th></th></tr></thead>
