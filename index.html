/* =========================================================================
   TAB: RENCANA PRODUKSI (2026-11-22)
   Fungsi parser & helper SKU (parseStokSheetBlok1 dkk, ratakanStokProduksi, cariKodeWarnaByNama, dst) sudah
   didefinisikan di blok "FITUR: RENCANA PRODUKSI" dekat SIZE_CODE_MAP -- bagian ini KHUSUS mesin rekomendasi +
   UI tab-nya.
   ========================================================================= */
let produksiSubTab = 'stok'; // 'stok' | 'wip' | 'po' | 'rekomendasi'
let produksiPasteText = '';
let editingWipId = null;
let editingPOId = null;
// Grup sheet yg panel detail pemetaannya sedang dibuka manual (2026-11-22, permintaan Setiawan: grup yg
// sudah dipetakan di-collapse otomatis biar tidak perlu scroll jauh -- UI saja, TIDAK disimpan/persisten).
let produksiStokGroupExpanded = {};
// Baseline qty saran minimal saat "Stok Kritis" (stok+WIP sudah habis) TAPI kecepatan jual historis blm bisa
// dipercaya (2026-11-22, Setiawan: "bukan berarti jika tidak ada historis tidak di produksi, tapi bisa juga
// krn stok habis dan kemampuan produksi tidak terkejar" ... "kalau tidak ada historis tidak apa apa jika
// produksi hanya 5 pcs juga") -- qty hasil proyeksi velocity TIDAK PERNAH dianggap final "tidak perlu
// produksi" kalau stoknya sudah 0, minimal selalu disarankan angka kecil ini spy tidak kosong total.
const BASELINE_QTY_STOK_KRITIS = 5;

function produkUoutList() { return STATE.products.filter(p => p.brand === 'URBAN OUTDOOR'); }

// Kecepatan jual per SKU (unit/minggu) dari STATE.orderDb, dlm window N minggu terakhir dihitung dari HARI INI
// -- ini basis "belajar otomatis" yg diminta user: tidak ada input manual kecepatan jual, selalu dihitung ulang
// live dari data orderDb yg terus bertambah stlh tiap upload baru.
function hitungKecepatanJualPerSku(windowMinggu) {
  const w = windowMinggu > 0 ? windowMinggu : 8;
  const now = new Date();
  const batas = new Date(now.getTime() - w * 7 * 86400000);
  const totalBySku = {};
  STATE.orderDb.forEach(r => {
    if (!r.sku) return;
    const tglStr = r.tanggalPesan || r.tanggalPenarikan;
    if (!tglStr) return;
    const d = new Date(tglStr);
    if (isNaN(d.getTime()) || d < batas || d > now) return;
    totalBySku[r.sku] = (totalBySku[r.sku] || 0) + (r.qty || 0);
  });
  const perMinggu = {};
  Object.entries(totalBySku).forEach(([sku, total]) => { perMinggu[sku] = total / w; });
  return perMinggu;
}

// Tanggal pesanan pelanggan TERLAMA yg SKU-nya cocok dgn SKU PO ybs (dari STATE.pendingOrderSku, yg kadang
// bawa field tanggalPesan kalau diisi lewat alur "Update Daftar Pesanan") -- ini basis urutan prioritas PO:
// yg plg lama menunggu dikerjakan lebih dulu, BUKAN flat "PO selalu paling atas" / skor abstrak.
function cariTanggalPesanTerlamaUntukSku(sku) {
  if (!sku) return null;
  let terlama = null;
  Object.values(STATE.pendingOrderSku).forEach(rows => {
    (rows || []).forEach(r => {
      if (r.sku === sku && r.tanggalPesan) {
        if (!terlama || new Date(r.tanggalPesan) < new Date(terlama)) terlama = r.tanggalPesan;
      }
    });
  });
  return terlama;
}

// Bangun SKU dari 1 entri manual (WIP/PO) {produkNama, warna, ukuran} -- null kalau blm bisa dipetakan penuh
// ke kode SKU (mis. warna blm ada di Kode Warna, atau ukuran bukan SIZES standar & bukan kode custom yg sudah
// dipetakan utk grup itu). Pemanggil WAJIB sedia fallback pencocokan berbasis teks produk+warna+ukuran
// (lihat kunciEntriProduksi) spy data WIP/PO produk varian non-ukuran (DEO dkk) tetap bisa cocok ke stok.
function skuDariEntriManual(entri) {
  const p = findProduct(entri.produkNama);
  if (!p) return null;
  const kodeWarna = cariKodeWarnaByNama(entri.warna);
  const kodeUkuran = cariKodeUkuranBySize(entri.ukuran);
  return bangunSkuProduksi(p.prefix, kodeWarna, kodeUkuran);
}

// Kunci fallback produk+warna+ukuran (dipakai saat SKU tidak bisa dibangun) -- HARUS persis sama dgn label yg
// dipakai ratakanStokProduksi (produkNama, warna=rowLabel, ukuran=ukuranLabel) agar WIP/PO manual bisa cocok.
function kunciEntriProduksi(produkNama, warna, ukuran) {
  return [String(produkNama || '').trim().toUpperCase(), String(warna || '').trim().toUpperCase(), String(ukuran || '').trim().toUpperCase()].join('||');
}

// Mesin rekomendasi inti. CATATAN KRITIS: fungsi ini HANYA MEMBACA STATE (stok hasil mapping, WIP, PO,
// orderDb, pendingOrderSku, produksiSettings) dan TIDAK PERNAH menyentuh/mengubah STATE.capitalPartners,
// p.kontrakAktif, payout investor, atau apapun yg berkaitan dgn alokasi/pembagian kontrak -- jadi fitur ini
// TIDAK BISA mengubah data kontrak (dibuktikan test_produksi_jsdom.js: snapshot kontrak sebelum/sesudah sama).
function hitungRekomendasiProduksi() {
  const warnings = [];
  const mapping = STATE.produksiStockMapping || { groups: {}, variants: {} };
  const { rows: stockRows, warnings: stokWarnings } = ratakanStokProduksi(STATE.produksiStockRaw || [], mapping);
  warnings.push(...stokWarnings);

  const settings = STATE.produksiSettings || { targetMinggu: 4, windowMinggu: 8 };
  const velocityBySku = hitungKecepatanJualPerSku(settings.windowMinggu || 8);
  const targetMinggu = settings.targetMinggu || 4;

  const wipBySku = {}, wipByKunci = {}, wipMeta = {};
  (STATE.produksiWip || []).forEach(w => {
    const sku = skuDariEntriManual(w);
    const kunci = kunciEntriProduksi(w.produkNama, w.warna, w.ukuran);
    if (sku) wipBySku[sku] = (wipBySku[sku] || 0) + (w.qty || 0);
    wipByKunci[kunci] = (wipByKunci[kunci] || 0) + (w.qty || 0);
    if (!wipMeta[kunci]) wipMeta[kunci] = { produkNama: w.produkNama, warna: w.warna, ukuran: w.ukuran };
  });
  const poBySku = {}, poByKunci = {}, poMeta = {};
  (STATE.produksiPO || []).forEach(po => {
    const sku = skuDariEntriManual(po);
    const kunci = kunciEntriProduksi(po.produkNama, po.warna, po.ukuran);
    if (sku) poBySku[sku] = (poBySku[sku] || 0) + (po.qtyPO || 0);
    poByKunci[kunci] = (poByKunci[kunci] || 0) + (po.qtyPO || 0);
    if (!poMeta[kunci]) poMeta[kunci] = { produkNama: po.produkNama, warna: po.warna, ukuran: po.ukuran };
  });

  // Hitung 1 baris rekomendasi -- diekstrak jadi fungsi (2026-11-22 round 14) supaya bisa dipakai utk baris
  // yg PUNYA data stok fisik (dari stockRows) MAUPUN baris SINTETIS utk kombinasi produk+warna+ukuran yg
  // CUMA py PO/WIP tapi TIDAK PERNAH ada sbg baris stok sama sekali (lihat komentar "kunciDariStockRows" di
  // bawah) -- logic SAMA PERSIS, tidak digandakan/didrift.
  const hitungBarisRekomendasi = (produkNama, warna, ukuran, sku, stok) => {
    const p = findProduct(produkNama);
    const kunci = kunciEntriProduksi(produkNama, warna, ukuran);
    const wip = (sku && wipBySku[sku]) || wipByKunci[kunci] || 0;
    const poQty = (sku && poBySku[sku]) || poByKunci[kunci] || 0;
    const velocity = (sku && velocityBySku[sku]) || 0;
    const target = velocity * targetMinggu;
    const qtyNeededMentah = Math.max(0, Math.ceil(target - (stok + wip)));
    // "Stok Kritis" (2026-11-22, permintaan user): stok+WIP sudah 0 (habis) -- di titik ini kecepatan jual
    // HISTORIS BISA MENYESATKAN (rendah/nol bukan krn kurang diminati, tapi krn stockout/produksi tidak
    // terkejar, jadi pembeli tidak sempat terekam beli sama sekali). Jadi: JANGAN PERNAH simpulkan "tidak perlu
    // produksi" murni dari histori kosong/rendah saat stok sudah habis -- selalu sarankan minimal
    // BASELINE_QTY_STOK_KRITIS pcs & tandai utk dicek manual, bukan didiamkan/dianggap qty 0.
    const stokKritis = (stok + wip) <= 0;
    const qtyNeeded = stokKritis ? Math.max(qtyNeededMentah, BASELINE_QTY_STOK_KRITIS) : qtyNeededMentah;
    const statusProduksi = (p && p.statusProduksi === 'stop') ? 'stop' : 'aktif';
    const tanggalPesanTerlama = poQty > 0 ? cariTanggalPesanTerlamaUntukSku(sku) : null;
    return { produkNama, warna, ukuran, sku, stok, wip, poQty, velocityPerMinggu: velocity, target, qtyNeeded, stokKritis, statusProduksi, tanggalPesanTerlama };
  };

  const hasil = stockRows.map(row => hitungBarisRekomendasi(row.produkNama, row.warna, row.ukuranLabel, row.sku, row.qtyStok));

  // BUG NYATA (2026-11-22 round 14, Setiawan: "untuk yang rovee saja di produksi hanya warna pure grey
  // padahal kalau berdasarkan list PO masih banyak yang belum tercapai") -- SEBELUM baris di bawah ini ada,
  // `hasil` di atas CUMA dibangun dari stockRows (baris stok FISIK yg sudah dipetakan) -- jadi PO/WIP utk
  // kombinasi produk+warna+ukuran yg TIDAK PERNAH ada sbg baris stok sama sekali (mis. warna baru yg sudah
  // di-PO ke konveksi tapi belum/tidak pernah dicatat di sheet stok gudang -- lazim utk produk kategori PO
  // spt ROVEE yg warnanya terus bertambah sesuai demand) SAMA SEKALI TIDAK PERNAH MUNCUL di Prioritas PO
  // ATAUPUN Kartu Order Produksi, walau STATE.produksiPO sudah py datanya & sudah tersinkron dari Pre-Order
  // List. Fix: tambahkan baris SINTETIS (stok dianggap 0, krn memang blm pernah tercatat ada stoknya) utk
  // setiap kunci PO/WIP yg belum kecover oleh baris stok manapun di atas.
  const kunciDariStockRows = new Set(hasil.map(h => kunciEntriProduksi(h.produkNama, h.warna, h.ukuran)));
  const metaPoWipGabungan = Object.assign({}, wipMeta, poMeta);
  Object.keys(metaPoWipGabungan).forEach(kunci => {
    if (kunciDariStockRows.has(kunci)) return;
    const meta = metaPoWipGabungan[kunci];
    const sku = skuDariEntriManual(meta);
    hasil.push(hitungBarisRekomendasi(meta.produkNama, meta.warna, meta.ukuran, sku, 0));
  });

  // Produk berstatus "stop" TIDAK PERNAH masuk rekomendasi apapun (PO maupun restock biasa) -- stoknya tetap
  // ditampilkan di tabel "Ringkasan Stok per Produk" (htmlProduksiStok), terpisah dari sini.
  const aktif = hasil.filter(h => h.statusProduksi !== 'stop');

  const poItems = aktif.filter(h => h.poQty > 0).sort((a, b) => {
    const da = a.tanggalPesanTerlama ? new Date(a.tanggalPesanTerlama).getTime() : Infinity;
    const db = b.tanggalPesanTerlama ? new Date(b.tanggalPesanTerlama).getTime() : Infinity;
    return da - db;
  });
  const poKunciSet = new Set(poItems.map(h => kunciEntriProduksi(h.produkNama, h.warna, h.ukuran)));
  // stokKritis SELALU masuk restockItems walau qtyNeeded hasil hitungan mentah = 0 (baseline sudah dipaksa
  // minimal BASELINE_QTY_STOK_KRITIS di atas) -- lalu diurutkan PALING ATAS (lebih mendesak dari sekadar qty
  // besar biasa), krn ini kasus stok BENAR-BENAR HABIS, bukan cuma "menipis sesuai proyeksi".
  const restockItems = aktif
    .filter(h => (h.qtyNeeded > 0 || h.stokKritis) && !poKunciSet.has(kunciEntriProduksi(h.produkNama, h.warna, h.ukuran)))
    .sort((a, b) => (Number(b.stokKritis) - Number(a.stokKritis)) || (b.qtyNeeded - a.qtyNeeded));

  return { poItems, restockItems, allRows: hasil, warnings };
}

// Kunci "kartu produksi" (produk+warna+ukuran -- SAMA PERSIS bentuknya dgn kunciEntriProduksi, cuma nama
// fungsi dibuat khusus biar jelas konteksnya dipakai di kartu Order Produksi, lihat hitungKartuProduksi).
// (2026-11-22 round 10, Setiawan: "seharusnya di pisah juga berdasarkan warna" -- SEBELUMNYA kunci ini cuma
// produk+ukuran [digabung lintas warna], sekarang per warna spy bisa ditimpa manual per warna jg.
function kunciKartuProduksi(produkNama, warna, ukuran) {
  return kunciEntriProduksi(produkNama, warna, ukuran);
}
// Kartu "Order Produksi" per produk (2026-11-22, Setiawan kirim contoh sheet referensi: 1 kartu per produk,
// tabel WARNA+SIZE+QTY+baris TOTAL, spt yg biasa dia pakai, lalu diringkas lagi round 10: "dipisah jg
// berdasarkan warna" + "yg tidak di produksi tidak perlu muncul jadi 0, biar ringkas, bisa langsung dikasih
// ke konveksi") -- menggantikan tabel "Rekomendasi Restock" di sub-tab Rekomendasi Produksi, 1 baris per
// produk+warna+ukuran yg BENAR-BENAR perlu diproduksi (qty PO yg SUDAH ADA kalau ada, ATAU rekomendasi
// restock kalau belum ada PO). Baris yg qty-nya 0 DAN belum pernah disentuh manual disembunyikan (noise) --
// TAPI baris yg sudah PERNAH ditimpa manual (STATE.produksiOverrideQty) tetap ditampilkan WALAU nilainya 0,
// supaya tidak terjebak permanen hilang tanpa cara mengembalikannya (retik ulang angka sistem = otomatis
// hapus override lagi, lihat attachListenersProduksiRekomendasi). Angka SISTEM bisa ditimpa manual per sel
// yg SELALU menang kalau ada & tersimpan PERMANEN (bukan sekadar tampilan sementara) -- Setiawan eksplisit:
// "aku bisa rubah dan sesuaikan stoknya tidak hanya berdasarkan hasil rekomendasi sistem saja". CATATAN
// KONTRAK: fungsi ini cuma MEMBACA hasil hitungRekomendasiProduksi() (yg sendirinya sudah terbukti tidak
// pernah menyentuh kontrak/payout) + STATE.produksiOverrideQty (field baru, tidak dibaca fungsi kontrak
// manapun) -- tidak ada jalur ke computePembagiPct.
function hitungKartuProduksi() {
  const { allRows } = hitungRekomendasiProduksi();
  const overrides = STATE.produksiOverrideQty || {};
  const idxUkuran = (u) => { const i = SIZES.indexOf(u); return i === -1 ? SIZES.length : i; };
  const perProduk = {};
  const urutanProduk = [];
  allRows.forEach(h => {
    if (h.statusProduksi === 'stop') return;
    const kunci = kunciKartuProduksi(h.produkNama, h.warna, h.ukuran);
    const sistem = h.poQty > 0 ? h.poQty : h.qtyNeeded;
    const adaOverride = Object.prototype.hasOwnProperty.call(overrides, kunci);
    const final = adaOverride ? (Number(overrides[kunci]) || 0) : sistem;
    if (!final && !adaOverride) return; // ringkas: blm pernah disentuh & memang 0 -> sembunyikan, bukan noise
    if (!perProduk[h.produkNama]) { perProduk[h.produkNama] = []; urutanProduk.push(h.produkNama); }
    perProduk[h.produkNama].push({ warna: h.warna, ukuran: h.ukuran, sistem, final, adaOverride, kunci, stokKritis: h.stokKritis });
  });
  return urutanProduk.map(produkNama => {
    const baris = perProduk[produkNama].slice().sort((a, b) => {
      if (a.warna !== b.warna) return a.warna < b.warna ? -1 : 1;
      const ia = idxUkuran(a.ukuran), ib = idxUkuran(b.ukuran);
      return ia !== ib ? ia - ib : (a.ukuran < b.ukuran ? -1 : (a.ukuran > b.ukuran ? 1 : 0));
    });
    const total = baris.reduce((s, b) => s + (Number(b.final) || 0), 0);
    return { produkNama, baris, total };
  });
}

// Ubah 1 hasil hitungKartuProduksi() (per produk) jadi bentuk pivot/matrix SIZE (baris) x WARNA (kolom),
// sesuai pola spreadsheet yg biasa dipakai Setiawan sendiri (2026-11-22: "mungkin bisa seperti ini" + contoh
// screenshot pivot). CATATAN KONTRAK: fungsi ini HANYA membaca ulang k.baris (hasil hitungKartuProduksi, yg
// sudah terbukti read-only thdp kontrak/payout) -- tidak menghitung apa pun baru & tidak menyentuh STATE.
// hitungKartuProduksi() & kunciKartuProduksi() sendiri TIDAK diubah sama sekali oleh fungsi ini.
function pivotKartuProduksi(k) {
  const idxUkuran = (u) => { const i = SIZES.indexOf(u); return i === -1 ? SIZES.length : i; };
  const warnaSet = new Set();
  const ukuranSet = new Set();
  const cellMap = {};
  (k.baris || []).forEach(b => {
    warnaSet.add(b.warna);
    ukuranSet.add(b.ukuran);
    cellMap[b.warna + '||' + b.ukuran] = b;
  });
  const warnaCols = Array.from(warnaSet).sort((a, b) => a < b ? -1 : (a > b ? 1 : 0));
  const ukuranRows = Array.from(ukuranSet).sort((a, b) => {
    const ia = idxUkuran(a), ib = idxUkuran(b);
    return ia !== ib ? ia - ib : (a < b ? -1 : (a > b ? 1 : 0));
  });
  return { warnaCols, ukuranRows, cellMap };
}

      produksiStokGroupExpanded[g.groupLabel] = true;
      setTimeout(() => renderProduksi(container), 700);
    });
  });

  container.querySelectorAll('.btn-simpan-map-variants').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = Number(btn.dataset.groupIdx);
      const g = (STATE.produksiStockRaw || [])[idx];
      if (!g) return;
      const msg = document.getElementById(`mapVariantMsg_${idx}`);
      await withSaving(msg, 'Pemetaan varian/ukuran tersimpan.', async () => {
        STATE.produksiStockMapping.variants = STATE.produksiStockMapping.variants || {};
        STATE.produksiStockMapping.variants[g.groupLabel] = STATE.produksiStockMapping.variants[g.groupLabel] || {};
        g.variantLabels.forEach((vl, vidx) => {
          const selStd = container.querySelector(`.sel-map-ukuran-std[data-group-idx="${idx}"][data-variant-idx="${vidx}"]`);
          const inpCustom = container.querySelector(`.inp-map-ukuran-custom[data-group-idx="${idx}"][data-variant-idx="${vidx}"]`);
          const std = selStd ? selStd.value : '';
          const custom = inpCustom ? inpCustom.value.trim().toUpperCase() : '';
          STATE.produksiStockMapping.variants[g.groupLabel][vl] = std ? { ukuran: std } : (custom ? { kodeCustom: custom } : {});
        });
        await saveState();
      });
      produksiStokGroupExpanded[g.groupLabel] = true;
      setTimeout(() => renderProduksi(container), 700);
    });
  });

  container.querySelectorAll('.btn-simpan-row-override').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = Number(btn.dataset.groupIdx);
      const g = (STATE.produksiStockRaw || [])[idx];
      if (!g) return;
      const msg = document.getElementById(`mapRowMsg_${idx}`);
      await withSaving(msg, 'Override produk per baris tersimpan.', async () => {
        STATE.produksiStockMapping.rowProduk = STATE.produksiStockMapping.rowProduk || {};
        STATE.produksiStockMapping.rowProduk[g.groupLabel] = STATE.produksiStockMapping.rowProduk[g.groupLabel] || {};
        g.items.forEach((item, ridx) => {
          const sel = container.querySelector(`.sel-row-override-produk[data-group-idx="${idx}"][data-row-idx="${ridx}"]`);
          const inp = container.querySelector(`.inp-row-override-warna[data-group-idx="${idx}"][data-row-idx="${ridx}"]`);
          const produkOverride = sel ? sel.value : '';
          const warnaOverride = inp ? inp.value.trim() : '';
          if (!produkOverride) { delete STATE.produksiStockMapping.rowProduk[g.groupLabel][item.rowLabel]; return; }
          STATE.produksiStockMapping.rowProduk[g.groupLabel][item.rowLabel] = warnaOverride ? { produkNama: produkOverride, warna: warnaOverride } : { produkNama: produkOverride };
        });
        await saveState();
      });
      produksiStokGroupExpanded[g.groupLabel] = true;
      setTimeout(() => renderProduksi(container), 700);
    });
  });
}

function attachListenersProduksiWip(container) {
  wireSelectOtherToggle('wip_warna', 'wip_warna_other');
  wireSelectOtherToggle('wip_ukuran', 'wip_ukuran_other');
  const selProdukWip = document.getElementById('wip_produk');
  if (selProdukWip) selProdukWip.addEventListener('change', () => {
    // Ganti produk -> opsi Warna/Ukuran (atau grid qty-per-ukuran, mode tambah baru) ikut menyesuaikan
    // (2026-11-22, permintaan Setiawan), reset ke kosong (bukan bawa2 pilihan lama dari produk sebelumnya
    // yg bisa jadi tidak nyambung).
    const { warnaHtml, ukuranHtml } = htmlOptsWarnaUkuran(selProdukWip.value, '', '');
    document.getElementById('wip_warna').innerHTML = warnaHtml;
    wireSelectOtherToggle('wip_warna', 'wip_warna_other');
    const ukuranSel = document.getElementById('wip_ukuran');
    if (ukuranSel) { ukuranSel.innerHTML = ukuranHtml; wireSelectOtherToggle('wip_ukuran', 'wip_ukuran_other'); }
    const grid = document.getElementById('wip_qty_grid');
    if (grid) grid.innerHTML = htmlQtyGridUkuran('wip', selProdukWip.value);
  });
  const form = document.getElementById('formProduksiWip');
  if (form) form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('wipMsg');
    const produkNama = document.getElementById('wip_produk').value;
    const warna = nilaiWarnaUkuranDariForm('wip_warna', 'wip_warna_other');
    const catatan = document.getElementById('wip_catatan').value.trim();
    if (editingWipId) {
      const qty = Number(document.getElementById('wip_qty').value);
      const ukuran = nilaiWarnaUkuranDariForm('wip_ukuran', 'wip_ukuran_other');
      if (!produkNama || !warna || !ukuran || !qty || qty < 1) { showMsg(msg, 'err', 'Lengkapi semua field wajib (qty minimal 1).'); return; }
      const w = STATE.produksiWip.find(x => x.id === editingWipId);
      if (w) { w.produkNama = produkNama; w.qty = qty; w.warna = warna; w.ukuran = ukuran; w.catatan = catatan || null; w.updatedAt = new Date().toISOString(); }
      editingWipId = null;
    } else {
      if (!produkNama || !warna) { showMsg(msg, 'err', 'Pilih produk & warna dulu.'); return; }
      const entriUkuran = kumpulkanQtyUkuranDariGrid('wip');
      if (!entriUkuran.length) { showMsg(msg, 'err', 'Isi qty di minimal 1 ukuran (qty harus lebih dari 0).'); return; }
      const now = new Date().toISOString();
      entriUkuran.forEach(({ ukuran, qty }) => {
        STATE.produksiWip.push({ id: uid('wip'), produkNama, qty, warna, ukuran, catatan: catatan || null, updatedAt: now });
      });
    }
    await saveState();
    renderProduksi(container);
  });
  const btnBatal = document.getElementById('btnBatalEditWip');
  if (btnBatal) btnBatal.addEventListener('click', () => { editingWipId = null; renderProduksi(container); });
  container.querySelectorAll('[data-edit-wip]').forEach(btn => btn.addEventListener('click', () => { editingWipId = btn.dataset.editWip; renderProduksi(container); }));
  container.querySelectorAll('[data-del-wip]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Hapus data WIP ini?')) return;
    STATE.produksiWip = STATE.produksiWip.filter(w => w.id !== btn.dataset.delWip);
    await saveState();
    renderProduksi(container);
  }));
}

// Status sinkron sheet PO Rovee (2026-11-22, permintaan Setiawan: "seharusnya di sini ada tampilan sheet
// sudah tersinkron atau belum dengan sheet po rovee") -- bandingkan preOrderListFetchedAt (kapan teks sheet
// terakhir diproses) vs preOrderListSyncedAt (kapan terakhir klik "Sinkronkan ke Daftar PO"). Kalau sudah
// impor ulang SETELAH sinkron terakhir, Daftar PO & Rencana Produksi masih pakai data LAMA -- user perlu tau.
function htmlStatusSinkronPreOrderList() {
  const fetchedAt = STATE.preOrderListFetchedAt;
  const syncedAt = STATE.preOrderListSyncedAt;
  if (!syncedAt) {
    return `<div class="status-box show err" style="margin-top:8px;">&#9888; Data ini BELUM PERNAH disinkronkan ke Daftar PO -- klik tombol "Sinkronkan" di bawah dulu supaya ikut masuk ke Rencana Produksi.</div>`;
  }
  if (fetchedAt && syncedAt < fetchedAt) {
    return `<div class="status-box show err" style="margin-top:8px;">&#9888; Sheet sudah diimpor ulang (${new Date(fetchedAt).toLocaleString('id-ID')}) SETELAH sinkron terakhir (${new Date(syncedAt).toLocaleString('id-ID')}) -- Daftar PO &amp; Rencana Produksi masih pakai data lama, klik "Sinkronkan" lagi.</div>`;
  }
  return `<div class="status-box show ok" style="margin-top:8px;">&#10003; Sudah tersinkron ke Daftar PO (pada ${new Date(syncedAt).toLocaleString('id-ID')}).</div>`;
}

    const msg = document.getElementById('preOrderListMsg');
    const text = document.getElementById('preOrderListPasteText').value;
    if (!text.trim()) { showMsg(msg, 'err', 'Tempel teks sheet dulu sebelum diproses.'); return; }
    const { rows, warnings } = parsePreOrderListRovee(text);
    if (!rows.length) { showMsg(msg, 'err', warnings.length ? warnings.join(' ') : 'Tidak ada baris order yg berhasil dibaca.'); return; }
    STATE.preOrderListRaw = rows;
    STATE.preOrderListFetchedAt = new Date().toISOString();
    await withSaving(msg, `${rows.length} baris order berhasil diproses.`, async () => { await saveState(); });
    setTimeout(() => renderProduksi(container), 700);
  });
  const btnSinkron = document.getElementById('btnSinkronPreOrderList');
  if (btnSinkron) btnSinkron.addEventListener('click', async () => {
    const msg = document.getElementById('preOrderListMsg');
    const { rekap } = hitungRekapPreOrderList(STATE.preOrderListRaw || []);
    await withSaving(msg, 'Berhasil disinkronkan ke Daftar PO.', async () => {
      sinkronkanPreOrderListKeProduksiPO(rekap);
      STATE.preOrderListSyncedAt = new Date().toISOString();
      await saveState();
    });
    setTimeout(() => renderProduksi(container), 700);
  });

  wireSelectOtherToggle('po_warna', 'po_warna_other');
  wireSelectOtherToggle('po_ukuran', 'po_ukuran_other');
  const selProdukPo = document.getElementById('po_produk');
  if (selProdukPo) selProdukPo.addEventListener('change', () => {
    const { warnaHtml, ukuranHtml } = htmlOptsWarnaUkuran(selProdukPo.value, '', '');
    document.getElementById('po_warna').innerHTML = warnaHtml;
    wireSelectOtherToggle('po_warna', 'po_warna_other');
    const ukuranSel = document.getElementById('po_ukuran');
    if (ukuranSel) { ukuranSel.innerHTML = ukuranHtml; wireSelectOtherToggle('po_ukuran', 'po_ukuran_other'); }
    const grid = document.getElementById('po_qty_grid');
    if (grid) grid.innerHTML = htmlQtyGridUkuran('po', selProdukPo.value);
  });

  const form = document.getElementById('formProduksiPO');
  if (form) form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('poMsg');
    const produkNama = document.getElementById('po_produk').value;
    const warna = nilaiWarnaUkuranDariForm('po_warna', 'po_warna_other');
    const catatan = document.getElementById('po_catatan').value.trim();
    if (editingPOId) {
      const qtyPO = Number(document.getElementById('po_qty').value);
      const ukuran = nilaiWarnaUkuranDariForm('po_ukuran', 'po_ukuran_other');
      if (!produkNama || !warna || !ukuran || !qtyPO || qtyPO < 1) { showMsg(msg, 'err', 'Lengkapi semua field wajib (qty minimal 1).'); return; }
      const po = STATE.produksiPO.find(x => x.id === editingPOId);
      if (po) { po.produkNama = produkNama; po.qtyPO = qtyPO; po.warna = warna; po.ukuran = ukuran; po.catatan = catatan || null; po.updatedAt = new Date().toISOString(); }
      editingPOId = null;
    } else {
      if (!produkNama || !warna) { showMsg(msg, 'err', 'Pilih produk & warna dulu.'); return; }
      const entriUkuran = kumpulkanQtyUkuranDariGrid('po');
      if (!entriUkuran.length) { showMsg(msg, 'err', 'Isi qty di minimal 1 ukuran (qty harus lebih dari 0).'); return; }
      const now = new Date().toISOString();
      entriUkuran.forEach(({ ukuran, qty }) => {
        STATE.produksiPO.push({ id: uid('po'), produkNama, qtyPO: qty, warna, ukuran, catatan: catatan || null, updatedAt: now });
      });
    }
    await saveState();
    renderProduksi(container);
  });
  const btnBatal = document.getElementById('btnBatalEditPO');
  if (btnBatal) btnBatal.addEventListener('click', () => { editingPOId = null; renderProduksi(container); });
  container.querySelectorAll('[data-edit-po]').forEach(btn => btn.addEventListener('click', () => { editingPOId = btn.dataset.editPo; renderProduksi(container); }));
  container.querySelectorAll('[data-del-po]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Hapus data PO ini?')) return;
    STATE.produksiPO = STATE.produksiPO.filter(po => po.id !== btn.dataset.delPo);
    await saveState();
    renderProduksi(container);
  }));
}

function htmlProduksiRekomendasi() {
  const settings = STATE.produksiSettings || { targetMinggu: 4, windowMinggu: 8 };
  const { poItems, warnings } = hitungRekomendasiProduksi();
  const kartuProduksi = hitungKartuProduksi();
  // Tanggal kartu (2026-11-22 round 14, Setiawan: "setelah di unduh seharusnya ada tulisan tanggalnya juga
  // agar tidak bingung") -- dihitung SEKALI di sini & diselipkan ke DALAM tiap kartu (bukan cuma di judul
  // panel di luar), krn "Unduh PNG" cuma screenshot div kartu itu sendiri -- judul panel di luar tidak ikut
  // kefoto, jadi tanpa ini gambar yg diunduh/dishare lewat WA tidak ada keterangan tanggalnya sama sekali.
  const tanggalKartu = fmtTanggalPanjang(new Date().toISOString());
  return `
    <div class="panel">
      <h2>Pengaturan Proyeksi</h2>
      <div class="grid2">
        <div class="field"><label>Target cadangan stok (minggu)</label><input type="number" id="produksi_targetMinggu" min="1" value="${settings.targetMinggu}"></div>
        <div class="field"><label>Jendela histori kecepatan jual (minggu)</label><input type="number" id="produksi_windowMinggu" min="1" value="${settings.windowMinggu}"></div>
      </div>
      <button class="btn btn-ghost" id="btnSimpanSettingProduksi">Simpan Pengaturan</button>
      <div class="status-box" id="produksiSettingMsg"></div>
    </div>

    ${htmlPrioritasPO(poItems)}

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <h2 style="margin:0;">Order Produksi -- ${tanggalKartu}</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="btnSimpanKartuProduksi">Simpan Qty</button>
          <button class="btn btn-ghost" id="btnResetKartuProduksi">Reset ke Saran Sistem</button>
        </div>
      </div>
      <div class="desc">1 kartu per produk, SIZE sbg baris &amp; WARNA sbg kolom (spt pola spreadsheet yg biasa dipakai) -- qty awal dari saran sistem (PO yg sudah ada ATAU rekomendasi restock, mana yg berlaku), tapi SEMUA angka bisa kamu ubah manual &amp; tersimpan sbg angka final (klik "Simpan Qty") -- tidak cuma ikut hasil rekomendasi sistem begitu saja. Sel kosong/strip (-) = memang tidak perlu diproduksi, tapi tetap bisa diisi manual kalau mau. Baris/kolom yg semuanya kosong disembunyikan biar ringkas. Sel yg sudah ditimpa manual ditandai warna oranye. Tombol "Unduh PNG" di tiap kartu utk kirim cepat ke konveksi lewat WA.</div>
      <div class="status-box" id="kartuProduksiMsg"></div>
      ${!kartuProduksi.length ? '<div class="empty-note" style="margin-top:8px;">Tidak ada produk yg perlu diproduksi saat ini (semua qty 0).</div>' : `
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-top:12px;">
        ${kartuProduksi.map((k, kIdx) => {
          const piv = pivotKartuProduksi(k);
          // Nama Tampilan (2026-11-22 round 14, Setiawan: "sebaiknya namanya jelas, jika oswalder waterproof
          // atau oswalder windbreaker, bomber warfield dll") -- CUMA utk label di kartu & nama file unduhan;
          // k.produkNama (nama RESMI, kunci pencocokan kontrak/SKU/dll) TIDAK disentuh sama sekali di manapun.
          const prodRef = findProduct(k.produkNama);
          const namaTampil = (prodRef && prodRef.namaTampilan) || k.produkNama;
          const aksenKartu = ['', 'purple', 'amber', 'rose'][kIdx % 4];
          return `
        <div class="kartu-produksi-card ${aksenKartu}" id="kartuProduksiCard_${kIdx}" style="min-width:260px; padding:10px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">
            <div>
              <div class="kartu-produksi-title" style="font-weight:700;">${namaTampil}</div>
              <div class="kartu-produksi-tanggal" style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${tanggalKartu}</div>
            </div>
            <button type="button" class="btn btn-ghost btn-unduh-kartu" data-kartu-idx="${kIdx}" data-produk="${namaTampil.replace(/"/g, '&quot;')}" style="padding:3px 8px; font-size:11px; flex:none;">Unduh PNG</button>
          </div>
          <div style="overflow-x:auto;">
          <table class="data compact" style="width:auto;">
            <thead><tr><th>SIZE</th>${piv.warnaCols.map(w => `<th>${w}</th>`).join('')}<th>TOTAL</th></tr></thead>
            <tbody>
              ${piv.ukuranRows.map((u, rIdx) => `<tr>
                <td>${u}</td>
                ${piv.warnaCols.map((w, cIdx) => {
                  const b = piv.cellMap[w + '||' + u];
                  if (b) {
                    return `<td class="num">
                      <input type="number" min="0" class="inp-kartu-qty" data-kunci="${b.kunci}" data-produk="${k.produkNama.replace(/"/g, '&quot;')}" data-sistem="${b.sistem}" data-row-idx="${rIdx}" data-col-idx="${cIdx}" value="${b.final}"
                        style="width:52px; text-align:right; ${b.adaOverride ? 'border-color:#f59e0b; background:#fff7ed;' : ''}"
                        title="${w} / ${u} -- Saran sistem: ${b.sistem}${b.adaOverride ? ' (angka ini sudah ditimpa manual)' : ''}${b.stokKritis ? ' -- Stok Kritis (stok+WIP sudah habis)' : ''}">
                    </td>`;
                  }
                  const kunciKosong = kunciKartuProduksi(k.produkNama, w, u);
                  return `<td class="num">
                    <input type="number" min="0" class="inp-kartu-qty" data-kunci="${kunciKosong}" data-produk="${k.produkNama.replace(/"/g, '&quot;')}" data-sistem="0" data-row-idx="${rIdx}" data-col-idx="${cIdx}" value="" placeholder="-"
                      style="width:52px; text-align:right;" title="${w} / ${u} -- blm ada saran sistem, bisa diisi manual">
                  </td>`;
                }).join('')}
                <td class="num" data-row-total-idx="${rIdx}">${piv.warnaCols.reduce((s, w) => { const b = piv.cellMap[w + '||' + u]; return s + (b ? Number(b.final) || 0 : 0); }, 0)}</td>
              </tr>`).join('')}
              <tr style="font-weight:700; border-top:2px solid var(--line);">
                <td>TOTAL</td>
                ${piv.warnaCols.map((w, cIdx) => `<td class="num" data-col-total-idx="${cIdx}">${piv.ukuranRows.reduce((s, u) => { const b = piv.cellMap[w + '||' + u]; return s + (b ? Number(b.final) || 0 : 0); }, 0)}</td>`).join('')}
                <td class="num" data-total-produk="${k.produkNama.replace(/"/g, '&quot;')}">${k.total}</td>
              </tr>
            </tbody>
          </table>
          </div>
        </div>`;
        }).join('')}
      </div>
      <div class="desc" style="margin-top:10px;">&#9888; (lihat tooltip sel) = "Stok Kritis" (stok+WIP produk+ukuran ini sudah HABIS) -- qty minimal disarankan ${BASELINE_QTY_STOK_KRITIS} pcs walau histori jual belum ada/sedikit, krn histori rendah/nol saat stok habis bisa krn stockout, bukan krn kurang diminati. Cek manual sebelum putuskan qty final.</div>
      `}
      ${warnings.length ? `<div class="desc" style="margin-top:10px; color:#b45309;">Peringatan (${warnings.length}): ${warnings.slice(0, 10).join(' | ')}${warnings.length > 10 ? ' ...' : ''}</div>` : ''}
    </div>
  `;
}

function attachListenersProduksiRekomendasi(container) {
  const btn = document.getElementById('btnSimpanSettingProduksi');
  if (btn) btn.addEventListener('click', async () => {
    const msg = document.getElementById('produksiSettingMsg');
    const targetMinggu = Number(document.getElementById('produksi_targetMinggu').value) || 4;
    const windowMinggu = Number(document.getElementById('produksi_windowMinggu').value) || 8;
    STATE.produksiSettings = { targetMinggu, windowMinggu };
    await saveState();
    showMsg(msg, 'ok', 'Pengaturan disimpan.');
    renderProduksi(container);
  });

  // Kartu Order Produksi (2026-11-22): update TOTAL per kartu live saat angka diketik (belum tersimpan),
  // simpan semua sbg override permanen sekaligus, atau hapus semua override & kembali ke saran sistem.
  const updateTotalKartu = (produk) => {
    const total = Array.from(container.querySelectorAll('.inp-kartu-qty'))
      .filter(el => el.dataset.produk === produk)
      .reduce((s, el) => s + (Number(el.value) || 0), 0);
    const totalEl = Array.from(container.querySelectorAll('[data-total-produk]')).find(el => el.dataset.totalProduk === produk);
    if (totalEl) totalEl.textContent = total;
  };
  // Pivot grid (2026-11-22): update TOTAL per baris (SIZE) & per kolom (WARNA) live saat angka diketik,
  // dicari via data-row-idx/data-col-idx (bukan nama warna/ukuran langsung, supaya aman dari karakter aneh
  // spt tanda kutip di querySelector) -- diskop per kartu (card) spy nomor indeks antar kartu tidak bentrok.
  const updateTotalBarisKolomKartu = (inp) => {
    const card = inp.closest('.kartu-produksi-card');
    if (!card) return;
    const rIdx = inp.dataset.rowIdx, cIdx = inp.dataset.colIdx;
    if (rIdx !== undefined && rIdx !== '') {
      const rowTotalEl = card.querySelector(`[data-row-total-idx="${rIdx}"]`);
      if (rowTotalEl) {
        const total = Array.from(card.querySelectorAll('.inp-kartu-qty')).filter(el => el.dataset.rowIdx === rIdx).reduce((s, el) => s + (Number(el.value) || 0), 0);
        rowTotalEl.textContent = total;
      }
    }
    if (cIdx !== undefined && cIdx !== '') {
      const colTotalEl = card.querySelector(`[data-col-total-idx="${cIdx}"]`);
      if (colTotalEl) {
        const total = Array.from(card.querySelectorAll('.inp-kartu-qty')).filter(el => el.dataset.colIdx === cIdx).reduce((s, el) => s + (Number(el.value) || 0), 0);
        colTotalEl.textContent = total;
      }
    }
  };
  container.querySelectorAll('.inp-kartu-qty').forEach(inp => {
    inp.addEventListener('input', () => { updateTotalKartu(inp.dataset.produk); updateTotalBarisKolomKartu(inp); });
  });
  // Unduh kartu produksi sbg PNG (2026-11-22, permintaan Setiawan: "agar bisa download image...agar mudah di
  // share lewat WA") -- pakai html2canvas (dimuat di <head>), screenshot div kartu apa adanya (termasuk angka
  // yg BARU diketik tapi belum "Simpan Qty" -- sengaja, supaya user bisa cek dulu sblm simpan kalau mau).
  container.querySelectorAll('.btn-unduh-kartu').forEach(btn => {
    btn.addEventListener('click', async () => {
      const kartuIdx = btn.dataset.kartuIdx;
      const produk = btn.dataset.produk || 'produk';
      const card = document.getElementById(`kartuProduksiCard_${kartuIdx}`);
      if (!card || typeof window.html2canvas !== 'function') { alert('Fitur unduh gambar belum siap (html2canvas belum termuat) -- cek koneksi internet lalu coba lagi.'); return; }
      try {
        const canvas = await window.html2canvas(card, { backgroundColor: '#ffffff', scale: 2 });
        const link = document.createElement('a');
        const tanggal = new Date().toISOString().slice(0, 10);
        link.download = `order-produksi-${produk.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${tanggal}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        alert('Gagal membuat gambar: ' + e.message);
      }
    });
  });
  const btnSimpanKartu = document.getElementById('btnSimpanKartuProduksi');
  if (btnSimpanKartu) btnSimpanKartu.addEventListener('click', async () => {
    STATE.produksiOverrideQty = STATE.produksiOverrideQty || {};
    container.querySelectorAll('.inp-kartu-qty').forEach(inp => {
      const kunci = inp.dataset.kunci;
      const sistem = Number(inp.dataset.sistem);
      const nilai = Number(inp.value) || 0;
      if (nilai === sistem) delete STATE.produksiOverrideQty[kunci];
      else STATE.produksiOverrideQty[kunci] = nilai;
    });
    const msg = document.getElementById('kartuProduksiMsg');
    await withSaving(msg, 'Qty produksi tersimpan.', async () => { await saveState(); });
    setTimeout(() => renderProduksi(container), 700);
  });
  const btnResetKartu = document.getElementById('btnResetKartuProduksi');
  if (btnResetKartu) btnResetKartu.addEventListener('click', async () => {
    if (!confirm('Hapus SEMUA angka override manual di kartu Order Produksi, kembali ke saran sistem?')) return;
    STATE.produksiOverrideQty = {};
    await saveState();
    renderProduksi(container);
  });
}

function renderProduksi(container) {
  const groups = STATE.produksiStockRaw || [];
  const { rows: stockRows, warnings: mappingWarnings } = ratakanStokProduksi(groups, STATE.produksiStockMapping || { groups: {}, variants: {} });

  container.innerHTML = `
    <div class="panel" style="padding-bottom:0;">
      <div style="display:flex; gap:2px; border-bottom:1px solid var(--line); flex-wrap:wrap;">
        <button class="btn-subtab ${produksiSubTab === 'stok' ? 'active' : ''}" data-subtab-produksi="stok">Stok &amp; Pemetaan</button>
        <button class="btn-subtab ${produksiSubTab === 'wip' ? 'active' : ''}" data-subtab-produksi="wip">Sedang Dijahit (WIP)</button>
        <button class="btn-subtab ${produksiSubTab === 'po' ? 'active' : ''}" data-subtab-produksi="po">PO (Pre-Order)</button>
        <button class="btn-subtab ${produksiSubTab === 'rekomendasi' ? 'active' : ''}" data-subtab-produksi="rekomendasi">Rekomendasi Produksi</button>
      </div>
    </div>
    ${produksiSubTab === 'stok' ? htmlProduksiStok(groups, stockRows, mappingWarnings) : ''}
    ${produksiSubTab === 'wip' ? htmlProduksiWip() : ''}
    ${produksiSubTab === 'po' ? htmlProduksiPO() : ''}
    ${produksiSubTab === 'rekomendasi' ? htmlProduksiRekomendasi() : ''}
  `;

  container.querySelectorAll('[data-subtab-produksi]').forEach(btn => {
    btn.addEventListener('click', () => { produksiSubTab = btn.dataset.subtabProduksi; renderProduksi(container); });
  });

  if (produksiSubTab === 'stok') attachListenersProduksiStok(container);
  if (produksiSubTab === 'wip') attachListenersProduksiWip(container);
  if (produksiSubTab === 'po') attachListenersProduksiPO(container);
  if (produksiSubTab === 'rekomendasi') attachListenersProduksiRekomendasi(container);
}

const renderers = { master: renderMaster, kontrak: renderKontrak, produksi: renderProduksi, import: renderImport, database: renderDatabase, pelanggan: renderPelanggan, invoice: renderInvoiceTab, laporan: renderLaporan, ads: renderAds, opex: renderOpex, alokasi: renderAlokasiProfit, pnl: renderPnl, dashboard: renderDashboard, gaji: renderGaji };
function switchTab(tab) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderers[tab](document.getElementById('app'));
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); // closest(), bukan tagName langsung -- tombol menu sidebar sekarang
                                            // berisi <svg>/<span> ikon+label di dalamnya, jadi klik bisa kena child itu
  if (btn && !btn.disabled) {
    switchTab(btn.dataset.tab);
    closeSidebar(); // di mobile, tutup sidebar begitu pilih menu
  }
});

/* Sidebar mobile: toggle hamburger + overlay */
function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }
document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

  try {
    setupTokenClient();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="panel"><div class="status-box show err">Gagal memuat Google Sign-In: ${e.message}</div></div>`;
    return;
  }
  renderGate();
};
