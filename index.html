<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outmark OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16181D; --paper: #F5F4F0; --surface: #FFFFFF; --line: #D8D6CE;
    --ok: #2E6B4F; --err: #A83A2E; --accent: #3457D5; --ink-soft: #6B6A63;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 90px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 6px; flex-wrap: wrap; gap: 10px; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; }
  .auth-status { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-align: right; }
  .auth-status .email { color: var(--ok); }
  .auth-status button { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; margin-top: 4px; }

  nav.tabs { display: flex; gap: 2px; margin: 18px 0 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav.tabs button { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; background: none; border: none; padding: 10px 14px; cursor: pointer; color: var(--ink-soft); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  nav.tabs button:disabled { opacity: 0.35; cursor: not-allowed; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; margin: 0 0 6px; }
  .panel .desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.5; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-soft); }
  input, select { font-family: 'Inter', sans-serif; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 3px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  .btn { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; border: none; border-radius: 3px; padding: 11px 18px; cursor: pointer; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--accent); }
  .btn-primary:disabled { background: #B8B6AC; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); font-size: 12.5px; padding: 7px 12px; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-soft); text-align: left; border-bottom: 2px solid var(--ink); padding: 8px 6px; }
  table.data td { padding: 9px 6px; border-bottom: 1px solid var(--line); }
  .pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; padding: 2px 8px; border-radius: 20px; background: var(--line); color: var(--ink-soft); }
  .pill.ok { background: #E3EFE8; color: var(--ok); }
  .pill.off { background: #F3E5E2; color: var(--err); }

  .status-box { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 10px 12px; border-radius: 3px; margin-top: 10px; display: none; }
  .status-box.show { display: block; }
  .status-box.ok { background: #EEF3EC; color: var(--ok); border: 1px solid #C9D8C4; }
  .status-box.err { background: #FBEDE9; color: var(--err); border: 1px solid #E8C2B8; }
  .status-box.info { background: #F2EEE0; color: var(--ink-soft); border: 1px solid var(--line); }

  .empty-note { text-align: center; padding: 30px; color: var(--ink-soft); font-size: 13px; border: 1.5px dashed var(--line); border-radius: 3px; }
  .gate { text-align: center; padding: 80px 20px; }
  .gate .wordmark { font-size: 34px; margin-bottom: 6px; }
  .gate p { color: var(--ink-soft); font-size: 14px; margin-bottom: 24px; }
  .gate button { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--paper); border: none; border-radius: 3px; padding: 13px 26px; cursor: pointer; }
  .loading-wrap { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  button.icon-del { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 13px; }
  button.icon-del:hover { color: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="wordmark">Outmark <span style="color:var(--accent)">OS</span></div>
    <div class="auth-status" id="authStatus"></div>
  </header>
  <nav class="tabs" id="tabs" style="display:none;">
    <button data-tab="master" class="active">Data Master</button>
    <button data-tab="kontrak">Produk &amp; Kontrak</button>
    <button data-tab="import" disabled title="Segera">Import Mingguan</button>
  </nav>
  <div id="app"></div>
</div>

<script>
const CLIENT_ID = '534061439425-cl0savvhsflp1ub4tgcnf8uih4b2iqso.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const STATE_FILENAME = 'outmark-os-state.json';

/* =========================================================================
   STATE
   ========================================================================= */
let STATE = {
  capitalPartners: [],  // {id, nama, kode2, kontak, tanggalBergabung, status}
  stores: [],            // {id, nama, platform, status}
  products: [],           // {id, nama, brand, prefix, hargaKonveksi: {SIZE: [{harga,tanggal,sumber}]}}
  contracts: [],           // {id, produk, capitalPartnerId, kodeKontrak, tanggalMasuk, stockAwal, stockAkhir, hargaModalPcs, nilaiMargin, status}
  colorCodeMap: {},         // {kode3huruf: namaWarna}
  pembagiPctManual: {},      // override manual (opsional): {produk: {kode2: pct}}
};
let stateFileId = null;
let accessToken = null;

function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* =========================================================================
   LOGIKA INTI (dipindahkan dari versi sebelumnya, sudah tervalidasi)
   ========================================================================= */
const SIZE_CODE_MAP = { '01':'S','02':'M','03':'L','04':'XL','05':'XXL','06':'3XL','07':'4XL','08':'5XL','09':'6XL','10':'7XL' };
const SIZES = ['S','M','L','XL','XXL','3XL','4XL','5XL','6XL','7XL'];
const SIZE_TOKENS = new Set(['S','M','L','XL','XXL','2XL','3XL','4XL','5XL','6XL','7XL','8XL']);
const CAPITAL_PARTNER_PRODUCT_ALIAS = { 'FORSAKERWB': 'FORSAKERVOL2' }; // FORSAKERWB berbagi pool modal dgn FORSAKERVOL2 (ditemukan dari data nyata)
function capitalPartnerProduk(produk) { return CAPITAL_PARTNER_PRODUCT_ALIAS[produk] || produk; }

function findProduct(nama) { return STATE.products.find(p => p.nama === nama); }
function findPartnerByKode2(kode2) { return STATE.capitalPartners.find(p => p.kode2 === kode2); }
function findPartnerById(id) { return STATE.capitalPartners.find(p => p.id === id); }

function getCurrentHarga(produkNama, size) {
  const p = findProduct(produkNama);
  if (!p || !p.hargaKonveksi || !p.hargaKonveksi[size] || !p.hargaKonveksi[size].length) return null;
  const hist = p.hargaKonveksi[size];
  return hist[hist.length - 1].harga;
}
function addHargaHistory(produkNama, size, harga, sumber) {
  const p = findProduct(produkNama);
  if (!p) return;
  p.hargaKonveksi = p.hargaKonveksi || {};
  p.hargaKonveksi[size] = p.hargaKonveksi[size] || [];
  p.hargaKonveksi[size].push({ harga, tanggal: new Date().toISOString(), sumber: sumber || 'manual' });
}

// Hitung persentase Pembagi Qty SW dari besaran modal kontrak AKTIF (DANA BELUM CAIR) saat ini, per produk (setelah alias)
function computePembagiPct(produkAsli) {
  const produk = capitalPartnerProduk(produkAsli);
  if (STATE.pembagiPctManual[produk]) return STATE.pembagiPctManual[produk]; // manual override menang
  const active = STATE.contracts.filter(c => capitalPartnerProduk(c.produk) === produk && c.status === 'DANA BELUM CAIR');
  const capitalByPartner = {};
  active.forEach(c => {
    const partner = findPartnerById(c.capitalPartnerId);
    if (!partner) return;
    const modal = (c.stockAwal || 0) * (c.hargaModalPcs || 0);
    capitalByPartner[partner.kode2] = (capitalByPartner[partner.kode2] || 0) + modal;
  });
  const total = Object.values(capitalByPartner).reduce((a,b) => a+b, 0);
  if (total <= 0) return {};
  const pct = {};
  Object.entries(capitalByPartner).forEach(([k,v]) => { pct[k] = v / total; });
  return pct;
}

// Kontrak aktif (FIFO) milik 1 capital partner utk 1 produk -- yg paling awal tanggal masuk dgn status DANA BELUM CAIR
function activeContractFor(produkAsli, capitalPartnerId) {
  const list = STATE.contracts
    .filter(c => c.produk === produkAsli && c.capitalPartnerId === capitalPartnerId && c.status === 'DANA BELUM CAIR')
    .sort((a,b) => new Date(a.tanggalMasuk) - new Date(b.tanggalMasuk));
  return list[0] || null;
}

function parseWarna(variasiText) {
  if (!variasiText) return null;
  const parts = String(variasiText).split(',').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  const first = parts[0].toUpperCase();
  if (SIZE_TOKENS.has(first)) return null;
  return parts[0];
}
function deriveWarnaFromSku(sku) {
  if (!sku || String(sku).length < 6) return null;
  const kode = String(sku).toUpperCase().slice(3,6);
  return STATE.colorCodeMap[kode] || null;
}
function lookupHargaKonveksiBySku(sku) {
  if (!sku) return null;
  const skuUpper = String(sku).toUpperCase();
  const prefix = skuUpper.slice(0,3);
  const sizeCode = skuUpper.slice(-2);
  const p = STATE.products.find(pr => pr.prefix === prefix);
  const ukuran = SIZE_CODE_MAP[sizeCode];
  if (p && ukuran) return getCurrentHarga(p.nama, ukuran);
  return null;
}

/* =========================================================================
   GOOGLE DRIVE STORAGE LAYER
   ========================================================================= */
async function driveApi(path, opts) {
  opts = opts || {};
  const res = await fetch('https://www.googleapis.com' + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + accessToken, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error(`Drive API ${res.status}: ${await res.text()}`);
  return res;
}

async function getOrCreateStateFile() {
  // cari file yg sudah pernah dibuat app ini (drive.file scope: cuma file yg dibuat app ini yg kelihatan)
  const q = encodeURIComponent(`name='${STATE_FILENAME}' and trashed=false`);
  const listRes = await driveApi(`/drive/v3/files?q=${q}&fields=files(id,name)`);
  const list = await listRes.json();
  if (list.files && list.files.length) {
    return list.files[0].id;
  }
  // belum ada -> buat baru, isi kosong
  const initialContent = JSON.stringify({ capitalPartners: [], stores: [] });
  const metadata = { name: STATE_FILENAME, mimeType: 'application/json' };
  const boundary = '-------outmarkstate';
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
               `--${boundary}\r\nContent-Type: application/json\r\n\r\n${initialContent}\r\n--${boundary}--`;
  const createRes = await driveApi('/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body,
  });
  const created = await createRes.json();
  return created.id;
}

async function loadState() {
  stateFileId = await getOrCreateStateFile();
  const res = await driveApi(`/drive/v3/files/${stateFileId}?alt=media`);
  const text = await res.text();
  const loaded = text ? JSON.parse(text) : {};
  // DEFAULT_STATE mencakup SEMUA field yg pernah ada -- supaya file lama (dari sebelum field baru ditambahkan)
  // tidak jadi undefined pas dimuat. Tiap kali nambah field baru ke STATE, tambahkan juga di sini.
  const DEFAULT_STATE = { capitalPartners: [], stores: [], products: [], contracts: [], colorCodeMap: {}, pembagiPctManual: {} };
  STATE = Object.assign({}, DEFAULT_STATE, loaded);
}

async function saveState() {
  const body = JSON.stringify(STATE);
  await driveApi(`/upload/drive/v3/files/${stateFileId}?uploadType=media`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body,
  });
}

/* =========================================================================
   AUTH
   ========================================================================= */
let tokenClient;
let authReady = false;

function setupTokenClient() {
  if (typeof google === 'undefined' || !google.accounts) throw new Error('Library Google gagal dimuat.');
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: (resp) => {
      if (resp.error) { onLoginError(new Error(resp.error)); return; }
      accessToken = resp.access_token;
      onLoggedIn();
    },
    error_callback: (err) => onLoginError(new Error(err.message || 'Login dibatalkan/gagal.')),
  });
  authReady = true;
}

function login() {
  if (!authReady) { onLoginError(new Error('Google Sign-In belum siap, coba refresh halaman.')); return; }
  tokenClient.requestAccessToken();
}

function onLoginError(e) {
  const s = document.getElementById('gateStatus');
  if (s) { s.className = 'status-box show err'; s.textContent = 'Gagal: ' + e.message; }
  const btn = document.getElementById('btnGateLogin');
  if (btn) { btn.disabled = false; btn.textContent = 'Login dengan Google'; }
}

/* =========================================================================
   RENDER: GATE (belum login)
   ========================================================================= */
function renderGate() {
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="gate">
      <div class="wordmark">Outmark <span style="color:var(--accent)">OS</span></div>
      <p>Masuk dengan akun Google untuk mulai. Data kamu tersimpan di Google Drive kamu sendiri.</p>
      <button id="btnGateLogin">Login dengan Google</button>
      <div class="status-box" id="gateStatus"></div>
    </div>
  `;
  document.getElementById('btnGateLogin').addEventListener('click', () => {
    const btn = document.getElementById('btnGateLogin');
    btn.disabled = true; btn.textContent = 'Menunggu login...';
    login();
  });
}

async function onLoggedIn() {
  document.getElementById('authStatus').innerHTML = `<div class="email">● Tersambung ke Google Drive</div><button id="btnLogout">Keluar</button>`;
  document.getElementById('app').innerHTML = `<div class="loading-wrap">Memuat data dari Google Drive...</div>`;
  try {
    await loadState();
    document.getElementById('tabs').style.display = 'flex';
    switchTab('master');
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="panel"><div class="status-box show err">Gagal memuat data: ${e.message}</div></div>`;
  }
  document.getElementById('btnLogout').addEventListener('click', () => { location.reload(); });
}

/* =========================================================================
   TAB: DATA MASTER
   ========================================================================= */
function renderMaster(container) {
  container.innerHTML = `
    <div class="panel">
      <h2>Muat dari File UJUSO <span class="pill">opsional</span></h2>
      <div class="desc">Isi otomatis Capital Partner (dari SYIRKAH WAKALAH) dan Toko (dari kolom SUMBER di PENJUALAN) supaya tidak perlu ketik manual satu-satu. Yang sudah ada tidak akan ditimpa/dobel.</div>
      <input type="file" id="fileMigrate" accept=".xlsx" style="display:none">
      <button class="btn btn-ghost" id="btnPickFile">Pilih File UJUSO</button>
      <span id="fileMigrateLabel" style="font-size:12px; color:var(--ink-soft); margin-left:8px;">Belum ada file dipilih</span>
      <br><button class="btn btn-primary" id="btnMigrate" style="margin-top:10px;" disabled>Proses Migrasi</button>
      <div class="status-box" id="migrateMsg"></div>
    </div>

    <div class="panel">
      <h2>Capital Partner</h2>
      <div class="desc">Daftar investor. Kode 2 huruf didaftarkan sekali di sini, dicek otomatis supaya tidak tabrakan dengan yang sudah dipakai.</div>
      <form id="formPartner">
        <div class="grid2">
          <div class="field"><label>Nama Lengkap</label><input type="text" id="p_nama" required placeholder="mis. IDA SADIDAH"></div>
          <div class="field"><label>Kode 2 Huruf</label><input type="text" id="p_kode" required maxlength="2" placeholder="mis. ID" style="text-transform:uppercase;"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Kontak (WA/Telpon)</label><input type="text" id="p_kontak" placeholder="mis. 0812xxxxxxx"></div>
          <div class="field"><label>Tanggal Bergabung</label><input type="date" id="p_tanggal"></div>
        </div>
        <button type="submit" class="btn btn-primary">+ Tambah Capital Partner</button>
        <div class="status-box" id="partnerMsg"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Daftar Capital Partner</h2>
      <div id="partnerList"></div>
    </div>

    <div class="panel">
      <h2>Setup Toko</h2>
      <div class="desc">Identitas tiap toko (bisa lebih dari 1 toko per platform, mis. 2 toko Shopee).</div>
      <form id="formStore">
        <div class="grid2">
          <div class="field"><label>Nama Toko</label><input type="text" id="s_nama" required placeholder='mis. "Shopee - Toko Utama"'></div>
          <div class="field"><label>Platform</label>
            <select id="s_platform" required>
              <option value="">Pilih platform</option>
              <option value="Shopee">Shopee</option>
              <option value="TikTok">TikTok</option>
              <option value="Tokopedia">Tokopedia</option>
              <option value="Lazada">Lazada</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">+ Tambah Toko</button>
        <div class="status-box" id="storeMsg"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Daftar Toko</h2>
      <div id="storeList"></div>
    </div>
  `;

  renderPartnerList(document.getElementById('partnerList'));
  renderStoreList(document.getElementById('storeList'));

  document.getElementById('btnPickFile').addEventListener('click', () => document.getElementById('fileMigrate').click());
  let pendingMigrateFile = null;
  document.getElementById('fileMigrate').addEventListener('change', (e) => {
    if (e.target.files[0]) {
      pendingMigrateFile = e.target.files[0];
      document.getElementById('fileMigrateLabel').textContent = pendingMigrateFile.name;
      document.getElementById('btnMigrate').disabled = false;
    }
  });
  document.getElementById('btnMigrate').addEventListener('click', async () => {
    const msg = document.getElementById('migrateMsg');
    if (!pendingMigrateFile) return;
    showMsg(msg, 'info', 'Membaca file...');
    try {
      const buf = await pendingMigrateFile.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const XU = XLSX.utils;

      let nPartnerAdded = 0, nStoreAdded = 0;

      // ---- Capital Partner dari SYIRKAH WAKALAH ----
      const wsSW = wb.Sheets['SYIRKAH WAKALAH'];
      if (wsSW) {
        const rows = XU.sheet_to_json(wsSW, { header: 1 });
        const header = rows[0];
        const iNama = header.indexOf('NAMA INVESTOR');
        const iKode = header.indexOf('KODE INVESTOR');
        const pairs = {}; // kode2 -> nama
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (row && row[iKode] && row[iNama]) {
            const kode2 = String(row[iKode]).slice(0, 2).toUpperCase();
            if (!pairs[kode2]) pairs[kode2] = String(row[iNama]).toUpperCase();
          }
        }
        Object.entries(pairs).forEach(([kode2, nama]) => {
          if (!STATE.capitalPartners.some(p => p.kode2 === kode2)) {
            STATE.capitalPartners.push({ id: uid('cp'), nama, kode2, kontak: '', tanggalBergabung: null, status: 'Aktif' });
            nPartnerAdded++;
          }
        });
      }

      // ---- Toko dari kolom SUMBER di PENJUALAN ----
      const wsPJ = wb.Sheets['PENJUALAN'];
      if (wsPJ) {
        const rows = XU.sheet_to_json(wsPJ, { header: 1 });
        const header = rows[0];
        const iSumber = header.indexOf('SUMBER');
        const sumberSet = new Set();
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (row && row[iSumber]) sumberSet.add(String(row[iSumber]).trim());
        }
        const platformGuess = (s) => {
          const up = s.toUpperCase();
          if (up.includes('SHOPEE')) return 'Shopee';
          if (up.includes('TIKTOK')) return 'TikTok';
          if (up.includes('TOKPED') || up.includes('TOKOPEDIA')) return 'Tokopedia';
          if (up.includes('LAZADA')) return 'Lazada';
          return 'Lainnya';
        };
        sumberSet.forEach(nama => {
          if (!STATE.stores.some(s => s.nama.toUpperCase() === nama.toUpperCase())) {
            STATE.stores.push({ id: uid('st'), nama, platform: platformGuess(nama), status: 'Aktif' });
            nStoreAdded++;
          }
        });
      }

      // ---- Produk (dari PENJUALAN: prefix SKU, brand, harga konveksi BE:BF) ----
      let nProductAdded = 0, nColorAdded = 0;
      if (wsPJ) {
        const pjRows = XU.sheet_to_json(wsPJ, { header: 1 });
        const pjHeader = pjRows[0];
        const counts = {}; const brandCounts = {}; const colorCounts = {};
        const iSKU = pjHeader.indexOf('No. SKU') >= 0 ? pjHeader.indexOf('No. SKU') : pjHeader.indexOf('No SKU');
        const iBrand = pjHeader.indexOf('BRAND');
        const iNamaBarang = pjHeader.indexOf('Nama Barang');
        const iWarnaCol = pjHeader.indexOf('Warna');
        for (let r = 1; r < pjRows.length; r++) {
          const row = pjRows[r];
          if (!row) continue;
          const sku = row[iSKU], nama = row[iNamaBarang], brand = row[iBrand], warnaVal = row[iWarnaCol];
          if (sku && nama) { const prefix = String(sku).slice(0,3).toUpperCase(); counts[prefix] = counts[prefix] || {}; counts[prefix][nama] = (counts[prefix][nama]||0)+1; }
          if (nama && brand) { brandCounts[nama] = brandCounts[nama] || {}; brandCounts[nama][brand] = (brandCounts[nama][brand]||0)+1; }
          if (sku && warnaVal && String(sku).length >= 6) {
            const kw = String(sku).slice(3,6).toUpperCase();
            colorCounts[kw] = colorCounts[kw] || {}; colorCounts[kw][String(warnaVal).toUpperCase()] = (colorCounts[kw][String(warnaVal).toUpperCase()]||0)+1;
          }
        }
        const majority = (obj) => Object.entries(obj).reduce((best,[k,n]) => n > (best[1]||-1) ? [k,n] : best, [null,-1])[0];
        Object.entries(colorCounts).forEach(([kode,obj]) => { if (!STATE.colorCodeMap[kode]) { STATE.colorCodeMap[kode] = majority(obj); nColorAdded++; } });

        const h2 = pjRows[1] || [];
        const iModel = h2.indexOf('MODEL'), iHarga = h2.indexOf('HARGA');
        const bePriceByKodeProduk = {};
        if (iModel >= 0 && iHarga >= 0) {
          for (let r = 2; r < pjRows.length; r++) {
            const row = pjRows[r];
            if (row && row[iModel] && typeof row[iHarga] === 'number') bePriceByKodeProduk[String(row[iModel]).toUpperCase()] = row[iHarga];
          }
        }
        Object.entries(counts).forEach(([prefix, obj]) => {
          const nama = majority(obj);
          if (STATE.products.some(p => p.nama === nama)) return;
          const brand = majority(brandCounts[nama] || {}) || '';
          const hargaKonveksi = {};
          SIZES.forEach(s => {
            const h = bePriceByKodeProduk[(nama + s).toUpperCase()];
            if (h != null) hargaKonveksi[s] = [{ harga: h, tanggal: null, sumber: 'migrasi' }];
          });
          STATE.products.push({ id: uid('pr'), nama, brand, prefix, hargaKonveksi });
          nProductAdded++;
        });
      }

      // ---- Kontrak (dari SYIRKAH WAKALAH, ditautkan ke Capital Partner via kode2) ----
      let nContractAdded = 0;
      if (wsSW) {
        const swRows = XU.sheet_to_json(wsSW, { header: 1 });
        const swHeader = swRows[0];
        const iProduk = swHeader.indexOf('PRODUK'), iKodeInv = swHeader.indexOf('KODE INVESTOR');
        const iTglMasuk = swHeader.indexOf('TANGGAL MASUK'), iStockAwal = swHeader.indexOf('STOCK AWAL'), iStockAkhir = swHeader.indexOf('STOCK AKHIR');
        const iHargaModal = swHeader.indexOf('HARGA MODAL/PCS'), iNilaiMargin = swHeader.indexOf('NILAI MARGIN');
        const statusIdxs = swHeader.reduce((acc,h,i) => { if (h==='STATUS') acc.push(i); return acc; }, []);
        const iStatus = statusIdxs[0];
        const existingKode = new Set(STATE.contracts.map(c => c.kodeKontrak));
        for (let r = 1; r < swRows.length; r++) {
          const row = swRows[r];
          if (!row || !row[iProduk] || !row[iKodeInv]) continue;
          const kodeKontrak = String(row[iKodeInv]);
          if (existingKode.has(kodeKontrak)) continue;
          const kode2 = kodeKontrak.slice(0,2).toUpperCase();
          const partner = findPartnerByKode2(kode2);
          if (!partner) continue;
          let tglMasuk = null;
          if (row[iTglMasuk]) { try { const d = new Date(row[iTglMasuk]); if (!isNaN(d)) tglMasuk = d.toISOString(); } catch(e){} }
          STATE.contracts.push({
            id: uid('ct'), produk: row[iProduk], capitalPartnerId: partner.id, kodeKontrak,
            tanggalMasuk: tglMasuk, stockAwal: Number(row[iStockAwal])||0, stockAkhir: Number(row[iStockAkhir])||0,
            hargaModalPcs: Number(row[iHargaModal])||0, nilaiMargin: Number(row[iNilaiMargin])||0,
            status: row[iStatus] || 'DANA SUDAH CAIR',
          });
          existingKode.add(kodeKontrak);
          nContractAdded++;
        }
      }

      await saveState();
      showMsg(msg, 'ok', `Selesai: ${nPartnerAdded} Capital Partner, ${nStoreAdded} toko, ${nProductAdded} produk, ${nColorAdded} kode warna, ${nContractAdded} kontrak ditambahkan.`);
      renderPartnerList(document.getElementById('partnerList'));
      renderStoreList(document.getElementById('storeList'));
    } catch (e) {
      showMsg(msg, 'err', 'Gagal migrasi: ' + e.message);
    }
  });

  document.getElementById('formPartner').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('partnerMsg');
    const nama = document.getElementById('p_nama').value.trim().toUpperCase();
    const kode2 = document.getElementById('p_kode').value.trim().toUpperCase();
    const kontak = document.getElementById('p_kontak').value.trim();
    const tanggalBergabung = document.getElementById('p_tanggal').value || null;

    if (kode2.length !== 2) { showMsg(msg, 'err', 'Kode harus persis 2 huruf.'); return; }
    if (STATE.capitalPartners.some(p => p.kode2 === kode2)) {
      showMsg(msg, 'err', `Kode "${kode2}" sudah dipakai oleh ${STATE.capitalPartners.find(p=>p.kode2===kode2).nama} -- pakai kode lain.`);
      return;
    }
    STATE.capitalPartners.push({ id: uid('cp'), nama, kode2, kontak, tanggalBergabung, status: 'Aktif' });
    await withSaving(msg, 'Capital Partner ditambahkan.', async () => {
      await saveState();
      document.getElementById('formPartner').reset();
      renderPartnerList(document.getElementById('partnerList'));
    });
  });

  document.getElementById('formStore').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('storeMsg');
    const nama = document.getElementById('s_nama').value.trim();
    const platform = document.getElementById('s_platform').value;
    if (STATE.stores.some(s => s.nama.toLowerCase() === nama.toLowerCase())) {
      showMsg(msg, 'err', 'Nama toko ini sudah ada.'); return;
    }
    STATE.stores.push({ id: uid('st'), nama, platform, status: 'Aktif' });
    await withSaving(msg, 'Toko ditambahkan.', async () => {
      await saveState();
      document.getElementById('formStore').reset();
      renderStoreList(document.getElementById('storeList'));
    });
  });
}

function showMsg(el, type, text) { el.className = 'status-box show ' + type; el.textContent = text; }

async function withSaving(msgEl, successText, fn) {
  showMsg(msgEl, 'info', 'Menyimpan ke Google Drive...');
  try {
    await fn();
    showMsg(msgEl, 'ok', successText);
  } catch (e) {
    showMsg(msgEl, 'err', 'Gagal simpan: ' + e.message);
  }
}

function renderPartnerList(el) {
  if (!STATE.capitalPartners.length) { el.innerHTML = '<div class="empty-note">Belum ada Capital Partner terdaftar.</div>'; return; }
  el.innerHTML = `
    <table class="data">
      <thead><tr><th>Kode</th><th>Nama</th><th>Kontak</th><th>Bergabung</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${STATE.capitalPartners.map(p => `<tr>
          <td><b>${p.kode2}</b></td><td>${p.nama}</td><td>${p.kontak || '-'}</td>
          <td>${p.tanggalBergabung ? new Date(p.tanggalBergabung).toLocaleDateString('id-ID') : '-'}</td>
          <td><span class="pill ${p.status==='Aktif'?'ok':'off'}">${p.status}</span></td>
          <td><button class="icon-del" data-del-partner="${p.id}" title="Hapus">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('[data-del-partner]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus Capital Partner ini? (Hanya hapus dari daftar master, tidak menghapus kontrak yang sudah ada)')) return;
      STATE.capitalPartners = STATE.capitalPartners.filter(p => p.id !== btn.dataset.delPartner);
      await saveState();
      renderPartnerList(el);
    });
  });
}

function renderStoreList(el) {
  if (!STATE.stores.length) { el.innerHTML = '<div class="empty-note">Belum ada toko terdaftar.</div>'; return; }
  el.innerHTML = `
    <table class="data">
      <thead><tr><th>Nama Toko</th><th>Platform</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${STATE.stores.map(s => `<tr>
          <td>${s.nama}</td><td>${s.platform}</td>
          <td><span class="pill ${s.status==='Aktif'?'ok':'off'}">${s.status}</span></td>
          <td><button class="icon-del" data-del-store="${s.id}" title="Hapus">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('[data-del-store]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus toko ini dari daftar?')) return;
      STATE.stores = STATE.stores.filter(s => s.id !== btn.dataset.delStore);
      await saveState();
      renderStoreList(el);
    });
  });
}

/* =========================================================================
   TAB: PRODUK & KONTRAK (versi awal -- lihat hasil migrasi, CRUD lengkap menyusul)
   ========================================================================= */
function renderKontrak(container) {
  const activeContracts = STATE.contracts.filter(c => c.status === 'DANA BELUM CAIR')
    .sort((a,b) => (a.produk||'').localeCompare(b.produk||'') || new Date(a.tanggalMasuk) - new Date(b.tanggalMasuk));

  container.innerHTML = `
    <div class="panel">
      <h2>Produk Terdaftar <span class="pill">${STATE.products.length}</span></h2>
      ${!STATE.products.length ? '<div class="empty-note">Belum ada produk. Migrasi dari file UJUSO di tab Data Master.</div>' : `
      <table class="data">
        <thead><tr><th>Nama Produk</th><th>Brand</th><th>Prefix</th><th class="num">Size dgn Harga</th></tr></thead>
        <tbody>
          ${STATE.products.map(p => {
            const nSize = SIZES.filter(s => p.hargaKonveksi && p.hargaKonveksi[s] && p.hargaKonveksi[s].length).length;
            return `<tr><td>${p.nama}</td><td>${p.brand||'-'}</td><td>${p.prefix}</td><td class="num">${nSize}/${SIZES.length}</td></tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="panel">
      <h2>Kontrak Aktif (DANA BELUM CAIR) <span class="pill">${activeContracts.length}</span></h2>
      ${!activeContracts.length ? '<div class="empty-note">Belum ada kontrak aktif.</div>' : `
      <table class="data">
        <thead><tr><th>Produk</th><th>Kode Kontrak</th><th>Capital Partner</th><th>Tgl Masuk</th><th class="num">Stock Akhir</th><th class="num">Nilai Margin</th></tr></thead>
        <tbody>
          ${activeContracts.map(c => {
            const partner = findPartnerById(c.capitalPartnerId);
            return `<tr>
              <td>${c.produk}</td><td>${c.kodeKontrak}</td><td>${partner ? partner.nama : '(tidak ditemukan)'}</td>
              <td>${c.tanggalMasuk ? new Date(c.tanggalMasuk).toLocaleDateString('id-ID') : '-'}</td>
              <td class="num">${c.stockAkhir}</td><td class="num">${fmtRp(c.nilaiMargin)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="panel">
      <h2>Persentase Pembagi Qty SW (Otomatis dari Modal)</h2>
      <div id="pctView"></div>
    </div>

    <div class="panel">
      <div class="desc">Form tambah/tutup kontrak manual, edit harga per size, dan kode warna menyusul di update berikutnya.</div>
    </div>
  `;

  const produkList = [...new Set(STATE.contracts.map(c => c.produk))].sort();
  const pctEl = document.getElementById('pctView');
  if (!produkList.length) { pctEl.innerHTML = '<div class="empty-note">Belum ada kontrak.</div>'; }
  else {
    pctEl.innerHTML = produkList.map(p => {
      const pct = computePembagiPct(p);
      if (!Object.keys(pct).length) return '';
      return `<div style="margin-bottom:10px;"><b>${p}</b>: ${Object.entries(pct).map(([k,v]) => `${k} ${(v*100).toFixed(1)}%`).join(' &middot; ')}</div>`;
    }).join('');
  }
}
function fmtRp(n) { if (n==null||isNaN(n)) return '-'; return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }

/* =========================================================================
   NAV
   ========================================================================= */
const renderers = { master: renderMaster, kontrak: renderKontrak };
function switchTab(tab) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderers[tab](document.getElementById('app'));
}
document.getElementById('tabs').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' && !e.target.disabled) switchTab(e.target.dataset.tab);
});

/* =========================================================================
   INIT
   ========================================================================= */
window.onload = function init() {
  try {
    setupTokenClient();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="panel"><div class="status-box show err">Gagal memuat Google Sign-In: ${e.message}</div></div>`;
    return;
  }
  renderGate();
};
</script>
