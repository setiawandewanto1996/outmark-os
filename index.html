// Kop surat Outmark dipakai bersama Invoice & Kwitansi (replikasi desain resmi Outmark Invoice Manager,
// dicocokkan 2026-11-19 dari contoh PDF asli "INV/2026/11/005 - Alifa - Procurement" yg Setiawan kirim):
// logo "Outmark." (kotak oranye + wordmark) kiri, "<LABEL> : <nomor>" kanan, lalu blok alamat perusahaan.
// Watermark "Outmark." diulang sbg CSS background-image pada .invoice-print-page (lihat blok CSS terkait) --
// BUKAN lagi elemen DOM terpisah (pendekatan DOM-text lama dihapus 2026-11-19 lanjutan x2, setelah
// Setiawan kirim contoh PDF baru "INV-2026-11-007" yg membuktikan watermark asli justru DIPUTAR/miring,
// bukan lurus seperti dugaan sebelumnya -- lihat catatan CSS .invoice-print-page utk detail pengukuran).

function renderDokumenLetterheadHtml(labelNomor, nomor) {
  return `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;">
      <img src="${LOGO_OUTMARK_DATAURI}" alt="Outmark" style="height:40px; width:auto; display:block;">
      <div style="font-size:15px; font-weight:800; white-space:nowrap;">${labelNomor} : ${nomor}</div>
    </div>
    <div style="margin-bottom:18px;">
      <div style="font-weight:700; text-decoration:underline;">PT. Outmark Global Industri</div>
      <div style="font-size:12px; color:#333;">Jalan Permana Timur Blok D7 No. 28B</div>
      <div style="font-size:12px; color:#333;">Kec. Cimahi Utara, Kota Cimahi, Prov. Jawa Barat</div>
    </div>
  `;
}

// Layout cetak A4 (dipakai lewat #invoicePrintArea + window.print(), lihat CSS @media print), dicocokkan
// 2026-11-19 ke contoh PDF asli Outmark Invoice Manager (lihat renderDokumenLetterheadHtml di atas).
// inv.tanpaTtdCap=true -> blok ttd/cap disembunyikan sepenuhnya ("tanpa ttd dan cap"). inv.ongkirMenyusul
// (tipe DP) -> baris Biaya Kirim diganti label "Menyusul di invoice pelunasan" (bukan Rp0 yg bisa
// disalahartikan sbg "tidak ada ongkir sama sekali"); invoice SETTLEMENT yg tertaut ke DP spt itu melabeli
// baris Biaya Kirim-nya "(dari invoice DP sebelumnya)". Nomor urut (kolom No.) BERJALAN TERUS lewat baris
// produk + Biaya Kirim + Diskon (persis spt contoh asli -- baris ringkasan Sub Total/Total Invoice/DP/Sisa
// TIDAK diberi nomor). Baris "Sub Total" di contoh asli = subtotal barang + ongkir (SEBELUM dikurangi
// diskon) -- ini murni tampilan cetak, TIDAK mengubah inv.subtotal/inv.grandTotal yg tersimpan di STATE.
function renderInvoicePrintHtml(inv) {
  const cust = STATE.customers.find(c => c.id === inv.customerId);
  const judulUtama = inv.tipe === 'DP' ? 'INVOICE DP' : inv.tipe === 'SETTLEMENT' ? 'INVOICE PELUNASAN' : 'INVOICE';
  const subJudul = inv.tipe === 'DP' ? 'DOWN PAYMENT / UANG MUKA' : inv.tipe === 'SETTLEMENT' ? 'SETTLEMENT / PELUNASAN' : '';

  let no = 0;
  const baris = [];
  (inv.items || []).forEach(it => {
    no++;
    baris.push(`<tr><td>${no}</td><td>${it.nama}</td><td>${it.warna || '-'}</td><td>${it.ukuran || '-'}</td><td class="num">${fmtRp(it.harga)}</td><td class="num">${it.qty}</td><td class="num">${fmtRp((it.harga || 0) * (it.qty || 0))}</td></tr>`);
  });

  const srcDp = inv.tipe === 'SETTLEMENT' && inv.settlementOfInvoiceId ? STATE.invoices.find(i => i.id === inv.settlementOfInvoiceId) : null;
  let ongkirUtkSubTotal = 0;
  if (inv.tipe === 'DP' && inv.ongkirMenyusul) {
    no++;
    baris.push(`<tr><td>${no}</td><td colspan="4" style="text-align:center;">Biaya Kirim</td><td class="num">-</td><td class="num">Menyusul di invoice pelunasan</td></tr>`);
  } else if (inv.ongkir) {
    no++;
    const labelOngkir = srcDp && srcDp.ongkirMenyusul ? 'Biaya Kirim (dari invoice DP sebelumnya)' : 'Biaya Kirim';
    baris.push(`<tr><td>${no}</td><td colspan="4" style="text-align:center;">${labelOngkir}</td><td class="num">-</td><td class="num">${fmtRp(inv.ongkir)}</td></tr>`);
    ongkirUtkSubTotal = inv.ongkir;
  }

  const totalQty = (inv.items || []).reduce((s, it) => s + (Number(it.qty) || 0), 0);
  const subtotalBarang = (inv.items || []).reduce((s, it) => s + (Number(it.harga) || 0) * (Number(it.qty) || 0), 0);
  baris.push(`<tr><td></td><td colspan="4" style="text-align:center;"><b>Sub Total</b></td><td class="num"><b>${totalQty}</b></td><td class="num"><b>${fmtRp(subtotalBarang + ongkirUtkSubTotal)}</b></td></tr>`);

  if (inv.potongan) {
    no++;
    const diskonObj = inv.diskonId ? STATE.diskon.find(d => d.id === inv.diskonId) : null;
    const labelDiskon = diskonObj ? ('Diskon - ' + diskonObj.nama) : 'Potongan';
    baris.push(`<tr><td>${no}</td><td colspan="4" style="text-align:center;">${labelDiskon}</td><td class="num">Diskon</td><td class="num">(${fmtRp(inv.potongan)})</td></tr>`);
  }

  baris.push(`<tr><td></td><td colspan="5" style="text-align:right;"><b>Total Invoice</b></td><td class="num" style="font-size:15px;"><b>${fmtRp(inv.grandTotal)}</b></td></tr>`);
  if (inv.tipe === 'DP') {
    baris.push(`<tr><td></td><td colspan="5" style="text-align:right;">DP / Uang Muka (${inv.dpPercent}%)</td><td class="num" style="font-size:15px;"><b>${fmtRp(inv.dpPaid)}</b></td></tr>`);
    baris.push(`<tr><td></td><td colspan="5" style="text-align:right;">Sisa Pembayaran</td><td class="num" style="font-size:15px;"><b>${fmtRp(inv.sisaBayar)}</b></td></tr>`);
  }

  return `
    <div class="invoice-print-page">
        ${renderDokumenLetterheadHtml('INVOICE', inv.nomor)}
        <div class="print-title-block" style="text-align:center; margin:22px 0 18px;">
          <div style="font-size:19px; font-weight:800;">${judulUtama}</div>
          ${subJudul ? `<div style="font-size:11px; letter-spacing:2px; font-weight:600; margin-top:3px;">${subJudul}</div>` : ''}
        </div>
        <table class="noborder" style="margin-bottom:16px;">
          <tr><td style="width:110px;">Tanggal</td><td>: ${fmtTanggalPanjang(inv.tanggal)}</td></tr>
          <tr><td>Kepada</td><td>: ${cust ? cust.nama : '-'}</td></tr>
          <tr><td>Alamat</td><td>: ${cust && cust.alamat ? cust.alamat : '-'}</td></tr>
          <tr><td>No Telepon</td><td>: ${cust && cust.noHp ? cust.noHp : '-'}</td></tr>
          ${inv.deskripsi ? `<tr><td>Deskripsi</td><td>: ${inv.deskripsi}</td></tr>` : ''}
        </table>
        <table style="margin-bottom:14px;">
          <thead><tr><th>No.</th><th>Produk</th><th>Warna</th><th>Size</th><th class="num">Harga</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
          <tbody>${baris.join('')}</tbody>
        </table>
        <div class="print-keep-block" style="display:flex; justify-content:space-between; align-items:flex-start; font-size:12px; margin-top:20px;">
          <div>
            Pembayaran dapat dilakukan melalui transfer:<br>
            <b>BANK BSI SYARIAH</b><br>7321305916<br>PT OUTMARK INDUSTRI
          </div>
          ${inv.tanpaTtdCap ? '' : `
          <div style="text-align:center;">
            Mengetahui,<br>
            <b style="text-decoration:underline;">PT. Outmark Global Industri</b><br>
            Penanggung Jawab
            <img src="${STAMP_TTD_DATAURI}" alt="" style="height:85px; width:auto; display:block; margin:2px auto -8px;">
          </div>`}
        </div>
    </div>
  `;
}

function renderInvoiceKatalog(el, container) {
  const editing = editingInvoiceProdukId ? STATE.invoiceProducts.find(p => p.id === editingInvoiceProdukId) : null;
  const list = STATE.invoiceProducts.slice().sort((a,b) => (a.nama||'').localeCompare(b.nama||''));
  el.innerHTML = `
    <div class="panel">
      <h2>${editing ? 'Edit Produk Invoice' : 'Tambah Produk Invoice'}</h2>
      <form id="formInvoiceProduk">
        <div class="field"><label>Nama Produk</label><input type="text" id="ip_nama" required value="${editing ? editing.nama.replace(/"/g,'&quot;') : ''}"></div>
        <div class="grid2">
          <div class="field"><label>Harga (Rp)</label><input type="number" id="ip_harga" min="0" required value="${editing ? editing.harga : ''}"></div>
          <div class="field"><label>Status</label>
            <select id="ip_status">
              <option value="Aktif" ${(!editing || editing.status==='Aktif')?'selected':''}>Aktif</option>
              <option value="Nonaktif" ${(editing && editing.status==='Nonaktif')?'selected':''}>Nonaktif</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>Warna (pisah koma)</label><input type="text" id="ip_warna" placeholder="mis. Black, Navy, Army" value="${editing ? (editing.warna||[]).join(', ') : ''}"></div>
          <div class="field"><label>Ukuran (pisah koma)</label><input type="text" id="ip_ukuran" placeholder="mis. S, M, L, XL" value="${editing ? (editing.ukuran||[]).join(', ') : ''}"></div>
        </div>
        <button type="submit" class="btn btn-primary">${editing ? 'Simpan Perubahan' : '+ Tambah Produk'}</button>
        ${editing ? `<button type="button" class="btn btn-ghost" id="btnBatalEditIp" style="margin-left:8px;">Batal</button>` : ''}
        <div class="status-box" id="ipFormMsg"></div>
      </form>
    </div>
    <div class="panel">
      <h2>Produk Invoice Terdaftar <span class="pill">${STATE.invoiceProducts.length}</span></h2>
      ${!list.length ? '<div class="empty-note">Belum ada produk invoice. Tambah dulu sebelum bisa dipakai di form Buat Invoice.</div>' : `
      <div class="list-card">
        ${list.map(p => `
        <div class="list-row">
          <div class="list-row-main" style="flex:1 1 260px; max-width:none;">
            <span class="list-row-title">${p.nama}</span>
            <span class="list-row-sub" style="font-family:inherit;">${fmtRp(p.harga)} &middot; Warna: ${(p.warna||[]).join(', ')||'-'} &middot; Ukuran: ${(p.ukuran||[]).join(', ')||'-'}</span>
          </div>
          <span class="list-row-small" style="flex:0 0 80px;"><span class="pill ${p.status==='Aktif'?'ok':'off'}">${p.status}</span></span>
          <button class="btn btn-ghost" data-edit-ip="${p.id}" style="padding:4px 10px; font-size:11px;">Edit</button>
          <button class="btn btn-ghost" data-toggle-status-ip="${p.id}" style="padding:4px 10px; font-size:11px; margin-left:6px;">${p.status==='Aktif'?'Nonaktifkan':'Aktifkan'}</button>
        </div>`).join('')}
      </div>`}
    </div>
  `;
  document.getElementById('formInvoiceProduk').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('ipFormMsg');
    const nama = document.getElementById('ip_nama').value.trim();
    const harga = Number(document.getElementById('ip_harga').value) || 0;
    const status = document.getElementById('ip_status').value;
    const warna = document.getElementById('ip_warna').value.split(',').map(s => s.trim()).filter(Boolean);
    const ukuran = document.getElementById('ip_ukuran').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!nama) { showMsg(msg, 'err', 'Nama produk wajib diisi.'); return; }
    if (editing) {
      editing.nama = nama; editing.harga = harga; editing.status = status; editing.warna = warna; editing.ukuran = ukuran;
    } else {
      STATE.invoiceProducts.push({ id: uid('ipr'), nama, harga, status: status || 'Aktif', warna, ukuran, createdAt: new Date().toISOString() });
    }
    await withSaving(msg, editing ? 'Perubahan produk invoice disimpan.' : 'Produk invoice ditambahkan.', async () => {
      await saveState();
      editingInvoiceProdukId = null;
      renderInvoiceKatalog(el, container);
    });
  });
  const btnBatal = document.getElementById('btnBatalEditIp');
  if (btnBatal) btnBatal.addEventListener('click', () => { editingInvoiceProdukId = null; renderInvoiceKatalog(el, container); });
  el.querySelectorAll('[data-edit-ip]').forEach(btn => {
    btn.addEventListener('click', () => { editingInvoiceProdukId = btn.dataset.editIp; renderInvoiceKatalog(el, container); });
  });
  el.querySelectorAll('[data-toggle-status-ip]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const p = STATE.invoiceProducts.find(x => x.id === btn.dataset.toggleStatusIp);
      if (!p) return;
      const statusLama = p.status;
      p.status = p.status === 'Aktif' ? 'Nonaktif' : 'Aktif';
      try {
        await saveState();
      } catch (err) {
        p.status = statusLama;
        alert('Gagal menyimpan perubahan status: ' + err.message);
      }
      renderInvoiceKatalog(el, container);
    });
  });
}

function renderInvoiceBuat(el, container) {
  if (!invoiceDraft) invoiceDraft = emptyInvoiceDraft();
  const d = invoiceDraft;
  const customersSorted = STATE.customers.slice().sort((a,b) => (a.nama||'').localeCompare(b.nama||''));

  const ongkirEfektif = (d.tipe === 'DP' && d.ongkirMenyusul) ? 0 : d.ongkir; // ongkir "menyusul" TIDAK ikut total invoice DP ini
  const { subtotal, grandTotal } = hitungTotalInvoice(d.items, ongkirEfektif, d.potongan);
  const dpPaid = d.tipe === 'DP' ? Math.round(grandTotal * (d.dpPercent||0) / 100) : 0;
  const sisaBayar = d.tipe === 'DP' ? grandTotal - dpPaid : 0;

          </div>
        </div>
        <div class="field"><label>Customer</label>
          <select id="inv_customer">
            <option value="">-- Pilih Pelanggan --</option>
            ${customersSorted.map(c => `<option value="${c.id}" ${d.customerId===c.id?'selected':''}>${c.nama}${c.status==='Nonaktif'?' (Nonaktif)':''}</option>`).join('')}
          </select>
          ${!customersSorted.length ? '<div class="desc">Belum ada pelanggan -- tambah dulu di tab Pelanggan.</div>' : ''}
        </div>
      </div>
      <div class="field"><label>Deskripsi (Opsional)</label><input type="text" id="inv_deskripsi" value="${(d.deskripsi||'').replace(/"/g,'&quot;')}" placeholder="mis. Wilson Windbreaker"></div>

      ${d.tipe === 'SETTLEMENT' ? `
      <div class="field"><label>Invoice DP Terkait</label>
        <select id="inv_settlementOf">
          <option value="">-- Tidak terkait DP manapun --</option>
          ${dpInvoicesOutstanding.map(i => `<option value="${i.id}" ${d.settlementOfInvoiceId===i.id?'selected':''}>${i.nomor} -- ${findCustName(i.customerId)||'-'} (sisa ${fmtRp(i.sisaBayar)})</option>`).join('')}
        </select>
        ${sumberDp ? `<div class="desc">Sisa dari invoice DP <b>${sumberDp.nomor}</b>: <b>${fmtRp(sumberDp.sisaBayar)}</b>. Kalau ongkir belum termasuk di invoice DP itu, isi di field Ongkir di bawah.</div>` : ''}
      </div>` : ''}

      <h3 style="margin:16px 0 8px;">Item Produk</h3>
      ${!d.items.length ? '<div class="empty-note">Belum ada item produk.</div>' : `
      <table class="data" style="margin-bottom:10px;">
        <thead><tr><th>Produk</th><th>Warna</th><th>Ukuran</th><th class="num">Harga</th><th class="num">Qty</th><th class="num">Total</th><th></th></tr></thead>
        <tbody>
          ${d.items.map((it,idx) => `<tr>
            <td>${it.nama}</td><td>${it.warna||'-'}</td><td>${it.ukuran||'-'}</td>
            <td class="num">${fmtRp(it.harga)}</td><td class="num">${it.qty}</td><td class="num">${fmtRp((it.harga||0)*(it.qty||0))}</td>
            <td><button type="button" class="btn btn-ghost" data-remove-item="${idx}" style="padding:2px 8px; font-size:11px;">Hapus</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`}

      <div class="grid2" style="align-items:flex-end;">
        <div class="field"><label>Pilih Produk</label>
          <select id="inv_itemProduk">
            <option value="">-- Pilih --</option>
            ${katalogAktif.map(p => `<option value="${p.id}">${p.nama}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Warna</label><select id="inv_itemWarna"><option value="-">-</option></select></div>
      </div>
      <div class="grid2" style="align-items:flex-end;">
        <div class="field"><label>Ukuran</label><select id="inv_itemUkuran"><option value="-">-</option></select></div>
        <div class="field"><label>Harga (Rp)</label><input type="number" id="inv_itemHarga" min="0" value="0"></div>
      </div>
      <div class="grid2" style="align-items:flex-end;">
        <div class="field"><label>Qty</label><input type="number" id="inv_itemQty" min="1" value="1"></div>
        <div class="field"><button type="button" class="btn btn-ghost" id="btnTambahItem">+ Tambah Item</button></div>
      </div>
      ${!katalogAktif.length ? '<div class="desc">Belum ada produk invoice aktif -- tambah dulu di sub-tab Katalog Produk.</div>' : ''}

      <h3 style="margin:16px 0 8px;">Total</h3>
      <div class="grid2">
        <div class="field"><label>Ongkir (Rp)</label><input type="number" id="inv_ongkir" min="0" value="${d.ongkir}" ${d.tipe === 'DP' && d.ongkirMenyusul ? 'disabled' : ''}></div>
        <div class="field"><label>Diskon (Opsional)</label>
          <select id="inv_diskon">
            <option value="">-- Tanpa Diskon --</option>
            ${STATE.diskon.filter(ds => ds.status==='Aktif').map(ds => `<option value="${ds.id}" ${d.diskonId===ds.id?'selected':''}>${ds.nama} (${ds.tipe==='persen' ? ds.nilai+'%' : fmtRp(ds.nilai)})</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field" style="max-width:300px;"><label>Potongan (Rp)</label><input type="number" id="inv_potongan" min="0" value="${d.potongan}"></div>
      ${d.tipe === 'DP' ? `
      <div class="grid2">
        <div class="field" style="max-width:220px;"><label>DP (%)</label><input type="number" id="inv_dpPercent" min="1" max="99" value="${d.dpPercent}"></div>
        <div class="field" style="justify-content:flex-end;"><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="inv_ongkirMenyusul" ${d.ongkirMenyusul?'checked':''}> Ongkir ditagih di invoice pelunasan (ongkir menyusul)</label></div>
      </div>` : ''}
      <div class="field"><label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="inv_tanpaTtdCap" ${d.tanpaTtdCap?'checked':''}> Cetak tanpa tanda tangan &amp; cap</label></div>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">Subtotal</div><div class="kpi-value">${fmtRp(subtotal)}</div></div>
        <div class="kpi"><div class="kpi-label">Grand Total</div><div class="kpi-value">${fmtRp(grandTotal)}</div></div>
        ${d.tipe === 'DP' ? `
        <div class="kpi"><div class="kpi-label">DP Dibayar</div><div class="kpi-value">${fmtRp(dpPaid)}</div></div>
        <div class="kpi"><div class="kpi-label">Sisa Bayar</div><div class="kpi-value">${fmtRp(sisaBayar)}</div></div>
        ` : ''}
      </div>

      <button type="button" class="btn btn-primary" id="btnSimpanInvoice" style="margin-top:12px;">${editingInvoiceId ? 'Simpan Perubahan' : 'Simpan Invoice'}</button>
      ${editingInvoiceId ? `<button type="button" class="btn btn-ghost" id="btnBatalEditInvoice" style="margin-left:8px;">Batal</button>` : ''}
      <div class="status-box" id="invoiceFormMsg"></div>
    </div>
  `;

  const rerender = () => { syncInvoiceDraftFromDom(); renderInvoiceBuat(el, container); };
  document.getElementById('inv_tipe').addEventListener('change', rerender);
  document.getElementById('inv_tanggal').addEventListener('change', rerender);
  document.getElementById('inv_nomor').addEventListener('change', () => syncInvoiceDraftFromDom());
  document.getElementById('inv_customer').addEventListener('change', () => syncInvoiceDraftFromDom());
  document.getElementById('inv_deskripsi').addEventListener('change', () => syncInvoiceDraftFromDom());
  document.getElementById('inv_ongkir').addEventListener('change', rerender);
  document.getElementById('inv_potongan').addEventListener('change', rerender);
  document.getElementById('inv_diskon').addEventListener('change', (e) => {
    syncInvoiceDraftFromDom();
    const diskon = STATE.diskon.find(ds => ds.id === e.target.value);
    invoiceDraft.potongan = hitungNilaiDiskon(diskon, hitungTotalInvoice(invoiceDraft.items, 0, 0).subtotal);
    renderInvoiceBuat(el, container);
  });
  document.getElementById('inv_tanpaTtdCap').addEventListener('change', () => syncInvoiceDraftFromDom());
  const dpPercentEl = document.getElementById('inv_dpPercent');
  if (dpPercentEl) dpPercentEl.addEventListener('change', rerender);
  const ongkirMenyusulEl = document.getElementById('inv_ongkirMenyusul');
  if (ongkirMenyusulEl) ongkirMenyusulEl.addEventListener('change', (e) => {
    syncInvoiceDraftFromDom();
    if (e.target.checked) invoiceDraft.ongkir = 0; // ongkir dipindah ke invoice pelunasan, kosongkan di sini
    renderInvoiceBuat(el, container);
  });
  const settlementOfEl = document.getElementById('inv_settlementOf');
  if (settlementOfEl) settlementOfEl.addEventListener('change', rerender);
  document.getElementById('btnGenNomor').addEventListener('click', () => {
    syncInvoiceDraftFromDom();
    invoiceDraft.nomor = suggestNomorInvoice(invoiceDraft.tanggal);
    renderInvoiceBuat(el, container);
  });
  document.getElementById('inv_itemProduk').addEventListener('change', (e) => {
    const prod = STATE.invoiceProducts.find(p => p.id === e.target.value);
    const warnaSel = document.getElementById('inv_itemWarna');
    const ukuranSel = document.getElementById('inv_itemUkuran');
    const hargaInput = document.getElementById('inv_itemHarga');
    if (prod) {
      warnaSel.innerHTML = (prod.warna && prod.warna.length ? prod.warna : ['-']).map(w => `<option value="${w}">${w}</option>`).join('');
      ukuranSel.innerHTML = (prod.ukuran && prod.ukuran.length ? prod.ukuran : ['-']).map(s => `<option value="${s}">${s}</option>`).join('');
      hargaInput.value = prod.harga;
    } else {
      warnaSel.innerHTML = '<option value="-">-</option>';
      ukuranSel.innerHTML = '<option value="-">-</option>';
      hargaInput.value = 0;
    }
  });
  document.getElementById('btnTambahItem').addEventListener('click', () => {
    syncInvoiceDraftFromDom();
    const msg = document.getElementById('invoiceFormMsg');
    const prodId = document.getElementById('inv_itemProduk').value;
    const prod = STATE.invoiceProducts.find(p => p.id === prodId);
    if (!prod) { showMsg(msg, 'err', 'Pilih produk dulu sebelum tambah item.'); return; }
    const warnaVal = document.getElementById('inv_itemWarna').value;
    const ukuranVal = document.getElementById('inv_itemUkuran').value;
    const harga = Number(document.getElementById('inv_itemHarga').value) || 0;
    const qty = Number(document.getElementById('inv_itemQty').value) || 0;
    if (qty <= 0) { showMsg(msg, 'err', 'Qty harus lebih dari 0.'); return; }
    invoiceDraft.items.push({ invoiceProductId: prod.id, nama: prod.nama, warna: warnaVal === '-' ? '' : warnaVal, ukuran: ukuranVal === '-' ? '' : ukuranVal, harga, qty });
    renderInvoiceBuat(el, container);
  });
  el.querySelectorAll('[data-remove-item]').forEach(btn => {
    btn.addEventListener('click', () => {
      syncInvoiceDraftFromDom();
      invoiceDraft.items.splice(Number(btn.dataset.removeItem), 1);
      renderInvoiceBuat(el, container);
    });
  });
  document.getElementById('btnSimpanInvoice').addEventListener('click', async () => {
    syncInvoiceDraftFromDom();
    const msg = document.getElementById('invoiceFormMsg');
    const dd = invoiceDraft;
    if (!dd.nomor.trim()) { showMsg(msg, 'err', 'Nomor invoice wajib diisi.'); return; }
    if (!dd.customerId) { showMsg(msg, 'err', 'Pelanggan wajib dipilih.'); return; }
    if (!dd.items.length) { showMsg(msg, 'err', 'Tambahkan minimal 1 item produk.'); return; }
    const ongkirDisimpan = (dd.tipe === 'DP' && dd.ongkirMenyusul) ? 0 : dd.ongkir; // ongkir "menyusul" tidak ikut total invoice DP ini
    const totals = hitungTotalInvoice(dd.items, ongkirDisimpan, dd.potongan);
    const payload = {
      nomor: dd.nomor.trim(), tanggal: dd.tanggal, tipe: dd.tipe, customerId: dd.customerId, deskripsi: dd.deskripsi,
      items: dd.items.map(it => ({ ...it })), ongkir: ongkirDisimpan, potongan: dd.potongan, diskonId: dd.diskonId || null,
      subtotal: totals.subtotal, grandTotal: totals.grandTotal, tanpaTtdCap: !!dd.tanpaTtdCap,
      dpPercent: null, dpPaid: null, sisaBayar: null, ongkirMenyusul: false, settlementOfInvoiceId: null,
    };
    if (dd.tipe === 'DP') {
      payload.dpPercent = dd.dpPercent;
      payload.dpPaid = Math.round(totals.grandTotal * (dd.dpPercent||0) / 100);
      payload.sisaBayar = totals.grandTotal - payload.dpPaid;
      payload.ongkirMenyusul = !!dd.ongkirMenyusul;
    }
    if (dd.tipe === 'SETTLEMENT') payload.settlementOfInvoiceId = dd.settlementOfInvoiceId || null;
    if (editingInvoiceId) {
      const existing = STATE.invoices.find(i => i.id === editingInvoiceId);
      Object.assign(existing, payload);
    } else {
      payload.id = uid('inv');
      payload.createdAt = new Date().toISOString();
      STATE.invoices.push(payload);
    }
    await withSaving(msg, editingInvoiceId ? 'Perubahan invoice disimpan.' : 'Invoice disimpan.', async () => {
      await saveState();
      editingInvoiceId = null;
      invoiceDraft = null;
      invoiceFilter.tab = 'daftar';
      renderInvoiceTab(container);
    });
  });
  const btnBatalEdit = document.getElementById('btnBatalEditInvoice');
  if (btnBatalEdit) btnBatalEdit.addEventListener('click', () => { editingInvoiceId = null; invoiceDraft = null; renderInvoiceBuat(el, container); });
}

/* =========================================================================
   KWITANSI (2026-11-19 lanjutan) -- dokumen TERPISAH dari invoice (Setiawan: "aku juga ingin bisa
   mengeluarkan kwitansi, agar bisa aku beri materai digital nantinya"), bisa ditautkan opsional ke 1
   invoice (auto-isi pelanggan & jumlah) atau diisi manual berdiri sendiri. Layout cetak menyisakan baris
   kosong "tempat tempel e-meterai" di dekat ttd -- penempelan materai digital sungguhan (lewat PERURI dkk)
   TETAP dilakukan Setiawan sendiri di luar app ini, bukan sesuatu yg bisa digenerate app.
   ========================================================================= */
function suggestNomorKwitansi(tanggalStr) {
  const d = tanggalStr ? new Date(tanggalStr) : new Date();
  const yyyy = isNaN(d.getTime()) ? new Date().getFullYear() : d.getFullYear();
  const mm = String((isNaN(d.getTime()) ? new Date().getMonth() : d.getMonth()) + 1).padStart(2, '0');
  const prefix = `KWT/${yyyy}/${mm}/`;
  let maxN = 0;
  STATE.kwitansi.forEach(k => {
    if (k.nomor && k.nomor.startsWith(prefix)) {
      const m = k.nomor.match(/(\d+)\s*$/);
      if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
    }
  });
  return prefix + String(maxN + 1).padStart(3, '0');
}

// Catatan: konversi angka->teks dipakai di sini lewat terbilangRupiah(n), fungsi yg sudah ada di app
// (dibuat awalnya utk baris "Terbilang" di slip gaji) -- dipakai ulang, bukan ditulis dobel.

// Dipakai panel "Modal Terjual + Profit per Kelompok" di tab Kontrak (renderKontrak) -- "contracts" yg dioper
// masuk HARUS sudah di-filter sesuai yg mau ditampilkan (mis. activeContracts yg sudah kena filter Produk/Capital
// Partner di layar), supaya angka rekap kelompok ini SELALU sinkron dgn tabel Kontrak Aktif di atasnya. Modal
// Terjual = Terjual (stockAwal-stockAkhir) x Harga/Pcs (porsi modal yg sudah "kembali" dari unit yg sudah laku),
// Profit = Terjual x Margin (SAMA PERSIS dgn kolom "Profit Berjalan" di tabel kontrak). Kelompok diambil dari
// capitalPartners[i].kelompok (sama pola spt computeKelompokSummary/computeSurplusPerusahaan), default 1 kalau
// belum diisi. Hanya kelompok yg benar2 py kontrak di set ini yg dimasukkan ke hasil (kalau filter lagi nyempit
// ke 1 partner, kelompok lainnya otomatis tidak muncul -- bukan ditampilkan Rp0).
function computeModalTerjualProfitPerKelompok(contracts) {
  const byKelompok = {};
  contracts.forEach(c => {
    const partner = findPartnerById(c.capitalPartnerId);
    const kelompokNum = (partner && partner.kelompok) || 1;
    const terjual = (c.stockAwal||0) - (c.stockAkhir||0);
    const modalTerjual = terjual * (c.hargaModalPcs||0);
    const profit = terjual * (c.nilaiMargin||0);
    if (!byKelompok[kelompokNum]) byKelompok[kelompokNum] = { kelompokNum, nKontrak: 0, modalTerjual: 0, profit: 0 };
    byKelompok[kelompokNum].nKontrak += 1;
    byKelompok[kelompokNum].modalTerjual += modalTerjual;
    byKelompok[kelompokNum].profit += profit;
  });
  return [1, 2].filter(k => byKelompok[k]).map(k => {
    const h = byKelompok[k];
    return { ...h, total: h.modalTerjual + h.profit };
  });
}

  // ---- Handlers: Tambah Kontrak ----

    const kodeKontrak = document.getElementById('k_kode').value.trim().toUpperCase();

    const hargaModalPcs = Number(document.getElementById('k_harga').value);
    const nilaiMargin = Number(document.getElementById('k_margin').value);
    const danaBaru = Number(document.getElementById('k_danaBaru').value) || 0;
    const pakaiSaldo = document.getElementById('k_pakaiSaldo').checked;
    if (STATE.contracts.some(c => c.kodeKontrak === kodeKontrak)) { showMsg(msg, 'err', `Kode kontrak "${kodeKontrak}" sudah ada.`); return; }

    // Kalau kalkulator "Hitung Stock Awal dari Dana Tunai/Saldo Luar Kontrak" dipakai (ditandai dgn Dana
    // Tunai Baru diisi dan/atau checkbox "gabung saldo" dicentang), terapkan hasilnya ke Saldo Luar Kontrak
    // partner -- TAPI cuma kalau Stock Awal yg mau disimpan PERSIS sama dgn hasil hitungannya, supaya
    // saldo tidak ikut berubah diam2 kalau user belum klik "Hitung Stock Awal" atau sudah mengubah Stock
    // Awal secara manual belakangan (kalau beda, tanya dulu lewat confirm sebelum lanjut TANPA update saldo).
    const partner = STATE.capitalPartners.find(p => p.id === capitalPartnerId);
    let saldoUpdateMsg = '';
    if (danaBaru > 0 || pakaiSaldo) {
      if (!hargaModalPcs || hargaModalPcs <= 0) { showMsg(msg, 'err', 'Isi Harga Modal/Pcs dulu utk memakai Dana Tunai Baru/Saldo Luar Kontrak.'); return; }
      const saldoLama = partner ? (STATE.saldoDiluarKontrak[partner.id]||0) : 0;
      const { stockAwal: stockAwalHitung, sisa } = hitungStockAwalDariDanaSaldo(danaBaru, pakaiSaldo, saldoLama, hargaModalPcs);
      if (stockAwal !== stockAwalHitung) {
        if (!confirm(`Stock Awal yg mau disimpan (${stockAwal}) beda dgn hasil hitung dari Dana Tunai Baru/Saldo (${stockAwalHitung} unit, sisa ${fmtRp(sisa)}). Kemungkinan belum klik "Hitung Stock Awal" atau Stock Awal sudah diubah manual belakangan. Lanjutkan simpan Stock Awal ${stockAwal} TANPA mengubah Saldo Luar Kontrak?`)) return;

      }

  container.querySelectorAll('[data-riwayat-toggle]').forEach(pill => {

      // Telusuri mundur: kontrak ini -> asal-usulnya (rolledFromKodeKontrak), berlapis kalau ada
      const rantaiMundur = [];
      let cur = STATE.contracts.find(x => x.kodeKontrak === kode);
      while (cur && cur.rolledFromKodeKontrak) {
        rantaiMundur.push(cur.rolledFromKodeKontrak + (cur.rolledTipe ? ` (${cur.rolledTipe==='putar_penuh'?'putar penuh':'putar modal saja'})` : ''));
        cur = STATE.contracts.find(x => x.kodeKontrak === cur.rolledFromKodeKontrak);
      }
      // Telusuri maju: kontrak lain yg rolledFrom = kode ini
      const lanjutan = STATE.contracts.filter(x => x.rolledFromKodeKontrak === kode);
      let html = '';
      if (rantaiMundur.length) html += `<div><b>Asal:</b> ${rantaiMundur.reverse().join(' &rarr; ')} &rarr; ${kode}</div>`;

    pctEl.innerHTML = produkList.map(produk => {
      const activeForProduk = STATE.contracts.filter(c => c.produk === produk && c.status === 'DANA BELUM CAIR' && !punyaPenerusView.has(c.kodeKontrak));
      const byKode2 = {};
      activeForProduk.forEach(c => {
        const partner = findPartnerById(c.capitalPartnerId);
        if (!partner) return;
        byKode2[partner.kode2] = byKode2[partner.kode2] || { nama: partner.nama, qty: 0, harga: c.hargaModalPcs };
        byKode2[partner.kode2].qty += c.stockAwal || 0;
        byKode2[partner.kode2].harga = c.hargaModalPcs; // kontrak aktif biasanya 1 per investor, kalau >1 pakai yg terakhir diproses
      });
      const rows = Object.entries(byKode2);
      const totalQty = rows.reduce((s,[,v]) => s + v.qty, 0);
      const totalNilai = rows.reduce((s,[,v]) => s + v.qty * v.harga, 0);
      if (!rows.length) return '';
      return `
        <div style="margin-bottom:20px;">
          <div style="font-weight:700; font-family:'Inter',sans-serif; margin-bottom:6px;">${produk}</div>
          <table class="data compact">
            <thead><tr><th>Kode</th><th>Nama</th><th class="num">Qty</th><th class="num">%</th><th class="num">Harga</th><th class="num">Total</th></tr></thead>
            <tbody>
              ${rows.sort((a,b) => b[1].qty - a[1].qty).map(([kode2, v]) => `<tr>
                <td><b>${kode2}</b></td><td>${v.nama}</td><td class="num">${v.qty}</td>
                <td class="num">${totalQty > 0 ? (v.qty/totalQty*100).toFixed(2) : '0.00'}%</td>
                <td class="num">${fmtRpCompact(v.harga)}</td><td class="num">${fmtRpCompact(v.qty * v.harga)}</td>
              </tr>`).join('')}
              <tr style="font-weight:600; border-top:2px solid var(--ink);">
                <td colspan="2">TOTAL</td><td class="num">${totalQty}</td><td class="num">100.00%</td><td class="num"></td><td class="num">${fmtRpCompact(totalNilai)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }).join('');
  }
}
function fmtRp(n) { if (n==null||isNaN(n)) return '-'; return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
// Titik warna kecil di depan nama toko/platform, biar gampang dibedain sekilas (Shopee/TikTok/Tokopedia/lainnya).
function platformDot(sumberOrNama) {
  if (!sumberOrNama) return '';
  const up = String(sumberOrNama).toUpperCase();
  let cls = 'lainnya';
  if (up.includes('SHOPEE')) cls = 'shopee';
  else if (up.includes('TIKTOK')) cls = 'tiktok';
  else if (up.includes('TOKPED') || up.includes('TOKOPEDIA')) cls = 'tokopedia';
  return `<span class="platform-dot ${cls}"></span>`;
}
// Format tanggal LANGSUNG dari teks ISO (YYYY-MM-DD...) tanpa lewat konversi zona waktu browser,
// supaya tanggal yg ditampilkan SELALU sama persis dgn tanggal yg tersimpan, di zona waktu manapun dibuka.
function fmtTanggal(isoString, opts) {
  if (!isoString) return '-';
  const datePart = String(isoString).slice(0, 10); // "YYYY-MM-DD"
  const [y, m, d] = datePart.split('-');
  if (!y || !m || !d) return '-';
  if (opts && opts.short) return `${d}/${m}/${y.slice(2)}`;
  return `${d}/${m}/${y}`;
}
// Format tanggal panjang bergaya "11 November 2026" -- dipakai di kop & ttd cetak Invoice/Kwitansi (meniru
// format resmi Outmark Invoice Manager). REUSE NAMA_BULAN_ID/namaBulanID yg sudah ada (awalnya dibuat utk
// slip gaji), bukan bikin array nama bulan baru yg kedua.
function fmtTanggalPanjang(isoString) {
  if (!isoString) return '-';
  const datePart = String(isoString).slice(0, 10);
  const [y, m, d] = datePart.split('-');
  if (!y || !m || !d) return '-';
  return `${Number(d)} ${namaBulanID(Number(m))} ${y}`;
}
// Dipakai di tabel Biaya Operasional (& rincian opex di PNL): kalau tanggalDari & tanggalSampai sama (hari
// yg sama -- kasus paling umum sejak form Tambah Biaya Operasional defaultnya 1 tanggal saja), tampil 1
// tanggal saja, tidak perlu "23/10/26 - 23/10/26" yg berulang & bikin tabel ramai tanpa guna.
function fmtRentangTanggal(dari, sampai, opts) {
  if (dari && sampai && String(dari).slice(0,10) === String(sampai).slice(0,10)) return fmtTanggal(dari, opts);
  return `${fmtTanggal(dari, opts)} - ${fmtTanggal(sampai, opts)}`;
}
function fmtRpCompact(n) {
  if (n==null||isNaN(n)) return '-';
  n = Math.round(n);
  if (Math.abs(n) >= 1000000) return (n/1000000).toLocaleString('id-ID',{maximumFractionDigits:2}) + 'jt';
  return n.toLocaleString('id-ID');
}

// Rekonstruksi PERKIRAAN payouts dari histori PENJUALAN yg sudah dimigrasi -- SEPENUHNYA TERPISAH dari alur
// Tandai riwayat rollover utk kontrak2 LAMA (dari migrasi UJUSO) berdasarkan pola: kontrak sebelumnya
// habis total (stockAkhir=0) tepat sebelum kontrak berikutnya (nomor urut+1, investor+produk sama) mulai.
// TIDAK menandai kalau kontrak sebelumnya masih ada sisa (brarti bukan rollover linear, tapi kontrak paralel/split).
// Juga perbaiki tanggal placeholder (2025-01-01) dgn interpolasi dari tetangganya dlm urutan yg sama.
function inferRolloverLineage() {
  const groups = {};
  STATE.contracts.forEach(c => {
    const m = String(c.kodeKontrak).match(/^([A-Z]{2})([A-Z])(\d+)$/i);
    if (!m) return;
    const key = (m[1]+m[2]).toUpperCase();
    groups[key] = groups[key] || [];
    groups[key].push({ c, num: parseInt(m[3],10) });
  });

  let nTglDiperbaiki = 0, nDitandai = 0, nDilewati = 0;
  const dilewatiList = [];

  Object.values(groups).forEach(list => {
    list.sort((a,b) => a.num - b.num);
    list.forEach((item, i) => {
      const tgl = item.c.tanggalMasuk ? item.c.tanggalMasuk.slice(0,10) : null;
      if (tgl === '2025-01-01') {
        const prev = list[i-1], next = list[i+1];
        if (prev && prev.c.tanggalMasuk && next && next.c.tanggalMasuk) {
          const tPrev = new Date(prev.c.tanggalMasuk).getTime(), tNext = new Date(next.c.tanggalMasuk).getTime();
          item.c.tanggalMasuk = new Date(tPrev + (tNext - tPrev) / 2).toISOString();
          nTglDiperbaiki++;
        }
      }
    });
    list.sort((a,b) => new Date(a.c.tanggalMasuk||0) - new Date(b.c.tanggalMasuk||0));
    for (let i = 1; i < list.length; i++) {
      const prev = list[i-1].c, cur = list[i].c;
      if (cur.rolledFromKodeKontrak) continue;
      if ((prev.stockAkhir||0) === 0) {
        cur.rolledFromKodeKontrak = prev.kodeKontrak;
        cur.rolledTipe = 'historis';
        nDitandai++;
      } else {
        dilewatiList.push(`${prev.kodeKontrak} -> ${cur.kodeKontrak} (${prev.kodeKontrak} masih sisa ${prev.stockAkhir})`);
        nDilewati++;
      }
    }
  });
  return { nTglDiperbaiki, nDitandai, nDilewati, dilewatiList };
}

// Import Mingguan asli. TIDAK PERNAH menyentuh STATE.contracts atau STATE.orderDb -- cuma BACA dari orderDb,
// TULIS ke STATE.payouts/vendorPayouts saja. Aman dijalankan berkali-kali (hapus hasil lama dulu tiap kali).
// PAKAI kodeKontrakHistoris (kolom B di PENJUALAN) LANGSUNG sbg sumber kebenaran -- BUKAN hitung ulang alokasi
// pakai kontrak yg aktif SEKARANG, supaya akurat kalau kontrak sudah berganti sejak saat itu (mis. IWO013->IWO014).
function backfillPayoutsFromHistory() {
  STATE.payouts = STATE.payouts.filter(p => p.sumberData !== 'backfill_estimasi');
  STATE.vendorPayouts = STATE.vendorPayouts.filter(p => p.sumberData !== 'backfill_estimasi');

  const histRows = STATE.orderDb.filter(r => r.sumberData === 'migrasi_penjualan' && r.tanggalPenarikan && r.produk);
  const byDate = {};
  histRows.forEach(r => { const d = r.tanggalPenarikan.slice(0,10); byDate[d] = byDate[d] || []; byDate[d].push(r); });

  let nBackfilled = 0, nTanpaKodeKontrak = 0;
  Object.entries(byDate).forEach(([date, rows]) => {
    // ---- INVESTOR: kelompokkan LANGSUNG per kodeKontrakHistoris (dari kolom B) -- bukan re-alokasi ----
    const byKontrak = {};
    rows.forEach(r => {
      const p = findProduct(r.produk);
      if (!p || p.brand !== 'URBAN OUTDOOR') return;
      if (!r.kodeKontrakHistoris) { nTanpaKodeKontrak++; return; }
      const key = r.kodeKontrakHistoris + '|' + capitalPartnerProduk(r.produk);
      byKontrak[key] = byKontrak[key] || { kodeKontrak: r.kodeKontrakHistoris, produk: capitalPartnerProduk(r.produk), rows: [] };
      byKontrak[key].rows.push(r);
    });
    Object.values(byKontrak).forEach(group => {
      const kode2 = group.kodeKontrak.slice(0,2).toUpperCase();
      const partner = findPartnerByKode2(kode2);
      const kontrakRef = STATE.contracts.find(c => c.kodeKontrak === group.kodeKontrak); // cari kontraknya (aktif atau sudah tutup)
      const qty = group.rows.reduce((s,r) => s + (r.qty||1), 0);
      const skuBreakdown = {};
      group.rows.forEach(r => { if (r.sku) skuBreakdown[r.sku] = (skuBreakdown[r.sku]||0) + (r.qty||1); });
      STATE.payouts.push({
        id: uid('po'), tanggalDihitung: new Date(date).toISOString(), produk: group.produk, kode2,
        namaInvestor: partner ? partner.nama : kode2, capitalPartnerId: partner ? partner.id : null,
        kodeKontrak: group.kodeKontrak, qty, rate: kontrakRef ? kontrakRef.nilaiMargin : null,
        payout: kontrakRef ? qty*kontrakRef.nilaiMargin : null, tanggalDibayar: null,
        hargaModalPcs: kontrakRef ? kontrakRef.hargaModalPcs : null, skuBreakdown,
        orderIds: [...new Set(group.rows.map(r=>r.orderId))], sumberData: 'backfill_estimasi',
      });
      nBackfilled++;
    });

    // ---- VENDOR/KONVEKSI: SEMUA brand TERMASUK Urban Outdoor (arus uang beda: investor dapat margin,
    // konveksi/pembuat barang dapat harga produksi -- 2 hal terpisah utk produk yg sama) ----
    const vendorByBrand = {};
    rows.forEach(r => {
      if (!r.sku) return;
      const harga = lookupHargaKonveksiBySku(r.sku);
      if (!harga) return;
      const b = r.brand || 'TIDAK DIKETAHUI';
      vendorByBrand[b] = vendorByBrand[b] || { qty:0, total:0, produk:new Set(), skuBreakdown:{} };
      vendorByBrand[b].qty += (r.qty||1); vendorByBrand[b].total += (r.qty||1)*harga; vendorByBrand[b].produk.add(r.produk);
      vendorByBrand[b].skuBreakdown[r.sku] = (vendorByBrand[b].skuBreakdown[r.sku]||0) + (r.qty||1);
    });
    Object.entries(vendorByBrand).forEach(([brand,d]) => {
      STATE.vendorPayouts.push({ id: uid('vpo'), tanggalDihitung: new Date(date).toISOString(), brand,
        produk: [...d.produk].join(', '), qty: d.qty, total: d.total, tanggalDibayar: null,
        skuBreakdown: d.skuBreakdown, sumberData: 'backfill_estimasi' });
    });
  });

  return { nBackfilled, nTanpaKodeKontrak };
}

// Ekstraksi murni rekap per Kelompok Investor (1/2) dari sekumpulan payout yg cocok tanggal+kontrak/brand --
// dipakai render layar & export Excel supaya angka DIJAMIN sama persis. Return array (bisa 0/1/2 elemen).
function computeKelompokSummary(matchingPayouts) {
  const kelompokOfKode2 = (kode2) => { const p = findPartnerByKode2(kode2); return (p && p.kelompok) || 1; };
  const hasil = [];
  [1, 2].forEach(kelompokNum => {
    const payoutsKelompok = matchingPayouts.filter(p => kelompokOfKode2(p.kode2) === kelompokNum);
    if (!payoutsKelompok.length) return;
    const grandTotalQty = payoutsKelompok.reduce((s,p) => s + p.qty, 0);
    const grandTotalRp = payoutsKelompok.reduce((s,p) => s + (p.qty * (p.hargaModalPcs||0)), 0);
    const profitByKode2 = {};
    payoutsKelompok.forEach(p => { profitByKode2[p.kode2] = profitByKode2[p.kode2] || { qty:0, total:0 }; profitByKode2[p.kode2].qty += p.qty; profitByKode2[p.kode2].total += p.payout||0; });
    const totalProfitQty = Object.values(profitByKode2).reduce((s,v)=>s+v.qty,0);
    const totalProfitRp = Object.values(profitByKode2).reduce((s,v)=>s+v.total,0);
    hasil.push({ kelompokNum, grandTotalQty, grandTotalRp, profitByKode2, totalProfitQty, totalProfitRp });
  });
  return hasil;
}

// Cari harga konveksi HISTORIS (yg beneran berlaku saat payout itu terjadi) utk 1 SKU -- dipakai hitung Surplus
// Perusahaan scr retroaktif (Rekap per Kontrak/Brand). BEDA dgn lookupHargaKonveksiBySku yg selalu ambil harga
// TERKINI -- di sini kita cari dulu ke orderDb (harga yg beneran ke-lock waktu diproses dulu), supaya tidak
// keliru kalau harga konveksi sudah berubah sejak payout itu dibuat. Prioritas: (1) baris orderDb sku ini yg
// tanggalPenarikan-nya PERSIS sama dgn payout, (2) baris orderDb sku ini kapan saja, (3) fallback harga skrg.
function cariHargaKonveksiHistoris(sku, tanggalDihitung) {
  const tglKey = tanggalDihitung ? String(tanggalDihitung).slice(0,10) : null;
  const rowsSku = STATE.orderDb.filter(r => r.sku === sku && r.hargaKonveksi != null);
  if (tglKey) {
    const sameDate = rowsSku.find(r => (r.tanggalPenarikan||'').slice(0,10) === tglKey);
    if (sameDate) return sameDate.hargaKonveksi;
  }
  if (rowsSku.length) return rowsSku[0].hargaKonveksi;
  return lookupHargaKonveksiBySku(sku);
}

// Ekstraksi murni Surplus Perusahaan (Nilai ke Investor - Nilai ke Konveksi) utk sekumpulan payout yg cocok
// tanggal+kontrak/brand -- dipakai render layar & export Excel, pola sama spt computeKelompokSummary.
// PENTING soal akurasi: qty per SKU diambil dari payout.skuBreakdown (BUKAN dihitung ulang dari baris orderDb)
// krn 1 order bisa kepecah alokasinya ke LEBIH DARI 1 kontrak (mis. kasus rollover-berantai) -- orderDb di sini
// HANYA dipakai utk cari HARGA konveksinya per SKU (via cariHargaKonveksiHistoris), bukan qty-nya, supaya unit yg
// sama tidak ikut dihitung dobel kalau kebetulan 1 orderId muncul di orderIds lebih dari 1 payout.
// Diminta Setiawan 2026-09-26: dipecah per Kelompok Investor (1/2), sama spt computeKelompokSummary, BUKAN lagi
// 1 blok gabungan -- meski surplus ini scr konsep tetap milik perusahaan (bukan hak investor manapun), Setiawan
// tetap mau lihatnya terpisah per kongsi/kelompok. Return array (bisa 0/1/2 elemen), 1 elemen per kelompok yg ada datanya.
function computeSurplusPerusahaan(matchingPayouts) {
  const kelompokOfKode2 = (kode2) => { const p = findPartnerByKode2(kode2); return (p && p.kelompok) || 1; };
  const hasil = [];
  [1, 2].forEach(kelompokNum => {
    const payoutsKelompok = matchingPayouts.filter(p => kelompokOfKode2(p.kode2) === kelompokNum);
    if (!payoutsKelompok.length) return;
    const byProduk = {};
    payoutsKelompok.forEach(p => {
      const g = byProduk[p.produk] = byProduk[p.produk] || { produk: p.produk, qty: 0, nilaiInvestor: 0, nilaiKonveksi: 0 };
      const { totalQty, totalRp } = kontrakDetailRows(p);
      g.qty += totalQty;
      g.nilaiInvestor += totalRp;
      Object.entries(p.skuBreakdown || {}).forEach(([sku, qty]) => {
        const harga = cariHargaKonveksiHistoris(sku, p.tanggalDihitung);
        if (harga) g.nilaiKonveksi += qty * harga;
      });
    });
    const rows = Object.values(byProduk).map(g => ({ ...g, surplus: g.nilaiInvestor - g.nilaiKonveksi }));
    const grand = rows.reduce((acc,r) => ({ qty: acc.qty+r.qty, nilaiInvestor: acc.nilaiInvestor+r.nilaiInvestor, nilaiKonveksi: acc.nilaiKonveksi+r.nilaiKonveksi, surplus: acc.surplus+r.surplus }),
      { qty:0, nilaiInvestor:0, nilaiKonveksi:0, surplus:0 });
    hasil.push({ kelompokNum, rows, grand });
  });
  return hasil;
}

function renderLaporanDetailPanel(container) {
  const allDates = [...new Set(STATE.payouts.map(p => p.tanggalDihitung ? p.tanggalDihitung.slice(0,10) : null).filter(Boolean))].sort().reverse();
  const kontrakForDate = laporanDetail.tanggal ? STATE.payouts.filter(p => p.tanggalDihitung && p.tanggalDihitung.slice(0,10) === laporanDetail.tanggal) : [];
  const kontrakList = [...new Set(kontrakForDate.map(p => p.kodeKontrak))].filter(Boolean).sort();
  const brandList = [...new Set(kontrakForDate.map(p => { const pr = findProduct(p.produk); return pr ? pr.brand : null; }).filter(Boolean))].sort();

  let detailHtml = '';
  let matchingPayouts = [];
  if (laporanDetail.tanggal && laporanDetail.kodeKontrak) {
    matchingPayouts = kontrakForDate.filter(p => p.kodeKontrak === laporanDetail.kodeKontrak);
  } else if (laporanDetail.tanggal && laporanDetail.brand) {
    matchingPayouts = kontrakForDate.filter(p => { const pr = findProduct(p.produk); return pr && pr.brand === laporanDetail.brand; });
  }
  if (matchingPayouts.length) {
    detailHtml = matchingPayouts.map(p => renderKontrakDetailTable(p)).join('');
    // Rekap dipecah per Kelompok Investor (1/2, diatur di Data Master > Capital Partner) -- bukan lagi 1 total
    // gabungan, supaya 2 kongsi/kelompok investor yg berbeda bisa dilihat terpisah.
    computeKelompokSummary(matchingPayouts).forEach(({ kelompokNum, grandTotalQty, grandTotalRp, profitByKode2, totalProfitQty, totalProfitRp }) => {
      detailHtml += `
        <div style="border:2px solid var(--ink); border-radius:3px; padding:12px; margin-top:6px;">
          <table class="data compact">
            <tbody>
              <tr style="font-weight:600;"><td colspan="3">TOTAL MILIK INVESTOR ${kelompokNum}</td><td class="num">${grandTotalQty}</td><td class="num">${fmtRp(grandTotalRp)}</td></tr>
            </tbody>
          </table>
          <table class="data compact" style="margin-top:10px;">
            <thead><tr><th>Kode</th><th class="num">Qty</th><th class="num">Profit</th></tr></thead>
            <tbody>
              ${Object.entries(profitByKode2).sort((a,b)=>b[1].total-a[1].total).map(([kode2,v]) => `<tr><td>PROFIT ${kode2}</td><td class="num">${v.qty}</td><td class="num">${fmtRp(v.total)}</td></tr>`).join('')}
              <tr style="font-weight:600; border-top:2px solid var(--ink);"><td>TOTAL PROFIT</td><td class="num">${totalProfitQty}</td><td class="num">${fmtRp(totalProfitRp)}</td></tr>
            </tbody>
          </table>
        </div>
      `;
    });
    // Surplus Perusahaan (Nilai ke Investor dikurangi Nilai ke Konveksi) -- dipecah per Kelompok Investor (1/2)
    // spt "TOTAL MILIK INVESTOR" di atas (permintaan Setiawan 2026-09-26), 1 blok terpisah per kelompok yg ada datanya.
    computeSurplusPerusahaan(matchingPayouts).forEach(({ kelompokNum, rows, grand }) => {
      detailHtml += `
        <div style="border:2px solid var(--ink); border-radius:3px; padding:12px; margin-top:6px;">
          <div style="font-weight:600; margin-bottom:8px;">Surplus Perusahaan Kelompok ${kelompokNum} (Nilai ke Investor &minus; Nilai ke Konveksi)</div>
          <table class="data compact">
            <thead><tr><th>Produk</th><th class="num">Qty</th><th class="num">Nilai ke Investor</th><th class="num">Nilai ke Konveksi</th><th class="num">Surplus</th></tr></thead>
            <tbody>
              ${rows.map(r => `<tr><td>${r.produk}</td><td class="num">${r.qty}</td><td class="num">${fmtRp(r.nilaiInvestor)}</td><td class="num">${fmtRp(r.nilaiKonveksi)}</td><td class="num">${fmtRp(r.surplus)}</td></tr>`).join('')}
              <tr style="font-weight:600; border-top:2px solid var(--ink);"><td>TOTAL SURPLUS KELOMPOK ${kelompokNum}</td><td class="num">${grand.qty}</td><td class="num">${fmtRp(grand.nilaiInvestor)}</td><td class="num">${fmtRp(grand.nilaiKonveksi)}</td><td class="num">${fmtRp(grand.surplus)}</td></tr>
            </tbody>
          </table>
        </div>
      `;
    });
  }

  container.innerHTML = `
    <div class="panel">
      <h2>Rekap per Kontrak / Brand</h2>
      <div class="desc">Pilih tanggal penarikan, lalu lihat berdasarkan kode kontrak (1 investor) atau brand (semua kontrak sekaligus).</div>
      <div class="grid2">
        <div class="field"><label>Tanggal Penarikan</label>
          <select id="ld_tanggal"><option value="">Pilih tanggal</option>${allDates.map(d=>`<option value="${d}" ${laporanDetail.tanggal===d?'selected':''}>${fmtTanggal(d)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Kode Kontrak (opsional)</label>
          <select id="ld_kontrak" ${!kontrakList.length?'disabled':''}><option value="">-- atau pilih Brand di bawah --</option>${kontrakList.map(k=>`<option value="${k}" ${laporanDetail.kodeKontrak===k?'selected':''}>${k}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Brand (opsional, gabungan semua kontrak)</label>
        <select id="ld_brand" ${!brandList.length?'disabled':''}><option value="">-- atau pilih Kode Kontrak di atas --</option>${brandList.map(b=>`<option value="${b}" ${laporanDetail.brand===b?'selected':''}>${b}</option>`).join('')}</select>
      </div>
    </div>
    ${detailHtml ? `<div class="panel"><button class="btn btn-ghost" id="btnExportRekapKontrakBrand" style="margin-bottom:12px;">Export Excel</button>${detailHtml}</div>` : (laporanDetail.tanggal ? '<div class="panel"><div class="empty-note">Pilih kode kontrak atau brand utk lihat detail.</div></div>' : '')}
  `;
  document.getElementById('ld_tanggal').addEventListener('change', (e) => { laporanDetail = { tanggal: e.target.value, kodeKontrak:'', brand:'' }; renderLaporanDetailPanel(container); });
  document.getElementById('ld_kontrak').addEventListener('change', (e) => { laporanDetail.kodeKontrak = e.target.value; laporanDetail.brand=''; renderLaporanDetailPanel(container); });
  document.getElementById('ld_brand').addEventListener('change', (e) => { laporanDetail.brand = e.target.value; laporanDetail.kodeKontrak=''; renderLaporanDetailPanel(container); });
  const btnExportRekapKontrakBrand = document.getElementById('btnExportRekapKontrakBrand');
  if (btnExportRekapKontrakBrand) btnExportRekapKontrakBrand.addEventListener('click', () => exportRekapKontrakBrandToExcel(matchingPayouts));
  wireDrilldownHandlers(container);
}

// Tabel "Riwayat Rollover" (2026-11-13, permintaan Setiawan: butuh laporan rollover apa saja yg terjadi di

// ditulis di resolveRolloverIntoAllocations, TIDAK terpengaruh status kontrak sama sekali).
function renderRolloverLogTable(el) {
  const dari = rolloverLogFilter.dari, sampai = rolloverLogFilter.sampai;
  const list = (STATE.rolloverLog || [])
    .filter(r => (!dari || r.waktu.slice(0,10) >= dari) && (!sampai || r.waktu.slice(0,10) <= sampai))
    .sort((a,b) => new Date(b.waktu) - new Date(a.waktu));
  if (!list.length) { el.innerHTML = '<div class="empty-note">Tidak ada rollover tercatat utk rentang tanggal ini.</div>'; return; }
  el.innerHTML = `
    <div style="overflow-x:auto;">
    <table class="data compact">
      <thead><tr>
        <th>Waktu</th><th>Produk</th><th>Investor</th><th>Keputusan</th><th>Kontrak</th>
        <th class="num">Harga Lama &rarr; Baru</th><th class="num">Modal Baru</th><th class="num">Stock Awal Baru</th><th class="num">Sisa ke Saldo</th>
      </tr></thead>
      <tbody>
        ${list.map(r => {
          const tipeLabel = r.tipe === 'putar_penuh' ? 'Putar Penuh' : r.tipe === 'putar_modal' ? 'Putar Modal Saja' : 'Stop (Redistribusi)';

            return `<tr>
              <td>${fmtTanggal(r.waktu, {short:true})}</td><td>${r.produk}</td><td>${r.namaInvestor||'-'}</td>
              <td>${tipeLabel}</td>
              <td>${r.kodeKontrakLama} &rarr; <i>ditutup</i><div style="font-size:10.5px; color:var(--ink-soft); margin-top:2px; white-space:normal;">${redis}</div></td>
              <td class="num">-</td><td class="num">-</td><td class="num">-</td><td class="num">-</td>
            </tr>`;
          }
          return `<tr>
            <td>${fmtTanggal(r.waktu, {short:true})}</td><td>${r.produk}</td><td>${r.namaInvestor||'-'}</td>
            <td>${tipeLabel}</td>
            <td>${r.kodeKontrakLama} &rarr; ${r.kodeKontrakBaru}${r.kontrakBaruDipakaiUlang?' <span class="pill" style="font-size:9px;">pakai ulang</span>':''}</td>

  `;
}

function renderLaporan(container) {
  const payouts = STATE.payouts;
  const vendorPayouts = STATE.vendorPayouts;
  const nBackfilled = payouts.filter(p => p.sumberData === 'backfill_estimasi').length;

  // Ringkasan belum dibayar per investor
  const totalByPartner = {};
  payouts.filter(p => !p.tanggalDibayar).forEach(p => {
    const key = p.capitalPartnerId || p.kode2;
    totalByPartner[key] = totalByPartner[key] || { nama: p.namaInvestor, kode2: p.kode2, total: 0, nItem: 0 };
    totalByPartner[key].total += p.payout || 0;
    totalByPartner[key].nItem++;
  });
  const partnerSummary = Object.values(totalByPartner).sort((a,b) => b.total - a.total);
  const totalBelumDibayarInvestor = partnerSummary.reduce((s,p) => s + p.total, 0);
  const totalKonveksiSemua = vendorPayouts.reduce((s,v) => s + v.total, 0);

  const nBackfilledBelumBayar = payouts.filter(p => p.sumberData === 'backfill_estimasi' && !p.tanggalDibayar).length;
  container.innerHTML = `
    <div class="panel">
      <h2>Perkiraan dari Histori <span class="pill ${nBackfilled?'ok':''}">${nBackfilled} entri perkiraan</span></h2>
      <div class="desc">Hitung ulang PERKIRAAN payout dari histori PENJUALAN yg sudah dimigrasi, pakai kode kontrak ASLI (kolom B di PENJUALAN) supaya akurat kalau kontrak sudah berganti sejak saat itu.
      Sepenuhnya aman -- <b>tidak menyentuh stok kontrak sama sekali</b>.</div>
      <button class="btn btn-ghost" id="btnBackfill">${nBackfilled ? 'Hitung Ulang Perkiraan' : 'Buat Perkiraan dari Histori'}</button>
      ${nBackfilledBelumBayar ? `<button class="btn btn-ghost" id="btnMarkAllHistoriPaid" style="margin-left:8px;">Tandai Semua Histori (${nBackfilledBelumBayar}) Sebagai Dibayar</button>` : ''}
      <div class="status-box" id="backfillMsg"></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Belum Dibayar ke Investor</div><div class="kpi-value">${fmtRp(totalBelumDibayarInvestor)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Rekap Konveksi/Supplier</div><div class="kpi-value">${fmtRp(totalKonveksiSemua)}</div></div>
    </div>

    <div class="panel">
      <h2>Ringkasan per Capital Partner (Belum Dibayar)</h2>
      ${!partnerSummary.length ? '<div class="empty-note">Tidak ada yang belum dibayar. Semua lunas.</div>' : `
      <table class="data">
        <thead><tr><th>Kode</th><th>Nama</th><th class="num">Jml Item</th><th class="num">Total Belum Dibayar</th></tr></thead>
        <tbody>
          ${partnerSummary.map(p => `<tr><td><b>${p.kode2}</b></td><td>${p.nama}</td><td class="num">${p.nItem}</td><td class="num">${fmtRp(p.total)}</td></tr>`).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="panel">
      <h2>Saldo di Luar Kontrak</h2>
      <div class="desc">Sisa pembulatan dari rollover kontrak (Putar Penuh/Putar Modal Saja), terkumpul lintas produk per investor. Murni catatan -- belum otomatis dipakai jadi kontrak baru.</div>
      ${(() => {
        const saldoEntries = Object.entries(STATE.saldoDiluarKontrak).filter(([,v]) => v > 0);
        if (!saldoEntries.length) return '<div class="empty-note">Belum ada saldo di luar kontrak.</div>';
        return `<table class="data">
          <thead><tr><th>Investor</th><th class="num">Saldo</th></tr></thead>
          <tbody>${saldoEntries.map(([cpId,v]) => { const p = findPartnerById(cpId); return `<tr><td>${p?p.nama:cpId}</td><td class="num">${fmtRp(v)}</td></tr>`; }).join('')}</tbody>
        </table>`;
      })()}
    </div>

    <div class="panel">
      <h2>Riwayat Rollover</h2>
      <div class="desc">Semua keputusan rollover (Putar Penuh / Putar Modal Saja / Stop) yang pernah diproses -- tetap tercatat di sini walau kontrak barunya sudah langsung habis/tertutup lagi, berbeda dgn badge "rollover" di tab Kelola Kontrak yg bisa hilang.</div>
      <div class="grid2" style="margin-bottom:8px; max-width:420px;">
        <div class="field"><label>Dari Tanggal</label><input type="date" id="rlog_dari" value="${rolloverLogFilter.dari}"></div>
        <div class="field"><label>Sampai Tanggal</label><input type="date" id="rlog_sampai" value="${rolloverLogFilter.sampai}"></div>
      </div>
      <button class="btn btn-ghost" id="rlog_hariIni" style="margin-right:8px;">Hari Ini</button>

        <button class="btn-subtab ${laporanFilter.tab==='detail'?'active':''}" data-subtab="detail">Rekap per Kontrak/Brand</button>
      </div>
    </div>
    ${laporanFilter.tab === 'detail' ? '<div id="laporanDetailArea"></div>' : `
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
        <div style="flex:1; min-width:200px;">
          ${laporanFilter.tab === 'investor' ? `
          <div class="field" style="max-width:220px;"><label>Status</label>
            <select id="laporanStatusFilter">
              <option value="belum" ${laporanFilter.status==='belum'?'selected':''}>Belum Dibayar</option>
              <option value="sudah" ${laporanFilter.status==='sudah'?'selected':''}>Sudah Dibayar</option>
              <option value="semua" ${laporanFilter.status==='semua'?'selected':''}>Semua</option>
            </select>
          </div>` : '<div class="desc">Klik baris untuk lihat rincian per produk &amp; ukuran.</div>'}
        </div>
        <button class="btn btn-ghost" id="btnExportLaporan">Export Excel</button>
      </div>
      <div id="laporanTableArea" style="margin-top:10px;"></div>
    </div>`}
  `;

  container.querySelectorAll('[data-subtab]').forEach(btn => {
    btn.addEventListener('click', () => { laporanFilter.tab = btn.dataset.subtab; laporanBulkSelection.clear(); renderLaporan(container); });
  });
  document.getElementById('btnBackfill').addEventListener('click', async () => {
    const msg = document.getElementById('backfillMsg');
    if (!confirm('Hitung ulang perkiraan payout dari histori? Ini AMAN (tidak menyentuh stok kontrak), tapi hasil sebelumnya (kalau ada) akan diganti dengan hitungan baru.')) return;
    showMsg(msg, 'info', 'Menghitung...');
    try {
      const { nBackfilled, nTanpaKodeKontrak } = backfillPayoutsFromHistory();
      await saveState();
      showMsg(msg, 'ok', `${nBackfilled} entri payout dibuat dari kode kontrak asli (kolom B).` + (nTanpaKodeKontrak ? ` ${nTanpaKodeKontrak} baris dilewati krn kolom B kosong di data sumbernya.` : '') + ` Stok kontrak TIDAK berubah.`);
      renderLaporan(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  const btnMarkAllHistoriPaid = document.getElementById('btnMarkAllHistoriPaid');
  if (btnMarkAllHistoriPaid) {
    btnMarkAllHistoriPaid.addEventListener('click', async () => {
      const msg = document.getElementById('backfillMsg');
      const nTarget = STATE.payouts.filter(p => p.sumberData === 'backfill_estimasi' && !p.tanggalDibayar).length;
      if (!confirm(`Tandai ${nTarget} entri histori (perkiraan) sebagai sudah dibayar? Cuma yg bersumber dari backfill histori -- payout dari batch mingguan yg sungguhan TIDAK ikut tertandai.`)) return;
      showMsg(msg, 'info', 'Menandai...');
      try {
        const now = new Date().toISOString();
        let n = 0;
        STATE.payouts.forEach(p => { if (p.sumberData === 'backfill_estimasi' && !p.tanggalDibayar) { p.tanggalDibayar = now; n++; } });
        await saveState();
        showMsg(msg, 'ok', `${n} entri histori ditandai sudah dibayar.`);
        renderLaporan(container);
      } catch (e) {
        showMsg(msg, 'err', 'Gagal: ' + e.message);

    });

  document.getElementById('rlog_dari').addEventListener('change', (e) => { rolloverLogFilter.dari = e.target.value; renderRolloverLogTable(document.getElementById('rolloverLogArea')); });
  document.getElementById('rlog_sampai').addEventListener('change', (e) => { rolloverLogFilter.sampai = e.target.value; renderRolloverLogTable(document.getElementById('rolloverLogArea')); });
  document.getElementById('rlog_hariIni').addEventListener('click', () => {
    const t = new Date().toISOString().slice(0,10);
    rolloverLogFilter = { dari: t, sampai: t };
    document.getElementById('rlog_dari').value = t; document.getElementById('rlog_sampai').value = t;
    renderRolloverLogTable(document.getElementById('rolloverLogArea'));

  document.getElementById('rlog_semua').addEventListener('click', () => {
    rolloverLogFilter = { dari: '', sampai: '' };
    document.getElementById('rlog_dari').value = ''; document.getElementById('rlog_sampai').value = '';
    renderRolloverLogTable(document.getElementById('rolloverLogArea'));

  renderRolloverLogTable(document.getElementById('rolloverLogArea'));
  if (laporanFilter.tab === 'detail') { renderLaporanDetailPanel(document.getElementById('laporanDetailArea')); return; }
  const statusFilterEl = document.getElementById('laporanStatusFilter');
  if (statusFilterEl) statusFilterEl.addEventListener('change', (e) => { laporanFilter.status = e.target.value; laporanBulkSelection.clear(); renderLaporan(container); });
  const btnExportLaporan = document.getElementById('btnExportLaporan');
  if (btnExportLaporan) btnExportLaporan.addEventListener('click', () => {
    const { isVendor, filtered } = getLaporanFilteredList();
    if (!filtered.length) { alert('Tidak ada data utk diexport.'); return; }
    if (isVendor) exportVendorPayoutToExcel(filtered); else exportPayoutInvestorToExcel(filtered);
  });

  renderLaporanTable(document.getElementById('laporanTableArea'), container);
}

// Ekstraksi murni perhitungan baris detail per produk-ukuran 1 vendor payout (dipakai render layar & export
// Excel supaya dijamin SELALU sama persis -- tidak ada rumus terpisah/duplikat).
function vendorDetailRows(vendorPayout) {
  const bySizeLabel = {}; // "PRODUKSIZE" -> {qty, harga, produkNama}
  Object.entries(vendorPayout.skuBreakdown || {}).forEach(([sku, qty]) => {
    const prefix = String(sku).toUpperCase().slice(0,3);
    const p = STATE.products.find(pr => pr.prefix === prefix);
    if (!p) return;
    const sizeCode = String(sku).toUpperCase().slice(-2);
    const size = SIZE_CODE_MAP[sizeCode];
    if (!size) return;
    const label = p.nama + size;
    const harga = lookupHargaKonveksiBySku(sku) || 0;
    bySizeLabel[label] = bySizeLabel[label] || { qty: 0, harga, produkNama: p.nama };
    bySizeLabel[label].qty += qty;
  });
  const produkOrder = [...new Set(Object.values(bySizeLabel).map(v=>v.produkNama))].sort();
  let totalQty = 0, totalRp = 0;
  const rows = [];
  produkOrder.forEach(produkNama => {
    SIZES.forEach(s => {
      const label = produkNama + s;
      const g = bySizeLabel[label];
      const qty = g ? g.qty : 0;
      const harga = g ? g.harga : (getCurrentHarga(produkNama, s) || 0);
      const total = qty * harga;
      totalQty += qty; totalRp += total;
      rows.push({ label, harga, qty, total });
    });
  });
  return { rows, totalQty, totalRp };
}

function renderVendorDetailTable(vendorPayout) {
  const { rows, totalQty, totalRp } = vendorDetailRows(vendorPayout);
  return `
    <table class="data compact">
      <thead><tr><th>Kode Produk</th><th class="num">Harga</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.label}</td><td class="num">${r.harga?fmtRpCompact(r.harga):'-'}</td><td class="num">${r.qty||'-'}</td><td class="num">${r.total?fmtRp(r.total):'-'}</td></tr>`).join('')}
        <tr style="font-weight:600; border-top:2px solid var(--ink);"><td colspan="2">TOTAL</td><td class="num">${totalQty}</td><td class="num">${fmtRp(totalRp)}</td></tr>
      </tbody>
    </table>
  `;
}

// Ekstraksi murni logika filter+sort tabel Laporan Penarikan (investor/vendor) -- dipakai render layar & export
// Excel supaya data yg diexport DIJAMIN sama persis dgn yg tampil di layar.
function getLaporanFilteredList() {
  const isVendor = laporanFilter.tab === 'vendor';
  const list = isVendor ? STATE.vendorPayouts : STATE.payouts;
  let filtered = list;
  if (!isVendor) {
    if (laporanFilter.status === 'belum') filtered = filtered.filter(x => !x.tanggalDibayar);
    else if (laporanFilter.status === 'sudah') filtered = filtered.filter(x => x.tanggalDibayar);
  }
  filtered = filtered.slice().sort((a,b) => new Date(b.tanggalDihitung||0) - new Date(a.tanggalDihitung||0));
  return { isVendor, filtered };
}

// Ekstraksi murni: tandai 1/beberapa payout sbg sudah dibayar (idempoten -- yg sudah lunas dilewati, id yg tdk
// ditemukan diabaikan). Dipakai tombol "Tandai Dibayar" per-baris (1 id) & tombol massal (banyak id sekaligus)
// supaya keduanya DIJAMIN perilakunya identik. Return jumlah payout yg BENERAN baru ditandai (bkn total id yg dikirim).
function markPayoutsDibayar(payoutIds) {
  const now = new Date().toISOString();
  let n = 0;
  payoutIds.forEach(id => {
    const p = STATE.payouts.find(x => x.id === id);
    if (p && !p.tanggalDibayar) { p.tanggalDibayar = now; n++; }
  });
  return n;
}

function renderLaporanTable(el, container) {
  const { isVendor, filtered } = getLaporanFilteredList();

  if (!filtered.length) { el.innerHTML = '<div class="empty-note">Tidak ada data.</div>'; return; }

  if (isVendor) {
    el.innerHTML = `
      <table class="data compact">
        <thead><tr><th>Tgl Dihitung</th><th>Brand</th><th>Produk</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${filtered.map(v => `<tr class="row-drilldown" style="cursor:pointer;" data-vendor-toggle="${v.id}">
            <td>${fmtTanggal(v.tanggalDihitung)}</td><td>${v.brand}</td><td style="font-size:11px;">${v.produk}</td>
            <td class="num">${v.qty}</td><td class="num">${fmtRp(v.total)}</td>
          </tr>
          <tr id="vendorDetailRow_${v.id}" style="display:none;"><td colspan="5">${renderVendorDetailTable(v)}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
    el.querySelectorAll('[data-vendor-toggle]').forEach(tr => {
      tr.addEventListener('click', () => {
        const row = document.getElementById('vendorDetailRow_' + tr.dataset.vendorToggle);
        if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
      });
    });
  } else {
    const adaYgBelumDibayar = filtered.some(p => !p.tanggalDibayar);
    el.innerHTML = `
      ${adaYgBelumDibayar ? `<div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <button class="btn btn-primary" id="btnBulkMarkDibayar" disabled>Tandai Dibayar (0 dipilih)</button>
      </div>` : ''}
      <table class="data compact">
        <thead><tr>
          ${adaYgBelumDibayar ? '<th style="width:22px;"><input type="checkbox" id="chkSelectAllPayout" title="Pilih semua yg belum dibayar"></th>' : ''}
          <th>Tgl Dihitung</th><th>Investor</th><th>Produk</th><th>Kontrak</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Payout</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.map(p => `<tr>
            ${adaYgBelumDibayar ? `<td>${!p.tanggalDibayar ? `<input type="checkbox" class="chk-payout" data-payout-id="${p.id}" ${laporanBulkSelection.has(p.id)?'checked':''}>` : ''}</td>` : ''}
            <td>${fmtTanggal(p.tanggalDihitung)}${p.sumberData==='backfill_estimasi'?' <span class="pill" style="font-size:9px;">perkiraan</span>':''}</td><td>${p.namaInvestor||'-'}</td><td>${p.produk}</td><td style="font-size:11px;">${p.kodeKontrak||'-'}</td>
            <td class="num">${p.qty}</td><td class="num">${p.rate?fmtRpCompact(p.rate):'-'}</td><td class="num">${p.payout?fmtRp(p.payout):'-'}</td>
            <td>${p.tanggalDibayar ? `<span class="pill ok">Lunas ${fmtTanggal(p.tanggalDibayar,{short:true})}</span>` : `<span class="pill pending">Belum</span>`}</td>
            <td>${!p.tanggalDibayar ? `<button class="btn btn-ghost" data-mark-payout="${p.id}" style="padding:4px 8px; font-size:11px;">Tandai Dibayar</button>` : ''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
    el.querySelectorAll('[data-mark-payout]').forEach(btn => {
      btn.addEventListener('click', async () => {
        markPayoutsDibayar([btn.dataset.markPayout]);
        laporanBulkSelection.delete(btn.dataset.markPayout);
        await saveState();
        renderLaporan(container);
      });
    });

    // ---- Centang massal (permintaan user 2026-09-18): pilih beberapa baris sekaligus, lalu 1x klik utk
    // menandai semuanya dibayar -- drpd klik "Tandai Dibayar" 1 per 1 kalau lagi settle banyak payout sekaligus. ----
    if (adaYgBelumDibayar) {
      const chkAll = document.getElementById('chkSelectAllPayout');
      const chkRows = () => Array.from(el.querySelectorAll('.chk-payout'));
      const btnBulk = document.getElementById('btnBulkMarkDibayar');
      function updateBulkBar() {
        const n = laporanBulkSelection.size;
        btnBulk.textContent = `Tandai Dibayar (${n} dipilih)`;
        btnBulk.disabled = n === 0;
        const rows = chkRows();
        if (chkAll) chkAll.checked = rows.length > 0 && rows.every(c => c.checked);
      }
      chkRows().forEach(chk => {
        chk.addEventListener('change', () => {
          if (chk.checked) laporanBulkSelection.add(chk.dataset.payoutId); else laporanBulkSelection.delete(chk.dataset.payoutId);
          updateBulkBar();
        });
      });
      if (chkAll) chkAll.addEventListener('change', () => {
        chkRows().forEach(chk => {
          chk.checked = chkAll.checked;
          if (chkAll.checked) laporanBulkSelection.add(chk.dataset.payoutId); else laporanBulkSelection.delete(chk.dataset.payoutId);
        });
        updateBulkBar();
      });
      updateBulkBar();
      btnBulk.addEventListener('click', async () => {
        const ids = [...laporanBulkSelection];
        if (!ids.length) return;
        if (!confirm(`Tandai ${ids.length} payout terpilih sbg sudah dibayar?`)) return;
        markPayoutsDibayar(ids);
        laporanBulkSelection.clear();
        await saveState();
        renderLaporan(container);
      });
    }
  }
}

// EXPORT EXCEL -- fitur diminta user 2026-09-11 utk 3 sub-tab Laporan Penarikan (Payout Capital Partner,

// perhitungan yg SAMA PERSIS dgn yg dipakai render tabel di layar (getLaporanFilteredList / kontrakDetailRows /
// vendorDetailRows / computeKelompokSummary) -- supaya angka yg diexport DIJAMIN selalu sama dgn yg tampil,
// termasuk saat data difilter (mis. Status Belum/Sudah Dibayar, atau kontrak/brand & tanggal yg dipilih).

function downloadWorkbook(wb, filenamePrefix) {
  const tgl = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `${filenamePrefix}_${tgl}.xlsx`);
}

function exportPayoutInvestorToExcel(filtered) {
  const rows = filtered.map(p => ({
    'Tgl Dihitung': p.tanggalDihitung ? fmtTanggal(p.tanggalDihitung) : '-',
    'Investor': p.namaInvestor || '-',
    'Kode Kontrak': p.kodeKontrak || '-',
    'Produk': p.produk || '-',
    'Qty': p.qty || 0,
    'Rate': p.rate || 0,
    'Payout': p.payout || 0,
    'Status': p.tanggalDibayar ? 'Sudah Dibayar' : 'Belum Dibayar',
    'Tgl Dibayar': p.tanggalDibayar ? fmtTanggal(p.tanggalDibayar) : '-',
    'Sumber': p.sumberData === 'backfill_estimasi' ? 'Perkiraan (Histori)' : 'Batch Mingguan',
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Payout Investor');
  downloadWorkbook(wb, 'Payout_Capital_Partner');
  return rows.length;
}

function exportVendorPayoutToExcel(filtered) {
  const ringkasan = filtered.map(v => ({
    'Tgl Dihitung': v.tanggalDihitung ? fmtTanggal(v.tanggalDihitung) : '-',
    'Brand': v.brand || '-',
    'Produk': v.produk || '-',
    'Qty': v.qty || 0,
    'Total': v.total || 0,
    'Status': v.tanggalDibayar ? 'Sudah Dibayar' : 'Belum Dibayar',
  }));
  // Rincian per Produk-Ukuran -- tiap vendorPayout (1 tanggal+brand) dapat blok barisnya sendiri, DITUTUP dgn 1
  // baris TOTAL (spt tabel rapi di layar/renderVendorDetailTable), bukan cuma daftar rata tanpa subtotal per grup.
  const rincian = [];
  filtered.forEach(v => {
    const { rows, totalQty, totalRp } = vendorDetailRows(v);
    const tgl = v.tanggalDihitung ? fmtTanggal(v.tanggalDihitung) : '-';
    rows.forEach(r => {
      rincian.push({ 'Tgl Dihitung': tgl, 'Konveksi': v.brand || '-', 'Kode Produk': r.label, 'Harga': r.harga || 0, 'Qty': r.qty || 0, 'Total': r.total || 0 });
    });
    rincian.push({ 'Tgl Dihitung': tgl, 'Konveksi': v.brand || '-', 'Kode Produk': 'TOTAL', 'Harga': '', 'Qty': totalQty, 'Total': totalRp });
  });
  const wb = XLSX.utils.book_new();
  // Sheet Rincian dijadikan sheet PERTAMA (aktif saat file dibuka) -- ini yg paling dibutuhkan user (rincian per
  // produk-ukuran, bukan cuma total), Ringkasan tetap ada sbg sheet ke-2 utk rekap cepat lintas tanggal/brand.
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rincian), 'Rincian per Produk-Ukuran');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ringkasan), 'Ringkasan');
  downloadWorkbook(wb, 'Pembayaran_Konveksi_Supplier');
  return { nRingkasan: ringkasan.length, nRincian: rincian.length };
}

function exportRekapKontrakBrandToExcel(matchingPayouts) {
  // Rincian per Kontrak -- tiap payout (1 kontrak) dapat blok barisnya sendiri, DITUTUP dgn 1 baris TOTAL MILIK
  // INVESTOR (spt tabel rapi di layar/renderKontrakDetailTable), bukan cuma daftar rata tanpa subtotal per kontrak.
  const rincian = [];
  matchingPayouts.forEach(p => {
    const produk = findProduct(p.produk);
    const { rows, totalQty, totalRp } = kontrakDetailRows(p);
    rows.forEach(r => {
      rincian.push({
        'Kode Kontrak': p.kodeKontrak || '-',
        'Investor': p.namaInvestor || '-',
        'Konveksi': produk ? produk.brand : '-',
        'Kode Produk': r.label,
        'Harga': p.hargaModalPcs || 0,
        'Qty': r.qty || 0,
        'Total': r.total || 0,
      });
    });
    rincian.push({ 'Kode Kontrak': p.kodeKontrak || '-', 'Investor': p.namaInvestor || '-', 'Konveksi': '', 'Kode Produk': 'TOTAL MILIK INVESTOR', 'Harga': '', 'Qty': totalQty, 'Total': totalRp });
  });
  const rekap = [];
  computeKelompokSummary(matchingPayouts).forEach(({ kelompokNum, grandTotalQty, grandTotalRp, profitByKode2, totalProfitQty, totalProfitRp }) => {
    rekap.push({ 'Kelompok': `Investor ${kelompokNum}`, 'Kode': 'TOTAL MILIK INVESTOR', 'Qty': grandTotalQty, 'Nilai': grandTotalRp });
    Object.entries(profitByKode2).sort((a,b)=>b[1].total-a[1].total).forEach(([kode2,v]) => {
      rekap.push({ 'Kelompok': `Investor ${kelompokNum}`, 'Kode': `PROFIT ${kode2}`, 'Qty': v.qty, 'Nilai': v.total });
    });
    rekap.push({ 'Kelompok': `Investor ${kelompokNum}`, 'Kode': 'TOTAL PROFIT', 'Qty': totalProfitQty, 'Nilai': totalProfitRp });
  });
  // Surplus Perusahaan -- sheet baru, dipecah per Kelompok Investor (kolom 'Kelompok', pola sama spt sheet
  // 'Rekap Kelompok' di atas), angka DIJAMIN sama persis dgn blok "Surplus Perusahaan Kelompok N" di layar
  // (computeSurplusPerusahaan dipakai di 2 tempat itu).
  const surplusRows = [];
  computeSurplusPerusahaan(matchingPayouts).forEach(({ kelompokNum, rows, grand }) => {
    rows.forEach(r => surplusRows.push({ 'Kelompok': `Investor ${kelompokNum}`, 'Produk': r.produk, 'Qty': r.qty, 'Nilai ke Investor': r.nilaiInvestor, 'Nilai ke Konveksi': r.nilaiKonveksi, 'Surplus': r.surplus }));
    surplusRows.push({ 'Kelompok': `Investor ${kelompokNum}`, 'Produk': `TOTAL SURPLUS KELOMPOK ${kelompokNum}`, 'Qty': grand.qty, 'Nilai ke Investor': grand.nilaiInvestor, 'Nilai ke Konveksi': grand.nilaiKonveksi, 'Surplus': grand.surplus });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rincian), 'Rincian per Kontrak');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rekap), 'Rekap Kelompok');
  if (surplusRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(surplusRows), 'Surplus Perusahaan');
  downloadWorkbook(wb, 'Rekap_Kontrak_Brand');
  return { nRincian: rincian.length, nRekap: rekap.length, nSurplus: surplusRows.length };
}
