// Parse teks yg ditempel dari Google Sheets (tab-separated). Baris header dicari via kolom "NO. PESANAN"
// (bukan asumsi posisi baris tetap, supaya tahan kalau ada baris judul "Pre-Order List" di atas header asli).
// Kolom QTY/WARNA kadang py newline tertanam (order 1 baris berisi >1 item warna beda, mis. "MB, XXL: 1\nBM,
// XXL: 1") -- saat ditempel, newline itu jadi baris FISIK terpisah yg TIDAK diawali nomor urut (NO), jadi
// dideteksi via cek "apakah sel pertama baris ini angka bulat" & digabung ke baris logis sebelumnya kalau bukan.
function parsePreOrderListRovee(text) {
  const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
  let headerIdx = -1, headerCells = null;
  for (let i = 0; i < lines.length; i++) {
    const cells = lines[i].split('\t');
    if (cells.some(c => /NO\.?\s*PESANAN/i.test(c.trim()))) { headerIdx = i; headerCells = cells.map(c => c.trim()); break; }
  }
  if (headerIdx === -1) return { rows: [], warnings: ['Header "NO. PESANAN" tidak ditemukan di teks yg ditempel -- pastikan baris header ikut disalin.'] };

  const idx = {};
  headerCells.forEach((h, i) => {
    const key = h.toUpperCase();
    if (key === 'NO') idx.no = i;
    else if (key.includes('TGL') && key.includes('ORDER')) idx.tglOrder = i;
    else if (key.startsWith('USSERNAME') || key.startsWith('USERNAME')) idx.username = i;
    else if (key === 'ARTIKEL') idx.artikel = i;
    else if (key === 'WARNA') idx.warna = i;
    else if (key === 'SIZE') idx.size = i;
    else if (key === 'QTY') idx.qty = i;
    else if (key === 'TOTAL') idx.total = i;
    else if (key.includes('PESANAN')) idx.noPesanan = i;
    else if (key === 'LOGISTIK') idx.logistik = i;
    else if (key === 'KET') idx.ket = i;
    else if (key === 'STATUS') idx.status = i;
    else if (key === 'WAREHOUSE') idx.warehouse = i;
  });

  const rawRows = [];
  let current = null;
  for (let i = headerIdx + 1; i < lines.length; i++) {
    if (lines[i].trim() === '') continue;
    const cells = lines[i].split('\t');
    const isNewRow = /^\d+$/.test((cells[0] || '').trim());
    if (isNewRow) {
      if (current) rawRows.push(current);
      current = cells.slice();
    } else if (current) {
      // Baris sambungan (newline tertanam dari 1 sel yg kewrap) -- gabung ke kolom terakhir yg sudah
      // terisi, lanjutkan sisa sel berikutnya sbg kolom setelahnya (lihat komentar fungsi di atas).
      current[current.length - 1] = (current[current.length - 1] || '') + '\n' + (cells[0] || '');
      current.push(...cells.slice(1));
    }
  }
  if (current) rawRows.push(current);

  const rows = rawRows.map(cells => ({
    no: (cells[idx.no] || '').trim(),
    tglOrder: (cells[idx.tglOrder] || '').trim(),
    username: (cells[idx.username] || '').trim(),
    artikel: (cells[idx.artikel] || '').trim().toUpperCase(),
    warnaRaw: (cells[idx.warna] || '').trim(),
    sizeRaw: (cells[idx.size] || '').trim(),
    qtyRaw: (cells[idx.qty] || '').trim(),
    noPesanan: (cells[idx.noPesanan] || '').trim(),
    status: (cells[idx.status] || '').trim(),
    warehouse: (cells[idx.warehouse] || '').trim(),
  })).filter(r => r.no);
  return { rows, warnings: [] };
}

// 1 baris sheet PO = 1 ORDER, tapi bisa berisi >1 item warna beda (qty tercampur dlm 1 sel, mis. "MB, XXL: 1
// \nBM, XXL: 1") -- ledakkan jadi item2 terpisah {warnaRaw, sizeRaw, qty}. Baris normal (qty cuma angka polos)
// tetap 1 item, pakai warna/size level baris apa adanya.
function ledakkanBarisPreOrder(row) {
  const qtyRaw = row.qtyRaw || '';
  if (qtyRaw.includes(':')) {
    const items = [];
    qtyRaw.split('\n').forEach(line => {
      const m = line.trim().match(/^(.+?)\s*,\s*(.+?)\s*:\s*(\d+)\s*$/);
      if (m) items.push({ warnaRaw: m[1].trim(), sizeRaw: m[2].trim(), qty: Number(m[3]) });
    });
    if (items.length) return items;
  }
  const qtyMatch = qtyRaw.match(/\d+/);
  return [{ warnaRaw: row.warnaRaw, sizeRaw: row.sizeRaw, qty: qtyMatch ? Number(qtyMatch[0]) : 0 }];
}

// Cari SKU ASLI dari data pesanan yg SUDAH DIIMPOR (STATE.pendingOrderSku dari "Update Daftar Pesanan" +
// STATE.orderDb dari batch mingguan yg sudah cair) via NO. PESANAN == orderId -- formatnya sama persis.
// Ini LEBIH PRESISI drpd menebak SKU dari singkatan WARNA di sheet PO manual (DP/BM/MG/dst), krn ambil
// langsung sku yg sudah tercatat resmi di sistem. Kalau order ini py >1 SKU (order gabung bbrp produk),
// diutamakan yg prefix-nya cocok dgn produk ybs; kalau masih ambigu (>1 ATAU tidak ketemu sama sekali),
// return null supaya pemanggil fallback ke cara lama (bangun dari singkatan warna+size sheet PO ini sendiri).
function cariSkuAsliDariPesananRovee(noPesanan, prefix) {
  if (!noPesanan) return null;
  const kandidat = [];
  (STATE.pendingOrderSku[noPesanan] || []).forEach(r => { if (r.sku) kandidat.push({ sku: r.sku, warna: r.warna || null, tanggalPesan: r.tanggalPesan || null }); });
  STATE.orderDb.forEach(r => { if (r.orderId === noPesanan && r.sku) kandidat.push({ sku: r.sku, warna: r.warna || null, tanggalPesan: r.tanggalPesan || null }); });
  if (!kandidat.length) return null;
  const cocokPrefix = prefix ? kandidat.filter(k => k.sku.toUpperCase().startsWith(String(prefix).toUpperCase())) : [];
  if (cocokPrefix.length === 1) return cocokPrefix[0];
  if (kandidat.length === 1) return kandidat[0];
  return null; // ambigu (>1 kandidat, prefix tidak cukup membedakan) -- jangan nebak, fallback ke cara lama
}

// Resolve 1 item (hasil ledakkanBarisPreOrder) jadi {produkNama, warna, ukuranLabel, sku, qty, tanggalPesan,
// sumber}. null kalau tidak bisa diresolve sama sekali (masuk warnings, item dilewati -- bukan dianggap qty 0).
function resolvePreOrderListItem(row, item, warningsSet) {
  const produk = STATE.products.find(pr => pr.prefix === row.artikel);
  if (!produk) { warningsSet.add(`Kode ARTIKEL "${row.artikel}" (order ${row.noPesanan || row.no}) tidak cocok dgn prefix produk manapun yg terdaftar.`); return null; }

  const sumberAsli = cariSkuAsliDariPesananRovee(row.noPesanan, produk.prefix);
  if (sumberAsli) {
    return { produkNama: produk.nama, warna: sumberAsli.warna || item.warnaRaw, ukuranLabel: item.sizeRaw.replace(/\s+/g, ''), sku: sumberAsli.sku, qty: item.qty, tanggalPesan: sumberAsli.tanggalPesan || null, sumber: 'data pesanan' };
  }

  // Fallback: bangun SKU dari singkatan WARNA + SIZE sheet PO ini sendiri (dicocokkan ke Kode Warna + alias,
  // dan ke Pemetaan Varian/Ukuran grup stok yg produkNama-nya sama, supaya tidak perlu konfigurasi ukuran dobel).
  const kodeWarna = cariKodeWarnaByNama(item.warnaRaw);
  if (!kodeWarna) { warningsSet.add(`Warna "${item.warnaRaw}" (order ${row.noPesanan || row.no}) tidak ketemu di data pesanan yg diimpor, dan belum ada di Kode Warna/alias (Data Master).`); return null; }

  const groupEntry = Object.entries((STATE.produksiStockMapping || {}).groups || {}).find(([, g]) => g.produkNama === produk.nama);
  const variantMap = groupEntry ? (((STATE.produksiStockMapping || {}).variants || {})[groupEntry[0]] || {}) : {};
  const ukuranNorm = item.sizeRaw.replace(/\s+/g, '');
  const vm = variantMap[ukuranNorm];
  if (!vm) { warningsSet.add(`Ukuran "${item.sizeRaw}" (order ${row.noPesanan || row.no}, produk ${produk.nama}) belum dipetakan di Pemetaan Varian/Ukuran (tab Stok & Pemetaan).`); return null; }
  const kodeUkuran = vm.ukuran ? cariKodeUkuranBySize(vm.ukuran) : (vm.kodeCustom || null);
  const sku = bangunSkuProduksi(produk.prefix, kodeWarna, kodeUkuran);
  if (!sku) { warningsSet.add(`SKU utk warna "${item.warnaRaw}"/ukuran "${item.sizeRaw}" (order ${row.noPesanan || row.no}) tidak bisa dibangun lengkap.`); return null; }
  return { produkNama: produk.nama, warna: item.warnaRaw, ukuranLabel: vm.ukuran || ukuranNorm, sku, qty: item.qty, tanggalPesan: null, sumber: 'singkatan sheet PO' };
}

// Rekap inti: dari STATE.preOrderListRaw -> detail per item + rekap qty "masih perlu diproduksi" per
// produk+warna+ukuran. Aturan "masih perlu" (2026-11-22, pilihan Setiawan -- gabungan kedua kolom, lebih
// ketat): WAREHOUSE kosong (belum dikemas dari stok) DAN STATUS persis "Diproses" (belum dikirim/selesai).
function hitungRekapPreOrderList(rawRows) {
  const warningsSet = new Set();
  const detail = [];
  let totalItemsAll = 0;
  (rawRows || []).forEach(row => {
    const items = ledakkanBarisPreOrder(row);
    totalItemsAll += items.length;
    items.forEach(it => {
      const resolved = resolvePreOrderListItem(row, it, warningsSet);
      if (!resolved) return;
      const belumSelesai = !(row.warehouse || '').trim() && String(row.status || '').trim().toUpperCase() === 'DIPROSES';
      detail.push(Object.assign({ no: row.no, noPesanan: row.noPesanan, username: row.username, status: row.status, warehouse: row.warehouse, belumSelesai }, resolved));
    });
  });
  const rekapMap = {};
  detail.forEach(d => {
    if (!d.belumSelesai) return;
    const key = kunciEntriProduksi(d.produkNama, d.warna, d.ukuranLabel);
    if (!rekapMap[key]) rekapMap[key] = { produkNama: d.produkNama, warna: d.warna, ukuran: d.ukuranLabel, qtyBelumSelesai: 0 };
    rekapMap[key].qtyBelumSelesai += d.qty;
  });
  const rekap = Object.values(rekapMap).sort((a, b) => b.qtyBelumSelesai - a.qtyBelumSelesai);
  const totalBelumSelesai = detail.filter(d => d.belumSelesai).reduce((s, d) => s + d.qty, 0);
  // Ringkasan per produk+warna (2026-11-22, permintaan Setiawan: "rangkuman apa saja yg di PO misal Rovee
  // black manta S/M 10 Pcs") -- gabungkan baris2 rekap (yg masih per produk+warna+UKURAN) jadi 1 baris per
  // produk+warna dgn daftar ukuran+qty inline, biar gampang dicocokkan ke kartu Order Produksi (pivot per warna).
  const ringkasanGrupMap = {};
  rekap.forEach(r => {
    const key = r.produkNama + '||' + r.warna;
    if (!ringkasanGrupMap[key]) ringkasanGrupMap[key] = { produkNama: r.produkNama, warna: r.warna, ukurans: [], total: 0 };
    ringkasanGrupMap[key].ukurans.push({ ukuran: r.ukuran, qty: r.qtyBelumSelesai });
    ringkasanGrupMap[key].total += r.qtyBelumSelesai;
  });
  const ringkasanGrup = Object.values(ringkasanGrupMap).sort((a, b) => b.total - a.total);
  const totalItemsResolved = detail.length;
  return { detail, rekap, ringkasanGrup, warnings: Array.from(warningsSet), totalBaris: (rawRows || []).length, totalBelumSelesai, totalItemsAll, totalItemsResolved };
}

// Sinkronkan hasil rekap ke STATE.produksiPO -- entri lama hasil import ini (ditandai sumberImport=
// 'preOrderList') dihapus dulu supaya import ulang tidak numpuk dobel; entri PO yg ditambah MANUAL (tanpa
// tag ini) TIDAK PERNAH disentuh oleh fungsi ini.
function sinkronkanPreOrderListKeProduksiPO(rekap) {
  STATE.produksiPO = (STATE.produksiPO || []).filter(po => po.sumberImport !== 'preOrderList');
  const now = new Date().toISOString();
  (rekap || []).forEach(r => {
    if (r.qtyBelumSelesai <= 0) return;
    STATE.produksiPO.push({ id: uid('po'), produkNama: r.produkNama, qtyPO: r.qtyBelumSelesai, warna: r.warna, ukuran: r.ukuran, catatan: 'Impor Pre-Order List (otomatis)', updatedAt: now, sumberImport: 'preOrderList' });
  });
}

// Daftar warna & ukuran yg SUDAH DIKENAL utk 1 produk (2026-11-22, Setiawan: "saat aku pilih produk, misal
// rovee, maka menyesuaikan pilihan warna apa saja yang muncul dan pilihan size") -- diambil dari hasil
// ratakanStokProduksi (baris stok yg SUDAH dipetakan ke produk ybs), supaya dropdown Warna/Ukuran di form
// WIP & PO otomatis menyesuaikan produk yg dipilih & labelnya DIJAMIN cocok dgn label di Stok & Pemetaan
// (tidak perlu ketik manual persis sama lagi). Produk yg blm py baris stok terpetakan -> dropdown kosong
// (pemanggil tetap sedia opsi "+ Lainnya (ketik manual)" spy tidak buntu).
// Urutkan daftar label ukuran: ukuran standar (S/M/L/XL/.../7XL) dulu sesuai urutan baku SIZES, baru label
// bukan-ukuran-standar (mis. "L/XL" varian Rovee) diurutkan alfabet di belakangnya -- TANPA ini, Array.sort()
// polos mengurutkan alfabet apa adanya ("3XL,4XL,...,L,M,S,XL,XXL" -- salah urut spt dilaporkan Setiawan dari
// screenshot produk OSWALD, 2026-11-22), krn "3" < "L" secara karakter walau S/M/L seharusnya duluan.
function urutkanUkuranStandarDulu(daftarUkuran) {
  const ukuranStandar = SIZES.filter(s => daftarUkuran.includes(s));
  const ukuranLain = daftarUkuran.filter(u => !SIZES.includes(u)).sort();
  return [...ukuranStandar, ...ukuranLain];
}
function daftarWarnaUkuranProduk(produkNama) {
  if (!produkNama) return { warnas: [], ukurans: [] };
  const { rows } = ratakanStokProduksi(STATE.produksiStockRaw || [], STATE.produksiStockMapping || { groups: {}, variants: {} });
  const warnaSet = new Set(), ukuranSet = new Set();
  rows.forEach(r => { if (r.produkNama === produkNama) { if (r.warna) warnaSet.add(r.warna); if (r.ukuranLabel) ukuranSet.add(r.ukuranLabel); } });
  return { warnas: Array.from(warnaSet).sort(), ukurans: urutkanUkuranStandarDulu(Array.from(ukuranSet)) };
}
// Bangun HTML <option> utk dropdown Warna/Ukuran form WIP/PO -- nilai yg sedang aktif (mis. saat Edit)
// selalu diselipkan ke daftar meski bukan hasil stok (mis. data lama/custom), supaya tidak hilang diam2
// dari tampilan. Opsi terakhir "__custom__" ("+ Lainnya") selalu ada supaya tetap bisa isi nilai baru yg
// belum pernah ada di stok sama sekali (produk baru/varian baru blm sempat masuk sheet stok).
function htmlOptsWarnaUkuran(produkNama, selectedWarna, selectedUkuran) {
  const { warnas, ukurans } = daftarWarnaUkuranProduk(produkNama);
  if (selectedWarna && !warnas.includes(selectedWarna)) warnas.push(selectedWarna);
  if (selectedUkuran && !ukurans.includes(selectedUkuran)) ukurans.push(selectedUkuran);
  const opt = (v, sel) => `<option value="${String(v).replace(/"/g, '&quot;')}" ${v === sel ? 'selected' : ''}>${v}</option>`;
  const warnaHtml = `<option value="">-- pilih warna --</option>` + warnas.map(w => opt(w, selectedWarna)).join('') + `<option value="__custom__">+ Lainnya (ketik manual)</option>`;
  const ukuranHtml = `<option value="">-- pilih ukuran --</option>` + ukurans.map(u => opt(u, selectedUkuran)).join('') + `<option value="__custom__">+ Lainnya (ketik manual)</option>`;
  return { warnaHtml, ukuranHtml };
}
// Wire 1 pasang <select> (Warna atau Ukuran) + <input> "lainnya" tersembunyi di belakangnya -- toggle
// tampil/sembunyi sesuai pilihan "__custom__", dan panggil sync() sekali di awal (penting krn saat produk
// baru dipilih, opsi select di-reset via innerHTML baru tapi listener lama sudah lepas dari elemen lama).
function wireSelectOtherToggle(selId, otherId) {
  const sel = document.getElementById(selId);
  const other = document.getElementById(otherId);
  if (!sel || !other) return;
  const sync = () => { other.style.display = sel.value === '__custom__' ? '' : 'none'; };
  sel.addEventListener('change', sync);
  sync();
}
// Nilai akhir Warna/Ukuran dari 1 pasang <select>+<input> "lainnya" -- ambil dari input kalau mode custom,
// dari select kalau tidak (dipakai sama persis oleh submit handler form WIP & PO).
function nilaiWarnaUkuranDariForm(selId, otherId) {
  const sel = document.getElementById(selId);
  const other = document.getElementById(otherId);
  if (sel && sel.value === '__custom__') return (other ? other.value : '').trim();
  return sel ? sel.value.trim() : '';
}

// Grid "qty per ukuran" utk form Tambah WIP/PO (2026-11-22, Setiawan: "langsung muncul sizenya apa saja aku
// tinggal isi qty per masing masing size nya, agar tidak perlu satu-satu") -- dipakai HANYA saat TAMBAH data
// baru (mode Edit tetap pakai 1 pasang Ukuran+Qty spt sebelumnya, krn 1 entri yg diedit memang cuma 1 ukuran).
// User isi qty di baris ukuran mana saja yg relevan (boleh banyak sekaligus), submit bikin 1 entri WIP/PO
// per baris yg qty-nya > 0, semua share produk+warna+catatan yg sama (lihat kumpulkanQtyUkuranDariGrid).
function htmlQtyGridUkuran(prefix, produkNama) {
  const { ukurans } = daftarWarnaUkuranProduk(produkNama);
  const baris = ukurans.map(u => `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
      <label style="min-width:70px; margin:0; font-weight:600;">${u}</label>
      <input type="number" min="0" class="${prefix}_qty_ukuran" data-ukuran="${String(u).replace(/"/g, '&quot;')}" placeholder="0" style="width:90px;">
    </div>`).join('');
  return `
    ${baris || '<div class="empty-note">Belum ada data ukuran utk produk ini -- isi manual di bawah.</div>'}
    <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
      <input type="text" id="${prefix}_ukuran_manual" placeholder="+ ukuran lain (ketik manual)" style="flex:1;">
      <input type="number" min="0" id="${prefix}_qty_manual" placeholder="qty" style="width:90px;">
    </div>`;
}
// Kumpulkan {ukuran, qty} dari grid di atas -- hanya baris dgn qty > 0 (baris kosong/0 diabaikan, bukan error).
// Baris manual (kalau ukuran DAN qty>0 diisi) ikut ditambahkan sbg baris tersendiri.
function kumpulkanQtyUkuranDariGrid(prefix) {
  const hasil = [];
  document.querySelectorAll('.' + prefix + '_qty_ukuran').forEach(inp => {
    const qty = Number(inp.value);
    if (qty > 0) hasil.push({ ukuran: inp.dataset.ukuran, qty });
  });
  const manualUkuran = document.getElementById(prefix + '_ukuran_manual');
  const manualQty = document.getElementById(prefix + '_qty_manual');
  if (manualUkuran && manualQty) {
    const u = manualUkuran.value.trim();
    const q = Number(manualQty.value);
    if (u && q > 0) hasil.push({ ukuran: u, qty: q });
  }
  return hasil;
}

function findProduct(nama) { return STATE.products.find(p => p.nama === nama); }
function findPartnerByKode2(kode2) { return STATE.capitalPartners.find(p => p.kode2 === kode2); }
function findPartnerById(id) { return STATE.capitalPartners.find(p => p.id === id); }

function getCurrentHarga(produkNama, size) {
  const p = findProduct(produkNama);
  if (!p || !p.hargaKonveksi || !p.hargaKonveksi[size] || !p.hargaKonveksi[size].length) return null;
  const hist = p.hargaKonveksi[size];
  return hist[hist.length - 1].harga;
}
function addHargaHistory(produkNama, size, harga, sumber) {
  const p = findProduct(produkNama);
  if (!p) return;
  p.hargaKonveksi = p.hargaKonveksi || {};
  p.hargaKonveksi[size] = p.hargaKonveksi[size] || [];
  p.hargaKonveksi[size].push({ harga, tanggal: new Date().toISOString(), sumber: sumber || 'manual' });
}

// Hitung persentase Pembagi Qty SW dari besaran modal kontrak AKTIF (DANA BELUM CAIR) saat ini, per produk (setelah alias)
function computePembagiPct(produkAsli) {
  const produk = capitalPartnerProduk(produkAsli);
  if (STATE.pembagiPctManual[produk]) return STATE.pembagiPctManual[produk]; // manual override menang
  // Kontrak yg SUDAH punya penerus (ada kontrak lain dgn rolledFromKodeKontrak == kode kontrak ini) di-exclude dari
  // perhitungan persentase, TERLEPAS dari status live-nya saat ini. Kenapa: kontrak spt ini sudah "pensiun" --
  // modalnya sudah "diwariskan" ke penerusnya (mis. IDO047 -> IDO049), jadi kalau tetap ikut dihitung di sini
  // JUGA, modal yg SAMA jadi dihitung DUA KALI (sekali lewat kontrak lama, sekali lewat penerusnya) dan
  // menggelembungkan persentase investor itu secara keliru. Ini penting terutama saat "Hitung Ulang Alokasi per
  // Tanggal Penarikan" meng-undo payout lama & mengaktifkan-ulang status kontrak lama (mis. IDO047 dibalikin ke
  // DANA BELUM CAIR) supaya sisa stocknya bisa dipakai FIFO lagi utk reproduksi histori -- reaktivasi status itu
  // TIDAK BOLEH bikin modalnya ikut dihitung lagi di sini kalau penerusnya (mis. IDO049) sudah nyata ada.
  const punyaPenerus = new Set(STATE.contracts.filter(c => c.rolledFromKodeKontrak).map(c => c.rolledFromKodeKontrak));
  const active = STATE.contracts.filter(c => capitalPartnerProduk(c.produk) === produk && c.status === 'DANA BELUM CAIR' && !punyaPenerus.has(c.kodeKontrak));
  const capitalByPartner = {};
  active.forEach(c => {
    const partner = findPartnerById(c.capitalPartnerId);
    if (!partner) return;
    const modal = (c.stockAwal || 0) * (c.hargaModalPcs || 0);
    capitalByPartner[partner.kode2] = (capitalByPartner[partner.kode2] || 0) + modal;
  });
  const total = Object.values(capitalByPartner).reduce((a,b) => a+b, 0);
  if (total <= 0) return {};
  const pct = {};
  Object.entries(capitalByPartner).forEach(([k,v]) => { pct[k] = v / total; });
  return pct;
}

// Kontrak aktif (FIFO) milik 1 capital partner utk 1 produk -- yg paling awal tanggal masuk dgn status DANA BELUM CAIR
function activeContractFor(produkAsli, capitalPartnerId) {
  const list = STATE.contracts
    .filter(c => c.produk === produkAsli && c.capitalPartnerId === capitalPartnerId && c.status === 'DANA BELUM CAIR')
    .sort((a,b) => new Date(a.tanggalMasuk) - new Date(b.tanggalMasuk));
  return list[0] || null;
}

// Hitung berapa Stock Awal (unit UTUH) yg bisa "dibeli" dari gabungan Dana Tunai Baru + (opsional) Saldo Luar
// Kontrak yg sudah ada, dibagi Harga Modal/Pcs -- sisa pecahannya (blm cukup utk 1 unit lagi) dikembalikan
// terpisah supaya bisa disimpan lagi sbg Saldo Luar Kontrak yg baru. Dipakai oleh kalkulator "Hitung Stock
// Awal dari Dana" (tombol preview) DAN submit handler form Tambah Kontrak Baru (harus 1 sumber logika yg
// sama persis, supaya preview yg ditampilkan ke user selalu cocok dgn apa yg beneran disimpan).
function hitungStockAwalDariDanaSaldo(danaBaru, pakaiSaldo, saldoLama, hargaModalPcs) {
  const saldoDipakai = pakaiSaldo ? (saldoLama||0) : 0;
  const totalDana = (danaBaru||0) + saldoDipakai;
  const stockAwal = hargaModalPcs > 0 ? Math.floor(totalDana / hargaModalPcs) : 0;
  const sisa = totalDana - stockAwal * (hargaModalPcs||0);
  return { totalDana, stockAwal, sisa, saldoDipakai };
}

// Generate kode kontrak berikutnya, meniru pola kode kontrak LAMA yg sedang di-rollover (mis. "IMO021" -> "IMO022"),
// tapi dicari nomor TERTINGGI yg sudah dipakai utk kombinasi [investor][huruf produk] itu (bukan cuma +1 dari kode lama),
// supaya tidak tabrakan kalau ada gap/kontrak lain sudah dibuat duluan.
function generateNextKodeKontrak(kodeKontrakLama) {
  const m = String(kodeKontrakLama).match(/^([A-Z]{2})([A-Z])(\d+)$/i);
  if (!m) return kodeKontrakLama + '-2'; // fallback kalau polanya tidak dikenali
  const [, kode2, huruf, numStr] = m;
  const prefix = (kode2 + huruf).toUpperCase();
  const width = numStr.length;
  let maxNum = 0;
  STATE.contracts.forEach(c => {
    const mm = String(c.kodeKontrak).match(/^([A-Z]{2})([A-Z])(\d+)$/i);
    if (mm && (mm[1]+mm[2]).toUpperCase() === prefix) maxNum = Math.max(maxNum, parseInt(mm[3], 10));
  });
  const next = maxNum + 1;
  return prefix + String(next).padStart(width, '0');
}

// Kunci unik utk 1 kasus keputusan rollover di objek `resolutions` (mis. rolloverResolutions). Sengaja
// menyertakan kodeKontrakLama (bukan cuma kode2+produk) -- kalau tidak, kasus "keputusan rollover LANJUTAN"
// (lihat resolveRolloverIntoAllocations, bug 2026-09-11) akan bentrok kuncinya dgn kasus level pertama
// (investor+produk yg sama), padahal keduanya butuh jawaban TERPISAH.
function rolloverCaseKey(a) { return a.kode2 + '|' + a.produk + '|' + a.kodeKontrakLama; }

// Eksekusi keputusan rollover (dari panel di preview batch) -- MENGUBAH result.allocations di tempat
// supaya applyBatchResult() yg jalan setelah ini bisa memproses semuanya spt alokasi normal (bikin kontrak
// baru beneran ke STATE.contracts kalau perlu, atau redistribusi ke investor lain kalau di-stop). BISA
// dipanggil BERKALI-KALI dgn aman utk 1 `result` yg sama (mis. saat ada kasus rollover LANJUTAN yg baru
// ketahuan setelah panggilan sebelumnya) -- tiap panggilan cuma memproses entri yg MASIH `perluKontrakBaru`
// & SUDAH ada jawabannya di `resolutions`; entri yg sudah selesai diproses (flag sudah dihapus) dilewati.
function resolveRolloverIntoAllocations(result, resolutions, tanggalPenarikanForRollover) {
  // Tanggal yg relevan utk penarikan batch ini -- dipakai utk menandai kontrak baru hasil rollover supaya
  // nanti kalau tanggal yg SAMA di-"Hitung Ulang" dari nol, kontrak ini (yg murni lahir dari hasil rollover
  // tanggal ini) bisa dikenali & tidak keliru dianggap "sudah ada dari awal" (lihat beginRecomputeForDate).
  const dateForRollover = tanggalPenarikanForRollover ? String(tanggalPenarikanForRollover).slice(0,10) : (result.dateStr || null);
  const perluList = result.allocations.filter(a => a.perluKontrakBaru);

  // Tahap 1: proses PUTAR PENUH / PUTAR MODAL SAJA dulu -- bikin kontrak baru, supaya kontrak2 baru ini
  // ikut kehitung sbg kandidat kalau ada kasus STOP yg perlu redistribusi di tahap 2.
  const toRemoveTahap1 = [];
  perluList.forEach(a => {
    const key = rolloverCaseKey(a);
    const res = resolutions[key];
    if (!res || res.tipe === 'stop') return;

    // Sebelum sisa unit ini masuk ke kontrak BARU hasil rollover, coba dulu pakaikan ke kontrak2 AKTIF LAIN
    // milik investor yg sama utk produk yg sama yg SUDAH ADA lebih dulu (mis. IDO048), urut FIFO dari
    // tanggalMasuk paling awal. Kontrak yg baru saja habis (a.kodeKontrakLama, mis. IDO047) di-exclude
    // krn stockAkhir/status-nya di STATE.contracts masih STALE di titik ini (baru benar2
    // dikurangi/ditutup nanti di applyBatchResult) -- kalau tidak di-exclude bisa keliru dianggap masih ada isi.
    // CATATAN: kontrak yg merupakan "pewaris asli" dari kontrak yg baru habis ini (c.rolledFromKodeKontrak === a.kodeKontrakLama,
    // mis. IDO049 pewaris dari IDO047) SENGAJA di-exclude dari daftar sibling generik di sini. Kalau tidak di-exclude, dia bisa
    // ikut "disedot" di loop drain-sibling di bawah dan ditandai idSiblingYgDipakai -- akibatnya jadi TIDAK ELIGIBLE lagi utk
    // mekanisme "reuse" (existingUnusedSuccessor) di bawah, dan kontrak DUPLIKAT baru pun keliru dibuat lagi. Pewaris asli harus
    // SELALU ditangani lewat jalur reuse khusus, bukan lewat jalur sibling generik.
    // BUG KEDUA ditemukan 2026-09-11 sewaktu menambah "rollover berantai" (lihat di bawah): kalau kasus ini
    // adalah kasus LANJUTAN (level ke-2+ dari 1 rangkaian rollover berantai dlm batch yg SAMA, mis. a.kodeKontrakLama
    // = IDS003 hasil level-1), kontrak ROOT ASLI di rangkaian ini (mis. IDS002, yg SUDAH dapat alokasi 2 unit di
    // langkah paling awal/allocateUnitsToContracts) TIDAK ikut ter-exclude oleh 2 kondisi di atas (kodeKontrak/
    // rolledFromKodeKontrak-nya beda dgn 'IDS003') -- padahal stockAkhir-nya di STATE msh STALE (blm dikurangi,
    // krn pengurangan stok kontrak baru terjadi nanti di applyBatchResult), jadi keliru dianggap py sisa stok
    // "aktif" yg bisa disedot LAGI -- akibatnya unit yg SAMA bisa ke-drain 2x (dobel hitung). Exclude SEMUA
    // kontrak yg SUDAH py alokasi nyata (bukan placeholder perluKontrakBaru) utk kode2+produk yg SAMA di
    // result.allocations SEJAUH INI -- itu tandanya kapasitasnya SUDAH terpakai di batch ini, brp pun stockAkhir
    // basi yg masih tercatat di STATE.
    const kodeSudahDialokasikanBatchIni = new Set(
      result.allocations.filter(x => x.kode2 === a.kode2 && x.produk === a.produk && x.kodeKontrak && !x.perluKontrakBaru).map(x => x.kodeKontrak)
    );
    const siblingContracts = STATE.contracts
      .filter(c => c.produk === a.produk && c.capitalPartnerId === a.capitalPartnerId
        && c.status === 'DANA BELUM CAIR' && c.kodeKontrak !== a.kodeKontrakLama
        && c.rolledFromKodeKontrak !== a.kodeKontrakLama
        && !kodeSudahDialokasikanBatchIni.has(c.kodeKontrak))
      .sort((x, y) => new Date(x.tanggalMasuk) - new Date(y.tanggalMasuk));

    const qtyAwal = a.qty;
    const orderUnitsAll = a.orderUnits || [];
    let sisaQty = qtyAwal;
    let unitCursor = 0;
    const idSiblingYgDipakai = new Set(); // dikecualikan dari pencarian "kontrak blm kepakai" di bawah -- kontrak
    // ini BARU SAJA kepakai (walau efek pengurangan stock-nya baru nyata nanti di finalize), jangan sampai
    // jugadianggap "belum kepakai" & malah ditimpa ulang jadi kontrak baru hasil rollover.
    siblingContracts.forEach(sc => {
      if (sisaQty <= 0) return;
      const qtyDariSini = Math.min(sisaQty, sc.stockAkhir);
      if (qtyDariSini <= 0) return;
      const subUnits = orderUnitsAll.slice(unitCursor, unitCursor + qtyDariSini);
      unitCursor += qtyDariSini;
      const skuBreakdown = {};
      subUnits.forEach(u => { skuBreakdown[u.sku] = (skuBreakdown[u.sku]||0) + 1; });
      result.allocations.push({
        produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor, capitalPartnerId: a.capitalPartnerId,
        kodeKontrak: sc.kodeKontrak, contractId: sc.id, qty: qtyDariSini, rate: sc.nilaiMargin, payout: qtyDariSini*sc.nilaiMargin,
        catatan: `${qtyDariSini} unit sisa dari ${a.kodeKontrakLama} (habis) dipakaikan dulu ke kontrak aktif ${sc.kodeKontrak} milik ${a.namaInvestor} sebelum ke kontrak baru hasil rollover`,
        orderUnits: subUnits, skuBreakdown, hargaModalPcs: sc.hargaModalPcs,
      });
      idSiblingYgDipakai.add(sc.id);
      sisaQty -= qtyDariSini;
    });
    const qtyDariSibling = qtyAwal - sisaQty;

    // Kontrak baru hasil rollover TETAP dibuat (utk jejak/lineage & dipakai batch berikutnya), walau
    // sisaQty di titik ini sudah 0 (artinya semua sisa unit sudah tertampung kontrak aktif lama di atas).
    const modalLama = a.qtyKontrakLama * a.hargaModalPcsLama;
    const profitLama = a.qtyKontrakLama * a.nilaiMarginLama;
    const modalBaru = res.tipe === 'putar_penuh' ? (modalLama + profitLama) : modalLama;
    const stockAwalBaru = Math.floor(modalBaru / res.hargaBaru);
    const sisaRp = modalBaru - (stockAwalBaru * res.hargaBaru);
    STATE.saldoDiluarKontrak[a.capitalPartnerId] = (STATE.saldoDiluarKontrak[a.capitalPartnerId] || 0) + sisaRp;
    // Kalau SUDAH ADA kontrak hasil rollover dari sumber yg SAMA (a.kodeKontrakLama) yg BELUM PERNAH kepakai
    // sama sekali (stockAkhir === stockAwal, blm ada 1 unit pun terjual), PAKAI ULANG kontrak itu -- JANGAN
    // bikin kontrak baru lagi. Tanpa ini, tiap kali tanggal yg sama di-hitung ulang berkali2 (mis. sambil
    // ganti2 versi perbaikan) & kebetulan kontrak lama itu blm sempat dibersihkan otomatis, numpuk kontrak
    // duplikat kosong (nyata terjadi: IDO049, IDO050, IDO051 identik semua muncul dari 1 sumber IDO047) yg
    // ikut menggelembungkan modal investor itu di computePembagiPct & mencuri jatah investor lain.
    const existingUnusedSuccessor = STATE.contracts.find(c =>
      c.rolledFromKodeKontrak === a.kodeKontrakLama && c.capitalPartnerId === a.capitalPartnerId &&
      c.produk === a.produk && c.stockAkhir === c.stockAwal && !idSiblingYgDipakai.has(c.id)
    );
    let kontrakBaru;
    if (existingUnusedSuccessor) {
      // Samakan syaratnya dgn keputusan yg BARU saja diambil (harga baru dari percobaan sebelumnya bisa saja
      // beda) -- supaya tidak "nyangkut" pakai syarat lama yg sudah tidak relevan lagi.
      existingUnusedSuccessor.hargaModalPcs = res.hargaBaru;
      existingUnusedSuccessor.stockAwal = stockAwalBaru;
      existingUnusedSuccessor.stockAkhir = stockAwalBaru;
      existingUnusedSuccessor.rolledTipe = res.tipe;
      existingUnusedSuccessor.rolledForTanggalPenarikan = dateForRollover;
      kontrakBaru = existingUnusedSuccessor;
    } else {
      const kodeBaru = generateNextKodeKontrak(a.kodeKontrakLama);
      kontrakBaru = {
        id: uid('ct'), produk: a.produk, capitalPartnerId: a.capitalPartnerId, kodeKontrak: kodeBaru,
        tanggalMasuk: new Date().toISOString(), stockAwal: stockAwalBaru, stockAkhir: stockAwalBaru,
        hargaModalPcs: res.hargaBaru, nilaiMargin: a.nilaiMarginLama, status: 'DANA BELUM CAIR',
        rolledFromKodeKontrak: a.kodeKontrakLama, rolledTipe: res.tipe,
        rolledForTanggalPenarikan: dateForRollover,
      };
      STATE.contracts.push(kontrakBaru);
    }

    // Catat ke rolloverLog (2026-11-13, laporan "rollover hari ini") -- SELALU dicatat di titik ini terlepas
    // kontrakBaru ini nanti langsung habis lagi di batch yg sama atau tidak. STATE.contracts sendiri TIDAK bisa
    // diandalkan sbg riwayat krn kontrak yg sudah DANA SUDAH CAIR tidak tampil lagi di tab Kelola Kontrak.
    STATE.rolloverLog.push({
      id: uid('rlog'), waktu: new Date().toISOString(), tanggalPenarikanBatch: dateForRollover,
      produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor, capitalPartnerId: a.capitalPartnerId,
      kodeKontrakLama: a.kodeKontrakLama, tipe: res.tipe, kodeKontrakBaru: kontrakBaru.kodeKontrak,
      kontrakBaruDipakaiUlang: !!existingUnusedSuccessor, hargaLama: a.hargaModalPcsLama, hargaBaru: res.hargaBaru,
      modalLama, profitLama, modalBaru, stockAwalBaru, sisaRp, qtyDariSibling,
      qtyKeKontrakBaru: Math.min(sisaQty, stockAwalBaru),
    });

    if (sisaQty <= 0) {
      // Semua sisa unit sudah tertampung kontrak aktif lama -- entri placeholder ini tidak perlu jadi payout lagi.
      toRemoveTahap1.push(a);
      delete a.perluKontrakBaru;
      return;
    }

    const qtyAlokasi = Math.min(sisaQty, stockAwalBaru);
    const subUnitsBaru = orderUnitsAll.slice(unitCursor, unitCursor + qtyAlokasi);
    const skuBreakdownBaru = {};
    subUnitsBaru.forEach(u => { skuBreakdownBaru[u.sku] = (skuBreakdownBaru[u.sku]||0) + 1; });
    a.kodeKontrak = kontrakBaru.kodeKontrak; a.contractId = kontrakBaru.id; a.qty = qtyAlokasi;
    a.orderUnits = subUnitsBaru; a.skuBreakdown = skuBreakdownBaru;
    a.rate = a.nilaiMarginLama; a.payout = qtyAlokasi * a.nilaiMarginLama;
    // BUG (dilaporkan user 2026-09-04): a.hargaModalPcs dulu TIDAK PERNAH di-set di sini, jadi tetap null
    // (dari placeholder awal saat masih perluKontrakBaru) -- akibatnya payout hasil rollover (kontrak BARU,
    // mis. IDS002 penerus IDS001) tersimpan dgn hargaModalPcs:null, & Laporan Penarikan (renderKontrakDetailTable,
    // Harga = payout.hargaModalPcs) menampilkan Harga "-" dan Total Rp0 walau qty-nya nyata ada.
    a.hargaModalPcs = kontrakBaru.hargaModalPcs;
    // BUG KEDUA (dilaporkan user 2026-09-11, kasus nyata IDS002->IDS003): kalau kontrak BARU hasil rollover
    // ternyata masih TIDAK CUKUP menampung semua sisa unit (mis. kontrak lama cuma 20pcs tapi yg cair sekaligus
    // 23pcs sisa), unit lebihnya (qtyAlokasi < sisaQty) DULU cuma disebut di teks catatan ("sisanya perlu
    // ditangani manual") tapi TIDAK PERNAH benar2 dialokasikan ke kontrak/payout manapun -- HILANG tanpa jejak,
    // catatannya pun tidak pernah tampil di kolom manapun di Laporan Penarikan. Sesuai keputusan user: JANGAN
    // auto-lanjut rollover sendiri -- munculkan LAGI 1 kasus "perlu keputusan rollover" (persis kasus normal
    // kontrak habis), kali ini "kontrak lama"-nya adalah kontrak BARU yg baru saja dibuat ini (kontrakBaru,
    // SUDAH benar2 ada di STATE.contracts, bukan hipotesis/preview) -- supaya user WAJIB memutuskan lagi
    // (Putar Penuh/Modal Saja/Stop) sebelum sisa unit ini ikut disimpan. Kalau resolveRolloverIntoAllocations
    // dipanggil ulang (user klik Proses lagi setelah mengisi keputusan susulan ini), entri baru ini ikut
    // terproses lewat jalur yg SAMA PERSIS (bukan reimplementasi terpisah). CATATAN: qtyDariSibling/pengecekan
    // kontrak aktif lain SENGAJA tidak diulang lagi utk level lanjutan ini -- kontrak yg baru dibuat dianggap
    // "polos"/pertama pakai, konsisten dgn cara kontrakHabisPersis pertama kali ditangani.
    const shortfallQty = sisaQty - qtyAlokasi;
    if (shortfallQty > 0) {
      const sisaUnitsLanjutan = orderUnitsAll.slice(unitCursor + qtyAlokasi);
      result.allocations.push({
        produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor, capitalPartnerId: a.capitalPartnerId,
        kodeKontrak: null, contractId: null, qty: shortfallQty, rate: null, payout: null,
        catatan: `⚠ Kontrak ${kontrakBaru.kodeKontrak} (baru saja dibuat dari rollover ${a.kodeKontrakLama}) milik ${a.namaInvestor} utk ${a.produk} cuma cukup utk ${qtyAlokasi} dari ${sisaQty} unit -- sisa ${shortfallQty} unit butuh keputusan rollover LANJUTAN (Putar Penuh/Modal Saja/Stop) sebelum bisa disimpan.`,
        orderUnits: sisaUnitsLanjutan, skuBreakdown: {}, hargaModalPcs: null, perluKontrakBaru: true,
        kodeKontrakLama: kontrakBaru.kodeKontrak, qtyKontrakLama: kontrakBaru.stockAwal,
        hargaModalPcsLama: kontrakBaru.hargaModalPcs, nilaiMarginLama: a.nilaiMarginLama,
      });
    }
    a.catatan = `Rollover (${res.tipe==='putar_penuh'?'putar penuh':'putar modal saja'}) dari ${a.kodeKontrakLama} -> ${kontrakBaru.kodeKontrak}` +
      (qtyDariSibling > 0 ? ` -- ${qtyDariSibling} unit sudah dipakaikan dulu ke kontrak aktif lama sebelum ke kontrak baru ini` : '') +
      (shortfallQty > 0 ? ` -- ⚠ kontrak baru cuma cukup utk ${qtyAlokasi} dari ${sisaQty} unit, sisa ${shortfallQty} unit dijadikan kasus keputusan rollover baru (lihat di bawah)` : '');
    delete a.perluKontrakBaru;
  });
  toRemoveTahap1.forEach(a => { const idx = result.allocations.indexOf(a); if (idx >= 0) result.allocations.splice(idx, 1); });

  // Tahap 2: proses STOP -- hapus entri ini, redistribusi qty-nya ke investor aktif lain (kontrak baru dari tahap 1 ikut terhitung)
  const toRemove = [];
  perluList.forEach(a => {
    const key = rolloverCaseKey(a);
    const res = resolutions[key];
    if (!res || res.tipe !== 'stop') return;
    toRemove.push(a);
    // Kontrak lama BELUM ditutup di titik ini (penutupan normal baru terjadi nanti di applyBatchResult).
    // Karena investor pilih STOP, tutup SEKARANG supaya tidak ikut kehitung di persentase redistribusi di bawah.
    const kontrakLama = STATE.contracts.find(c => c.kodeKontrak === a.kodeKontrakLama);
    if (kontrakLama) { kontrakLama.stockAkhir = 0; kontrakLama.status = 'DANA SUDAH CAIR'; }
    const pct = computePembagiPct(a.produk); // sekarang benar2 exclude kontrak yg baru ditutup ini
    if (!Object.keys(pct).length) {
      result.allocations.push({ produk: a.produk, kode2: null, namaInvestor: null, kodeKontrak: null, qty: a.qty, rate: null, payout: null,
        catatan: `${a.qty} unit dari ${a.namaInvestor} (STOP) tidak bisa diredistribusi -- tidak ada kontrak aktif lain utk ${a.produk}.` });
      STATE.rolloverLog.push({
        id: uid('rlog'), waktu: new Date().toISOString(), tanggalPenarikanBatch: dateForRollover,
        produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor, capitalPartnerId: a.capitalPartnerId,
        kodeKontrakLama: a.kodeKontrakLama, tipe: 'stop', qty: a.qty, redistribusi: [],
      });
      return;
    }
    const floors = allocateLargestRemainder(a.qty, pct);
    const redistribusiLog = [];
    Object.entries(floors).forEach(([kode2b, qtyb]) => {
      if (qtyb <= 0) return;
      const partnerB = findPartnerByKode2(kode2b);
      const kontrakB = partnerB ? activeContractFor(a.produk, partnerB.id) : null;
      redistribusiLog.push({ kode2: kode2b, namaInvestor: partnerB ? partnerB.nama : kode2b, qty: qtyb });
      result.allocations.push({
        produk: a.produk, kode2: kode2b, namaInvestor: partnerB ? partnerB.nama : kode2b, capitalPartnerId: partnerB ? partnerB.id : null,
        kodeKontrak: kontrakB ? kontrakB.kodeKontrak : null, contractId: kontrakB ? kontrakB.id : null,
        qty: qtyb, rate: kontrakB ? kontrakB.nilaiMargin : null, payout: kontrakB ? qtyb*kontrakB.nilaiMargin : null,
        catatan: `Redistribusi dari ${a.namaInvestor} (kontrak di-STOP)` + (kontrakB ? '' : ' -- TIDAK ADA kontrak aktif, cek manual'),
        orderUnits: a.orderUnits ? a.orderUnits.slice(0, qtyb) : [], skuBreakdown: {}, hargaModalPcs: kontrakB ? kontrakB.hargaModalPcs : null,
      });
    });
    STATE.rolloverLog.push({
      id: uid('rlog'), waktu: new Date().toISOString(), tanggalPenarikanBatch: dateForRollover,
      produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor, capitalPartnerId: a.capitalPartnerId,
      kodeKontrakLama: a.kodeKontrakLama, tipe: 'stop', qty: a.qty, redistribusi: redistribusiLog,
    });
  });
  toRemove.forEach(a => { const idx = result.allocations.indexOf(a); if (idx >= 0) result.allocations.splice(idx, 1); });
}

function parseWarna(variasiText) {
  if (!variasiText) return null;
  const parts = String(variasiText).split(',').map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;
  const first = parts[0].toUpperCase();
  if (SIZE_TOKENS.has(first)) return null;
  return parts[0];
}
function deriveWarnaFromSku(sku) {
  if (!sku || String(sku).length < 6) return null;
  const kode = String(sku).toUpperCase().slice(3,6);
  return STATE.colorCodeMap[kode] || null;
}
// "Warna Terlaris" (Dashboard, breakdown per produk) digabung per warna DASAR -- varian akhiran bahan
// ("Waterproof", mis. "Navy Waterproof"; "Polar WB"/"Polar", mis. "Army Polar WB", ditambah 2026-10-27)
// sengaja digabung ke warna dasarnya ("Navy", "Army") DI BREAKDOWN INI SAJA (dikonfirmasi user
// 2026-09-10 utk Waterproof, 2026-10-27 utk Polar/Polar WB), krn dari sisi warna dianggap sama, cuma
// beda bahan -- supaya tidak kesannya ada warna beda padahal sama. Data SKU/produk asli TIDAK diubah,
// ini murni pengelompokan tampilan.
function normalizeWarnaUtkBreakdown(w) {
  if (!w) return w;
  const base = String(w).replace(/\s+(waterproof|polar\s*wb|polar)\s*$/i, '').trim();
  return base || w;
}
function lookupHargaKonveksiBySku(sku) {
  if (!sku) return null;
  const skuUpper = String(sku).toUpperCase();
  const prefix = skuUpper.slice(0,3);
  const p = STATE.products.find(pr => pr.prefix === prefix);
  // Produk "Tanpa Ukuran" (2026-11-20, kasus DEO/"NS") -- lewati pencocokan kode ukuran SEPENUHNYA, langsung
  // pakai 1 harga tunggal yg disimpan di hargaKonveksi[UKURAN_TANPA_SIZE_KEY]. Cek ini SEBELUM baca 2 huruf
  // akhir SKU sbg sizeCode, krn utk produk ini 2 huruf itu adalah kode VARIAN/TIPE (bukan ukuran) dan memang
  // tidak boleh dicocokkan ke SIZE_CODE_MAP. Produk yg TIDAK ditandai (tanpaUkuran falsy -- termasuk SEMUA
  // produk lama yg sudah ada sebelum fitur ini) jalan lewat path asli di bawah, tidak berubah sama sekali.
  if (p && p.tanpaUkuran) return getCurrentHarga(p.nama, UKURAN_TANPA_SIZE_KEY);
  const sizeCode = skuUpper.slice(-2);
  const ukuran = SIZE_CODE_MAP[sizeCode];
  if (p && ukuran) return getCurrentHarga(p.nama, ukuran);
  return null;
}
// Jelaskan KENAPA lookupHargaKonveksiBySku(sku) gagal (null) utk 1 SKU tertentu -- dipakai di Dashboard
// (panel Omzet per Toko/Platform) supaya user langsung tahu SKU mana yg perlu dibenerin di Data Master,
// bukan cuma "ada yg kurang" tanpa rincian.
function diagnoseMissingHargaKonveksi(sku) {
  if (!sku) return 'SKU kosong pada baris order (data import tidak lengkap)';
  const skuUpper = String(sku).toUpperCase();
  const prefix = skuUpper.slice(0,3);
  const p = STATE.products.find(pr => pr.prefix === prefix);
  if (!p) return `Prefix SKU "${prefix}" belum terdaftar ke produk manapun (Data Master > Produk)`;
  // Produk "Tanpa Ukuran" (lihat lookupHargaKonveksiBySku) -- rincian sebabnya beda, tidak menyinggung soal
  // "kode ukuran" sama sekali krn memang tidak relevan utk produk ini.
  if (p.tanpaUkuran) {
    const h = getCurrentHarga(p.nama, UKURAN_TANPA_SIZE_KEY);
    if (h == null) return `Harga konveksi ${p.nama} (produk Tanpa Ukuran) belum pernah diisi`;
    return 'Sebab tidak diketahui -- cek manual';
  }
  const sizeCode = skuUpper.slice(-2);
  const ukuran = SIZE_CODE_MAP[sizeCode];
  if (!ukuran) return `2 digit akhir SKU ("${sizeCode}") bukan kode ukuran yg dikenali`;
  const h = getCurrentHarga(p.nama, ukuran);
  if (h == null) return `Harga konveksi ${p.nama} ukuran ${ukuran} belum pernah diisi`;
  return 'Sebab tidak diketahui -- cek manual';
}

/* =========================================================================
   IMPORT MINGGUAN -- helper baca Excel & kategorisasi biaya (tervalidasi Fase 1)
   ========================================================================= */
function sheetToRows(ws) {
  // baca SEMUA baris apa adanya, termasuk kalau !ref rusak (bug TikTok export) -> scan cell keys manual
  const XU = XLSX.utils;
  let ref = ws['!ref'];
  let range = ref ? XU.decode_range(ref) : null;
  let maxR = range ? range.e.r : 0, maxC = range ? range.e.c : 0;
  Object.keys(ws).forEach(k => {
    if (k[0] === '!') return;
    const cell = XU.decode_cell(k);
    if (cell.r > maxR) maxR = cell.r;
    if (cell.c > maxC) maxC = cell.c;
  });
  const rows = [];
  for (let r = 0; r <= maxR; r++) {
    const row = [];
    for (let c = 0; c <= maxC; c++) {
      const cell = ws[XU.encode_cell({r, c})];
      row.push(cell ? cell.v : null);
    }
    rows.push(row);
  }
  return rows;
}
function rowsToObjects(rows, headerRowIdx, dataStartIdx) {
  const header = rows[headerRowIdx];
  return rows.slice(dataStartIdx).map(r => {
    const o = {}; header.forEach((h,i) => { if (h) o[h] = r[i]; }); return o;
  }).filter(o => Object.values(o).some(v => v !== null && v !== undefined));
}
