// Bersihkan "Menunggu Cair" dari order yg TERNYATA sudah ada di Database Penjualan (sudah cair beneran),
// tapi ketinggalan di pendingOrderSku krn belum pernah dibersihkan (mis. dari sebelum perbaikan ini ada).
// Batalkan alokasi kontrak utk 1 order ID -- order TETAP tercatat sbg penjualan di Database Penjualan,
// tapi stok kontrak dikembalikan & payout terkait dihapus (dianggap "tidak terikat modal investor manapun").
// HANYA aman kalau payout itu PERSIS 1 order (spt hasil Tambah Transaksi Manual) -- kalau payout itu gabungan
// dari BEBERAPA order sekaligus (batch normal), TIDAK disentuh (supaya tidak salah kurangi qty order lain).
function reverseContractAllocation(orderId) {
  const payoutsTerkait = STATE.payouts.filter(p => (p.orderIds||[]).includes(orderId));
  let nDibatalkan = 0, nDilewati = 0, totalQtyDikembalikan = 0;
  payoutsTerkait.forEach(p => {
    if ((p.orderIds||[]).length > 1) { nDilewati++; return; } // gabungan bbrp order, tidak aman disentuh
    const kontrak = STATE.contracts.find(c => c.kodeKontrak === p.kodeKontrak);
    if (kontrak) {
      kontrak.stockAkhir += p.qty;
      if (kontrak.status !== 'DANA BELUM CAIR') kontrak.status = 'DANA BELUM CAIR';
      totalQtyDikembalikan += p.qty;
    }
    const idx = STATE.payouts.indexOf(p);
    STATE.payouts.splice(idx, 1);
    nDibatalkan++;
  });
  return { nDibatalkan, nDilewati, totalQtyDikembalikan };
}

// ==========================================================================
// HITUNG ULANG ALOKASI PER TANGGAL PENARIKAN
// ==========================================================================
// Menggantikan pendekatan lama "alokasikanOrderKeKontrak" (pilih 1 kontrak per order) -- ternyata SALAH
// utk order yg isinya BANYAK produk sekaligus (mis. 585620049046766664: 1 order, 3 SKU beda ukuran, semua
// produk OSWALD). Pendekatan yg benar (sesuai arahan user): jangan ikat ke 1 kontrak manual, tapi HITUNG ULANG
// SEMUA alokasi utk 1 Tanggal Penarikan sekaligus -- gabungkan SEMUA order Urban Outdoor yg tercatat di
// tanggal itu (STATE.orderDb, bukan cuma 1 order yg "hilang" payoutnya), lalu jalankan ulang algoritma
// FIFO/largest-remainder yg SAMA (allocateUnitsToContracts) spt batch normal. Ini otomatis membetulkan
// order manapun di tanggal itu yg pernah "nyangkut" tanpa payout (mis. akibat Batalkan Alokasi), TANPA perlu
// tahu order mana persisnya yg bermasalah.
//
// User sudah diberi tahu & MEMILIH SENDIRI opsi paling destruktif: HAPUS SEMUA payout investor di tanggal itu,
// lalu hitung ulang dari nol (bukan cuma menambal yg kurang) -- supaya tidak ada duplikat/salah hitung kalau
// sebagian sudah benar & sebagian belum. Konsekuensi yg disadari & diterima: payout yg sudah ditandai
// "Sudah Dibayar" di tanggal itu HILANG status itu (payout lama dihapus, diganti payout baru blm dibayar) --
// harus ditandai ulang manual. Krn itu prosesnya dipecah 3 tahap spy ada jaring pengaman:
//   1. summarizeRecomputeForDate -- READ-ONLY, utk ditampilkan sbg peringatan/konfirmasi SEBELUM apa2 dihapus.
//   2. beginRecomputeForDate -- MENGHAPUS payout lama & mengembalikan stok kontrak (disimpan snapshotnya di
//      recomputeUndoSnapshot supaya BISA dibatalkan), lalu menghitung alokasi baru (BELUM ditulis sbg payout).
//      Kalau ada kasus "Perlu Kontrak Baru" (rollover), user masih harus memutuskan dulu di step ini.
//   3a. undoRecomputeForDate -- kalau user klik Batal di titik ini: kembalikan PERSIS spt semula.
//   3b. finalizeRecomputeForDate -- kalau user konfirmasi: terapkan alokasi baru (kurangi stok, buat payout
//       baru sumberData 'hitung_ulang_tanggal'), lalu saveState(). Setelah ini TIDAK bisa di-undo lagi.
function summarizeRecomputeForDate(dateStr) {
  const payoutsForDate = STATE.payouts.filter(p => p.tanggalDihitung && p.tanggalDihitung.slice(0,10) === dateStr);
  const sudahDibayar = payoutsForDate.filter(p => p.tanggalDibayar);
  const rowsForDate = STATE.orderDb.filter(r => r.brand === 'URBAN OUTDOOR' && r.kategoriJual !== 'PO' && r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) === dateStr && r.pendapatan != null && r.status !== 'Gagal');
  return {
    dateStr,
    nPayoutLama: payoutsForDate.length,
    totalQtyPayoutLama: payoutsForDate.reduce((s,p) => s + (p.qty||0), 0),
    totalRpPayoutLama: payoutsForDate.reduce((s,p) => s + (p.payout||0), 0),
    sudahDibayarList: sudahDibayar.map(p => ({ namaInvestor: p.namaInvestor, kodeKontrak: p.kodeKontrak, qty: p.qty, payout: p.payout })),
    // Rincian SEMUA payout yg ada saat ini (bukan cuma yg sudah dibayar) -- supaya kalau ada yg kelihatan
    // ganjil (mis. lebih dari 1 baris utk kode kontrak yg sama di tanggal yg sama, sisa dari proses lama
    // yg belum bersih), langsung kelihatan di sini SEBELUM diputuskan hitung ulang lagi, bukan ketebak2an.
    rincianPayoutLama: payoutsForDate.map(p => ({ namaInvestor: p.namaInvestor, kodeKontrak: p.kodeKontrak, produk: p.produk, qty: p.qty, payout: p.payout, sumberData: p.sumberData||'-', sudahDibayar: !!p.tanggalDibayar })),
    nOrderRows: rowsForDate.length,
    totalQtyOrderRows: rowsForDate.reduce((s,r) => s + (r.qty||1), 0),
  };
}

let recomputeUndoSnapshot = null; // { dateStr, deletedPayouts: [...], contractChanges: [{contractId, stockDelta, statusWasClosedBefore}] }

// MUTASI: hapus semua payout investor di tanggal ini & kembalikan stok kontrak terkait, lalu hitung ulang
// alokasi dari SEMUA baris Database Penjualan (Urban Outdoor) di tanggal itu. Alokasi hasilnya BELUM
// dituliskan sbg payout baru -- masih perlu lolos finalizeRecomputeForDate (& keputusan rollover kalau ada).
function beginRecomputeForDate(dateStr) {
  if (recomputeUndoSnapshot) throw new Error('Ada proses hitung ulang lain yg belum selesai/dibatalkan -- selesaikan atau batalkan itu dulu.');
  const payoutsForDate = STATE.payouts.filter(p => p.tanggalDihitung && p.tanggalDihitung.slice(0,10) === dateStr);
  const snapshot = { dateStr, deletedPayouts: JSON.parse(JSON.stringify(payoutsForDate)), contractChanges: [] };

  payoutsForDate.forEach(p => {
    const kontrak = STATE.contracts.find(c => c.kodeKontrak === p.kodeKontrak);
    if (kontrak) {
      snapshot.contractChanges.push({ contractId: kontrak.id, stockDelta: p.qty, statusWasClosedBefore: kontrak.status === 'DANA SUDAH CAIR' });
      kontrak.stockAkhir += p.qty;
      if (kontrak.status !== 'DANA BELUM CAIR') kontrak.status = 'DANA BELUM CAIR';
    }
    const idx = STATE.payouts.indexOf(p);
    if (idx >= 0) STATE.payouts.splice(idx, 1);
  });

  // CATATAN (koreksi dari versi sebelumnya): kontrak hasil rollover yg lahir dari tanggal ini (mis. IDO049)
  // SENGAJA TIDAK disingkirkan di sini. Sempat dicoba (versi sebelumnya menghapus kontrak semacam ini kalau
  // blm pernah kepakai), tapi itu keliru -- begitu keputusan rollover (Putar Penuh/Modal Saja) sudah diambil
  // & kontraknya dibuat, itu MODAL NYATA investor & harus tetap ikut dihitung persentasenya di
  // computePembagiPct(), persis spt kontrak manapun sebelum kepakai pertama kali. Yg sebenarnya perlu dicegah
  // hanyalah DUPLIKAT (kontrak baru dibuat lagi tiap kali tanggal yg sama dihitung ulang) -- itu sudah
  // ditangani di resolveRolloverIntoAllocations (pakai ulang kontrak yg blm kepakai, bukan bikin baru lagi)
  // & lewat alat manual "Bersihkan Kontrak Rollover Duplikat" utk beresin sisa2 duplikat yg sudah terlanjur ada.
  recomputeUndoSnapshot = snapshot;

  const rowsForDate = STATE.orderDb.filter(r => r.brand === 'URBAN OUTDOOR' && r.kategoriJual !== 'PO' && r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) === dateStr && r.pendapatan != null && r.status !== 'Gagal');
  const qtyPerProduk = {};
  rowsForDate.forEach(r => { const cp = capitalPartnerProduk(r.produk); qtyPerProduk[cp] = (qtyPerProduk[cp]||0) + (r.qty||1); });
  const cairSkuRowsForDate = rowsForDate.map(r => ({ orderId: r.orderId, sku: r.sku, qty: r.qty||1, produk: r.produk }));
  const allocations = allocateUnitsToContracts(qtyPerProduk, cairSkuRowsForDate);

  return { dateStr, allocations, qtyPerProduk, rowsForDate, nPayoutLamaDihapus: payoutsForDate.length };
}

// Batalkan proses hitung ulang yg SEDANG preview (setelah beginRecomputeForDate, SEBELUM finalizeRecomputeForDate)
// -- kembalikan payout lama & stok kontrak PERSIS spt sebelum beginRecomputeForDate dipanggil.
function undoRecomputeForDate() {
  if (!recomputeUndoSnapshot) return;
  const snap = recomputeUndoSnapshot;
  snap.contractChanges.forEach(cc => {
    const kontrak = STATE.contracts.find(c => c.id === cc.contractId);
    if (kontrak) {
      kontrak.stockAkhir -= cc.stockDelta;
      if (cc.statusWasClosedBefore && kontrak.stockAkhir <= 0) kontrak.status = 'DANA SUDAH CAIR';
    }
  });
  snap.deletedPayouts.forEach(p => STATE.payouts.push(p));
  recomputeUndoSnapshot = null;
}

// FINALISASI: dipanggil setelah keputusan rollover (kalau ada, lewat resolveRolloverIntoAllocations) sudah
// selesai. Menulis alokasi baru sbg payout baru (sumberData 'hitung_ulang_tanggal') + mengurangi stok kontrak
// sesuai hasil akhir, lalu saveState(). Setelah ini recomputeUndoSnapshot dibuang -- tidak bisa di-undo lagi.
async function finalizeRecomputeForDate(result, rolloverResolutions) {
  if (rolloverResolutions && Object.keys(rolloverResolutions).length) {
    resolveRolloverIntoAllocations(result, rolloverResolutions, result.dateStr);
  }
  // Sama spt finalizeManualTransaction: kalau kontrak baru hasil rollover ternyata masih kurang, kasus
  // keputusan LANJUTAN baru muncul di result.allocations -- JANGAN lanjut hapus payout lama/simpan dulu.
  if (result.allocations.some(a => a.perluKontrakBaru)) {
    return { needsMoreDecisions: true };
  }
  const tglIso = new Date(result.dateStr + 'T00:00:00.000Z').toISOString();
  result.allocations.forEach(a => {
    if (!a.contractId) return;
    const c = STATE.contracts.find(x => x.id === a.contractId);
    if (!c) return;
    c.stockAkhir = Math.max(0, (c.stockAkhir||0) - a.qty);
    if (c.stockAkhir === 0) c.status = 'DANA SUDAH CAIR';
  });
  let nPayoutBaru = 0;
  result.allocations.forEach(a => {
    if (!a.capitalPartnerId) return;
    STATE.payouts.push({
      id: uid('po'), tanggalDihitung: tglIso, produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor,
      capitalPartnerId: a.capitalPartnerId, kodeKontrak: a.kodeKontrak, qty: a.qty, rate: a.rate, payout: a.payout,
      tanggalDibayar: null, hargaModalPcs: a.hargaModalPcs||null, skuBreakdown: a.skuBreakdown||{},
      orderIds: [...new Set((a.orderUnits||[]).map(u=>u.orderId))], sumberData: 'hitung_ulang_tanggal',
    });
    nPayoutBaru++;
  });
  recomputeUndoSnapshot = null;
  await saveState();
  return { nPayoutBaru };
}

// ==========================================================================
// KOREKSI TANGGAL PENARIKAN YG SALAH INPUT
// ==========================================================================
// Bukan utk hitung ulang alokasi -- ini utk kasus Tanggal Penarikan-nya sendiri yg SALAH tercatat di Database
// Penjualan (mis. seharusnya 28/08 tapi kesimpan 27/08, krn salah pilih tanggal saat Tambah Transaksi Manual/
// import). HANYA mengubah field tanggalPenarikan di baris orderDb yg cocok -- TIDAK menyentuh payout sama
// sekali. DIBLOKIR kalau order ini SUDAH punya payout investor (STATE.payouts.orderIds mengandung order ini)
// -- supaya tidak menciptakan payout yg "nyasar" ke tanggal lama sementara orderDb-nya sudah pindah tanggal
// (payout & orderDb harus tetap match tanggalnya, krn Hitung Ulang Alokasi & laporan lain mengelompokkan
// berdasarkan tanggal ini). Kalau order-nya sudah py payout, selesaikan/pindahkan dulu (mis. Batalkan Alokasi,
// atau Hitung Ulang Alokasi di tanggal lama) sebelum koreksi tanggal di sini.
function previewKoreksiTanggalPenarikan(orderIds) {
  const rows = STATE.orderDb.filter(r => orderIds.includes(r.orderId));
  if (!rows.length) throw new Error('Tidak ditemukan baris Database Penjualan utk Order ID tsb.');
  const tanggalLamaSet = [...new Set(rows.map(r => r.tanggalPenarikan ? r.tanggalPenarikan.slice(0,10) : null))];
  const payoutsTerkait = STATE.payouts.filter(p => orderIds.some(id => (p.orderIds||[]).includes(id)));
  return { rows, tanggalLamaSet, nRows: rows.length, totalQty: rows.reduce((s,r)=>s+(r.qty||1),0), adaPayoutTerkait: payoutsTerkait.length > 0, payoutsTerkait };
}

function terapkanKoreksiTanggalPenarikan(orderIds, tanggalBaruStr) {
  const payoutsTerkait = STATE.payouts.filter(p => orderIds.some(id => (p.orderIds||[]).includes(id)));
  if (payoutsTerkait.length) throw new Error('Order ini sudah punya payout investor -- selesaikan/pindahkan payoutnya dulu (mis. Batalkan Alokasi, atau Hitung Ulang Alokasi di tanggal lama) sebelum mengubah Tanggal Penarikan.');
  const tglIso = new Date(tanggalBaruStr + 'T00:00:00.000Z').toISOString();
  let nUpdated = 0;
  STATE.orderDb.forEach(r => { if (orderIds.includes(r.orderId)) { r.tanggalPenarikan = tglIso; nUpdated++; } });
  return { nUpdated };
}

// Pembayaran Konveksi/Supplier (STATE.vendorPayouts) TIDAK menyimpan orderIds sama sekali -- cuma agregat
// per [tanggalDihitung, brand] (lihat applyBatchResult: 1 entri vendorPayouts bisa mewakili BANYAK order
// sekaligus dari 1 batch). Krn itu koreksi tanggal di atas SENGAJA tidak ikut memindahkan vendorPayouts --
// beresiko salah kalau entrinya ternyata gabungan bbrp order. Fungsi ini HANYA menganggap suatu entri
// vendorPayouts "aman dipindah" kalau, SETELAH koreksi orderDb di atas, sudah TIDAK ADA SATU PUN baris
// orderDb (brand apapun) yg masih mengacu ke tanggal lama itu -- artinya tanggal lama itu memang sudah
// "kosong" & entri vendorPayouts yg nyangkut di sana pasti murni milik order yg baru saja dipindah, bukan
// tercampur order lain yg TIDAK ikut dipindah.
function cariVendorPayoutYatimSetelahKoreksi(tanggalLamaStr) {
  const masihAdaOrderDb = STATE.orderDb.some(r => r.tanggalPenarikan && r.tanggalPenarikan.slice(0,10) === tanggalLamaStr);
  if (masihAdaOrderDb) return []; // tanggal lama masih dipakai order lain -- jangan sentuh, tidak aman dipisah
  return STATE.vendorPayouts.filter(v => v.tanggalDihitung && v.tanggalDihitung.slice(0,10) === tanggalLamaStr);
}

function pindahkanVendorPayoutKeTanggalBaru(vendorPayoutIds, tanggalBaruStr) {
  const tglIso = new Date(tanggalBaruStr + 'T00:00:00.000Z').toISOString();
  let nUpdated = 0;
  STATE.vendorPayouts.forEach(v => { if (vendorPayoutIds.includes(v.id)) { v.tanggalDihitung = tglIso; nUpdated++; } });
  return { nUpdated };
}

// ==========================================================================
// BERSIHKAN KONTRAK ROLLOVER DUPLIKAT YANG BELUM PERNAH DIPAKAI
// ==========================================================================
// Ditemukan dari kasus nyata: krn beberapa kali percobaan "Hitung Ulang" utk tanggal yg sama (sebelum
// resolveRolloverIntoAllocations dibuat "pakai ulang kontrak yg blm terpakai, jangan bikin baru lagi"),
// numpuk kontrak2 hasil rollover identik yg sama sekali belum pernah kejual (mis. IDO049, IDO050, IDO051
// semua dari sumber IDO047) -- masing2 tetap ikut dihitung modalnya di computePembagiPct, menggelembungkan
// jatah investor itu & mengambil jatah investor lain. Alat ini HANYA membaca (read-only) dulu, tidak
// menghapus apa2 sampai dikonfirmasi eksplisit.
function cariKontrakRolloverDuplikatKosong() {
  const groups = {};
  STATE.contracts.forEach(c => {
    if (!c.rolledFromKodeKontrak) return; // bukan hasil rollover, tidak relevan
    if (c.stockAkhir !== c.stockAwal) return; // sudah kepakai sebagian/semua -- BUKAN kandidat duplikat kosong, jangan disentuh
    const key = c.rolledFromKodeKontrak + '|' + c.capitalPartnerId + '|' + c.produk;
    (groups[key] = groups[key] || []).push(c);
  });
  return Object.values(groups).filter(g => g.length > 1).map(g => {
    const sorted = [...g].sort((a,b) => new Date(a.tanggalMasuk) - new Date(b.tanggalMasuk));
    const partner = findPartnerById(sorted[0].capitalPartnerId);
    return {
      kodeKontrakLama: sorted[0].rolledFromKodeKontrak, capitalPartnerId: sorted[0].capitalPartnerId,
      namaInvestor: partner ? partner.nama : sorted[0].capitalPartnerId, produk: sorted[0].produk,
      simpan: sorted[0], hapus: sorted.slice(1),
    };
  });
}

// MUTASI: hapus kontrak2 duplikat (simpan hanya 1 per grup, yg paling awal dibuat). Aman krn semuanya
// dijamin belum pernah kepakai sama sekali (stockAkhir === stockAwal) -- tidak ada payout manapun yg
// mereferensikannya, jadi tidak ada riwayat yg rusak.
async function terapkanBersihkanKontrakRolloverDuplikat(groups) {
  let nDihapus = 0;
  groups.forEach(g => {
    g.hapus.forEach(c => {
      const idx = STATE.contracts.indexOf(c);
      if (idx >= 0) { STATE.contracts.splice(idx, 1); nDihapus++; }
    });
  });
  await saveState();
  return { nDihapus };
}

// Cari baris orderDb yg hargaKonveksi-nya null krn KETIKA di-import dulu harganya belum diisi di Data Master,
// TAPI SEKARANG (di Data Master saat ini) harganya sudah ada -- kasus umum: user import dulu, baru belakangan
// isi harga konveksinya di Data Master, sehingga baris2 order yg sudah lama tercatat tidak otomatis ikut
// ke-update (field hargaKonveksi di-cache sekali sewaktu import, bukan dihitung ulang tiap saat).
// TIDAK termasuk baris yg SEKARANG PUN masih tidak bisa ditemukan harganya (itu tetap genuine data kosong --
// lihat diagnoseMissingHargaKonveksi() di Dashboard utk rincian sebabnya per SKU).
function cariOrderTanpaHargaKonveksiYangBisaDiperbaiki() {
  const bySku = {};
  STATE.orderDb.forEach(r => {
    if (r.hargaKonveksi != null || !r.sku) return;
    const hargaBaru = lookupHargaKonveksiBySku(r.sku);
    if (hargaBaru == null) return; // masih genuine kosong, bukan kandidat perbaikan
    const key = r.sku;
    if (!bySku[key]) bySku[key] = { sku: r.sku, produk: r.produk || '-', qty: 0, hargaBaru, rows: [] };
    bySku[key].qty += (r.qty||1);
    bySku[key].rows.push(r);
  });
  return Object.values(bySku).sort((a,b) => b.qty - a.qty);
}

// MUTASI: isi ulang r.hargaKonveksi utk semua baris pada grup2 hasil cariOrderTanpaHargaKonveksiYangBisaDiperbaiki()

// Cari baris STATE.payouts yg hargaModalPcs-nya null (Harga tampil "-" & Total Rp0 di Laporan Penarikan) TAPI
// kontraknya (dicari lewat kodeKontrak) SEKARANG py hargaModalPcs yg valid di STATE.contracts -- kasus ini
// muncul krn bug historis di resolveRolloverIntoAllocations (sudah diperbaiki 2026-09-04): saat rollover
// (Putar Penuh/Putar Modal Saja), kontrak PENERUS dibuat dgn harga modal baru yg benar, tp entri payout yg
// tercipta utk kontrak penerus itu lupa ikut dibawakan harganya (tetap null dari placeholder sblm kontrak
// penerus ada). rate/payout (Rp yg dibayar ke investor) TIDAK terpengaruh bug ini -- cuma field hargaModalPcs
// (dipakai murni utk kolom "Harga"/"Total" di Laporan Penarikan, bukan utk hitung payout) yg kosong.
function cariPayoutHargaModalKosongYangBisaDiperbaiki() {
  const byKontrak = {};
  STATE.payouts.forEach(p => {
    if (p.hargaModalPcs != null || !p.kodeKontrak) return;
    const kontrak = STATE.contracts.find(c => c.kodeKontrak === p.kodeKontrak);
    if (!kontrak || kontrak.hargaModalPcs == null) return; // masih genuine tidak bisa ditentukan -- jangan disentuh
    const key = p.kodeKontrak;
    if (!byKontrak[key]) byKontrak[key] = { kodeKontrak: p.kodeKontrak, namaInvestor: p.namaInvestor, produk: p.produk, qty: 0, hargaBaru: kontrak.hargaModalPcs, rows: [] };
    byKontrak[key].qty += (p.qty||0);
    byKontrak[key].rows.push(p);
  });
  return Object.values(byKontrak).sort((a,b) => b.qty - a.qty);
}

// MUTASI: isi ulang p.hargaModalPcs utk semua baris pada grup2 hasil cariPayoutHargaModalKosongYangBisaDiperbaiki()
// dgn harga kontrak yg SEKARANG berlaku. Aman krn hanya menyentuh field yg SEBELUMNYA kosong (null) -- rate/payout
// (jumlah Rp yg dibayar ke investor) TIDAK ikut diubah sama sekali, cuma field tampilan Harga/Total di Laporan

// Cari baris STATE.orderDb yg tanggalPesan-nya KOSONG (null) TAPI ada entri STATE.pendingOrderSku[orderId]
// dgn SKU yg sama & tanggalPesan TERISI -- kasus ini muncul kalau order tsb SUDAH cair/settle (masuk orderDb)
// SEBELUM user meng-upload/refresh "Update Daftar Pesanan Saja" utk order itu (jadi tanggalPesan blm diketahui
// waktu disettle & tersimpan null selamanya), padahal BELAKANGAN user upload ulang file Order List yg utk
// order yg sama ITU JUSTRU SUDAH ada tanggal pesannya -- data baru itu nyangkut nganggur di pendingOrderSku
// (krn SKU-nya sudah "abis" dipakai/disettle di orderDb, tidak pernah dipakai lagi utk matching) dan TIDAK
// otomatis ditarik balik ke baris orderDb yg sudah lama ada. Alat ini menariknya secara manual & aman: HANYA
// menyentuh baris yg field-nya SEBELUMNYA kosong (null), tidak pernah menimpa tanggalPesan yg sudah terisi.
function cariOrderTanpaTanggalPesanYangBisaDiperbaiki() {
  const byOrder = {};
  STATE.orderDb.forEach(r => {
    if (r.tanggalPesan || !r.orderId || !r.sku) return;
    const pending = STATE.pendingOrderSku[r.orderId];
    if (!pending) return;
    const match = pending.find(p => p.sku === r.sku && p.tanggalPesan);
    if (!match) return;
    const key = r.orderId;
    if (!byOrder[key]) byOrder[key] = { orderId: r.orderId, sumber: r.sumber || '-', tanggalBaru: match.tanggalPesan, qty: 0, rows: [] };
    byOrder[key].qty += (r.qty || 1);
    byOrder[key].rows.push({ row: r, tanggalBaru: match.tanggalPesan });
  });
  return Object.values(byOrder).sort((a,b) => (a.tanggalBaru||'').localeCompare(b.tanggalBaru||''));
}

// MUTASI: isi ulang r.tanggalPesan utk semua baris pada grup2 hasil cariOrderTanpaTanggalPesanYangBisaDiperbaiki()
// dgn tanggal yg ditemukan di pendingOrderSku. Aman krn hanya menyentuh baris yg field-nya SEBELUMNYA kosong.
async function terapkanPerbaikiTanggalPesanKosong(groups) {
  let nBarisDiperbarui = 0, totalUnit = 0;
  groups.forEach(g => {
    g.rows.forEach(({ row, tanggalBaru }) => { row.tanggalPesan = tanggalBaru; nBarisDiperbarui++; totalUnit += (row.qty||1); });
  });
  await saveState();
  return { nBarisDiperbarui, totalUnit };
}

function cleanupPendingAlreadySettled() {
  const settledKeys = new Set(STATE.orderDb.map(r => r.orderId + '|' + r.sku));
  let nRemoved = 0, nOrdersAffected = 0;
  Object.keys(STATE.pendingOrderSku).forEach(orderId => {
    const before = STATE.pendingOrderSku[orderId].length;
    STATE.pendingOrderSku[orderId] = STATE.pendingOrderSku[orderId].filter(p => !settledKeys.has(orderId + '|' + p.sku));
    const removed = before - STATE.pendingOrderSku[orderId].length;
    if (removed > 0) { nRemoved += removed; nOrdersAffected++; }
    if (STATE.pendingOrderSku[orderId].length === 0) delete STATE.pendingOrderSku[orderId];
  });
  return { nRemoved, nOrdersAffected };
}

// Perkiraan omset dari order yg SUDAH dipesan (tanggal pesan dlm rentang) tp BELUM cair -- diminta user 2026-09-10:
// "itu jelas capaian penjualan dari marketing walaupun ada kemungkinan gagal". Sumbernya pendingOrderSku (diisi
// dari "Update Daftar Pesanan Saja"), BUKAN orderDb -- makanya ini estimasi (bisa batal/retur), bukan pendapatan
// resmi. PENTING utk tidak dobel hitung: sebuah pendingOrderSku[orderId] bisa saja NYANGKUT/BASI (order itu
// SUDAH cair beneran & sudah ada di orderDb, tp entri pending-nya belum sempat dibersihkan -- lihat
// cleanupPendingAlreadySettled) -- baris spt itu HARUS dikecualikan di sini, krn pendapatan aslinya SUDAH
// terhitung di "Omzet Sudah Cair" (dari orderDb). Baris yg tanggalPesan-nya msh kosong (mis. file lama sblm
// perbaikan parsing tanggal 2026-09-10) TIDAK ikut dihitung sama sekali di sini (drpd salah kelompokkan ke
// tanggal yg salah) -- akan otomatis ikut kehitung normal nanti begitu order itu cair (masuk orderDb).
function computeOmzetEstimasiBelumCair(dari, sampai) {
  const inRange = (isoStr) => { if (!isoStr) return false; const d = isoStr.slice(0,10); return (!dari || d >= dari) && (!sampai || d <= sampai); };
  const settledKeys = new Set(STATE.orderDb.map(r => r.orderId + '|' + r.sku));
  let total = 0, qty = 0, nBaris = 0;
  Object.entries(STATE.pendingOrderSku).forEach(([orderId, rowsPending]) => {
    rowsPending.forEach(r => {
      if (settledKeys.has(orderId + '|' + r.sku)) return; // sudah beneran cair (data pending ini nyangkut/basi) -- JANGAN dobel hitung dgn Omzet Sudah Cair
      if (!inRange(r.tanggalPesan)) return;
      total += (r.estimasiPendapatan || 0);
      qty += (r.qty || 1);
      nBaris++;
    });
  });
  return { total, qty, nBaris };
}

async function uploadOrderListOnly(store, orderFile) {
  const wb = XLSX.read(await orderFile.arrayBuffer(), { type:'array' }); // TANPA cellDates -- baca angka mentah
  let count = 0, nDibatalkan = 0;
  function toIso(v) { return excelSerialToISO(v); }
  const STATUS_BATAL = new Set(['Batal', 'Dibatalkan']); // istilah beda per platform, artinya sama
  if (store.platform === 'Shopee') {
    const objs = rowsToObjects(sheetToRows(wb.Sheets['orders']), 0, 1);
    const byOrder = {}; const statusById = {};
    objs.forEach(o => {
      const id = String(o['No. Pesanan']);
      byOrder[id] = byOrder[id] || [];
      // estimasiPendapatan: perkiraan omset dari "Subtotal Pesanan" (blm cair, blm dipotong komisi/biaya) --
      // dipakai HANYA utk KPI "Omzet Estimasi (Belum Cair)" di Dashboard, BUKAN pengganti pendapatan resmi
      // yg baru ada setelah order ini benar2 cair lewat Income. Kolom "Subtotal Pesanan" di file Order.all
      // asli tersimpan sbg TEKS format Indonesia (mis. "359.000") -- pakai parseAngkaID, bukan Number() polos.
      byOrder[id].push({ sku: o['Nomor Referensi SKU'], qty: Number(o['Jumlah'])||0, warna: parseWarna(o['Nama Variasi']), storeName: store.nama, tanggalPesan: toIso(o['Waktu Pesanan Dibuat']), estimasiPendapatan: parseAngkaID(o['Subtotal Pesanan']) });
      statusById[id] = o['Status Pesanan'];
    });
    Object.entries(byOrder).forEach(([id, rows]) => {
      if (STATUS_BATAL.has(statusById[id])) { delete STATE.pendingOrderSku[id]; nDibatalkan++; }
      else { STATE.pendingOrderSku[id] = rows; count++; } // timpa (bukan tambah) -- data terbaru dari upload ini
    });
  } else {
    // dataStartIdx=1 (BUKAN 2) -- sheet "OrderSKUList" cuma py 1 baris header, persis bug off-by-one yg sama
    // spt sudah diperbaiki di processWeeklyBatch (2026-09-04) utk sheet Income TikTok/Tokopedia. Dulu ini
    // "SUSPECTED, belum diverifikasi" krn blm ada contoh file asli -- sekarang terbukti nyata (baris data
    // PERTAMA tiap file OrderSKUList selalu terlewat diam2, cek langsung file asli user 2026-09-10).
    const objs = rowsToObjects(sheetToRows(wb.Sheets['OrderSKUList']), 0, 1);
    const byOrder = {}; const statusById = {};
    objs.forEach(o => {
      const id = String(o['Order ID']);
      byOrder[id] = byOrder[id] || [];
      // estimasiPendapatan: sama spt Shopee di atas, tp pakai "SKU Subtotal After Discount" (per-baris SKU,
      // sepadan dgn "Subtotal Pesanan" Shopee -- omset produk sblm ongkir/biaya, blm cair). Kolom ini di file
      // TikTok/Tokopedia asli tersimpan sbg TEKS angka polos (mis. "253890", tanpa titik ribuan) -- parseAngkaID
      // tetap aman dipakai (angka polos lolos apa adanya).
      byOrder[id].push({ sku: o['Seller SKU'], qty: Number(o['Quantity'])||0, warna: parseWarna(o['Variation']), storeName: store.nama, tanggalPesan: toIso(o['Created Time']), estimasiPendapatan: parseAngkaID(o['SKU Subtotal After Discount']) });
      statusById[id] = o['Order Status'];
    });
    Object.entries(byOrder).forEach(([id, rows]) => {
      if (STATUS_BATAL.has(statusById[id])) { delete STATE.pendingOrderSku[id]; nDibatalkan++; }
      else { STATE.pendingOrderSku[id] = rows; count++; }
    });
  }
  await saveState();
  return { count, nDibatalkan };
}

      }
    });

  container.querySelectorAll('[data-remove-batch]').forEach(btn => {

// Terapkan perbaikan manual "kasus lama" (bug rollover-berantai, sebelum 2026-09-11): `result` di sini
// berbentuk PERSIS spt result.allocations di alur normal ({allocations:[kasus,...], dateStr, tanggalAsliIso})
// supaya bisa lewat jalur resolveRolloverIntoAllocations YG SAMA PERSIS (bukan reimplementasi terpisah) --
// termasuk dukungan rollover berantai kalau kontrak susulannya TERNYATA JUGA masih kurang (needsMoreDecisions).
async function terapkanPerbaikanKekuranganRolloverManual(result, resolutions) {
  resolveRolloverIntoAllocations(result, resolutions, result.dateStr);
  if (result.allocations.some(a => a.perluKontrakBaru)) {
    return { needsMoreDecisions: true };
  }
  let totalUnitDiperbaiki = 0, totalRpDiperbaiki = 0;
  result.allocations.forEach(a => {
    // Kasus STOP tanpa kontrak aktif lain yg bisa dituju: catatan sudah ada di a.catatan (dari Tahap 2
    // resolveRolloverIntoAllocations), tidak ada payout yg bisa dicatat -- biarkan, tidak dianggap gagal.
    if (!a.capitalPartnerId || !a.qty) return;
    STATE.payouts.push({
      id: uid('po'), tanggalDihitung: result.tanggalAsliIso, produk: a.produk, kode2: a.kode2, namaInvestor: a.namaInvestor,
      capitalPartnerId: a.capitalPartnerId, kodeKontrak: a.kodeKontrak, qty: a.qty, rate: a.rate, payout: a.payout,
      tanggalDibayar: null, hargaModalPcs: a.hargaModalPcs||null, skuBreakdown: a.skuBreakdown||{},
      orderIds: [...new Set((a.orderUnits||[]).map(u=>u.orderId))], sumberData: 'perbaikan_kekurangan_rollover_manual',
    });
    if (a.contractId) {
      const c = STATE.contracts.find(x => x.id === a.contractId);
      if (c) { c.stockAkhir = Math.max(0, (c.stockAkhir||0) - a.qty); if (c.stockAkhir === 0) c.status = 'DANA SUDAH CAIR'; }
    }
    totalUnitDiperbaiki += a.qty; totalRpDiperbaiki += (a.payout||0);
  });
  await saveState();
  return { totalUnitDiperbaiki, totalRpDiperbaiki };
}

    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const out = await terapkanPerbaikanKekuranganRolloverManual(result, perbaikanRolloverResolutions);

        rerender();
        return;
      }
      perbaikanRolloverPreview = null; perbaikanRolloverResolutions = {};
      showMsg(document.getElementById('perbaikanRolloverMsg'), 'ok', `Selesai -- ${out.totalUnitDiperbaiki} unit (${fmtRp(out.totalRpDiperbaiki)}) berhasil dialokasikan ulang ke investor. Cek Laporan Penarikan utk lihat payout barunya.`);

async function runWeeklyImport() {
  const msg = document.getElementById('importStatus');
  if (!pendingStoreImports.length) { showMsg(msg, 'err', 'Tambah minimal 1 toko ke batch dulu.'); return; }
  if (!STATE.contracts.length) { showMsg(msg, 'err', 'Belum ada kontrak. Tambah/migrasi kontrak di tab Produk & Kontrak dulu.'); return; }
  showMsg(msg, 'info', 'Memproses file...');
  try {
    const readWB = async (f) => XLSX.read(await f.arrayBuffer(), { type:'array' }); // TANPA cellDates -- baca angka mentah
    const storeImports = await Promise.all(pendingStoreImports.map(async si => ({
      store: si.store, incomeWb: await readWB(si.incomeFile),
    })));
    const result = await processWeeklyBatch(storeImports);
    lastBatchResult = result;
    const ms = result.matchStats;
    const foundTotal = ms.shopeeFound + ms.tiktokFound, notFoundTotal = ms.shopeeNotFound + ms.tiktokNotFound;
    let text = `Berhasil: ${result.cairSkuRows.length} baris SKU cair (dari ${foundTotal} order ketemu), ${Object.keys(result.qtyPerProduk).length} produk Urban Outdoor terdampak.`;
    if (result.nSkippedAlreadyRecorded) text += ` (${result.nSkippedAlreadyRecorded} order sudah pernah tercatat, tidak dihitung ulang)`;
    showMsg(msg, notFoundTotal ? 'err' : 'ok', text + (notFoundTotal ? ` ⚠ ${notFoundTotal} order tidak ketemu SKU-nya -- coba "Update Daftar Pesanan" dulu di panel atas.` : ''));
    renderImportPreview(document.getElementById('importPreview'), result);
  } catch (e) {
    console.error(e);
    showMsg(msg, 'err', 'Gagal: ' + e.message);
  }
}

let rolloverResolutions = {}; // key (kode2|produk) -> { tipe: 'putar_penuh'|'putar_modal'|'stop', hargaBaru }

// `resolutions` diteruskan sbg parameter (bukan hardcode ke rolloverResolutions global) supaya bisa dipakai
// ulang di alur lain (mis. manualRolloverResolutions milik Tambah Transaksi Manual) tanpa saling menimpa.
function renderRolloverCase(a, key, resolutions) {
  const res = resolutions[key];
  const modalLama = a.qtyKontrakLama * a.hargaModalPcsLama;
  const profitLama = a.qtyKontrakLama * a.nilaiMarginLama;
  return `
    <div style="border:1px solid #E8C2B8; border-radius:3px; padding:12px; margin-top:8px; background:#fff;" data-rollover-case="${key}">
      <div style="font-weight:600; font-size:13px;">${a.namaInvestor} &middot; ${a.produk} &middot; ${a.qty > 0 ? a.qty + ' unit perlu keputusan' : 'kontrak pas habis, perlu keputusan'}</div>
      <div class="desc" style="margin:4px 0;">Kontrak ${a.kodeKontrakLama} habis. Modal awal: ${fmtRp(modalLama)} &middot; Profit terkumpul: ${fmtRp(profitLama)}</div>
      ${res ? `
        <div class="status-box show ok" style="margin-top:6px;">
          ${res.tipe === 'stop' ? 'Dipilih: STOP -- sisa unit dialihkan ke investor aktif lain.' : `Dipilih: ${res.tipe === 'putar_penuh' ? 'Putar Penuh' : 'Putar Modal Saja'} -- Harga baru ${fmtRp(res.hargaBaru)}, kontrak baru: ${generateNextKodeKontrak(a.kodeKontrakLama)}`}
          <button class="btn btn-ghost" data-rollover-ubah="${key}" style="margin-left:8px; padding:2px 8px; font-size:10px;">Ubah</button>
        </div>
      ` : `
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
          <button class="btn btn-ghost" data-rollover-pilih="putar_penuh" data-case-key="${key}" data-harga-lama="${a.hargaModalPcsLama}" data-kode-lama="${a.kodeKontrakLama}">Putar Penuh</button>
          <button class="btn btn-ghost" data-rollover-pilih="putar_modal" data-case-key="${key}" data-harga-lama="${a.hargaModalPcsLama}" data-kode-lama="${a.kodeKontrakLama}">Putar Modal Saja</button>
          <button class="btn btn-ghost" data-rollover-pilih="stop" data-case-key="${key}">Stop</button>
        </div>
        <div id="rolloverInputArea_${key}"></div>
      `}
    </div>
  `;
}

function wireRolloverHandlers(el, resolutions, rerender) {
  el.querySelectorAll('[data-rollover-pilih]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.caseKey, tipe = btn.dataset.rolloverPilih;
      if (tipe === 'stop') { resolutions[key] = { tipe: 'stop' }; rerender(); return; }
      // Harga lama dititipkan via data-attribute tombol (data-harga-lama/data-kode-lama, diisi renderRolloverCase)
      // krn wireRolloverHandlers() dipanggil 1x utk SEMUA kasus sekaligus (tidak py akses langsung ke object
      // `a` tiap kasus) -- BUKAN variabel `a` (itu cuma scope renderRolloverCase, beda fungsi).
      const hargaLama = Number(btn.dataset.hargaLama) || 0;
      const kodeLama = btn.dataset.kodeLama || '';
      const area = document.getElementById('rolloverInputArea_' + key);
      // Tampilkan Harga Modal LAMA di dekat input Harga Modal Baru -- permintaan Setiawan 2026-11-13 ("agar aku
      // tidak bingung saat menginput harga baru, aku ingin ada tampilan harga sebelumnya"), supaya tidak perlu
      // scroll ke atas cek "Modal awal: Rp..." di baris kasusnya.
      area.innerHTML = `
        <div class="grid2" style="margin-top:8px; max-width:400px;">
          <div class="field">
            <label>Harga Modal Baru (Rp)</label>
            <input type="number" id="rolloverHarga_${key}" min="1" placeholder="Harga lama: ${fmtRp(hargaLama)}">
            <div class="desc" style="margin-top:3px;">Harga modal sebelumnya (${kodeLama}): <b>${fmtRp(hargaLama)}</b></div>
          </div>
        </div>
        <button class="btn btn-primary" data-confirm-rollover="${key}" data-tipe="${tipe}" style="padding:6px 12px; font-size:12px;">Konfirmasi</button>
      `;
      document.getElementById('rolloverInputArea_' + key).querySelector('[data-confirm-rollover]').addEventListener('click', () => {
        const harga = Number(document.getElementById('rolloverHarga_' + key).value);
        if (!harga || harga <= 0) { alert('Isi harga modal baru dulu.'); return; }
        resolutions[key] = { tipe, hargaBaru: harga };
        rerender();
      });
    });
  });
  el.querySelectorAll('[data-rollover-ubah]').forEach(btn => {
    btn.addEventListener('click', () => { delete resolutions[btn.dataset.rolloverUbah]; rerender(); });
  });
}

      ${perluKontrakBaru.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ PERLU KEPUTUSAN -- Kontrak Habis di Tengah (wajib diputuskan sebelum Simpan):</b>

      </div>` : ''}
      ${(result.notFoundOrderIds && result.notFoundOrderIds.length) ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ ${result.notFoundOrderIds.length} Order Tidak Ketemu SKU-nya:</b>

      <table class="data compact">

        <tbody>${result.allocations.map(a => `<tr>

      <table class="data compact">
        <thead><tr><th>Produk</th><th class="num">Qty</th><th class="num">Harga Investor</th><th class="num">Total Konveksi</th><th class="num">Total Surplus</th></tr></thead>
        <tbody>${result.surplusRows.map(r => `<tr><td>${r.produk}</td><td class="num">${r.qty}</td>
          <td class="num">${r.hargaInvestor?fmtRp(r.hargaInvestor):'-'}</td><td class="num">${r.totalKonveksi?fmtRp(r.totalKonveksi):'-'}</td>

    const btn = ev.target; btn.disabled = true; btn.textContent = 'Menyimpan...';

      const tglInput = document.getElementById('applyTanggalPenarikan').value;
      const tglIso = tglInput ? new Date(tglInput).toISOString() : new Date().toISOString();

      rolloverResolutions = {}; // reset supaya batch berikutnya bersih
      showMsg(msg, 'ok', `${added} baris baru tersimpan${updated ? `, ${updated} baris lama diperbarui (mis. order "Gagal" yg ternyata koreksi jadi cair)` : ''} ke database. Stok kontrak diperbarui.`);
      btn.textContent = 'Tersimpan ✓';
    } catch (e) {
      showMsg(msg, 'err', 'Gagal simpan: ' + e.message);
      btn.disabled = false; btn.textContent = 'Simpan ke Database & Kurangi Stok Kontrak';
    }
  });
}

// Preview khusus Tambah Transaksi Manual -- dipisah dari renderImportPreview krn kontennya lebih ringkas
// (cuma 1 order) & punya kasus tambahan "produk tidak punya kontrak aktif sama sekali" yg tidak muncul
// di alur Import Mingguan biasa (lihat manualNeedsAttention). Tujuannya spy keputusan rollover/peringatan
// "tidak ada kontrak" WAJIB dilihat & diputuskan dulu sebelum data ditulis -- sebelumnya alur manual
// langsung applyBatchResult tanpa pernah menampilkan result.allocations ke user sama sekali.
function renderManualPreview(el, container) {
  if (!manualPreviewResult) { el.innerHTML = ''; return; }
  const result = manualPreviewResult;
  const { perluKontrakBaru, tanpaKontrakSamaSekali } = manualNeedsAttention(result);
  const semuaRolloverSelesai = perluKontrakBaru.every(a => manualRolloverResolutions[rolloverCaseKey(a)]);
  const bisaSimpanNormal = semuaRolloverSelesai && !tanpaKontrakSamaSekali.length;
  const rerender = () => renderManualPreview(el, container);

  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3;">
      <div style="font-weight:600; margin-bottom:8px;">Preview Alokasi (belum tersimpan)</div>
      <table class="data compact">
        <thead><tr><th>Produk</th><th>Investor</th><th>Kode Kontrak</th><th class="num">Qty</th><th class="num">Payout</th><th>Catatan</th></tr></thead>
        <tbody>${result.allocations.map(a => `<tr>
          <td>${a.produk}</td><td>${a.namaInvestor||'-'}</td><td>${a.kodeKontrak||'-'}</td>
          <td class="num">${a.qty}</td><td class="num">${a.payout?fmtRpCompact(a.payout):'-'}</td>
          <td style="font-size:11px;color:var(--ink-soft);white-space:normal;">${a.catatan||'-'}</td>
        </tr>`).join('')}</tbody>
      </table>
      ${tanpaKontrakSamaSekali.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ Produk ini TIDAK PUNYA kontrak aktif sama sekali</b> (${tanpaKontrakSamaSekali.map(a=>`${a.produk}: ${a.qty} unit`).join(', ')}) --
        kalau disimpan sekarang, unit ini TIDAK akan terikat ke investor manapun (persis kasus yg pernah ditemukan sebelumnya).
        Sebaiknya tambah/aktifkan kontrak dulu di tab <b>Produk &amp; Kontrak</b>, lalu ulangi "Cek &amp; Proses" di atas.
        Kalau tetap mau disimpan sekarang, pakai tombol "Simpan Tanpa Investor" di bawah, lalu alokasikan belakangan lewat
        panel <b>"Hitung Ulang Alokasi per Tanggal Penarikan"</b> begitu kontraknya sudah ada.
      </div>` : ''}
      ${perluKontrakBaru.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ PERLU KEPUTUSAN -- Kontrak Habis (wajib diputuskan sebelum simpan):</b>
        ${perluKontrakBaru.map(a => renderRolloverCase(a, rolloverCaseKey(a), manualRolloverResolutions)).join('')}
      </div>` : ''}
      <div style="margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="btnKonfirmasiManual" ${!bisaSimpanNormal?'disabled':''}>Konfirmasi &amp; Simpan sebagai Cair</button>
        ${(tanpaKontrakSamaSekali.length && semuaRolloverSelesai) ? `<button class="btn btn-ghost" id="btnPaksaSimpanTanpaKontrak">Simpan Tanpa Investor (tidak disarankan)</button>` : ''}
        <button class="btn btn-ghost" id="btnBatalPreviewManual">Batal</button>
      </div>
      <div class="status-box" id="manualConfirmMsg"></div>
    </div>
  `;
  wireRolloverHandlers(el, manualRolloverResolutions, rerender);
  document.getElementById('btnBatalPreviewManual').addEventListener('click', () => {
    manualPreviewResult = null; manualRolloverResolutions = {};
    renderImport(container);
  });
  const btnKonfirmasi = document.getElementById('btnKonfirmasiManual');
  if (btnKonfirmasi) btnKonfirmasi.addEventListener('click', () => confirmManualTransaction(container));
  const btnPaksa = document.getElementById('btnPaksaSimpanTanpaKontrak');
  if (btnPaksa) btnPaksa.addEventListener('click', () => {
    if (!confirm('Simpan tanpa investor? Unit ini akan tercatat sbg penjualan TAPI tidak terikat modal investor manapun sampai kamu alokasikan manual nanti.')) return;
    confirmManualTransaction(container);
  });
}

async function confirmManualTransaction(container) {
  const msg = document.getElementById('manualConfirmMsg');
  showMsg(msg, 'info', 'Menyimpan...');
  try {
    const { added, updated, needsMoreDecisions } = await finalizeManualTransaction(manualPreviewResult, manualTanggalCairStr, manualRolloverResolutions);
    if (needsMoreDecisions) {
      // Kontrak baru hasil rollover ternyata masih kurang -- kasus keputusan rollover LANJUTAN baru saja
      // muncul di manualPreviewResult.allocations. JANGAN dianggap gagal & JANGAN reset preview -- render
      // ulang supaya kasus barunya kelihatan & bisa diputuskan, baru user klik Konfirmasi lagi.
      showMsg(msg, 'info', '⚠ Kontrak hasil rollover ternyata masih kurang menampung semua unit -- selesaikan dulu keputusan rollover LANJUTAN di bawah, lalu klik Konfirmasi lagi.');
      renderManualPreview(document.getElementById('manualPreviewArea'), container);
      return;
    }
    const totalUnit = Object.values(manualPreviewResult.qtyPerProduk).reduce((a,b)=>a+Math.round(b),0)
      + manualPreviewResult.allocations.filter(a=>!a.capitalPartnerId).reduce((s,a)=>s+a.qty,0);
    manualPreviewResult = null; manualRolloverResolutions = {}; manualTanggalCairStr = '';
    document.getElementById('mt_orderId').value = ''; document.getElementById('mt_skuRows').value = '';
    document.getElementById('mt_pendapatan').value = ''; document.getElementById('mt_settlement').value = '';
    const topMsg = document.getElementById('manualTransactionMsg');
    showMsg(topMsg, 'ok', `Tersimpan sebagai transaksi cair (${added} baris baru${updated?`, ${updated} diperbarui`:''}, ${totalUnit} unit total). Stok kontrak & payout investor sudah diperbarui otomatis.`);
    renderImport(container);
  } catch (e) {
    showMsg(msg, 'err', 'Gagal simpan: ' + e.message);
  }
}

// Panel "Hitung Ulang Alokasi per Tanggal Penarikan" -- 2 tampilan tergantung state:
//   1. recomputeSummary ada, recomputePreviewResult belum -- tahap konfirmasi (READ-ONLY, blm ada yg dihapus).
//   2. recomputePreviewResult ada -- payout lama SUDAH dihapus (lewat beginRecomputeForDate), tampilkan
//      alokasi baru utk dicek/diputuskan (termasuk rollover kalau ada) sebelum final -- "Batal" di sini
//      memanggil undoRecomputeForDate() supaya payout lama kembali PERSIS spt semula.
function renderRecomputeArea(el, container) {
  if (recomputePreviewResult) { renderRecomputePreview(el, container); return; }
  if (!recomputeSummary) { el.innerHTML = ''; return; }
  const s = recomputeSummary;
  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3;">
      <div style="font-weight:600; margin-bottom:8px;">Konfirmasi Hitung Ulang -- ${s.dateStr}</div>
      <table class="data compact">
        <tbody>
          <tr><td>Payout investor saat ini di tanggal ini (akan DIHAPUS)</td><td class="num">${s.nPayoutLama} payout / ${s.totalQtyPayoutLama} unit</td></tr>
          <tr><td>Total nilai payout yang akan dihapus</td><td class="num">${fmtRp(s.totalRpPayoutLama)}</td></tr>
          <tr><td>Baris Database Penjualan Urban Outdoor di tanggal ini (dasar hitung ulang)</td><td class="num">${s.nOrderRows} baris / ${s.totalQtyOrderRows} unit</td></tr>

        <b>⚠ ${s.sudahDibayarList.length} payout di tanggal ini SUDAH ditandai "Sudah Dibayar"</b> -- status itu akan HILANG (payout lama dihapus, diganti payout baru yang belum dibayar) &amp; perlu ditandai ulang manual setelah hitung ulang selesai:
        <div style="font-size:11px; margin-top:6px; line-height:1.8;">
          ${s.sudahDibayarList.map(p => `${p.namaInvestor||'-'} &middot; ${p.kodeKontrak||'-'} &middot; ${p.qty} unit &middot; ${fmtRp(p.payout||0)}`).join('<br>')}

    </div>
  `;
  document.getElementById('btnMulaiRecompute').addEventListener('click', () => {
    try {
      recomputePreviewResult = beginRecomputeForDate(s.dateStr);
      recomputeRolloverResolutions = {};
      renderRecomputeArea(el, container);
    } catch (e) {
      showMsg(document.getElementById('recomputeMsg'), 'err', 'Gagal: ' + e.message);
    }
  });
  document.getElementById('btnBatalRecomputeSummary').addEventListener('click', () => {
    recomputeSummary = null;
    renderRecomputeArea(el, container);
  });
}

function renderRecomputePreview(el, container) {
  const result = recomputePreviewResult;
  const perluKontrakBaru = result.allocations.filter(a => a.perluKontrakBaru);
  const semuaTerselesaikan = perluKontrakBaru.every(a => recomputeRolloverResolutions[rolloverCaseKey(a)]);
  const rerender = () => renderRecomputePreview(el, container);
  const totalPayoutBaru = result.allocations.reduce((s,a) => s + (a.payout||0), 0);
  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3;">
      <div style="font-weight:600; margin-bottom:8px;">Preview Alokasi Baru -- ${result.dateStr} <span style="font-weight:400; color:var(--ink-soft);">(${result.nPayoutLamaDihapus} payout lama sudah dihapus, BELUM final -- klik Batal utk kembalikan)</span></div>
      <table class="data compact">
        <thead><tr><th>Produk</th><th>Investor</th><th>Kode Kontrak</th><th class="num">Qty</th><th class="num">Payout</th><th>Catatan</th></tr></thead>
        <tbody>${result.allocations.map(a => `<tr>
          <td>${a.produk}</td><td>${a.namaInvestor||'-'}</td><td>${a.kodeKontrak||'-'}</td>
          <td class="num">${a.qty}</td><td class="num">${a.payout?fmtRpCompact(a.payout):'-'}</td>
          <td style="font-size:11px;color:var(--ink-soft);white-space:normal;">${a.catatan||'-'}</td>
        </tr>`).join('')}</tbody>
      </table>
      <div style="margin-top:8px; font-size:12px;">Total payout baru: <b>${fmtRp(totalPayoutBaru)}</b></div>
      ${perluKontrakBaru.length ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ PERLU KEPUTUSAN -- Kontrak Habis (wajib diputuskan sebelum simpan):</b>
        ${perluKontrakBaru.map(a => renderRolloverCase(a, rolloverCaseKey(a), recomputeRolloverResolutions)).join('')}
      </div>` : ''}
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnKonfirmasiRecompute" ${!semuaTerselesaikan?'disabled':''}>Konfirmasi &amp; Simpan Alokasi Baru</button>
        <button class="btn btn-ghost" id="btnBatalRecomputePreview">Batal (kembalikan payout lama)</button>
      </div>
      <div class="status-box" id="recomputeConfirmMsg"></div>
    </div>
  `;
  wireRolloverHandlers(el, recomputeRolloverResolutions, rerender);
  document.getElementById('btnBatalRecomputePreview').addEventListener('click', () => {
    undoRecomputeForDate();
    recomputePreviewResult = null; recomputeSummary = null; recomputeRolloverResolutions = {};
    renderImport(container);
  });
  const btnKonfirmasi = document.getElementById('btnKonfirmasiRecompute');
  if (btnKonfirmasi) btnKonfirmasi.addEventListener('click', async () => {
    const msg = document.getElementById('recomputeConfirmMsg');
    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const { nPayoutBaru, needsMoreDecisions } = await finalizeRecomputeForDate(result, recomputeRolloverResolutions);
      if (needsMoreDecisions) {
        showMsg(msg, 'info', '⚠ Kontrak hasil rollover ternyata masih kurang menampung semua unit -- selesaikan dulu keputusan rollover LANJUTAN di bawah, lalu klik Konfirmasi lagi.');
        renderRecomputePreview(el, container);
        return;
      }
      recomputePreviewResult = null; recomputeSummary = null; recomputeRolloverResolutions = {};
      const rcTanggal = document.getElementById('rc_tanggal'); if (rcTanggal) rcTanggal.value = '';
      showMsg(document.getElementById('recomputeMsg'), 'ok', `Hitung ulang selesai -- ${nPayoutBaru} payout baru dibuat utk ${result.dateStr}. Cek Laporan Penarikan &amp; tandai ulang "Sudah Dibayar" kalau ada yang perlu.`);
      renderImport(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal simpan: ' + e.message);
    }
  });
}

// Panel "Koreksi Tanggal Penarikan (Salah Input)" -- tahap konfirmasi tunggal (READ-ONLY sampai user klik
// "Ya, Ubah Tanggal Penarikan"). Diblokir total kalau order yg mau dikoreksi SUDAH punya payout investor,
// supaya payout tidak "nyasar" ke tanggal lama sementara orderDb-nya sudah pindah tanggal.
function renderKoreksiTanggalArea(el, container) {
  if (!koreksiTanggalPreview) { el.innerHTML = ''; return; }
  const p = koreksiTanggalPreview;
  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3;">
      <div style="font-weight:600; margin-bottom:8px;">Konfirmasi Koreksi Tanggal Penarikan</div>
      <table class="data compact">
        <tbody>
          <tr><td>Order ID</td><td>${p.orderIds.join(', ')}</td></tr>
          <tr><td>Baris Database Penjualan ditemukan</td><td class="num">${p.nRows} baris / ${p.totalQty} unit</td></tr>
          <tr><td>Tanggal Penarikan saat ini (tercatat)</td><td class="num">${p.tanggalLamaSet.filter(Boolean).map(d=>fmtTanggal(d)).join(', ') || '-'}</td></tr>
          <tr><td>Akan diubah menjadi</td><td class="num">${fmtTanggal(p.tanggalBaru)}</td></tr>
        </tbody>
      </table>
      ${p.adaPayoutTerkait ? `<div class="status-box show err" style="margin-top:10px;">
        <b>⚠ Order ini SUDAH punya ${p.payoutsTerkait.length} payout investor</b> -- tidak bisa diubah tanggalnya dulu spy payout tidak jadi nyasar ke tanggal lama.
        Selesaikan dulu payoutnya (mis. "Batalkan Alokasi" di atas, atau "Hitung Ulang Alokasi" di tanggal lama), baru ulangi koreksi ini.
        <table class="data compact" style="margin-top:8px; background:#fff;">
          <thead><tr><th>Tgl Dihitung</th><th>Investor</th><th>Kode Kontrak</th><th class="num">Qty</th><th>Sumber</th><th>Jumlah Order Digabung</th></tr></thead>
          <tbody>${p.payoutsTerkait.map(po => `<tr>
            <td>${fmtTanggal(po.tanggalDihitung)}</td><td>${po.namaInvestor||'-'}</td><td>${po.kodeKontrak||'-'}</td>
            <td class="num">${po.qty}</td><td style="font-size:11px;">${po.sumberData||'import_mingguan (batch normal)'}</td>
            <td class="num">${(po.orderIds||[]).length}${(po.orderIds||[]).length>1?' order (gabungan batch)':' order (berdiri sendiri)'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>` : `
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnKonfirmasiKoreksiTanggal">Ya, Ubah Tanggal Penarikan</button>
        <button class="btn btn-ghost" id="btnBatalKoreksiTanggal">Batal</button>
      </div>`}
    </div>
  `;
  const btnKonfirmasi = document.getElementById('btnKonfirmasiKoreksiTanggal');
  if (btnKonfirmasi) btnKonfirmasi.addEventListener('click', async () => {
    const msg = document.getElementById('koreksiTanggalMsg');
    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const { nUpdated } = terapkanKoreksiTanggalPenarikan(p.orderIds, p.tanggalBaru);
      await saveState();
      // Cek apakah ada Pembayaran Konveksi/Supplier yg "ketinggalan" di tanggal lama -- vendorPayouts TIDAK
      // menyimpan orderIds, jadi ini cuma ditawarkan kalau tanggal lama itu SUDAH benar2 kosong dari orderDb
      // (lihat catatan di cariVendorPayoutYatimSetelahKoreksi).
      const orphansByDate = {};
      p.tanggalLamaSet.filter(Boolean).forEach(tglLama => {
        const orphans = cariVendorPayoutYatimSetelahKoreksi(tglLama);
        if (orphans.length) orphansByDate[tglLama] = orphans;
      });
      koreksiTanggalPreview = null;
      const ktOrderIds = document.getElementById('kt_orderIds'); if (ktOrderIds) ktOrderIds.value = '';
      const ktTanggalBaru = document.getElementById('kt_tanggalBaru'); if (ktTanggalBaru) ktTanggalBaru.value = '';
      showMsg(document.getElementById('koreksiTanggalMsg'), 'ok', `${nUpdated} baris Database Penjualan diperbarui ke tanggal ${fmtTanggal(p.tanggalBaru)}.`);
      if (Object.keys(orphansByDate).length) {
        vendorOrphanFollowup = { tanggalBaru: p.tanggalBaru, orphansByDate };
      }
      renderImport(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  const btnBatal = document.getElementById('btnBatalKoreksiTanggal');
  if (btnBatal) btnBatal.addEventListener('click', () => { koreksiTanggalPreview = null; renderKoreksiTanggalArea(el, container); });
}

// Muncul SETELAH koreksi tanggal orderDb berhasil, HANYA kalau ditemukan entri Pembayaran Konveksi/Supplier
// yg "ketinggalan" di tanggal lama & sudah terbukti aman dipindah (lihat cariVendorPayoutYatimSetelahKoreksi
// -- tanggal lama itu sudah benar2 kosong dari orderDb apapun, jadi entri ini pasti murni milik order yg
// baru saja dikoreksi). Opsional -- boleh diabaikan (klik Lewati) kalau user mau urus manual sendiri.
function renderVendorOrphanFollowup(el, container) {
  if (!vendorOrphanFollowup) { el.innerHTML = ''; return; }
  const f = vendorOrphanFollowup;
  const allOrphans = Object.values(f.orphansByDate).flat();
  const totalRp = allOrphans.reduce((s,v) => s + (v.total||0), 0);
  el.innerHTML = `
    <div style="border:1px solid var(--line); border-radius:6px; padding:14px; background:#F8F7F3; margin-top:10px;">
      <div style="font-weight:600; margin-bottom:8px;">⚠ Ditemukan Pembayaran Konveksi/Supplier yang Ketinggalan di Tanggal Lama</div>
      <div class="desc">Tanggal Penjualan sudah dikoreksi, tapi Pembayaran Konveksi/Supplier (biaya ke pembuat barang) utk order ini TIDAK ikut pindah otomatis -- fitur ini tidak menyimpan Order ID per entri, cuma agregat per tanggal+brand. Entri di bawah ini AMAN dipindah krn tanggal lamanya sudah tidak dipakai order manapun lagi (dipastikan sblm ditawarkan), jadi pasti murni milik order yang baru dikoreksi.</div>
      <table class="data compact" style="margin-top:8px;">
        <thead><tr><th>Tgl Lama</th><th>Brand</th><th>Produk</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
        <tbody>${Object.entries(f.orphansByDate).map(([tglLama, orphans]) => orphans.map(v => `<tr>
          <td>${fmtTanggal(tglLama)}</td><td>${v.brand}</td><td>${v.produk}</td><td class="num">${v.qty}</td><td class="num">${fmtRp(v.total)}</td>
        </tr>`).join('')).join('')}</tbody>
      </table>
      <div style="margin-top:8px; font-size:12px;">Total: <b>${fmtRp(totalRp)}</b> -- akan dipindah ke tanggal <b>${fmtTanggal(f.tanggalBaru)}</b></div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary" id="btnPindahkanVendorOrphan">Ya, Pindahkan Juga</button>
        <button class="btn btn-ghost" id="btnLewatiVendorOrphan">Lewati (urus manual sendiri)</button>
      </div>
      <div class="status-box" id="vendorOrphanMsg"></div>
    </div>
  `;
  document.getElementById('btnPindahkanVendorOrphan').addEventListener('click', async () => {
    const msg = document.getElementById('vendorOrphanMsg');
    showMsg(msg, 'info', 'Menyimpan...');
    try {
      const ids = allOrphans.map(v => v.id);
      const { nUpdated } = pindahkanVendorPayoutKeTanggalBaru(ids, f.tanggalBaru);
      await saveState();
      vendorOrphanFollowup = null;
      showMsg(document.getElementById('koreksiTanggalMsg'), 'ok', `${nUpdated} entri Pembayaran Konveksi/Supplier juga dipindah ke tanggal ${fmtTanggal(f.tanggalBaru)}.`);
      renderImport(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  document.getElementById('btnLewatiVendorOrphan').addEventListener('click', () => {
    vendorOrphanFollowup = null;
    renderVendorOrphanFollowup(el, container);
  });
}

// Asumsi flat per unit utk Gross/Nett Profit di tabel Database Penjualan (permintaan user 2026-09-18) --
// SENGAJA berupa angka pukul rata (bukan ditarik dari kontrak/vendorPayouts asli spt di tab PNL), krn tujuannya
// cuma utk cek cepat margin per JENIS PRODUK kasar/tidaknya, bukan laporan resmi presisi kontrak.
const PACKING_AKSESORIS_PER_UNIT = 10000;
const PAYOUT_INVESTOR_UOUT_PER_UNIT = 5000;

// Gross Profit = Pendapatan - biaya platform (komisi/layanan/pembayaran/afiliasi/dinamis/pajak) -- ini yg
// "otomatis mirip dgn hasil dari Shopee/TikTok" krn platform jg motong biaya2 itu sblm netSettlement.
// Nett Profit = Gross Profit - Modal Konveksi - Packing&Aksesoris (flat) - Payout Investor (flat, brand UOUT saja).
// Math.abs() di biaya platform krn field itu tersimpan negatif dari laporan settlement asli (lihat catatan di computePNL).
function computeGrossNettProfitPerOrder(r) {
  const qty = r.qty || 1;
  const pendapatan = r.pendapatan || 0;
  const biayaPlatform = Math.abs(r.komisiPlatform||0) + Math.abs(r.biayaLayanan||0) + Math.abs(r.biayaPembayaran||0) +
    Math.abs(r.komisiAfiliasi||0) + Math.abs(r.komisiDinamis||0) + Math.abs(r.pajak||0);
  const grossProfit = pendapatan - biayaPlatform;
  const grossProfitPct = pendapatan > 0 ? (grossProfit / pendapatan * 100) : null;

  const hargaKonveksi = r.hargaKonveksi != null ? r.hargaKonveksi : lookupHargaKonveksiBySku(r.sku);
  const modal = hargaKonveksi != null ? qty * hargaKonveksi : 0;
  const packingAksesoris = qty * PACKING_AKSESORIS_PER_UNIT;
  // Kategori Jual produk dicek LIVE ke STATE.products (bukan snapshot r.kategoriJual yg sudah tersimpan di
  // baris order) -- ditemukan 2026-11-13 dari laporan nyata Setiawan (ROVEE masih kena "Payout Investor
  // (asumsi)" Rp5.000 di panel ini walau sudah ditandai PO): kalau produk baru ditandai PO lewat "Simpan
  // Kategori Jual" SETELAH sebuah order sudah lebih dulu diproses (applyBatchResult), baris orderDb lama itu
  // tetap membawa kategoriJual snapshot LAMA (null/normal), jadi estimasi di panel ini salah selamanya kalau
  // dibaca dari baris, padahal sebenarnya cuma soal pengkategorian produk yg terlanjur telat ditandai. Panel
  // ini MEMANG cuma estimasi cepat (bukan payout investor sungguhan dari STATE.payouts), jadi wajar & lebih
  // benar kalau selalu ikut klasifikasi produk YANG BERLAKU SEKARANG, bukan status di tanggal order itu cair --
  // fallback ke field snapshot r.brand/r.kategoriJual kalau produknya sudah tidak ada lagi di STATE.products.
  const produkRef = findProduct(r.produk);
  const brandUtkPayout = produkRef ? produkRef.brand : r.brand;
  const kategoriJualUtkPayout = produkRef ? produkRef.kategoriJual : r.kategoriJual;
  const payoutInvestor = (brandUtkPayout === 'URBAN OUTDOOR' && kategoriJualUtkPayout !== 'PO') ? qty * PAYOUT_INVESTOR_UOUT_PER_UNIT : 0;
  const nettProfit = grossProfit - modal - packingAksesoris - payoutInvestor;
  const nettProfitPct = pendapatan > 0 ? (nettProfit / pendapatan * 100) : null;

  return { biayaPlatform, grossProfit, grossProfitPct, modal, packingAksesoris, payoutInvestor, nettProfit, nettProfitPct };
}

      <div>

        ${legendRow(null, '= Gross Profit' + (hp.grossProfitPct!=null?` (${hp.grossProfitPct.toFixed(1)}%)`:''), fmtRp(hp.grossProfit), {bold:true, topBorder:true})}
        ${legendRow('#FDE68A', 'Modal Konveksi', '(' + fmtRp(hp.modal) + ')')}

// Rekap rata-rata Pendapatan/Profit/persentase per JENIS PRODUK (bukan per SKU/warna) -- permintaan user 2026-09-18
// spy bisa lgs lihat produk mana yg marginnya kekecilan, tanpa perlu buka rincian per warna/ukuran.
// Diurutkan dari Nett % TERKECIL dulu, spy produk paling bermasalah lgs kelihatan di atas.
function computeMarginPerJenisProduk(rows) {
  const byProduk = {};
  rows.forEach(r => {
    const key = r.produk || '(tanpa produk)';
    if (!byProduk[key]) byProduk[key] = { produk: key, nOrder: 0, qty: 0, pendapatan: 0, grossProfit: 0, nettProfit: 0 };
    const g = byProduk[key];
    const hasil = computeGrossNettProfitPerOrder(r);
    g.nOrder += 1;
    g.qty += r.qty || 1;
    g.pendapatan += r.pendapatan || 0;
    g.grossProfit += hasil.grossProfit;
    g.nettProfit += hasil.nettProfit;
  });
  const list = Object.values(byProduk).map(g => ({
    ...g,
    rataPendapatan: g.nOrder > 0 ? g.pendapatan / g.nOrder : 0,
    rataGrossProfit: g.nOrder > 0 ? g.grossProfit / g.nOrder : 0,
    grossProfitPct: g.pendapatan > 0 ? (g.grossProfit / g.pendapatan * 100) : null,
    rataNettProfit: g.nOrder > 0 ? g.nettProfit / g.nOrder : 0,
    nettProfitPct: g.pendapatan > 0 ? (g.nettProfit / g.pendapatan * 100) : null,
  }));
  list.sort((a,b) => (a.nettProfitPct==null?999:a.nettProfitPct) - (b.nettProfitPct==null?999:b.nettProfitPct));
  return list;
}

  // Filter Pelanggan (2026-11-19): '__unassigned__' = order yg BELUM dikaitkan ke pelanggan manapun, selain itu

  });

      r.customerId = sel.value || null;
      await withSaving(msg, 'Pelanggan disimpan.', async () => {
        await saveState();
        renderDatabase(container);
      });
    });
  });
  document.getElementById('dbPrevPage').addEventListener('click', () => { dbFilters.page--; renderDatabase(container); });
  document.getElementById('dbNextPage').addEventListener('click', () => { dbFilters.page++; renderDatabase(container); });
  container.querySelectorAll('[data-db-fee-detail]').forEach(rowEl => {
    rowEl.addEventListener('click', () => {
      const target = document.getElementById(rowEl.dataset.dbFeeDetail);

      if (!target) return;
      const nowOpen = target.style.display === 'none';
      target.style.display = nowOpen ? 'block' : 'none';
      if (chevron) chevron.classList.toggle('open', nowOpen);
    });
  });
  wirePendingHandlers(container);
}

function wirePendingHandlers(container) {
  const btn = document.getElementById('btnTogglePending');
  if (btn) btn.addEventListener('click', () => { showPendingOrders = !showPendingOrders; renderDatabase(container); });
  const cleanupBtn = document.getElementById('btnCleanupPending');
  if (cleanupBtn) cleanupBtn.addEventListener('click', async () => {
    const msg = document.getElementById('cleanupPendingMsg');
    showMsg(msg, 'info', 'Membersihkan...');
    try {
      const { nRemoved, nOrdersAffected } = cleanupPendingAlreadySettled();
      await saveState();
      showMsg(msg, 'ok', nRemoved ? `${nRemoved} baris (dari ${nOrdersAffected} order) dikeluarkan dari Menunggu Cair karena ternyata sudah ada di Database Penjualan.` : 'Tidak ada yang perlu dibersihkan -- semua di Menunggu Cair memang belum cair.');
      renderDatabase(container);
    } catch (e) {
      showMsg(msg, 'err', 'Gagal: ' + e.message);
    }
  });
  const searchInput = document.getElementById('pendingSearchInput');
  if (searchInput) searchInput.addEventListener('input', (e) => { pendingSearch = e.target.value; pendingPage = 1; renderDatabase(container); });
  const prev = document.getElementById('pendingPrevPage');
  if (prev) prev.addEventListener('click', () => { pendingPage--; renderDatabase(container); });
  const next = document.getElementById('pendingNextPage');
  if (next) next.addEventListener('click', () => { pendingPage++; renderDatabase(container); });
}

            <div class="list-row-main" style="flex:1 1 260px; max-width:none;">
              <span class="list-row-title">${p.nama}</span>
              <span class="list-row-sub" style="font-family:inherit;">${p.noHp||'No HP -'} &middot; ${orders.length} order &middot; ${p.alamat||'Alamat -'}</span>
            </div>
            <span class="list-row-small" style="flex:0 0 90px;"><span class="pill ${p.status==='Aktif'?'ok':'off'}">${p.status}</span></span>
          </div>
          <div id="plDetail_${p.id}" style="display:${isOpen?'block':'none'};" class="list-detail" >
            <div style="flex:1 1 100%;">
              ${renderRiwayatPelanggan(orders)}
              <div style="margin-top:10px;">
                <button class="btn btn-ghost" data-edit-pelanggan="${p.id}" style="padding:4px 10px; font-size:11px;">Edit</button>
                <button class="btn btn-ghost" data-toggle-status-pelanggan="${p.id}" style="padding:4px 10px; font-size:11px; margin-left:6px;">${p.status==='Aktif'?'Nonaktifkan':'Aktifkan'}</button>
              </div>
            </div>
          </div>
          `;
        }).join('')}
      </div>
      `}
    </div>
  `;

  document.getElementById('formPelanggan').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = document.getElementById('pelangganFormMsg');
    const nama = document.getElementById('pl_nama').value.trim();
    const noHp = document.getElementById('pl_noHp').value.trim();
    const alamat = document.getElementById('pl_alamat').value.trim();
    const status = document.getElementById('pl_status').value;
    if (!nama) { showMsg(msg, 'err', 'Nama pelanggan wajib diisi.'); return; }
    if (editing) {
      editing.nama = nama; editing.noHp = noHp; editing.alamat = alamat; editing.status = status;
    } else {
      STATE.customers.push({ id: uid('cust'), nama, noHp, alamat, status: status || 'Aktif', createdAt: new Date().toISOString() });
    }
    await withSaving(msg, editing ? 'Perubahan pelanggan disimpan.' : 'Pelanggan ditambahkan.', async () => {
      await saveState();
      editingPelangganId = null;
      renderPelanggan(container);
    });
  });
  const btnBatal = document.getElementById('btnBatalEditPelanggan');
  if (btnBatal) btnBatal.addEventListener('click', () => { editingPelangganId = null; renderPelanggan(container); });
  document.getElementById('plFilterSearch').addEventListener('input', (e) => { pelangganFilters.search = e.target.value; renderPelanggan(container); });
  document.getElementById('plFilterStatus').addEventListener('change', (e) => { pelangganFilters.status = e.target.value; renderPelanggan(container); });
  container.querySelectorAll('[data-pelanggan-toggle]').forEach(rowEl => {
    rowEl.addEventListener('click', () => {
      const id = rowEl.dataset.pelangganToggle;
      expandedPelangganId = expandedPelangganId === id ? null : id;
      renderPelanggan(container);
    });
  });
  container.querySelectorAll('[data-edit-pelanggan]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      editingPelangganId = btn.dataset.editPelanggan;
      renderPelanggan(container);
      if (typeof container.scrollIntoView === 'function') container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  container.querySelectorAll('[data-toggle-status-pelanggan]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const p = STATE.customers.find(c => c.id === btn.dataset.toggleStatusPelanggan);
      if (!p) return;
      const statusLama = p.status;
      p.status = p.status === 'Aktif' ? 'Nonaktif' : 'Aktif';
      try {
        await saveState();
      } catch (err) {
        p.status = statusLama; // batalkan perubahan lokal kalau gagal simpan, supaya tampilan tidak menyesatkan
        alert('Gagal menyimpan perubahan status: ' + err.message);
      }
      renderPelanggan(container);
    });
  });
}

/* =========================================================================
   INVOICE (2026-11-19) -- "struktur dasar" invoice B2B/grosir di Outmark OS, langkah awal migrasi dari
   Outmark Invoice Manager (app terpisah, React+GAS+Sheets). Replikasi field2 inti dari app lama (tipe
   FULL/DP/SETTLEMENT, katalog produk warna/ukuran+harga tetap -- SENGAJA terpisah dari STATE.products
   e-commerce, DP% -> sisa bayar -> link ke invoice Pelunasan). TIDAK termasuk di versi ini (menyusul kalau
   diminta): menu Diskon terpisah (cukup field "Potongan" manual), opsi cetak tanpa ttd/cap, impor data lama
   (Setiawan: tidak perlu, asal nomor invoice bisa auto-generate ATAU diisi manual sendiri).
   ========================================================================= */

function findCustName(customerId) {
  const c = STATE.customers.find(x => x.id === customerId);
  return c ? c.nama : '';
}

// Nomor invoice: SARAN otomatis format INV/YYYY/MM/NNN (urut per bulan), tapi field-nya SELALU bisa ditimpa
// manual oleh user (Setiawan: "bisa otomatis bisa juga aku yang input") -- dipakai jg utk re-generate saat
// tombol "Buat Otomatis" diklik atau tanggal invoice berubah.
function suggestNomorInvoice(tanggalStr) {
  const d = tanggalStr ? new Date(tanggalStr) : new Date();
  const yyyy = isNaN(d.getTime()) ? new Date().getFullYear() : d.getFullYear();
  const mm = String((isNaN(d.getTime()) ? new Date().getMonth() : d.getMonth()) + 1).padStart(2, '0');
  const prefix = `INV/${yyyy}/${mm}/`;
  let maxN = 0;
  STATE.invoices.forEach(inv => {
    if (inv.nomor && inv.nomor.startsWith(prefix)) {
      const m = inv.nomor.match(/(\d+)\s*$/);
      if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
    }
  });
  return prefix + String(maxN + 1).padStart(3, '0');
}

function hitungTotalInvoice(items, ongkir, potongan) {
  const subtotal = (items || []).reduce((s, it) => s + (Number(it.harga) || 0) * (Number(it.qty) || 0), 0);
  const grandTotal = Math.max(0, subtotal + (Number(ongkir) || 0) - (Number(potongan) || 0));
  return { subtotal, grandTotal };
}

function emptyInvoiceDraft() {
  const tanggal = new Date().toISOString().slice(0, 10);
  return { tipe: 'FULL', tanggal, nomor: suggestNomorInvoice(tanggal), customerId: '', deskripsi: '', items: [], ongkir: 0, potongan: 0, diskonId: '', dpPercent: 50, settlementOfInvoiceId: '', tanpaTtdCap: false, ongkirMenyusul: false };
}

// Hitung nominal potongan dari 1 diskon katalog (persen dari subtotal, atau nominal tetap) -- dipanggil saat
// user pilih diskon di dropdown, hasilnya diisi ke field Potongan (tetap bisa ditimpa manual sesudahnya).
function hitungNilaiDiskon(diskon, subtotal) {
  if (!diskon) return 0;
  if (diskon.tipe === 'persen') return Math.round((subtotal || 0) * (Number(diskon.nilai) || 0) / 100);
  return Number(diskon.nilai) || 0;
}

// Satu titik baca SEMUA field form (selain item -- item dikelola langsung di invoiceDraft.items oleh tombol
// Tambah/Hapus Item) dari DOM ke invoiceDraft, dipanggil SEBELUM render ulang apapun supaya nilai yg sudah
// diketik user di field lain tidak hilang tertimpa draft lama (krn render ulang ganti innerHTML sepenuhnya).
function syncInvoiceDraftFromDom() {
  const d = invoiceDraft;
  if (!d) return;
  const get = id => document.getElementById(id);
  if (get('inv_tipe')) d.tipe = get('inv_tipe').value;
  if (get('inv_tanggal')) d.tanggal = get('inv_tanggal').value;
  if (get('inv_nomor')) d.nomor = get('inv_nomor').value;
  if (get('inv_customer')) d.customerId = get('inv_customer').value;
  if (get('inv_deskripsi')) d.deskripsi = get('inv_deskripsi').value;
  if (get('inv_ongkir')) d.ongkir = Number(get('inv_ongkir').value) || 0;
  if (get('inv_potongan')) d.potongan = Number(get('inv_potongan').value) || 0;
  if (get('inv_diskon')) d.diskonId = get('inv_diskon').value;
  if (get('inv_dpPercent')) d.dpPercent = Number(get('inv_dpPercent').value) || 0;
  if (get('inv_settlementOf')) d.settlementOfInvoiceId = get('inv_settlementOf').value;
  if (get('inv_tanpaTtdCap')) d.tanpaTtdCap = get('inv_tanpaTtdCap').checked;
  if (get('inv_ongkirMenyusul')) d.ongkirMenyusul = get('inv_ongkirMenyusul').checked;
}

// Dipanggil bareng oleh SEMUA 3 jalur (Database Penjualan sudah pakai pola findCustName di atas) -- bukan,
// ini dipakai KHUSUS panel rincian invoice di tab Daftar Invoice (list-detail) & jadi dasar renderInvoicePrintHtml.
function renderInvoiceDetailPanel(inv) {
  return `
    <table class="data" style="margin-bottom:10px;">
      <thead><tr><th>Produk</th><th>Warna</th><th>Ukuran</th><th class="num">Harga</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
      <tbody>
        ${(inv.items||[]).map(it => `<tr><td>${it.nama}</td><td>${it.warna||'-'}</td><td>${it.ukuran||'-'}</td><td class="num">${fmtRp(it.harga)}</td><td class="num">${it.qty}</td><td class="num">${fmtRp((it.harga||0)*(it.qty||0))}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Subtotal</div><div class="kpi-value">${fmtRp(inv.subtotal)}</div></div>
      ${inv.tipe === 'DP' && inv.ongkirMenyusul ? `<div class="kpi"><div class="kpi-label">Ongkir</div><div class="kpi-value" style="font-size:13px;">Menyusul di pelunasan</div></div>` : inv.ongkir ? `<div class="kpi"><div class="kpi-label">Ongkir</div><div class="kpi-value">${fmtRp(inv.ongkir)}</div></div>` : ''}
      ${inv.potongan ? `<div class="kpi"><div class="kpi-label">Potongan</div><div class="kpi-value">${fmtRp(inv.potongan)}</div></div>` : ''}
      <div class="kpi"><div class="kpi-label">Grand Total</div><div class="kpi-value">${fmtRp(inv.grandTotal)}</div></div>
      ${inv.tipe === 'DP' ? `
      <div class="kpi"><div class="kpi-label">DP Dibayar (${inv.dpPercent}%)</div><div class="kpi-value">${fmtRp(inv.dpPaid)}</div></div>
      <div class="kpi"><div class="kpi-label">Sisa Bayar</div><div class="kpi-value">${fmtRp(inv.sisaBayar)}</div></div>
      ` : ''}
      ${inv.tipe === 'SETTLEMENT' && inv.settlementOfInvoiceId ? (() => {
        const src = STATE.invoices.find(i => i.id === inv.settlementOfInvoiceId);
        return src ? `<div class="kpi"><div class="kpi-label">Pelunasan dari</div><div class="kpi-value" style="font-size:14px;">${src.nomor}</div></div>` : '';
      })() : ''}
    </div>
    <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">${inv.tanpaTtdCap ? 'Cetak: TANPA tanda tangan &amp; cap.' : ''}</div>
  `;
}
