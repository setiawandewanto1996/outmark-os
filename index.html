          <tr><td>Pendapatan</td><td class="num">${fmtRp(p.pendapatan)}</td></tr>
          <tr><td style="padding-left:20px; color:var(--ink-soft);">Biaya Modal (Konveksi/Supplier)</td><td class="num">(${fmtRp(p.biayaModal)})</td></tr>
          <tr style="font-weight:600; border-top:1px solid var(--ink);"><td>Gross Margin</td><td class="num">${fmtRp(p.grossMargin)}</td></tr>
          <tr><td style="padding-top:14px; padding-left:20px; color:var(--ink-soft);">Komisi Platform</td><td class="num" style="padding-top:14px;">(${fmtRp(p.komisiPlatform)})</td></tr>
          <tr><td style="padding-left:20px; color:var(--ink-soft);">Biaya Layanan</td><td class="num">(${fmtRp(p.biayaLayanan)})</td></tr>
          <tr><td style="padding-left:20px; color:var(--ink-soft);">Biaya Pembayaran</td><td class="num">(${fmtRp(p.biayaPembayaran)})</td></tr>
          <tr><td style="padding-left:20px; color:var(--ink-soft);">Komisi Afiliasi</td><td class="num">(${fmtRp(p.komisiAfiliasi)})</td></tr>

          <tr><td style="padding-left:20px; color:var(--ink-soft);">Biaya Iklan (Ads Mingguan)</td><td class="num">(${fmtRp(p.biayaIklan)})</td></tr>
          <tr style="font-weight:600;"><td style="padding-left:20px;">Total Beban Penjualan</td><td class="num">(${fmtRp(p.bebanPenjualan)})</td></tr>
          <tr><td style="padding-left:20px; color:var(--ink-soft);">Biaya Operasional</td><td class="num">(${fmtRp(p.biayaOperasional)})</td></tr>
          <tr style="font-weight:600; border-top:2px solid var(--ink); font-size:15px;"><td style="padding-top:10px;">Nett Margin</td><td class="num" style="padding-top:10px;">${fmtRp(p.nettMargin)}</td></tr>
          <tr><td style="padding-top:14px; color:var(--ink-soft);">Payout Capital Partner</td><td class="num" style="padding-top:14px;">(${fmtRp(p.payoutInvestor)})</td></tr>
          <tr style="font-weight:700; border-top:2px solid var(--ink); font-size:16px;"><td style="padding-top:10px;">Profit Akhir Perusahaan</td><td class="num" style="padding-top:10px;">${fmtRp(p.profitAkhir)}</td></tr>
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('pnlPreset').addEventListener('change', (e) => {
    pnlFilter.preset = e.target.value;
    if (e.target.value !== 'custom') Object.assign(pnlFilter, pnlDateRangeFromPreset(e.target.value));
    renderPnl(container);

  document.getElementById('pnlDari').addEventListener('change', (e) => { pnlFilter.preset='custom'; pnlFilter.dari = e.target.value; renderPnl(container); });
  document.getElementById('pnlSampai').addEventListener('change', (e) => { pnlFilter.preset='custom'; pnlFilter.sampai = e.target.value; renderPnl(container); });

    Object.assign(dashFilter, pnlDateRangeFromPreset(dashFilter.preset));
  }
  const inRange = (isoStr) => { if (!isoStr) return false; const d = isoStr.slice(0,10); return (!dashFilter.dari || d >= dashFilter.dari) && (!dashFilter.sampai || d <= dashFilter.sampai); };
  const rows = STATE.orderDb.filter(r => inRange(r.tanggalPenarikan));

  const totalOmzet = rows.reduce((s,r) => s + (r.pendapatan||0), 0);
  const totalQty = rows.reduce((s,r) => s + (r.qty||1), 0);
  const totalProfit = rows.reduce((s,r) => s + (r.profit||0), 0);

  const bySumber = {};
  rows.forEach(r => { const k = r.sumber || 'Tidak diketahui'; bySumber[k] = bySumber[k] || {omzet:0,qty:0}; bySumber[k].omzet += r.pendapatan||0; bySumber[k].qty += r.qty||1; });
  const sumberList = Object.entries(bySumber).sort((a,b) => b[1].omzet - a[1].omzet);
  const maxOmzetSumber = Math.max(1, ...sumberList.map(([,v]) => v.omzet));

  const byProduk = {};
  rows.forEach(r => { const k = r.produk || 'Tidak diketahui'; byProduk[k] = byProduk[k] || {omzet:0,qty:0}; byProduk[k].omzet += r.pendapatan||0; byProduk[k].qty += r.qty||1; });
  const produkList = Object.entries(byProduk).sort((a,b) => b[1].omzet - a[1].omzet).slice(0,10);
  const maxOmzetProduk = Math.max(1, ...produkList.map(([,v]) => v.omzet));

  container.innerHTML = `
    <div class="panel">
      <h2>Periode</h2>
      <div class="field"><label>Preset</label>
        <select id="dashPreset">
          <option value="minggu_ini" ${dashFilter.preset==='minggu_ini'?'selected':''}>Minggu Ini</option>
          <option value="bulan_ini" ${dashFilter.preset==='bulan_ini'?'selected':''}>Bulan Ini</option>
          <option value="bulan_lalu" ${dashFilter.preset==='bulan_lalu'?'selected':''}>Bulan Lalu</option>
          <option value="custom" ${dashFilter.preset==='custom'?'selected':''}>Custom</option>
        </select>
      </div>
      <div class="grid2">
        <div class="field"><label>Dari Tanggal</label><input type="date" id="dashDari" value="${dashFilter.dari}"></div>
        <div class="field"><label>Sampai Tanggal</label><input type="date" id="dashSampai" value="${dashFilter.sampai}"></div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total Omzet</div><div class="kpi-value">${fmtRp(totalOmzet)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Qty Terjual</div><div class="kpi-value">${totalQty.toLocaleString('id-ID')}</div></div>
      <div class="kpi"><div class="kpi-label">Total Profit</div><div class="kpi-value">${fmtRp(totalProfit)}</div></div>
    </div>

    <div class="panel">
      <h2>Omzet per Toko/Platform</h2>
      ${!sumberList.length ? '<div class="empty-note">Tidak ada data di periode ini.</div>' : sumberList.map(([nama,v]) => `
        <div style="margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;">
            <span>${nama}</span><span>${fmtRp(v.omzet)} &middot; ${v.qty} unit</span>
          </div>
          <div style="background:var(--line); border-radius:2px; height:10px;"><div style="background:var(--accent); height:100%; border-radius:2px; width:${(v.omzet/maxOmzetSumber*100).toFixed(1)}%;"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="panel">
      <h2>Top 10 Produk (by Omzet)</h2>
      ${!produkList.length ? '<div class="empty-note">Tidak ada data di periode ini.</div>' : produkList.map(([nama,v]) => `
        <div style="margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;">
            <span>${nama}</span><span>${fmtRp(v.omzet)} &middot; ${v.qty} unit</span>
          </div>
          <div style="background:var(--line); border-radius:2px; height:10px;"><div style="background:var(--ok); height:100%; border-radius:2px; width:${(v.omzet/maxOmzetProduk*100).toFixed(1)}%;"></div></div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('dashPreset').addEventListener('change', (e) => {
    dashFilter.preset = e.target.value;
    if (e.target.value !== 'custom') Object.assign(dashFilter, pnlDateRangeFromPreset(e.target.value));
    renderDashboard(container);
  });
  document.getElementById('dashDari').addEventListener('change', (e) => { dashFilter.preset='custom'; dashFilter.dari = e.target.value; renderDashboard(container); });
  document.getElementById('dashSampai').addEventListener('change', (e) => { dashFilter.preset='custom'; dashFilter.sampai = e.target.value; renderDashboard(container); });
}

const renderers = { master: renderMaster, kontrak: renderKontrak, import: renderImport, database: renderDatabase, laporan: renderLaporan, ads: renderAds, opex: renderOpex, pnl: renderPnl, dashboard: renderDashboard };
function switchTab(tab) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderers[tab](document.getElementById('app'));
}
document.getElementById('tabs').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' && !e.target.disabled) switchTab(e.target.dataset.tab);
});

/* =========================================================================
   INIT
   ========================================================================= */
window.onload = function init() {
  try {
    setupTokenClient();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="panel"><div class="status-box show err">Gagal memuat Google Sign-In: ${e.message}</div></div>`;
    return;
  }
  renderGate();
};
</script>
</body>
</html>
