<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Outmark OS — Pemulihan Data</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: monospace; background:#F5F4F0; padding:24px; max-width:700px; margin:0 auto; }
  h1 { font-family: sans-serif; }
  button { padding:10px 18px; font-weight:bold; cursor:pointer; margin:4px 0; }
  .rev { border:1px solid #ccc; padding:12px; margin:8px 0; background:#fff; border-radius:4px; }
  .rev b { color: #2E6B4F; }
  .warn { color:#A83A2E; }
</style>
</head>
<body>
<h1>Outmark OS — Pemulihan Riwayat Versi</h1>
<p>Alat ini cari file <code>outmark-os-state.json</code> di Drive kamu dan tampilkan semua riwayat versinya (via API, bukan lewat antarmuka Drive yang membingungkan tadi), lengkap dengan ukuran tiap versi.</p>
<button id="btnLogin">1. Login dengan Google</button>
<div id="output"></div>

<script>
const CLIENT_ID = '534061439425-cl0savvhsflp1ub4tgcnf8uih4b2iqso.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
let accessToken, tokenClient;

window.onload = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: (resp) => { accessToken = resp.access_token; findFile(); },
  });
  document.getElementById('btnLogin').addEventListener('click', () => tokenClient.requestAccessToken());
};

async function api(path) {
  const res = await fetch('https://www.googleapis.com' + path, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  return res;
}

async function findFile() {
  const out = document.getElementById('output');
  out.innerHTML = 'Mencari file...';
  const q = encodeURIComponent(`name='outmark-os-state.json' and trashed=false`);
  const listRes = await api(`/drive/v3/files?q=${q}&fields=files(id,name,size,modifiedTime)`);
  const list = await listRes.json();
  if (!list.files || !list.files.length) { out.innerHTML = '<p class="warn">File tidak ditemukan.</p>'; return; }
  const file = list.files[0];
  out.innerHTML = `<p>File ditemukan: <b>${file.name}</b> -- ukuran saat ini: ${(file.size/1024).toFixed(1)} KB</p><p>Memuat riwayat versi...</p>`;

  const revRes = await api(`/drive/v3/files/${file.id}/revisions?fields=revisions(id,modifiedTime,size)`);
  const revData = await revRes.json();
  const revisions = (revData.revisions || []).sort((a,b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));

  out.innerHTML = `<p>File saat ini: ${(file.size/1024).toFixed(1)} KB</p><p><b>${revisions.length} versi riwayat ditemukan:</b></p>` +
    revisions.map(r => {
      const sizeKB = (Number(r.size)||0)/1024;
      const isLarge = sizeKB > 500; // curiga ini versi yg masih lengkap kalau > 500KB
      return `<div class="rev">
        <div>${new Date(r.modifiedTime).toLocaleString('id-ID')}</div>
        <div ${isLarge ? 'style="font-weight:bold;color:#2E6B4F;"' : ''}>${sizeKB.toFixed(1)} KB ${isLarge ? ' <- KEMUNGKINAN BESAR INI VERSI LENGKAP' : ''}</div>
        <button data-rev="${r.id}" data-fileid="${file.id}" class="btnDownloadRev">Download Versi Ini</button>
      </div>`;
    }).join('');

  document.querySelectorAll('.btnDownloadRev').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.textContent = 'Mengunduh...';
      const res = await api(`/drive/v3/files/${btn.dataset.fileid}/revisions/${btn.dataset.rev}?alt=media`);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'outmark-os-state-RECOVERED-' + btn.dataset.rev + '.json';
      a.click();
      btn.textContent = 'Terdownload ✓';
    });
  });
}
</script>
</body>
</html>
